<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>민법 터치 문제풀이</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#0f766e;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
button{font:inherit}
.app{max-width:720px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:rgba(243,244,246,.94);backdrop-filter:blur(10px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.title{font-size:20px;font-weight:800}
.badge{font-size:12px;color:#374151;background:#fff;padding:7px 10px;border:1px solid var(--line);border-radius:999px}
.progress-wrap{margin-top:10px;height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.progress{height:100%;width:0;background:#111827;transition:.2s}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:12px}
.question{font-size:20px;line-height:1.6;font-weight:750;margin-bottom:18px;white-space:pre-wrap}
.choice{width:100%;text-align:left;padding:16px;border:2px solid #e5e7eb;background:#fff;border-radius:16px;margin:8px 0;cursor:pointer;transition:.12s;font-size:16px;line-height:1.45}
.choice:active{transform:scale(.99)}
.choice.correct{border-color:var(--good);background:#ecfdf5}
.choice.wrong{border-color:var(--bad);background:#fef2f2}
.choice.dim{opacity:.65}
.num{display:inline-block;width:30px;font-weight:800}
.feedback{margin-top:14px;padding:14px;border-radius:14px;line-height:1.55;display:none}
.feedback.show{display:block}
.feedback.good{background:#ecfdf5;color:#065f46}
.feedback.bad{background:#fef2f2;color:#991b1b}
.explain{margin-top:8px;font-size:14px}
.controls{display:flex;gap:10px;margin-top:14px}
.ctrl{flex:1;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:700;cursor:pointer}
.ctrl.primary{background:#111827;color:white;border-color:#111827}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat strong{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.source{font-size:12px;color:#6b7280;margin-top:12px}
.footer{padding:0 16px 24px;color:#6b7280;font-size:12px;line-height:1.5}
.hidden{display:none!important}
@media (max-width:480px){.question{font-size:18px}.card{padding:15px}.choice{padding:15px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="top">
    <div class="title">⚖️ 민법 터치 문제풀이</div>
    <div class="badge">시제품 · 12문제</div>
  </div>
  <div class="progress-wrap"><div id="progress" class="progress"></div></div>
</header>
<main>
  <div class="stats">
    <div class="stat"><strong id="correctCount">0</strong><span>정답</span></div>
    <div class="stat"><strong id="wrongCount">0</strong><span>오답</span></div>
    <div class="stat"><strong id="score">0%</strong><span>정답률</span></div>
  </div>

  <section id="quiz" class="card">
    <div class="meta"><span id="category"></span><span id="number"></span></div>
    <div id="question" class="question"></div>
    <div id="choices"></div>
    <div id="feedback" class="feedback">
      <div id="result"></div>
      <div id="explain" class="explain"></div>
      <div id="law" class="source"></div>
    </div>
    <div class="controls">
      <button class="ctrl" id="prev">이전</button>
      <button class="ctrl primary" id="next">다음 문제</button>
    </div>
  </section>
</main>
<div class="footer">
  이 시제품은 휴대폰에서 큰 선택지를 손가락으로 터치하는 방식으로 구성되어 있습니다.<br>
  실제 버전에서는 네 PDF의 문제들을 문제은행으로 넣고, 각 빈칸 문제를 ①②③④ 선택지형으로 변환할 수 있습니다.
</div>
</div>

<script>
const questions = [{"no": 1, "category": "민법총칙", "q": "사실인 관습은 법령 중 선량한 풍속 기타 사회질서에 관계없는 규정과 다른 관습이 있는 경우, 당사자의 의사가 명확하지 아니하면 어떻게 되는가?", "choices": ["그 관습에 의한다", "항상 법률의 규정에 따른다", "당사자의 의사와 관계없이 무효가 된다", "법원의 별도 허가가 있어야 한다"], "answer": 0, "explain": "민법 제106조는 이러한 경우 그 관습에 의한다고 규정한다.", "law": "민법 제106조(사실인 관습)"}, {"no": 2, "category": "상속", "q": "민법상 상속순위에서 가장 후순위인 상속인은?", "choices": ["피상속인의 직계비속", "피상속인의 직계존속", "피상속인의 형제자매", "피상속인의 4촌 이내 방계혈족"], "answer": 3, "explain": "상속순위는 ① 직계비속 → ② 직계존속 → ③ 형제자매 → ④ 4촌 이내 방계혈족이다.", "law": "민법 제1000조(상속의 순위)"}, {"no": 3, "category": "민법총칙", "q": "실종선고에서 일반실종기간과 특별실종기간의 조합으로 옳은 것은?", "choices": ["일반 3년 / 특별 6개월", "일반 5년 / 특별 1년", "일반 5년 / 특별 2년", "일반 10년 / 특별 1년"], "answer": 1, "explain": "부재자의 생사가 5년간 분명하지 않으면 일반실종이고, 전쟁·선박 침몰·항공기 추락 등 사망원인이 될 위난에서는 원칙적으로 1년이 지나면 특별실종이 문제된다.", "law": "민법 제27조(실종의 선고)"}, {"no": 4, "category": "민법총칙", "q": "제한능력자가 속임수로써 자기를 능력자로 믿게 한 경우, 그 행위는?", "choices": ["언제나 무효이다", "언제나 취소할 수 있다", "취소할 수 없다", "법정대리인의 추인이 있어야만 유효하다"], "answer": 2, "explain": "민법 제17조 제1항은 제한능력자가 속임수로써 자기를 능력자로 믿게 한 경우 그 행위를 취소할 수 없다고 정한다.", "law": "민법 제17조(제한능력자의 속임수)"}, {"no": 5, "category": "물권", "q": "1필의 토지에 관하여 분필절차 없이 그 일부를 대상으로 설정할 수 있는 권리로 가장 적절한 것은?", "choices": ["지상권", "저당권", "지역권만 가능", "소유권이전청구권"], "answer": 0, "explain": "판례·교재에서 자주 묻는 핵심 포인트로, 토지 일부를 대상으로 한 지상권 설정은 가능하다고 정리한다.", "law": "민법 물권편 관련 판례·이론"}, {"no": 6, "category": "민법총칙", "q": "천연과실과 법정과실에 관한 설명으로 옳은 것은?", "choices": ["천연과실은 물건의 사용대가이고, 법정과실은 자연적으로 분리되는 산출물이다", "천연과실은 물건의 용법에 의하여 수취하는 산출물이고, 법정과실은 물건의 사용대가로 받는 금전 기타 물건이다", "둘 다 반드시 금전이어야 한다", "둘 다 물건의 원본 자체를 의미한다"], "answer": 1, "explain": "민법 제101조는 천연과실을 물건의 용법에 의하여 수취하는 산출물, 법정과실을 물건의 사용대가로 받는 금전 기타 물건으로 구분한다.", "law": "민법 제101조(천연과실, 법정과실)"}, {"no": 7, "category": "민법총칙", "q": "반사회질서의 법률행위인지 여부는 원칙적으로 언제의 사정을 기준으로 판단하는가?", "choices": ["법률행위 당시", "소송 제기 당시", "판결 선고 당시", "무효를 주장한 당시"], "answer": 0, "explain": "반사회질서 여부는 원칙적으로 법률행위가 이루어진 당시를 기준으로 판단한다.", "law": "민법 제103조(반사회질서의 법률행위) 관련 판례·이론"}, {"no": 8, "category": "민법총칙", "q": "불공정한 법률행위(민법 제104조)의 성립 요소로 옳은 것은?", "choices": ["궁박·경솔·무경험 중 하나의 사정 + 현저하게 공정을 잃은 법률행위", "당사자 간 친족관계 + 손해 발생", "고의 또는 과실 + 위법성 + 손해", "강박 + 사기 + 착오 + 손해"], "answer": 0, "explain": "민법 제104조는 당사자의 궁박, 경솔 또는 무경험으로 인하여 현저하게 공정을 잃은 법률행위를 무효로 한다.", "law": "민법 제104조(불공정한 법률행위)"}, {"no": 9, "category": "민법총칙", "q": "진의 아닌 의사표시에 관한 설명으로 옳은 것은?", "choices": ["표의자가 진의 아님을 알고 한 의사표시는 항상 무효이다", "표의자가 진의 아님을 알고 한 의사표시도 원칙적으로 효력이 있다", "상대방은 언제나 그 무효를 주장할 수 있다", "선의의 제3자도 그 무효를 주장할 수 있다"], "answer": 1, "explain": "민법 제107조 제1항은 표의자가 진의 아님을 알고 한 경우에도 원칙적으로 효력이 있다고 정하고, 상대방이 진의 아님을 알았거나 알 수 있었던 경우에 무효로 한다.", "law": "민법 제107조(진의 아닌 의사표시)"}, {"no": 10, "category": "민법총칙", "q": "태아의 지위에 관한 설명으로 민법상 명문 규정에 부합하는 것은?", "choices": ["태아는 모든 법률관계에서 완전한 권리능력을 가진다", "태아는 손해배상청구권에 관하여 이미 출생한 것으로 본다", "태아는 상속에서만 항상 권리능력이 없다", "태아는 유언과 불법행위에서 모두 법적으로 고려되지 않는다"], "answer": 1, "explain": "민법 제762조는 태아가 손해배상의 청구권에 관하여는 이미 출생한 것으로 본다고 규정한다.", "law": "민법 제762조(손해배상청구권에 있어서의 태아의 지위)"}, {"no": 11, "category": "민법총칙", "q": "민법상 사람의 권리능력은 원칙적으로 언제까지 존속하는가?", "choices": ["출생부터 만 19세까지", "출생부터 사망까지", "수정된 때부터 사망까지", "출생부터 실종선고까지"], "answer": 1, "explain": "민법 제3조는 사람은 생존한 동안 권리와 의무의 주체가 된다고 규정한다.", "law": "민법 제3조(권리능력의 존속기간)"}, {"no": 12, "category": "민법총칙", "q": "현행 민법상 성년이 되는 나이는?", "choices": ["18세", "19세", "20세", "21세"], "answer": 1, "explain": "민법 제4조에 따라 사람은 19세로 성년에 이른다.", "law": "민법 제4조(성년)"}];
let idx = 0;
let answered = Array(questions.length).fill(null);
let correct = 0, wrong = 0;

const $ = id => document.getElementById(id);

function render(){
  const q = questions[idx];
  $("category").textContent = q.category;
  $("number").textContent = `${q.no}번`;
  $("question").textContent = q.q;
  $("choices").innerHTML = "";
  q.choices.forEach((c,i)=>{
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = `<span class="num">${i+1}</span>${c}`;
    b.onclick = () => answer(i);
    $("choices").appendChild(b);
  });
  $("feedback").className = "feedback";
  $("result").textContent = "";
  $("explain").textContent = "";
  $("law").textContent = "";
  updateProgress();
  $("prev").disabled = idx===0;
}

function answer(i){
  if(answered[idx] !== null) return;
  const q = questions[idx];
  answered[idx] = i;
  const buttons = [...document.querySelectorAll(".choice")];
  buttons.forEach((b,n)=>{
    if(n===q.answer) b.classList.add("correct");
    if(n===i && i!==q.answer) b.classList.add("wrong");
    if(n!==q.answer && n!==i) b.classList.add("dim");
  });
  if(i===q.answer){
    correct++;
    $("feedback").className = "feedback show good";
    $("result").textContent = "✅ 정답!";
  }else{
    wrong++;
    $("feedback").className = "feedback show bad";
    $("result").textContent = `❌ 오답 — 정답은 ${q.answer+1}번`;
  }
  $("explain").textContent = q.explain;
  $("law").textContent = "근거: " + q.law;
  updateStats();
}

function next(){
  if(idx < questions.length-1){ idx++; render(); }
  else alert(`문제 풀이 완료!\n정답 ${correct} / ${questions.length}`);
}
function prev(){
  if(idx>0){ idx--; render(); }
}
function updateProgress(){
  $("progress").style.width = `${((idx+1)/questions.length)*100}%`;
}
function updateStats(){
  $("correctCount").textContent = correct;
  $("wrongCount").textContent = wrong;
  const done = correct+wrong;
  $("score").textContent = done ? Math.round(correct/done*100)+"%" : "0%";
}
$("next").onclick = next;
$("prev").onclick = prev;
render();
</script>
</body>
</html>
