태에 있고 통상적인 용도가 도로 외의 장 소에서만 사용하는 것이라는 등의 특별한 사정이 있다면, 민법 제249조의 선의취득 규정이 적용될 수 있다.","chapter":"물권법","answer":"O"},{"id":1230,"text":"채무자 이외의 사람에 속하는 동산을 경매절차에서 경락받은 경우에도 선의취득이 성 립할 수 있다.","chapter":"물권법","answer":"O"},{"id":1231,"text":"매수인이 점유개정으로 동산의 점유를 취득한 경우에는 선의취득이 인정되지 않는다.","chapter":"물권법","answer":"O"},{"id":1232,"text":"점유보조자가 보관한 물건을 횡령하여 형사상 절도죄가 성립되는 경우, 그 물건은 민 법 제250조(도품ㆍ유실물에 대한 특례)의 도품에 해당되므로, 피해자는 점유를 상실한 날로부터 2년 내에 그 물건의 반환을 청구할 수 있다.","chapter":"물권법","answer":"X"},{"id":1233,"text":"악의의 점유자가 점유물의 사용에 따른 이익을 반환하여야 하는 경우, 자신의 노력으 로 점유물을 활용하여 얻은 초과이익도 반환하여야 한다.","chapter":"물권법","answer":"X"},{"id":1234,"text":"악의의 수익자는 받은 이익에 이자를 붙여 반환하여야 하며, 그 이자의 이행지체로 인한 지연손해금도 지급하여야 한다.","chapter":"물권법","answer":"O"},{"id":1235,"text":"악의의 점유자가 과실(果實)을 수취하지 못한 경우, 이에 대한 과실(過失)이 없더라도 그 과실(果實)의 대가를 보상하여야 한다.","chapter":"물권법","answer":"X"},{"id":1236,"text":"점유자가 점유물을 개량하기 위하여 유익비를 지출한 경우는 점유자가 점유물을 반환 할 때에 그 상환을 청구할 수 있으나, 필요비를 지출한 경우에는 즉시 상환을 청구할 수 있다.","chapter":"물권법","answer":"X"},{"id":1237,"text":"점유물이 점유자의 책임 있는 사유로 멸실된 때, 악의의 점유자라 하더라도 자주점유 인 경우는 타주점유에 비하여 책임이 경감된다.","chapter":"물권법","answer":"X"},{"id":1238,"text":"본등기에 의한 물권변동의 효력은 가등기를 한 때에 소급하여 발생한다.","chapter":"물권법","answer":"X"},{"id":1239,"text":"등기가 원인 없이 말소된 경우, 그 회복등기가 마쳐지기 전이라도 말소된 등기의 등 기명의인은 적법한 권리자로 추정된다.","chapter":"물권법","answer":"O"},{"id":1240,"text":"합유자가 그 지분을 포기하면 지분권 이전등기를 하지 않더라도, 포기된 합유지분은 나머지 잔존 합유지분권자들에게 물권적으로 귀속하게 된다.","chapter":"물권법","answer":"X"},{"id":1241,"text":"매매로 인한 소유권이전등기에서 등기명의자가 등기원인을 증여로 주장하였다면 등기 의 추정력은 깨어진다.","chapter":"물권법","answer":"X"},{"id":1242,"text":"사망자 명의로 신청하여 이루어진 이전등기도 특별한 사정이 없는 한 등기의 추정력 이 인정되므로, 등기의 무효를 주장하는 자가 현재의 실체관계에 부합하지 않음을 증 명하여야 한다.","chapter":"물권법","answer":"X"},{"id":1243,"text":"甲은 丙에 대하여 소유권에 기한 방해배제청구권을 행사할 수 있다.","chapter":"물권법","answer":"X"},{"id":1244,"text":"乙은 丙에 대하여 소유권에 기한 방해배제청구권을 행사할 수 없지만, 甲의 소유권에 기한 방해배제청구권을 대위 행사할 수 있다.","chapter":"물권법","answer":"X"},{"id":1245,"text":"丙이 X토지를 자신의 것으로 오신하여 건축폐자재를 적치한 경우라 하더라도, 乙은 丙에 대하여 점유권에 기한 방해배제청구권을 행사할 수 있다.","chapter":"물권법","answer":"X"},{"id":1246,"text":"甲은 丙에 대하여 점유권에 기한 방해배제청구권을 행사할 수 없지만, 乙의 점유권에 기한 방해배제청구권을 대위 행사할 수 있다.","chapter":"물권법","answer":"O"},{"id":1247,"text":"X토지에 대한 임대차 계약이 종료되면 甲은 乙에 대하여 임대차 계약상 반환청구권을 행사할 수 있는데, 이는 채권적 청구권으로 물권적 청구권과 별개로 행사할 수 있다.","chapter":"물권법","answer":"X"},{"id":1248,"text":"시효완성자는 취득시효완성에 따른 등기를 하지 않더라도 시효완성 당시의 등기명의 인에 대하여 취득시효를 주장할 수 있다.","chapter":"물권법","answer":"O"},{"id":1249,"text":"취득시효가 완성되기 전에 등기명의인이 바뀐 경우에는 시효완성자는 취득시효완성 당시의 등기명의인에게 취득시효를 주장할 수 있다.","chapter":"물권법","answer":"O"},{"id":1250,"text":"취득시효완성 후 등기명의인이 변경되면 설사 등기원인이 취득시효 완성 전에 존재하 였더라도, 시효완성자는 변경된 등기명의인에게 취득시효를 주장할 수 없다.","chapter":"물권법","answer":"O"},{"id":1251,"text":"취득시효기간이 진행하는 중에 등기명의인이 변동된 경우, 취득시효기간의 기산점을 임의로 선택하거나 소급하여 20년 이상 점유한 사실만을 내세워 시효완성을 주장할 수 없다.","chapter":"물권법","answer":"O"},{"id":1252,"text":"취득시효완성 후 등기명의인이 바뀐 경우, 등기명의가 바뀐 시점으로부터 다시 취득 시효기간이 경과하더라도 취득시효완성을 주장할 수 없다.","chapter":"물권법","answer":"X"},{"id":1253,"text":"2020. 10. 1. 당시 丙은 X토지에 대하여 법정지상권 등기를 하지 않았기 때문에, 丙은 X토지에 대한 법정지상권을 취득하지 못한다.","chapter":"물권법","answer":"X"},{"id":1254,"text":"2020. 10. 1. 당시 丙이 법정지상권을 취득하였더라도 본인의 의사와 무관하게 취득한 것이므로, 지료를 지급할 필요가 없다.","chapter":"물권법","answer":"X"},{"id":1255,"text":"2021. 1. 16. 丙은 X토지에 대한 법정지상권을 丁에게 주장할 수 있다.","chapter":"물권법","answer":"O"},{"id":1256,"text":"2021. 2. 10. 戊는 법정지상권 등기 없이도, X토지에 대하여 법정지상권을 취득한다.","chapter":"물권법","answer":"X"},{"id":1257,"text":"2021. 2. 27. 현재 丁은 戊에 대하여 Y건물의 철거를 청구할 수 있다.","chapter":"물권법","answer":"X"},{"id":1258,"text":"구분건물의 전유부분에 설정된 저당권의 효력은 특별한 사정이 없는 한 그 전유부분 의 소유자가 나중에 취득한 대지권에도 미친다.","chapter":"물권법","answer":"O"},{"id":1259,"text":"저당목적물에 갈음하는 금전의 인도청구권에 대하여 저당권자가 압류하기 전에 그 금 전이 물상보증인에게 지급되었더라도, 저당권자는 물상보증인에게 부당이득반환을 청 구할 수 있다.","chapter":"물권법","answer":"O"},{"id":1260,"text":"저당권부 채권을 양수한 채권자가 채권양도의 대항요건을 갖추지 않은 경우에는 그보 다 후순위 저당권자에 대하여 채권양도로써 대항할 수 없다.","chapter":"물권법","answer":"X"},{"id":1261,"text":"물상대위권을 행사하지 아니하여 우선변제권을 상실한 저당권자는 저당목적물에 갈음 한 보상금으로 이득을 얻은 다른 채권자에 대하여 그 이익을 부당이득으로 반환청구 할 수 없다.","chapter":"물권법","answer":"O"},{"id":1262,"text":"저당부동산에 대하여 전세권을 취득한 제3자는 저당권자에게 그 부동산으로 담보된 채권을 변제하고 저당권의 소멸을 청구할 수 있다.","chapter":"물권법","answer":"O"},{"id":1263,"text":"타인의 토지에 있는 건물의 소유자가 그 건물에 설정한 전세권의 효력은 그 건물의 소유를 목적으로 한 임차권에도 미친다.","chapter":"물권법","answer":"O"},{"id":1264,"text":"대지와 건물이 동일한 소유자에게 속한 경우에 건물에 전세권을 설정한 때에는 그 대 지소유권의 특별승계인은 전세권설정자에 대하여 지상권을 설정한 것으로 본다.","chapter":"물권법","answer":"O"},{"id":1265,"text":"전세권이 법정갱신된 경우, 전세권자는 등기 없이도 그 목적물을 취득한 제3자에 대 하여 갱신된 권리를 주장할 수 있다.","chapter":"물권법","answer":"O"},{"id":1266,"text":"전세권에 저당권을 설정한 경우, 전세기간이 만료되더라도 전세권의 저당권자는 전세 권 자체에 대하여 저당권을 실행하여 전세금을 배당받을 수 있다.","chapter":"물권법","answer":"X"},{"id":1267,"text":"토지전세권의 존속기간을 15년으로 약정한 경우에 그 존속기간은 10년으로 단축되지 만, 당사자는 존속기간 만료 시에 갱신한 날로부터 10년을 넘지 않는 기간으로 전세 권을 갱신할 수 있다.","chapter":"물권법","answer":"O"},{"id":1268,"text":"유치권자는 유치물의 과실(果實)이 금전인 경우, 이를 수취하여 다른 채권보다 먼저 유치권으로 담보된 채권의 변제에 충당할 수 있다.","chapter":"물권법","answer":"O"},{"id":1269,"text":"유치권자가 유치물의 보존에 필요한 사용을 한 경우에는 특별한 사정이 없는 한, 차 임 상당의 이득을 소유자에게 반환할 의무가 없다.","chapter":"물권법","answer":"X"},{"id":1270,"text":"건물공사대금의 채권자가 그 건물에 대하여 유치권을 행사하는 동안에는 그 공사대금 채권의 소멸시효가 진행하지 않는다.","chapter":"물권법","answer":"X"},{"id":1271,"text":"임대인과 임차인 사이에 임대차 종료에 따른 건물명도 시에 권리금을 반환하기로 약정 한 경우, 임차인은 권리금반환청구권을 가지고 건물에 대한 유치권을 행사할 수 있다.","chapter":"물권법","answer":"X"},{"id":1272,"text":"유치권자가 경매개시결정등기 전에 부동산에 관하여 유치권을 취득하였더라도 그 취 득에 앞서 저당권설정등기가 먼저 되어 있었다면, 경매절차의 매수인에게 자기의 유 치권으로 대항할 수 없다.","chapter":"물권법","answer":"X"},{"id":1273,"text":"집합물 양도담보에서 양도담보의 목적인 집합물을 구성하는 개개의 물건이 변동되더 라도 양도담보권의 효력은 항상 현재의 집합물에 미친다.","chapter":"물권법","answer":"X"},{"id":1274,"text":"주택을 채권담보의 목적으로 양도한 경우, 양도담보권자가 그 주택을 사용ㆍ수익하기 로 하는 약정이 없는 이상 주택에 대한 임대권한은 양도담보 설정자에게 있다.","chapter":"물권법","answer":"O"},{"id":1275,"text":"채무자가 피담보채무의 이행지체에 빠진 경우, 양도담보권자는 채무자로부터 적법하 게 목적 부동산의 점유를 이전받은 제3자에 대하여 직접 소유권에 기한 인도청구를 할 수 있다.","chapter":"물권법","answer":"X"},{"id":1276,"text":"양도담보권의 목적인 주된 동산에 다른 동산이 부합되어 부합된 동산에 관한 권리를 상 실하는 손해를 입은 사람은 양도담보권자를 상대로 그로 인한 보상을 청구할 수 없다.","chapter":"물권법","answer":"O"},{"id":1277,"text":"채무자가 금전채무를 담보하기 위하여 그 소유의 동산을 채권자에게 양도하되 점유개 정에 의하여 이를 계속 점유하기로 한 경우, 다시 다른 채권자와 양도담보 설정계약 을 체결하고 점유개정의 방법으로 그 동산을 인도하더라도 뒤의 채권자는 양도담보권 을 취득할 수 없다.","chapter":"물권법","answer":"O"},{"id":1278,"text":"피담보채권액이 입질채권액보다 적은 경우에도 질권의 효력은 입질채권 전부에 미친다.","chapter":"물권법","answer":"O"},{"id":1279,"text":"주택임차인이 보증금반환채권을 담보로 질권을 설정한 경우, 질권자에게 임대차계약 서를 교부하지 않았더라도 그 질권은 유효하다.","chapter":"물권법","answer":"O"},{"id":1280,"text":"질권설정자가 제3채무자에게 질권설정 사실을 통지한 후 제3채무자가 질권자의 동의 없이 질권설정자와 상계합의를 하여 질권의 목적인 채무를 소멸하게 한 경우, 질권자 는 제3채무자에 대하여 직접 채무의 변제를 청구할 수 있다.","chapter":"물권법","answer":"O"},{"id":1281,"text":"저당권부 채권에 질권을 설정한 경우에는 그 저당권등기에 질권의 부기등기를 하여야 질권의 효력이 저당권에 미친다.","chapter":"물권법","answer":"O"},{"id":1282,"text":"저당권부 채권에 질권을 설정하면서 그 저당권의 피담보채권만을 질권의 목적으로 하 고 저당권은 질권의 목적으로 하지 않는 것은 저당권의 부종성에 반하여 허용되지 않 는다.","chapter":"물권법","answer":"X"},{"id":1283,"text":"환지처분으로 인하여 토지와 그 지상건물의 소유자가 달라진 경우","chapter":"물권법","answer":"O"},{"id":1284,"text":"미등기 건물을 그 대지와 함께 양수한 사람이 그 대지에 관하여서만 소 유권이전등기를 넘겨받고 건물에 대하여는 그 등기를 이전받지 못하고 있는 상태에서 그 대지가 강제경매되어 소유자가 달라진 경우","chapter":"물권법","answer":"O"},{"id":1285,"text":"공유토지 위에 신축한 건물을 단독 소유하던 토지공유자 1인이 자신의 토지지분만을 양도하여 건물과 토지의 소유자가 달라진 경우","chapter":"물권법","answer":"O"},{"id":1286,"text":"토지를 매수하여 소유권이전등기를 마친 매수인이 그 지상에 건물을 신 축한 후 그 토지의 소유권이전등기가 원인무효로 밝혀져 말소됨으로써 건물과 토지의 소유자가 달라진 경우","chapter":"물권법","answer":"O"},{"id":1287,"text":"소유권이전의 대가, 노동의 대가는 법정과실이다.","chapter":"물권법","answer":"X"},{"id":1288,"text":"물건의 용법에 의하여 수취하는 산출물은 천연과실이다.","chapter":"물권법","answer":"O"},{"id":1289,"text":"천연과실은 그 원물로부터 분리하는 때에 이를 수취할 권리자에게 속한다.","chapter":"물권법","answer":"O"},{"id":1290,"text":"미분리의 과실은 독립한 물건이 아니지만, 명인방법을 갖춘 경우에는 타인 소유권의 객체가 될 수 있다.","chapter":"물권법","answer":"O"},{"id":1291,"text":"법정과실은 수취할 권리의 존속기간일수의 비율로 취득할 수 있는 것이지만, 당사자가 그와 다르게 약정할 수도 있다.","chapter":"물권법","answer":"O"},{"id":1292,"text":"丙은 甲에 대해 자전거의 반환을 청구할 수 있다.","chapter":"물권법","answer":"O"},{"id":1293,"text":"丙은 자전거에 대한 선의취득을 근거로 소유권을 주장할 수 있다.","chapter":"물권법","answer":"X"},{"id":1294,"text":"丙의 甲에 대한 점유의 소에서 甲은 자전거에 대한 소유권을 근거로 항변할 수 있다.","chapter":"물권법","answer":"X"},{"id":1295,"text":"甲은 탈환행위 전에 丙에 대해 점유물반환청구권을 행사할 수 있다.","chapter":"물권법","answer":"X"},{"id":1296,"text":"0원","chapter":"물권법","answer":"X"},{"id":1297,"text":"2,000만원","chapter":"물권법","answer":"X"},{"id":1298,"text":"4,000만원","chapter":"물권법","answer":"O"},{"id":1299,"text":"6,000만원","chapter":"물권법","answer":"X"},{"id":1300,"text":"8,000만원","chapter":"물권법","answer":"X"},{"id":1301,"text":"질권의 목적인 채권의 양도행위에는 질권자의 동의가 필요하다.","chapter":"물권법","answer":"X"},{"id":1302,"text":"채권의 목적물이 금전인 때에는 질권자는 자기 채권의 한도에서 직접 청구할 수 있다.","chapter":"물권법","answer":"O"},{"id":1303,"text":"채권질권의 효력은 질권의 목적이 된 채권의 지연손해금 등과 같은 부대채권에도 미친다.","chapter":"물권법","answer":"O"},{"id":1304,"text":"저당권으로 담보한 채권을 질권의 목적으로 한 때에는 그 저당권등기에 질권의 부기 등기를 하여야 그 효력이 저당권에 미친다.","chapter":"물권법","answer":"O"},{"id":1305,"text":"제3채무자가 질권설정 사실을 승낙한 후 질권설정계약이 합의해지된 경우, 질권설정자 가 해지를 이유로 제3채무자에게 원래의 채권으로 대항하려면 질권자가 제3채무자에게 해지 사실을 통지하여야 한다.","chapter":"물권법","answer":"O"},{"id":1306,"text":"상속재산인 부동산에 관하여 상속등기를 하지 않았더라도, 상속인은 상속이 개 시된 때에 그 부동산의 소유권을 취득한다.","chapter":"물권법","answer":"O"},{"id":1307,"text":"공용징수를 위한 수용절차에서 재결에 의하여 토지가 수용되는 경우, 보상금을 공탁한 사업시행자는 수용의 개시일에 그 토지의 소유권을 취득한다.","chapter":"물권법","answer":"O"},{"id":1308,"text":"자기의 노력과 비용으로 건물을 신축한 자는 그 건축허가가 타인의 명의로 된 경우에도 그 건물의 소유권을 원시취득한다.","chapter":"물권법","answer":"O"},{"id":1309,"text":"공유물분할의 조정절차에서 공유자 사이에 공유토지에 대한 현물분할의 조정이 성립한 경우, 각 공유자는 조정에 기하여 지분이전등기를 마침으로써 분할된 부 분에 대한 소유권을 취득한다.","chapter":"물권법","answer":"X"},{"id":1310,"text":"민사집행법에 따른 경매를 통하여 부동산을 매수한 경우, 매수인은 경매법원의 촉탁에 의한 이전등기가 경료된 때에 소유권을 취득한다.","chapter":"물권법","answer":"O"},{"id":1311,"text":"甲이 그 소유건물을 乙에게 임대함으로써 현 실적으로 건물이나 그 부지를 점거 하고 있지 않으면, 甲은 그 부지를 점유한다고 볼 수 없다. 축","chapter":"물권법","answer":"X"},{"id":1312,"text":"甲이 신 한 미등기건물을 양수하여 건물에 대한 사실상의 처 분권을 보유하게 된 乙은 그 건물의 부지도 함 께 점유하고 있다고 볼 수 있다. 축 비","chapter":"물권법","answer":"O"},{"id":1313,"text":"甲이 신 한 건물의 경 원 乙이 甲의 지시를 받아 건물을 사실상 지배하고 있 더라도 특별한 사정이 없는 한 乙은 그 건물의 점유자가 되지 한다. 못","chapter":"물권법","answer":"O"},{"id":1314,"text":"甲이 그 소유건물을 乙에게 임대하여 인도한 경우에도 甲에게 점유권이 인정된다.","chapter":"물권법","answer":"O"},{"id":1315,"text":"甲 명 의로 토 지에 대한 소유권보 등기를 존 마 쳤다면, 특별한 사정이 없는 한 甲 이 그 등기 당시 그 토 지의 점유를 이전받았다고 인정할 수 없다.","chapter":"물권법","answer":"O"},{"id":1316,"text":"甲은 丙을 상대로 주택으로부터의 퇴거를 청구할 수 있다.","chapter":"물권법","answer":"X"},{"id":1317,"text":"甲은 乙을 상대로 토지에 대한 소유권이전등기를 청구할 수 있다.","chapter":"물권법","answer":"O"},{"id":1318,"text":"甲은 丙을 상대로 주택의 철거를 청구할 수 있다.","chapter":"물권법","answer":"O"},{"id":1319,"text":"만약 丁이 그 주택을 丙으로부터 임차하여 주민등록을 마치고 그 주택 에 거주하고 있다면, 甲은 丁을 상대로 퇴거를 청구할 수 있다.","chapter":"물권법","answer":"X"},{"id":1320,"text":"토지에 관하여 1번 저당권 설정 당시 건물이 건축 중이던 경우에도 건물의 규 모, 종류를 예상할 수 있었다면 법정지상권이 성립할 수 있다.","chapter":"물권법","answer":"O"},{"id":1321,"text":"토지에 관하여 1번 저당권 설정 당시 건물이 존재하였다면, 그 후 그 건물을 철 거하고 동일한 규모의 건물을 신축한 경우에도 법정지상권이 성립할 수 있다.","chapter":"물권법","answer":"O"},{"id":1322,"text":"동일인 소유의 토지와 지상건물에 관하여 공동저당권을 설정한 후, 그 건물을 철거하고 새로 건물을 신축한 경우에는 특별한 사정이 없는 한 법정지상권이 성 립하지 않는다.","chapter":"물권법","answer":"O"},{"id":1323,"text":"지상건물이 없는 토 지에 관하여 1 번저 당권을 설 정할 당시 저 당권자가 그 토지 에 건물을 축 였 조하는 것에 동의하 다면 법정지상권이 성립할 수 있다.","chapter":"물권법","answer":"X"},{"id":1324,"text":"토지공유자 한 사람이 다른 공유자 지분 과반수의 동의를 얻어 건물을 건축한 후 경매로 인하여 토지와 건물의 소유자가 달라진 경우 법정지상권이 성립하지 않는다.","chapter":"물권법","answer":"O"},{"id":1325,"text":"선의의 점유자라도 본권에 관한 소에 패소한 때에는 그 소가 제기된 때 로부터 악의의 점유자로 본다.","chapter":"물권법","answer":"O"},{"id":1326,"text":"전후 양 시점에 점유한 사실이 있는 때에는 그 점유는 계속한 것으로 추정되지만, 전후 양 시점의 점유자가 다른 경우에는 점유의 승계가 입 증되더라도 점유계속은 추정되지 않는다.","chapter":"물권법","answer":"X"},{"id":1327,"text":"점유의 승계가 있는 경우, 전 점유자의 점유가 타주점유라 하여도 점유 자의 승계인이 자기의 점유만을 주장하는 경우에는 현 점유자의 점유는 자주점유로 추정된다.","chapter":"물권법","answer":"O"},{"id":1328,"text":"점유자는 소유의 의사로 선의ㆍ무과실, 평온 및 공연하게 점유한 것으로 추정한다.","chapter":"물권법","answer":"X"},{"id":1329,"text":"경매개시결정이 있은 후, 甲이 경매신청을 취하하였다면 채무확정의 효과는 번 복된다.","chapter":"물권법","answer":"O"},{"id":1330,"text":"甲의 경매신청 시에 근저당권이 확정되므로, 그 이후에 발생하는 甲의 원본채권 은 근저당으로 담보되지 않는다.","chapter":"물권법","answer":"X"},{"id":1331,"text":"근저당권의 실행에 따른 경매비용은 채권최고액 1천만원에 포함되지 아니한다.","chapter":"물권법","answer":"X"},{"id":1332,"text":"甲의 피담보채권이 확정되기 전에 발생한 원본채권에 관하여 그 확정 후에 발생 하는 원본채권의 이자나 지연손해금은 채권최고액의 범위 내에서는 근저당권에 의하여 담보된다.","chapter":"물권법","answer":"X"},{"id":1333,"text":"만일 X토지에 대하여 후순위 저당권을 취득한 丙이 경매를 신청한 경우에는 그 매각대금 완납 시에 甲의 피담보채권액이 확정된다.","chapter":"물권법","answer":"X"},{"id":1334,"text":"지역권은 다른 약정이 없는 한 승역지소유권에 부종하여 이전한다.","chapter":"물권법","answer":"X"},{"id":1335,"text":"계약에 의하여 승역지소유자가 자기의 비용으로 지역권의 행사를 위하여 공작물 의 설치 또는 수선의 의무를 부담하기로 한 경우, 위 약정으로 승역지소유자의 특별승계인에게 대항하기 위해서는 등기를 하여야 한다.","chapter":"물권법","answer":"O"},{"id":1336,"text":"통행지역권을 시효취득하기 위해서는 요역지의 소유자가 타인의 토지를 20년간 통행하였다는 사실만으로 충분하며, 요역지의 소유자가 타인의 소유인 승역지 위에 통로를 개설할 필요는 없다.","chapter":"물권법","answer":"X"},{"id":1337,"text":"요역지의 공유자 중 1인이 지역권을 시효로 취득하더라도 다른 공유자는 지역권 을 취득하지 못한다.","chapter":"물권법","answer":"X"},{"id":1338,"text":"승역지는 반드시 1필의 토지이어야 하며, 토지의 일부 위에 지역권을 설정할 수 없다.","chapter":"물권법","answer":"X"},{"id":1339,"text":"X동산의 소유자 乙이 제3자에 대하여 가지는 목적물반환청구권의 양도 의 방법으로 甲에게 질권을 설정하는 것도 유효하다.","chapter":"물권법","answer":"O"},{"id":1340,"text":"乙이 X동산에 대한 처분권 없이 질권을 설정한 경우, 甲이 X동산의 선 의취득에 필요한 요건을 갖추었더라도 甲은 질권을 취득할 수 없다.","chapter":"물권법","answer":"X"},{"id":1341,"text":"甲의 채무자인 丙의 부탁을 받고 乙이 X동산에 질권을 설정한 경우, 甲 의 질권 실행으로 X동산의 소유권을 상실한 乙은 자신의 구상 범위 내에 서 甲의 丙에 대한 권리를 대위할 수 있다.","chapter":"물권법","answer":"O"},{"id":1342,"text":"만약 X동산이 타인의 물건에 부 합되어 乙이 보상금을 지급받은 경우, 甲은 물상대위권을 행사할 수 없다.","chapter":"물권법","answer":"O"},{"id":1343,"text":"특별한 사정이 없는 한, 간접점유는 유치권의 성립요건이자 존속요건인 점유에 해당한다.","chapter":"물권법","answer":"O"},{"id":1344,"text":"건축자재공급업자가 건물 신축공사 수급인과 체결한 자재공급계약에 따라 건축 자재를 공급한 경우, 자재공급업자는 자재대금을 피담보채권으로 하여 건물에 대한 유치권을 행사할 수 없다.","chapter":"물권법","answer":"O"},{"id":1345,"text":"유치권에 의한 경매절차가 정지된 상태에서 그 목적물에 대한 담보권실행을 위한 경매가 진행되어 매각이 이루어지게 되면 그 유치권은 소멸한다.","chapter":"물권법","answer":"X"},{"id":1346,"text":"유치권자로부터 유치물을 유치하기 위한 방법으로 유치물의 점유를 위탁받은 자는 특별한 사정이 없는 한 점유할 권리가 있음을 들어 소유자의 소유물반환청구를 거부 할 수 있다.","chapter":"물권법","answer":"O"},{"id":1347,"text":"건물신축공사를 도급받은 수급인은 사회통념상 독립한 건물이 되지 못한 정착물을 토지에 설치한 상태에서 공사가 중단된 경우, 위 정착물에 대하여 유치권을 행사할 수 없다.","chapter":"물권법","answer":"O"}],"patent":[{"id":1,"text":"국내에 주소 또는 영업소가 있는 자로부터 특허에 관한 절차를 밟을 것을 위임받은 대리인은 특별히 권한을 위임받아야만 청구의 취하를 할 수 있다.","chapter":"특허절차","answer":"O","explanation":"청구의 취하는 특별수권이 필요한 행위이므로 일반적인 절차대리권만으로는 할 수 없다."},{"id":2,"text":"지식재산처장 또는 특허법 제145 조(심판장)제1 항에 따라 지정된 심판장은, 특허에 관한 절차를 밟는 자가 그 절차를 원활히 수행할 수 없거 나 구술심리(口述審理)에서 진술할 능력이 없다고 인정되는 등 그 절차를 밟는 데 적당하지 아니하다고 인정되면 대리인을 선임하여 그 절차 를 밟을 것을 명할 수 있다.","chapter":"특허절차","answer":"O","explanation":"특허절차의 원활한 수행이나 구술심리에서의 적정한 진술 등을 위해 필요한 경우 대리인 선임을 명할 수 있다."},{"id":3,"text":"특허에 관한 절차를 밟는 자의 위임을 받은 대리인의 대리권은, 법정대리인이 사망하거나 행위능력을 상실하면 소멸한다.","chapter":"특허절차","answer":"X","explanation":"법정대리인의 사망 또는 행위능력 상실이 위임받은 대리인의 대리권을 당연히 소멸시키는 것은 아 니다. 대리인의 선임 또는 교체 명령 후 지식재산처장 또는 심판장은 특허에 관한 절차를 밟는 자 또는 대리 인이 그 전에 지식재산처장 또는 특허심판원장에 대하여 한 특허에 관한 절차의 전부 또는 일부를 무효 로 할 수 있다."},{"id":4,"text":"당사자에게 일정하지 아니한 기간 동안 지식재산처 또는 특허심판원에 계속 중인 절차를 속행할 수 없는 장애사유가 생긴 경우, 지식재산처장 또는 심판관은 결정으로 장애사유가 해소될 때까지 해당 절차 의 중지를 명할 수 있으며, 이에 따른 결정은 취소할 수 없다.","chapter":"특허절차","answer":"X","explanation":"절차중지 결정이 절대로 취소될 수 없다고 할 수 없다."},{"id":5,"text":"지식재산처 또는 특허심판원에 계속 중인 특허에 관한 절차는 당사자가 사망한 경우 중단되며, 사망 한 당사자의 상속인ㆍ상속재산관리인 또 는 법률에 따라 절차를 속행할 자는 중단 중인 절차를 즉시 수계 (受繼)하여야 한다.","chapter":"특허절차","answer":"X","explanation":"절차중단 후 수계에는 법정 절차와 기간이 있으므로 단순히 ‘즉시 수계하여야 한다’고 할 수 없다."},{"id":6,"text":"특허에 관한 절차가 천재지변을 이유로 중지된 경우에 그 기간의 진행은 정지되고, 해당 사유가 소멸 되어 그 절차가 속행되면 잔여 기간이 진 행된다.","chapter":"특허절차","answer":"X","explanation":"절차의 중지와 기간의 정지는 동일한 개념이 아니다. 특허법상 기간계산의 특칙을 구별해야 한다."},{"id":7,"text":"특허청장 또는 심판장은 특허에 관한 절차를 밟는 자의 대리인이 그 절차를 원활히 수행할 수 없거나 구술심리에서 진술할 능력이 없다고 인 정되는 등 그 절차를 밟는 데 적당하지 아니하다고 인정되면 변리 사로 하여금 대리하게 할 것을 명할 수 있다.","chapter":"특허절차","answer":"O","explanation":"특허절차를 원활하게 수행할 수 없거나 구술심리에서 진술능력이 부족한 등 적당하지 않은 경우에 는 변리사로 하여금 대리하게 할 수 있다."},{"id":8,"text":"특허출원에 있어서 거절이유통지에 따른 의견서 제출기간의 마지막 날이 2025. 1. 28.(화요일, 28일 부터 30일은 법정공휴일)인 경우 2025. 1. 31.(금요일) 제출된 의견서는 적법한 서류로 볼 수 없어 반려 되어야 한다.","chapter":"특허절차","answer":"X","explanation":"기간의 말일이 공휴일 등에 해당하면 기간은 그 다음 날까지 연장된다. 따라서 1 월 31일 제출은 적 법하다."},{"id":9,"text":"특허에 관한 절차에서 기간이 2025. 1. 31.(금요일) 오전 0 시부터 시작하는 경우 그 기간은 2025. 2. 3.(월요일)부터 기산한다.","chapter":"특허절차","answer":"X","explanation":"특허법 제14 조제1 호는 기간이 오전 0 시부터 시작하는 경우 첫날을 산입하도록 한다. 따라서 2025. 1. 31.부터 기산하며, 2 월 3일로 미루 어 기산하는 것은 아니다."},{"id":10,"text":"제28 조의3(전자문서에 의한 특허에 관한 절차의 수행) 제1 항에 따라 정보통신망을 이용하여 제출된 전자문서는 그 문서의 제출인이 정보 통신망을 통하여 접수번호를 확인할 수 있는 때에 특허청 또는 특허 심판원에서 사용하는 접수용 전산정보처리조직의 파일에 기록된 내용으 로 접수된 것으로 본다.","chapter":"특허절차","answer":"O","explanation":"전자문서 제출에 관한 접수시점은 법에서 정한 전산정보처리조직의 기록을 기준으로 한다."},{"id":11,"text":"심사관은 제28 조의4(전자문서 이용신고 및 전자서명) 제1 항에 따라 전자문서 이용신고를 한 자에게 서류의 통지 및 송달을 하려는 경우에 는 정보통신망을 이용하여 통지 등을 할 수 있고, 위 서류의 통지등 은 서면으로 한 것과 같은 효력을 가진다.","chapter":"특허절차","answer":"O","explanation":"전자문서 이용신고를 한 자에 대한 전자적 통지·송달은 서면과 같은 효력이 인정된다."},{"id":12,"text":"특허법에 따른 명령에 따라 특허청장 또는 특허심판원장에게 제출하는 출원서, 청구서, 그 밖의 서류 는 특허청장 또는 특허심판원장에게 도 달한 날부터 제출의 효력이 발생한다.","chapter":"특허절차","answer":"O","explanation":"원칙적으로 특허에 관한 서류는 특허청장 또는 특허심판원장에게 도달한 때 효력이 발생한다."},{"id":13,"text":"기간을 월 또는 연의 처음부터 기산하지 아니하는 때에는 최후의 월 또는 연에서 그 기산일에 해당하 는 날의 전일로 기간이 만료한다.","chapter":"특허절차","answer":"O","explanation":"월 또는 연으로 정한 기간은 법정 방식에 따라 계산한다."},{"id":14,"text":"기간의 기산일이 공휴일인 경우 그 기간은 공휴일의 다음날부터 시작된다.","chapter":"특허절차","answer":"X","explanation":"공휴일 때문에 기간의 기산일이 다음 날로 미뤄지는 것은 아니다. 특허법 제14 조는 기간의 첫날을 원칙적으로 산입하지 않되, 오전 0 시부터 시작하는 경우에는 첫날을 산입한다. 공휴일 특칙은 기간의 마지막 날에 관한 것이다."},{"id":15,"text":"법정기간은 단축할 수 없으나 지정기간은 당사자의 청구에 따라 단축할 수 있다.","chapter":"특허절차","answer":"O","explanation":"옳다. 법정기간은 원칙적으로 단축할 수 없지만, 특허법 제15 조제2 항에 따른 지정기간은 당사자의 청구로 단축할 수 있다. 이 내용은 제60 회 기출의 정답 취지와도 일치한다."},{"id":16,"text":"국내에 주소 또는 영업소가 없는 재외자라 하더라도 국내에 체류하고 있는 경우에는 재외자의 이름으 로 특허에 관한 절차를 밟을 수 있다.","chapter":"특허절차","answer":"O","explanation":"재외자라도 국내에 체류하는 경우에는 특허관리인 제도의 적용관계를 달리하여 특허절차를 직접 밟을 수 있다."},{"id":17,"text":"특허청 심사관이 의견제출통지서에서 출원인의 의견서 제출 기간을 지정한 경우, 이 지정기간은 출원 인의 청구에 의하여 연장뿐만 아니라 단 축도 가능하다.","chapter":"특허절차","answer":"O","explanation":"지정기간은 법에서 정한 절차에 따라 연장하거나 단축할 수 있다. 특허권 및 특허에 관한 권리의 등록신청서류와 특허협력조약 제2 조 (vii)에 따른 국제출원에 관한 서류 를 우편으로 제출하는 경우, 우편물의 통신일부인(通信日付印)에 표시된 날이 분명하다면 표시된 날부터 효력 이 발생한다."},{"id":18,"text":"특허청장 또는 특허심판원장은 부적법한 출원서류 등에 대하여 원칙적으로 반려 취지와 반려 이유 및 소명기간을 서면으로 통지하여야 한다.","chapter":"특허절차","answer":"O","explanation":"반려처분 전 소명기회를 부여하는 절차가 마련되어 있다. 반려 통지를 받은 출원인은 소명기간 안에 소명서를 제출하거나, 소명하지 않고 서류를 반려받으려면 반려요청서를 제출할 수 있다."},{"id":19,"text":"특허청장이나 특허심판원장이 한 반려처분에는 행정심판이나 행정소송으로 불복할 수 없다.","chapter":"특허절차","answer":"X","explanation":"반려처분은 행정쟁송의 대상이 될 수 있다."},{"id":20,"text":"특허고객번호는 특허청장 또는 특허심판원장에게 신청한다.","chapter":"특허절차","answer":"O","explanation":"특허에 관한 절차를 위해 고유번호를 부여받는다."},{"id":21,"text":"특허에 관한 절차를 밟는 자의 대리인도 반드시 별도의 특허고객번호를 신청하여야 한다.","chapter":"특허절차","answer":"X","explanation":"대리인이 당사자와 동일한 방식으로 반드시 별도 번호를 받아야 하는 것은 아니다. 특허청장 또는 특허심판원장은 특허고객번호를 신청 하지 않은 자에게 기간을 정하여 보정을 명할 수 있다."},{"id":22,"text":"특허고객번호를 기재하면 당사자의 주소 등을 적지 않을 수 있다.","chapter":"특허절차","answer":"O","explanation":"고유번호로 당사자 식별이 가능한 경우 주소 등의 중복 기재가 생략될 수 있다.. Ⅱ특허요건 및 특허출원 문항 수: 228 개 Ⅱ. 특허요건 및 특허출원 문항 수: 228개"},{"id":23,"text":"행위능력 또는 법정대리권이 없거나 특허에 관한 절차를 밟는 데 필요한 권한의 위임에 흠이 있는 자 가 밟은 절차는 보정(補正)된 당사자나 법정대리인이 추인하면 행위를 한 때로 소급하여 그 효력이 발생 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"행위능력이나 대리권에 흠이 있는 절차라도 적법한 추인이 있으면 그 행위를 한 때로 소급하여 효 력이 발생한다."},{"id":24,"text":"지식재산처장 또는 특허심판원장은 특허법 제46 조(절차의 보정)에 따른 보정명령을 받은 자가 지정 된 기간에 그 보정을 하지 아니하면 특허 에 관한 절차를 무효로 할 수 있다. 다만, 특허법 제82 조(수수료) 제2 항에 따른 심사청구료를 내지 아니하여 보정명령을 받은 자가 지정된 기간에 그 심사청구료를 내지 아니하는 경우에는 특허출원서에 첨부한 명세서에 관한 보정을 무효로 할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"보정명령 불이행은 절차의 무효사유가 될 수 있고, 심사청구료 미납에 대해서는 별도의 특칙이 있 다."},{"id":25,"text":"출원인으로부터 출원고안의 실용신안출원 및 등록에 관한 모든 절차에 관하여 포괄적 대리권을 받은 출원대리인은 출원인 본인을 위하여 거 절결정등본 등 출원절차와 관련된 서류를 송달받을 지위에 있으 므로, 거절결정등본 송달의 효력은 출원인과 대리인 중 누구에게라도 최초로 송달되었을 때 발생한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"포괄위임을 받은 대리인이 있는 경우 특허절차상 송달의 효력에 관한 특칙이 적용된다. 따라서 출 원인 또는 적법한 대리인에게 최초로 송달 된 때의 효력을 판단해야 한다."},{"id":26,"text":"발명이 완성되었는지는 반드시 설명 중의 구체적 실시례에 한정되어 인정되는 것은 아니고, 당해 발 명이 속하는 분야에서 통상의 기술자가 반복 실시할 수 있고 당해 발명이 목적하는 기술적 효과의 달성 가능성을 예상할 수 있을 정도로 구체적, 객관적으로 구성되어 있다면 당해 발 명은 완성되었다고 보아야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"발명의 완성 여부는 구체적 실시예가 반드시 존재하는지를 기준으로 하는 것이 아니라, 통상의 기 술자가 반복 실시할 수 있을 정도로 구체적· 객관적으로 구성되었는지를 기준으로 한다."},{"id":27,"text":"누구든지 특허출원에 대하여 특허출원일부터 3년 이내에 특허청장에게 출원심사의 청구를 할 수 있 다. 다만, 공동발명자 중 1 인이 특허출원 을 한 경우 출원심사의 청구를 취하할 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"출원심사의 청구는 누구든지 할 수 있지만, 출원심사의 청구 자체는 취하할 수 없다."},{"id":28,"text":"심사관은 제54 조(조약에 의한 우선권 주장)에 따른 우선권 주장을 수반한 특허출원의 심사에 필요한 경우에는 기간을 정하여 그 우선권 주장 의 기초가 되는 출원을 한 국가의 심사결과에 대한 자료를 산업 통상자원부령으로 정하는 방법에 따라 제출할 것을 특허출원인에게 명할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"조약우선권 주장 출원의 심사에 필요한 경우 외국 심사결과 자료의 제출을 명할 수 있다."},{"id":29,"text":"특허를 받을 수 있는 권리가 공유인 경우에는 공유자 모두가 공동으로 특허출원을 하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허를 받을 수 있는 권리가 공유이면 공유자 전원이 공동으로 출원하여야 한다."},{"id":30,"text":"특허를 받을 수 있는 권리를 이전하기로 하는 계약에 따라 특허등록을 공동출원한 경우에 출원인이 발명자가 아니라도 등록된 특허권의 공유 지분을 가진다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허를 받을 수 있는 권리를 적법하게 승계한 자는 발명자가 아니더라도 특허권자가 될 수 있다."},{"id":31,"text":"제47 조(특허출원의 보정) 제2 항에 규정된 ‘최초로 첨부된 명세서 또는 도면에 기재된 사항’이란 최초 명세서 등에 명시적으로 기재되어 있 는 사항이거나 또는 명시적인 기재가 없더라도 그 발명이 속하는 기 술분야에서 통상의 지식을 가진 자라면 출원시의 기술상식에 비추어 보아 보정된 사항이 최초 명세서 등 에 기재되어 있는 것과 마찬가지라고 이해할 수 있는 사항이어야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"최초 명세서 등에 명시적으로 기재되었거나 통상의 기술자에게 자명하게 이해될 수 있는 사항의 범위 내에서 보정할 수 있다."},{"id":32,"text":"제51 조(보정각하) 제1 항이 ‘청구항을 삭제하는 보정’의 경우를 대상에서 제외하고 있는 취지는, 보정 의 반복에 의하여 심사관의 새로운 심 사에 따른 업무량 가중 및 심사절차의 지연의 문제가 생기지 아니 하므로 그에 대하여 거절이유를 통지하여 보정의 기회를 다시 부여함으로써 출원인을 보호하려는 데 있 다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"청구항 삭제보정은 일반적으로 새로운 심사 부담이나 절차 지연을 초래하지 않는다는 점을 고려한 특칙이다."},{"id":33,"text":"외국어특허출원에 대한 명세서 또는 도면의 보정은 특허출원서에 최초로 첨부한 명세서 또는 도면에 기재된 사항의 범위에서 하여야 한다. 또 한 보정은 최종 국어번역문 또는 특허출원서에 최초로 첨부한 도면(도면 중 설명부분은 제외한다)에 기재된 사항의 범위에서도 하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"외국어특허출원은 최초 외국어 명세서·도면과 최종 국어번역문 등의 기재범위를 함께 고려한다."},{"id":34,"text":"청구항을 삭제하는 보정을 하였더라도 삭제된 청구항과 관련이 없는 부분에서 새롭게 발생한 거절이 유는 심사관에게 새로운 심사에 따른 업 무량을 가중시키고, 심사절차가 지연되는 결과를 가져오게 하는 등 달리 취급하여야 할 필요가 없으므로 제51 조(보정각하) 제1 항 본문이 규정하는 청구항을 삭제하는 보정에 따라 발생한 새로운 거절이유에 포함된다고 할 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"삭제된 청구항과 무관한 부분에서 새롭게 생긴 거절이유는 청구항 삭제보정으로 인해 발생한 새로 운 거절이유로 보지 않는다."},{"id":35,"text":"국내우선권주장에 있어서 선출원의 취하로 보는 시점은 기간의 말일이 공휴일이라 하더라도 기간의 말일이 그 다음날로 연장되지는 않는다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"기간의 말일이 공휴일이면 원칙적으로 다음 날로 기간이 연장된다."},{"id":36,"text":"특허법 제2 조(정의)는 ‘발명자’란 자연법칙을 이용하여 기술적 사상을 창작한 자로 규정하고 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"특허법 제2 조는 ‘발명’은 정의하지만 ‘발명자’를 별도로 정의하고 있지는 않다."},{"id":37,"text":"특허법 제42 조(특허출원) 제1 항에 따라 출원인과 발명자가 동일한 경우 특허출원서에는 발명자의 성 명 및 주소를 생략할 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"출원인과 발명자가 동일하더라도 발명자의 성명 및 주소를 임의로 생략할 수 없다."},{"id":38,"text":"물건을 생산하는 방법에 관한 발명이 있는 경우, 그 방법에 의하여 생산한 물건을 수출하는 행위 자체 는 특허발명의 실시행위에 해당하지 않 는다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"방법발명의 실시에는 그 방법의 사용 등이 포함되지만, 그 방법으로 생산된 물건의 수출 자체가 곧 바로 방법발명의 실시행위가 되는 것은 아 니다."},{"id":39,"text":"법인이 아닌 사단 또는 재단이라 하더라도 대표자나 관리인이 정하여져 있다면, 그 사단 또는 재단의 이름으로 출원심사의 청구인, 심판의 청 구인ㆍ피청구인이 될 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"대표자 또는 관리인이 정하여져 있는 법인이 아닌 사단·재단은 특허절차의 당사자가 될 수 있다."},{"id":40,"text":"특허출원 후에는 특허를 받을 수 있는 권리의 승계는 상속, 그 밖의 일반승계의 경우를 제외하고는 특 허출원인변경신고를 하여야만 그 효력 이 발생한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허출원 후 특허를 받을 수 있는 권리의 특정승계는 특허출원인변경신고가 있어야 특허법상 효력 이 발생한다."},{"id":41,"text":"특허출원 전에 이루어진 특허를 받을 수 있는 권리의 승계는 그 승계인이 특허출원을 하여야만 그 효 력이 발생한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"출원 전 승계의 경우에는 승계인이 직접 출원하여야만 권리승계의 효력이 발생하는 것은 아니다."},{"id":42,"text":"특허를 받을 수 있는 권리는 발명의 완성과 동시에 발명자에게 원시적으로 귀속되지만, 이는 재산권 으로 양도성을 가지므로 계약 또는 상속 등을 통하여 전부 또는 일부 지분을 이전할 수 있고, 특허를 받 을 수 있는 권리를 이전하기로 하는 계약은 명시적으로는 물론 묵시적으로도 이 루어질 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허를 받을 수 있는 권리는 발명자에게 원시적으로 귀속되고 재산권으로서 이전될 수 있다."},{"id":43,"text":"정부는 특허출원될 발명이 국방상 필요한 경우에는 특허를 하지 아니할 수 있으며, 전시ㆍ사변 또는 이에 준하는 비상시에 국방상 필요한 경 우에는 특허를 받을 수 있는 권리를 수용할 수 있고, 특허하지 아 니하거나 수용한 경우에는 정부는 정당한 보상금을 지급하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"국방상 필요한 발명에 대해서는 특허를 하지 않거나 권리를 수용할 수 있으며 정당한 보상이 따른 다."},{"id":44,"text":"동일한 자로부터 동일한 발명 및 고안에 대한 특허를 받을 수 있는 권리 및 실용신안등록을 받을 수 있 는 권리를 승계한 자가 둘 이상인 경우 그 승계한 권리에 대하여 같은 날에 특허출원 및 실용신안등록출 원이 있으면 특허출원인 및 실용신안등록출원인 간에 협의하여 정한 자에게 만 승계의 효력이 발생한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"동일한 권리를 승계한 자가 특허출원과 실용신안등록출원을 각각 한 경우에는 법에서 정한 협의에 따라 승계의 효력을 정한다."},{"id":45,"text":"특허출원인은 최초 거절이유를 통지받기 전까지의 자진보정에서는 특허출원서에 최초로 첨부한 명세 서에 없는 구성을 추가하는 보정이 가 능하다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"자진보정이라도 최초 명세서·도면에 기재되지 않은 신규사항을 추가할 수 없다."},{"id":46,"text":"최초 거절이유를 통지받고 해당 거절이유에 따른 보정을 할 수 있지만, 이 경우에는 거절이유에 기재 되지 않은 다른 사항에 대하여 보정을 할 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"거절이유통지 후에도 신규사항 추가 금지 범위에서 다른 사항에 관한 보정이 가능하다."},{"id":47,"text":"최초 거절이유를 해소하고자 청구항의 구성 A 를 하위개념의 구성인 “a+b”로 보정하였으나, 이에 대 하여 심사관으로부터 다시 거절이유를 통지받은 경우, 구성 “a+b”를 “a”로 보정하고 “b”를 신설 청구항 으로 보정을 할 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"다시 거절이유가 통지되면 최후거절이유통지에 해당하고, 청구범위 감축 등 특허법상 제한된 범위 의 보정만 가능하다."},{"id":48,"text":"거절결정에 대한 재심사청구에서는 보정을 하여야 하며, 이 경우에는 청구항을 신설할 수 없지만, 청 구항의 구성 A 에 발명의 설명에 기재된 하위개념의 구성 “a”를 직렬 부가하는 “A+a”로 보정할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"재심사청구와 함께 적법한 보정이 가능하며, 청구범위 감축을 위한 A+a 보정도 가능하다."},{"id":49,"text":"거절결정등본을 받은 후, 재심사를 청구하지 않고 거절결정불복심판을 청구하는 경우에는 심사관의 거절결정 이유를 해소하기 위한 도면의 보정만 가능하다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"심판청구 후에도 법이 정한 범위에서 명세서와 도면의 보정이 가능하다. 분할출원은 특허출원이 특허청에 계속 중인 경우에 한하여 할 수 있으므로, 거절결정이 있는 때에는 거절결정등본을 송달받은 날부터 30일 이내에 분할출원을 할 수 있으나 특허결정이 있는 때에는 분할출 원을 할 수 없다."},{"id":50,"text":"심사관은 특허법 제62 조(특허거절결정)에 따라 특허거절결정을 하고자 할 때에는 출원인에게 통지하 고 기간을 정하여 의견서를 제출할 기 회를 주어야 하지만, 보정각하결정을 하려는 경우에는 그러하지 아 니하다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"거절결정과 보정각하는 의견서 제출기회 부여 여부가 다르다."},{"id":51,"text":"거절이유통지를 받은 후 그 통지에 따른 의견서 또는 보정서 제출기한 내에 2 회 이상 보정을 하는 경 우, 각각의 보정절차에서 마지막 보정 전 에 한 모든 보정은 취하된 것으로 본다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"동일한 제출기간 내 여러 차례 보정한 경우 마지막 보정 전의 보정은 취하간주된다."},{"id":52,"text":"거절이유통지에서 지정된 기간이 경과하여 보정서와 의견서가 제출되더라도 등록 또는 거절결정 전 에는 모두 수리하여야 한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"지정기간이 지나 제출된 서류를 반드시 수리하여야 하는 것은 아니다."},{"id":53,"text":"심사관은 청구범위에 둘 이상의 청구항이 있는 특허출원에 대하여 거절이유를 통지할 때에는 그 통지 서에 거절되는 청구항을 명확히 밝히고, 그 청구항에 관한 거절이유를 구체적으로 적어야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"거절이유통지에서는 대상 청구항과 거절이유를 구체적으로 특정해야 한다."},{"id":54,"text":"특허출원서에 최초로 첨부한 명세서에 청구범위를 적지 아니한 분할출원에 관하여는 제42 조의2 제2 항에 따른 기한이 지난 후에도 분할출 원을 한 날부터 30일이 되는 날까지는 명세서에 청구범위를 적는 보정을 할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"분할출원의 청구범위 미기재에 관한 별도의 보정기간이 인정된다."},{"id":55,"text":"분할출원을 할 수 있는 권리를 가진 자는 원출원을 한 자 또는 그 승계인이고, 공동 출원의 경우에는 원출원과 분할출원의 출원인 전원이 완전 히 일치하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"분할출원의 출원인 적격과 공동출원인 동일성에 관한 내용이다."},{"id":56,"text":"분할출원의 경우에 제54 조(조약에 의한 우선권 주장)에 따른 우선권을 주장하는 자는 같은 조 제4 항 에 따른 서류를 같은 조 제5 항에 따른 기간이 지난 후에도 분할출원을 한 날부터 3개월 이내에 특허청장 에게 제출할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"분할출원에서 우선권 관련 서류의 제출에 관한 특례가 인정된다."},{"id":57,"text":"특허법 제51 조 제1 항 본문에 의하면, 심사관은, 청구항을 삭제하는 보정을 제외하고, 특허법 제47 조(특 허출원의 보정) 제1 항 제2 호 및 제3 호에 따른 보정이 그 보정에 따라 새로운 거절이유가 발생한 것으로 인정하면 결정으로 그 보정을 각하하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"새로운 거절이유가 발생한 경우의 보정각하 요건에 관한 내용이다. 특허법 제51 조 제1 항 본문의 ‘새로운 거절이유가 발생한 것’이란 해 당 보정으로 인하여 이전에 없던 거절이유가 새롭게 발생한 경우를 의미하는 것이다."},{"id":58,"text":"기재불비의 최후거절이유를 통지함에 따라 이를 해소하기 위한 보정으로 청구항이 신설된 경우, 신설 된 청구항이 청구항을 정리하면서 발생 하는 불가피한 경우로서 청구범위를 감축하는 경우가 아니라면 심사관은 결정으로 그 보정을 각하하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"최후거절이유통지 후 허용되는 보정범위를 벗어난 청구항 신설은 각하 대상이 된다."},{"id":59,"text":"미완성발명을 이유로 하는 최초거절이유를 통지함에 따라 이를 해소하기 위하여 미완성발명을 완성 시키는 보정을 한 경우라고 심사관이 인 정하면 결정으로 그 보정을 각하하여야 한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"최초거절이유통지 후 미완성발명을 완성시키는 보정이라는 이유만으로 보정각하되는 것은 아니다."},{"id":60,"text":"최후거절이유통지에 대한 의견서 제출기간 내에 단순히 청구항을 삭제하는 보정을 하면서 삭제된 청 구항을 인용하던 종속항에서 그 인용번 호를 잘못 변경함으로써 기재불비가 발생한 경우, 심사관은 거절 이유를 통지하여 출원인에게 보정의 기회를 부여하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"단순한 청구항 삭제 과정에서 생긴 불가피한 기재불비에 대해서는 보정 기회를 부여할 수 있다."},{"id":61,"text":"반려이유를 극복하기 위한 보정서는 소명기간 중 제출할 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"반려절차에서 허용되는 것은 소명이나 의견의 제출이고 반려이유를 보정으로 치유하는 것은 허용 되지 않는다."},{"id":62,"text":"반려된 출원은 선출원의 지위를 가질 수 없고 조약우선권의 기초출원으로도 이용할 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"반려된 출원은 적법한 출원으로 존속하지 않는다."},{"id":63,"text":"설정등록 이후에도 일정한 기간에는 분할출원을 할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허결정 후에도 일정 요건 아래 분할출원이 가능하다."},{"id":64,"text":"특허결정 등본을 받은 후 특허료를 납부하기 전에는 원출원의 청구범위에 새로운 발명을 추가하는 보 정을 할 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"특허결정 후에는 일반적인 명세서·청구범위 보정이 허용되지 않는다."},{"id":65,"text":"특허결정 후에도 원출원에서 권리화하지 못한 발명을 별도의 분할출원 등을 통하여 권리화할 기회가 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"분할출원제도 등에 의해 별도의 권리화가 가능하다."},{"id":66,"text":"특허출원인이 아닌 자가 출원심사를 청구한 경우 특허청장은 그 사실을 출원인에게 알려야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"제3 자의 심사청구가 있으면 출원인에게 통지한다."},{"id":67,"text":"제3 자가 심사청구한 후 청구항 수가 증가하더라도 증가된 청구항의 심사청구료는 기존 심사청구인 이 부담한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"증가한 청구항에 관한 추가 심사청구료의 부담 주체가 달라진다."},{"id":68,"text":"심사청구는 심사가 착수되기 전이라면 특별한 사유가 있는 경우 취하할 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"출원심사청구는 원칙적으로 취하할 수 없다."},{"id":69,"text":"심사청구가 없더라도 공익상 필요하면 심사관이 직권으로 심사를 할 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"특허출원에 대한 심사는 출원심사청구가 있어야 한다.. Ⅱ특허요건 및 특허출원 특허법 제29 조 제3 항에 따른 확대된 선원에 관한 설명"},{"id":70,"text":"甲이 2024. 8. 1. 특허출원 X 를 기초로 발명 B 에 대하여 분할출원 Z 를 한 후 2025. 2. 1. 특허출원 X 를 취하한 경우","chapter":"특허요건 및 특허출원","answer":"X","explanation":"분할출원의 존재만으로 원출원이 확대된 선원 관계에서 당연히 제외되는 것은 아니므로, 지문의 경우 Y 가 제29 조 제3 항에 의해 거절되지 않는다고 볼 수 없다."},{"id":71,"text":"甲이 2025. 2. 1. 乙에게 특허출원 X 에 대한 특허를 받을 수 있는 권리를 양도한 경우","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허를 받을 수 있는 권리의 양도로 인하여 출원인 관계가 변경되더라도 제29 조 제3 항의 적용 여 부는 최초 출원과 후출원의 관계를 기준으 로 판단한다."},{"id":72,"text":"甲의 특허출원 X 가 2026. 2. 1. 무효된 경우","chapter":"특허요건 및 특허출원","answer":"X","explanation":"출원이 무효가 되었다는 사정만으로 확대된 선원의 효과가 당연히 소멸한다고 볼 수 없다."},{"id":73,"text":"乙이 2023. 12. 1. 발명 B 를 공개하여 국내에 공지된 후 2024. 12. 1. 소정의 보완수수료를 납부하 면서 특허법 제30 조(공지 등이 되지 아 니한 발명으로 보는 경우)제1 항제1 호를 적용받으려는 취지를 적 은 서류 및 이를 증명하는 서류를 적법하게 제출한 경우","chapter":"특허요건 및 특허출원","answer":"X","explanation":"공지예외 규정은 자신의 공지에 대한 예외일 뿐 제3 자의 확대된 선원 문제까지 제거하는 것은 아 니다. 또한 이 지문의 기간관계에서는 제29 조 제3 항 적용을 피할 수 없다."},{"id":74,"text":"甲이 2024. 6. 1. 특허출원 X 의 발명의 설명에서 B 를 삭제 보정한 경우","chapter":"특허요건 및 특허출원","answer":"X","explanation":"최초 출원 당시 기재에 의해 발생한 선원의 효과가 이후 보정으로 당연히 소멸하는 것은 아니다."},{"id":75,"text":"물건의 발명에서 통상의 기술자가 특허출원 당시의 기술수준으로 보아 과도한 실험이나 특수한 지식 을 부가하지 않고서도 발명의 설명에 기 재된 사항에 의하여 물건 자체를 생산하고 이를 사용할 수 있고, 구체적인 실험 등으로 증명이 되어 있지 않더라도 통상의 기술자가 발명의 효 과의 발생을 충분히 예측할 수 있다면, 특허법 제42 조(특허출원)제3 항제1 호에서 정한 기재요건을 충족한다고 볼 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"실시가능요건은 통상의 기술자가 과도한 실험 없이 발명을 실시할 수 있는지를 기준으로 한다."},{"id":76,"text":"청구범위의 청구항이 발명의 설명에 의하여 뒷받침되지 않으면 거절 이유가 되며, 착오로 등록된 경 우에는 무효사유가 된다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"청구범위가 발명의 설명에 의해 뒷받침되지 않는 것은 거절이유이자 등록 후 무효사유가 된다."},{"id":77,"text":"발명의 설명을 기재할 때 그 발명의 배경이 되는 기술을 전혀 적지 않았음에도 착오로 등록된 경우에 는 무효사유가 된다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"배경기술을 기재하지 않았다는 사실만으로 곧바로 독립적인 무효사유가 되는 것은 아니다."},{"id":78,"text":"도면의 간단한 설명은 명세서의 발명의 설명에 기재하며, 해당하는 사항이 없는 경우에는 그 기재를 생략할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"도면의 간단한 설명은 명세서의 발명의 설명에 포함되며 해당 사항이 없는 경우 생략할 수 있다."},{"id":79,"text":"특허출원인이 명세서 및 도면(도면 중 설명부분에 한정한다)을 국어가 아닌 영어로 적겠다는 취지를 특허출원을 할 때 특허출원서에 적은 경 우에는 영어로 적을 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허법상 외국어 특허출원에 관한 특례에 따라 영어로 명세서 등을 작성할 수 있다."},{"id":80,"text":"선행발명에 개시된 물건이 특허발명과 동일한 구성 또는 속성을 가질 수도 있다는 가능성 또는 개연 성만으로는 두 발명을 동일하다고 할 수 없고, 필연적으로 그와 같은 구성 또는 속성을 가진다는 점이 증 명되어야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"단순한 가능성이나 개연성만으로는 신규성 판단상 동일성이 인정되지 않고, 선행발명에 그 구성이 필연적으로 나타난다는 점이 인정되어야 한다."},{"id":81,"text":"발명이 공지공용의 것이라 함은 공지공용의 기술과 동일한 경우에 한정할 필요는 없고, 어느 발명이 선행의 공지공용의 기술로부터 이루어진 것이라고 하여도 이것이 공지공용의 기술에 근사한 것이 명백 하여 특별히 새로운 기술이라고 볼 수 없는 경우에는 진보성에 앞서 그 신규성 자체를 부정할 수 있을 것 이다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"신규성 판단에서 선행기술과 실질적으로 동일한지 여부는 단순한 문구 일치만으로 판단하지 않는 다."},{"id":82,"text":"여러 선행기술문헌을 인용하여 특허발명의 진보성을 판단함에 있어서는 그 인용되는 기술을 조합 또 는 결합하면 당해 특허발명에 이를 수 있 다는 암시ㆍ동기 등이 선행기술문헌에 제시되어 있거나, 그렇지 않더라도 당해 특허발명의 출원 당시의 기술수준, 기술상식, 해당 기술분야 의 기본적 과제, 발전경향, 해 당 업계의 요구 등에 비추어 보아 그 기술분야에 통상의 지식을 가진 자가 용이하게 그와 같은 결합에 이 를 수 있 다고 인정할 수 있는 경우에는 당해 특허발명의 진보성은 부정된다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"복수의 선행기술을 결합할 동기나 기술상식 등을 종합하여 통상의 기술자가 쉽게 결합할 수 있으 면 진보성이 부정될 수 있다."},{"id":83,"text":"발명과 동일한 물건이 매매, 도급 등을 원인으로 양도된 경우에는 양수인에게 비밀유지의무가 부과되 었다는 등의 특별한 사정이 없는 한 외 관을 통해 발명의 기술적 구성을 용이하게 알 수 없더라도 그 발명 이 속하는 기술분야에서 통상의 지식을 가진 사람이 그 물건을 분해하거나 분석하여 발명의 기술적 구성 을 용이하게 알 수 있다면 발명이 공연히 실시된 것으로 볼 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"물건의 양도 후 통상의 기술자가 분해·분석하여 기술적 구성을 쉽게 알 수 있다면 공연히 실시된 것으로 볼 수 있다."},{"id":84,"text":"선행 또는 공지의 발명에 구성요소가 상위개념으로 기재되어 있고, 위 상위개념에 포함되는 하위개념 만을 구성요소 중의 전부 또는 일부로 하는 선택발명의 진보성이 부정되지 않기 위해서는, 선택발명에 포함되는 하위개념들 중 일부가 선행발명이 갖는 효과와 질적으로 다른 효과 를 갖고 있거나, 질적인 차 이가 없더라도 양적으로 현저한 차이가 있어야 한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"지문의 기준은 선택발명의 진보성 법리를 정확하게 표현한 것이 아니다. 선택발명의 진보성은 통 상의 기술자가 선행기술로부터 쉽게 도출할 수 있는지를 종합적으로 판단한다."},{"id":85,"text":"출원인이 원출원의 일부를 2 개의 특허출원(분할출원 1, 분할출원 2)으로 분할하는 과정에서 출원인 의 착오로 2 개의 출원이 동일한 출원이 되었으나, 출원인의 보정 등에 의하여 결국 원출원과 보정된 분 할출원 1, 그리고 분할출원 2 에 대하여 각각 특허사정(특허결정)이 이루어진 경우, 출원인은 분할출원 2 에 대한 특허사정(특허결정)의 취소를 구할 법률상 이익이 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"동일한 내용으로 특허결정을 받은 경우 그 특허결정의 취소를 구할 법률상 이익이 인정되지 않는 다."},{"id":86,"text":"둘 이상의 발명을 하나로 한 원출원에서 공지예외주장을 하지 않았더라도, 분할출원에서 적법한 절차 를 준수하여 공지예외주장을 하였다면, 원출원이 자기 공지일로부터 12개월 이내에 이루어진 이상 공지 예외의 효과를 인정받을 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"분할출원에서 법정 요건을 갖추어 공지예외주장을 할 수 있다."},{"id":87,"text":"분할출원은 국내우선권주장출원의 기초가 되는 선출원이 될 수 없다. 하지만 국내우선권주장출원을 기초로 분할출원할 수는 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"분할출원과 국내우선권주장출원의 관계를 구별해야 한다."},{"id":88,"text":"원출원 중 일부 발명이 실시례 등의 상세한 설명에 기재된 것으로서 원출원 발명과 다른 하나의 발명 으로 볼 수 있는 경우에는 그 일부를 분할 출원할 수 있으며, 이 경우 그 동일성 여부의 판단은 특허청구 범위에 기재된 양 발명의 기술적 구성이 동일한가 여부에 의하여 판단하되 그 효 과도 참작하여야 할 것 인바, 기술적 구성에 차이가 있더라도 그 차이가 주지 관용기술의 부가, 삭제, 변경 등으로 새로운 효과 의 발생이 없는 정도에 불과하다면 양 발명은 서로 동일하다고 하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"분할출원 가능 여부와 발명의 동일성 판단에서는 기술적 구성과 작용효과를 함께 고려한다."},{"id":89,"text":"분할출원이 외국어특허출원인 경우에 특허출원인은 국어번역문 또는 새로운 국어번역문을 특허법 제52조(분할출원)에서 정한 기간까지 제 출할 수 있으나, 특허출원인이 출원심사의 청구를 한 경우에는 새 로운 국어번역문을 제출할 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"외국어 특허출원의 번역문 제출에는 특칙이 있으며 심사청구 후에는 새로운 번역문 제출이 제한된 다."},{"id":90,"text":"청구범위를 적지 않은 특허출원 X 에 대하여 乙이 2025. 5. 20. 출원심사청구를 하여 甲이 2025. 6. 1. 그 취지의 통지를 받은 경우, 甲은 2025. 9. 1.까지 명세서에 청구범위를 적는 보정을 하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"제3 자가 심사청구를 한 경우 출원인에게 통지하고, 통지를 받은 날부터 법정기간 내 청구범위를 보정하여야 한다."},{"id":91,"text":"甲이 2023. 8. 1. 출원한 발명 A 에 대한 미국 특허출원 Z 를 기초로 특허법 제54 조(조약에 의한 우선 권 주장)에 의한 우선권을 주장하는 경 우라면, 甲은 발명 A 에 대하여 2026. 8. 1.까지 출원심사청구를 하여야 한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"심사청구기간은 국내 특허출원의 출원일을 기준으로 판단한다. 외국 선출원의 우선일만을 기준으 로 단순 계산하지 않는다."},{"id":92,"text":"甲이 정당한 사유로 출원심사청구 기간을 지키지 못하여 특허출원 X 가 취하된 것으로 인정되었는데, 그 사유가 2028. 7. 1. 소멸된 경우 甲 은 2028. 9. 1. 출원심사청구를 할 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"심사청구기간을 놓친 경우 그 출원이 취하간주된 뒤 일반적인 추후보완으로 다시 심사청구할 수 있는 것은 아니다. 甲이 2025. 8. 1. 출원 심사청구를 한 후, 심사관이 2026. 8. 1. 최초 거절이유통지(의견서 제출기한: 2026. 12. 1.)를 하였는데 甲이 2026. 10. 1. 출원을 취하한 경우, 甲은 이미 낸 심사청구료의 3 분의 1 에 해당하는 금액을 청구에 의하여 반환받을 수 있다."},{"id":93,"text":"발명이 명확하게 적혀있는지 여부는 통상의 기술자가 발명의 설명이나 도면 등의 기재와 출원 당시 기술상식을 고려하여 청구범위에 기재된 사항으로부터 특허를 받고자 하는 발명을 명확하게 파악할 수 있는지에 따라 개별적으로 판단하여야 하고, 단순히 청구범위에 사용된 용어만 을 기준으로 일률적으로 판단해서는 안 된다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"청구범위의 명확성은 청구범위 문구만 형식적으로 보는 것이 아니라 명세서·도면 및 출원 당시 기 술상식을 종합하여 통상의 기술자가 발명을 명확히 이해할 수 있는지를 기준으로 판단한다."},{"id":94,"text":"미생물에 관계되는 발명에 대하여 특허출원을 하려는 자는 특허법 제42 조(특허출원)제2 항에 따른 명 세서(특허출원서에 최초로 첨부한 명 세서를 말한다)를 적을 때, 특허법 시행령 제2 조(미생물의 기탁)제1 항 본문에 따라 미생물을 기탁한 경우에는 국내기탁기관, 국제기탁기관 또는 지정기탁기관에서 부여받 은 수탁번호를, 같은 항 단서에 따라 그 미생물을 기탁하지 않은 경우에는 그 미생물의 입수방법을 적어 야 한 다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"미생물 관련 발명은 재현 가능성을 확보하기 위해 기탁 여부에 따라 수탁번호 또는 입수방법을 명 세서에 기재하여야 한다."},{"id":95,"text":"발명의 설명에서의 기재 오류가 청구범위에 기재되어 있지 아니한 발명에 관한 것이거나 청구범위에 기재된 발명의 실시를 위하여 필요한 사 항 이외의 부분에 관한 것이어서 그 오류에도 불구하고 통상의 기술자가 청구항에 기재된 발명을 정확하게 이해하고 쉽게 재현할 수 있다면 특허법 제42 조(특허출원) 제3 항제1 호 위반이라고 할 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"모든 기재 오류가 곧바로 실시가능요건 위반이 되는 것은 아니다. 오류가 있더라도 통상의 기술자 가 발명을 쉽게 실시할 수 있다면 제42 조 제3 항 제1 호 위반이 아니다. 특허법 제42 조(특허출원)제4 항제1 호가 규정하는 명세서 기재요건을 충족하는지는, 발명의 설명이 통상의 기 술자가 그 발명을 쉽게 실시할 수 있도록 명확하고 상세하게 기재하고 있는지 여부에 의하여 판단하여서는 아니 된다."},{"id":96,"text":"의약의 용도발명에 있어서 의약의 용도가 구성요소에 해당하므로 청구범위에는 의약용도를 치료 대 상 질병 또는 약효로 명확하게 기재해야 하는 것인 바, 통상의 기술자의 기술상식에 비추어 약리기전만 으로 구체적인 의약으로서의 용도를 명확하게 파악할 수 있다고 하더라도 이것 만으로는 청구범위가 명 확히 기재된 것이 아니어서 특허법 제42 조(특허출원)제4 항제2 호의 요건을 충족한 것이라고 볼 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"의약의 용도는 명확하게 파악할 수 있어야 하지만, 반드시 특정한 표현방식만을 요구하는 것은 아 니다. 기술상식 등을 고려하여 약리기전만 으로도 용도가 명확하게 특정될 수 있는 경우에는 명확성 요건 을 충족할 수 있다."},{"id":97,"text":"甲은 특허출원 Y 에 대하여 2027. 6. 1.까지 심사청구할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"심사청구기간은 원칙적으로 특허출원일을 기준으로 3년이다. 우선권 주장의 유무와 관계없이 Y 의 출원일을 기준으로 계산한다."},{"id":98,"text":"甲이 특허출원 Y 에 대하여, 2023. 8. 1. 출원한 발명 C 에 대한 특허출원 W 를 기초로 특허법 제55 조 (특허출원 등을 기초로 한 우선권 주 장) 우선권 주장을 하기 위해서는 2024. 10. 1.까지 그 우선권 주장 을 추가하였어야 한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"우선권 주장 추가에는 법정기간이 있으므로 2024년 10 월 1일까지가 아니라 해당 우선권의 최초 출원일부터 1년 이내라는 점을 기준으로 판단하여야 한다. 甲이 특허법 제56 조(선출원의 취하 등)에 따라 취하 간주된 특허출원 X 에 관한 서류의 열람·복사를 2025. 2. 1. 신청하는 경 우, 특허청장은 비밀로 유지할 필요가 있다고 인정하면 그 서류의 열람·복사를 허가하지 아니할 수 있다."},{"id":99,"text":"乙이 스스로 A 를 발명한 후 2023. 4. 1. 발명 A 를 공지하였고, 2024. 4. 1. 특허법 제30 조(공지 등 이 되지 아니한 발명으로 보는 경우) 공 지예외적용 주장서를 수반하여 발명 A 에 대하여 특허출원 V 를 하 였다면, 甲의 특허출원 Y 중 발명 A 는 등록받을 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"乙 자신의 공지에 대해서는 乙에게 공지예외가 적용될 수 있지만, 그 공지 자체가 甲의 후출원에 대한 선행기술이 되는 문제는 별도로 판단한 다. 甲이 그 공지의 당사자가 아니므로 甲에게 공지예외 효 과가 발생하지 않는다."},{"id":100,"text":"乙이 스스로 A 를 발명한 후 2023. 4. 1. 발명 A 를 공지하였고, 2024. 4. 1. 특허법 제30 조(공지 등 이 되지 아니한 발명으로 보는 경우) 공 지예외적용 주장서를 수반하여 발명 A 에 대하여 특허출원 V 를 하 였다면, 乙의 특허출원 V 는 등록받을 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"乙의 공지예외 주장 자체는 적법하지만, 그보다 먼저 출원된 甲의 특허출원 X 및 그에 기초한 우선 권 관계를 고려하면 乙의 후출원이 선원관 계에서 자유로운 것은 아니다."},{"id":101,"text":"甲이 2023. 7. 1. 발명 B 를 특허출원하였다면, 이후 특허를 받을 수 있는 권리를 乙에게 양도하여 乙 로 출원인을 변경하였더라도 이 출원은 특허법 제29 조(특허요건)제3 항 위반에 해당하지 않는다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"제29 조 제3 항의 확대된 선원과 관련하여 후출원인이 변경되었다는 사후 사정만으로 최초 출원 당 시의 관계가 달라지는 것은 아니다. 丙이 2023. 6. 1. 발명 B 를 특허출원하였다면 이 출원은 특허법 제29 조(특허요건)제3 항 위반에 해 당한다."},{"id":102,"text":"丁이 2025. 1. 1. 발명 B 를 특허출원하였다면 이 출원은 특허법 제29 조(특허요건)제1 항 위반에 해 당한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"甲이 B 를 삭제하여 2024. 12. 1. 출원공개된 내용에는 B 가 포함되지 않으므로, 단순히 그 후출원 이 제29 조 제1 항의 공지기술 위반이라 고 볼 수 없다."},{"id":103,"text":"戊가 2023. 6. 1. 발명 A 를 특허출원하였다면 이 출원은 2024. 12. 1. 시점에서 특허법 제36 조(선 출원) 위반에 해당하지 않는다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"동일자 출원에 대한 선출원주의 적용은 단순히 동일한 날짜라는 이유만으로 후출원을 제36 조 위 반으로 볼 수 없으며 실제 선후관계 등을 고 려해야 한다."},{"id":104,"text":"누구든지 2026. 6. 1. 甲의 특허출원에 대하여 심사청구 및 우선심사신청을 할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"출원심사청구는 누구든지 할 수 있고, 이 사안에서는 벤처기업이라는 우선심사 대상 요건이 문제 된다. 우선심사 역시 법에서 정한 신청요건 을 갖추는 경우 제3 자에 의해 신청될 수 있다."},{"id":105,"text":"특허법 제30 조(공지 등이 되지 아니한 발명으로 보는 경우)제1 항제1 호의 규정을 적용받으려면 원칙 적으로 특허출원서에 그 취지를 적고 이를 증명할 수 있는 서류를 특허출원일부터 30일 이내에 특허청 장에게 제출하여야 하며, 그 특허출원이 설정등록된 이후에는 적용받을 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"자기공지에 대한 공지예외는 주장 및 증명절차가 법정기간 내에 이루어져야 한다. 공지 등이 있는 날부터 12개월 이내에 조약 당사국에 제1 국 출원을 한 경우, 해당 제1 국 출원을 기초 로 한 특허법 제54 조(조약에 의한 우선권 주장) 우선권주장 출원은 위 공지 등이 있는 날부터 12개월 이 내에 하여야 특허법 제30 조의 규정을 적용받을 수 있다."},{"id":106,"text":"특허법 제30 조는 발명이 출원 전에 공지되었다 하더라도 일정요건을 갖춘 경우 특허법 제29 조 제1 항 또는 제2 항 적용 시 그 발명을 선행 기술로 사용하지 않도록 하는 규정이므로, 그 공지일과 출원일 사이 에 동일한 발명에 대한 제3 자의 독립적 출원이 있는 경우에는 특허법 제30조의 규정을 적용받을 수 없 다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"공지예외는 자기공지의 선행기술 효과를 제한할 뿐 제3 자의 독립된 출원에 따른 선원효과까지 제 거하지 않는다."},{"id":107,"text":"특허출원인이 조기공개신청을 하여 자기의 발명이 특허법 제64 조(출원공개)에 따라 출원공개된 경우 라면, 동일한 발명을 출원공개일부터 12개월 이내에 출원하더라도 특허법 제30 조의 규정을 적용받을 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"출원공개에 따른 공지와 공지예외의 적용관계를 일률적으로 배제할 수는 없다. 법에서 정한 공지 예외 요건을 개별적으로 검토해야 한다."},{"id":108,"text":"특허청 직원은 발명자라 할지라도 상속 또는 유증의 경우를 제외하고는 재직 중 특허를 받을 수 없으 나, 특허권자로 권리를 행사하는 데 아무 런 문제가 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허청 직원의 재직 중 특허 취득 제한과 상속·유증에 의한 권리취득은 구별된다."},{"id":109,"text":"인공지능(AI)이 생성한 결과물에 대한 보호 여부와 관련하여 AI 가 자연인이 아니라는 점에 따라 발명 자가 될 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허법상 발명자는 자연인을 전제로 하므로 AI 자체를 발명자로 볼 수 없다."},{"id":110,"text":"법인이라 할지라도 특허를 받을 수 있는 권리를 승계할 수 있지만, 이 권리는 질권의 목적으로 할 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허를 받을 수 있는 권리는 이전할 수 있지만 질권의 목적이 될 수 없다."},{"id":111,"text":"발명이 정신적 창작활동의 결과로 얻어지는 것이라는 점에서 피성년후견인은 특허를 받을 수 있는 권 리를 가지지 못한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"피성년후견인이라는 이유만으로 발명자가 될 수 없거나 특허를 받을 수 있는 권리를 가질 수 없는 것은 아니다."},{"id":112,"text":"2 명 이상이 공동으로 발명한 경우에는 특허를 받을 수 있는 권리를 공유한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"공동발명자는 특허를 받을 수 있는 권리를 공유한다."},{"id":113,"text":"다수인이 발명의 내용을 알고 있거나 알 수 있는 상태에 있다 하더라도 그들이 모두 비밀유지의무를 지는 경우라면 그 발명은 공지되었다고 볼 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"비밀유지의무가 있는 사람에게 공개된 것만으로는 공중이 이용할 수 있는 상태가 되었다고 볼 수 없다."},{"id":114,"text":"제29 조(특허요건) 제1 항 제1 호에 규정한 ‘특허출원 전’의 의미는 발명의 공지 또는 공연 실시된 시점 이 특허출원 전이라는 의미이고, 그 공지 또는 공연 실시된 사실을 인정하기 위한 증거가 특허출원 전에 작성된 것을 의미한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"선행기술이 특허출원 전에 공개되었는지가 기준이지, 그 공개사실을 입증하는 증거가 반드시 출원 전에 작성되어야 하는 것은 아니다."},{"id":115,"text":"전기통신회선을 통하여 공개되었다 하더라도 암호를 부여하여 불특정 다수인의 접근이 불가능한 경 우에는 공중의 이용가능성이 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"불특정 다수가 접근할 수 없는 경우에는 공중이 이용할 수 있는 상태라고 보기 어렵다."},{"id":116,"text":"카탈로그는 제작되었으면 배부, 반포되는 것이 사회통념이라 하겠으며 제작한 카탈로그를 배부, 반포 하지 아니하고 사장하고 있다는 것은 경험칙상 수긍할 수 없는 것이어서 카탈로그의 배부범위, 비치장소 등에 관하여 구체적인 증거가 없다고 하더라도 그 카탈로그의 배부, 반포 되었음을 부인할 수는 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"카탈로그의 성격과 거래관행 등을 고려하여 반포 사실을 경험칙에 의해 인정할 수 있다."},{"id":117,"text":"공지기술이 상위개념으로 기재되어 있고 청구항에 기재된 발명이 하위개념으로 기재되어 있으면 동 일성이 없어 통상적으로 청구항에 기재 된 발명은 신규성이 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"상위개념의 선행기술이 존재한다는 것만으로 그 하위개념이 곧바로 동일하다고 할 수 없다."},{"id":118,"text":"그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람이란 특허법에 규정한 상상의 인물을 말한다 할지라도 실제 심사단계에서 심사관, 심 판단계에서 심판관 합의체의 입장에서 판단한다. 이에 법원은 문 제된 사안에서 법관의 판단을 배제하고 심사관ㆍ심판관 합의체가 어떻게 진 보성을 적용하였는지를 판단 한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"진보성 판단은 통상의 기술자를 기준으로 하되, 최종적인 법적 판단은 법원이 한다. 발명품의 판매가 상업적 성공을 거두었다 하더라도 일 응 진보성이 있는 것으로 볼 자료가 될 수 있지 만 그 자체로 진보성이 있다고 단정할 수 없다. 진보성에 대한 판단은 명세서에 기재된 내용을 토대로 판 단되어야 한다."},{"id":119,"text":"통상의 기술자가 특허출원 당시의 기술수준에 비추어 진보성 판단의 대상이 된 발명이 선행기술과 차 이가 있음에도 그러한 차이를 극복하고 선행기술로부터 그 발명을 용이하게 발명할 수 있는지를 살펴보 아야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"진보성은 통상의 기술자가 선행기술로부터 용이하게 발명할 수 있는지를 기준으로 판단한다."},{"id":120,"text":"신규성과 진보성은 별개의 거절이유로서 진보성 판단에 앞서 신규성 판단이 선행되어야 하고, 특허청 구범위가 여러 개의 항이 있는 경우에는 그 하나의 항이라도 거절이유가 있다면 그 출원은 전부가 거절 되어야 한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"청구항마다 독립적으로 특허요건을 판단하므로 하나의 청구항에 거절이유가 있다는 이유만으로 다른 청구항까지 전부 거절되는 것은 아니 다."},{"id":121,"text":"발명의 진보성 여부 판단에 있어서 그 출원 당시의 기술수준, 대비되는 발명의 유무 등에 따라 국가마 다 사정을 달리할 수 있으므로 외국에서 특허등록되었다 하더라도 국내에서 그 발명의 진보성이 부정될 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"각국의 특허요건 판단은 독립적이므로 외국의 특허등록만으로 국내 진보성이 인정되는 것은 아니 다."},{"id":122,"text":"특허권의 설정등록을 받으려는 자는 설정등록을 받으려는 날부터 3년분의 특허료를 내야 하고, 특허 권자는 그 다음 해부터의 특허료를 해당 권리의 설정등록일에 해당하는 날을 기준으로 매년 1년분씩 내 야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"설정등록 시에는 3년분의 특허료를 납부하고 이후 매년 특허료를 납부한다."},{"id":123,"text":"이해관계인은 특허료를 내야 할 자의 의사와 관계없이 특허료를 낼 수 있으며, 이 경우 이해관계인은 내야 할 자가 현재 이익을 얻는 한도에서 그 비용의 상환을 청구할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"이해관계인은 특허료를 대신 납부할 수 있고 일정 범위에서 비용상환을 청구할 수 있다."},{"id":124,"text":"특허권의 설정등록을 받으려는 자는 특허료 납부기간이 지난 후에도 1년 이내에 특허료를 추가로 낼 수 있으며, 이 경우 내야 할 특허료의 2 배의 범위에서 산업통상자원부령으로 정하는 금액을 납부하여야 한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"추가납부기간을 1년으로 한 부분이 틀리다."},{"id":125,"text":"특허권의 설정등록을 받으려는 자가 정당한 사유로 추가납부기간에 특허료를 내지 아니하였거나 보 전기간에 보전하지 아니한 경우에는 그 사유가 소멸한 날부터 2개월 이내에 그 특허료를 내거나 보전할 수 있다. 다만, 추가납부기간의 만료일 또는 보전기간의 만료일 중 늦은 날부 터 1년이 지난 때에는 그러 하지 아니하다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"정당한 사유로 추가납부 또는 보전을 하지 못한 경우에는 법정 추후납부 제도가 인정된다."},{"id":126,"text":"특허청장은 출원공개 전에 출원심사의 청구가 있으면 출원공개 시에, 출원공개 후에 출원심사의 청구 가 있으면 지체 없이 그 취지를 특허공 보에 게재하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"출원심사청구 사실은 출원공개의 시기와 심사청구 시점에 따라 특허공보에 게재된다."},{"id":127,"text":"특허출원인의 제65 조(출원공개의 효과) 제2 항에 따른 청구권은 그 특허출원된 발명에 대한 특허권이 설정등록된 후에만 행사할 수 있으며, 그 청구권의 행사는 특허권의 행사에 영향을 미치지 아니한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"출원공개 후 보상금청구권은 특허권 설정등록 후에 행사할 수 있다."},{"id":128,"text":"출원공개 후 특허출원이 포기ㆍ무효 또는 취하된 경우 제65 조(출원공개의 효과) 제2 항에 따른 청구 권은 처음부터 발생하지 아니한 것으로 본다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"출원이 포기·무효·취하되면 보상금청구권은 처음부터 발생하지 않은 것으로 본다."},{"id":129,"text":"국어로 출원한 국제특허출원에 관하여 출원공개 전에 이미 특허협력조약(PCT) 제21 조에 따라 국제 공개가 된 경우에는 우선일부터 1년 6개월이 되는 날에 출원공개가 된 것으로 본다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"이미 국제공개된 경우에는 그 국제공개에 따라 국내 출원공개와 관련된 효과를 판단한다."},{"id":130,"text":"국제특허출원의 출원인은 출원공개된 발명임을 알고도 그 국제특허출원된 발명을 업으로서 실시한 자에게 출원공개된 발명임을 안 때부터 특허권의 설정등록 시까지의 기간 동안 그 특허발명의 실시에 대 하여 합리적으로 받을 수 있는 금액에 상당하는 보상금의 지급을 청구할 수 있다. 다만, 그 청구권은 해 당 특허출원이 특허권의 설정등록된 후에만 행사할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"국제특허출원에도 출원공개에 따른 보상금청구권에 관한 특칙이 적용된다."},{"id":131,"text":"甲이 단독으로 완성한 발명 X 에 대한 특허를 받을 수 있는 권리를 乙에게 이전하는 것에 묵시적으로 동의하면, 乙은 발명 X 에 대한 특허를 받을 수 있는 권리의 승계인이 될 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허를 받을 수 있는 권리의 이전계약은 명시적인 경우뿐만 아니라 묵시적으로도 성립할 수 있다."},{"id":132,"text":"특허청 직원인 丙은 단독으로 완성한 발명 Y 를 재직 중에 일반인 乙에게 양도하더라도, 乙은 발명 Y 에 대한 특허를 받을 수 있는 권리의 승 계인이 될 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허청 직원도 특허를 받을 수 있는 권리를 가질 수 있고 이를 양도할 수 있다."},{"id":133,"text":"甲과 乙이 공동으로 발명을 완성한 경우, 甲과 乙 사이에 지분을 정하는 특약이 없으면 공유자의 지분 은 균등한 것으로 추정한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"공동으로 발명한 경우 특별한 약정이 없으면 공유지분은 균등한 것으로 본다."},{"id":134,"text":"특허청 직원인 丙으로부터 특허를 받을 수 있는 권리를 상속한 일반인 乙은 지체 없이 그 취지를 특허 청장에게 신고하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"상속 등 일반승계의 경우 권리승계의 효력은 발생하지만 승계인은 그 사실을 지체 없이 신고해야 한다."},{"id":135,"text":"미성년자 丁은 법정대리인 戊의 동의가 있어야만 제3 자로부터 특허를 받을 수 있는 권리를 무상으로 양도받을 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"미성년자의 행위능력에 관한 규정이 문제되므로 모든 경우에 법정대리인의 동의가 필요하다고 할 수 없다."},{"id":136,"text":"ㄱ. 특허법 제52 조(분할출원)에 따라 청구항 제9 항 및 제10 항을 분할 출원","chapter":"특허요건 및 특허출원","answer":"X","explanation":"원출원에 대한 특허여부결정이 확정된 후에는 분할출원을 할 수 없다."},{"id":137,"text":"ㄴ. 특허법 제52 조의2(분리출원)에 따라 청구항 제9 항 및 제10 항을 분리 출원","chapter":"특허요건 및 특허출원","answer":"O","explanation":"분리출원의 법정기간과 요건을 충족하는 경우 가능하다."},{"id":138,"text":"ㄷ. 특허법 제55 조(특허출원 등을 기초로 한 우선권 주장)에 따라 청구항 제9 항 및 제10 항을 청구범 위에 기재하여 국내 우선권 주장 출원","chapter":"특허요건 및 특허출원","answer":"O","explanation":"국내우선권주장출원은 선출원일로부터 1년 이내라는 요건 등을 충족하면 가능하다."},{"id":139,"text":"ㄹ. 특허법 제67 조의2(재심사의 청구)에 따라 청구항 제9 항 및 제10 항을 남기고 나머지 청구항을 삭 제하는 보정을 하면서 재심사 청구","chapter":"특허요건 및 특허출원","answer":"X","explanation":"이미 거절결정불복심판을 청구하여 심결을 받은 상황에서는 재심사를 다시 청구할 수 없다."},{"id":140,"text":"복수의 인용발명의 결합에 의하여 특허성을 판단하는 것은 진보성의 문제이며, 신규성의 문제가 아니 다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"신규성은 원칙적으로 하나의 선행발명과 대비하고, 복수 선행기술의 결합은 진보성 판단에서 문제 된다."},{"id":141,"text":"청구항에 기재된 발명에 대하여 동일한 인용발명으로, 또는 인용발명을 달리하여 신규성이 없다는 거 절 이유와 진보성이 없다는 거절 이유를 동시에 통지할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"신규성과 진보성에 관한 거절이유를 함께 통지하는 것이 가능하다."},{"id":142,"text":"발명의 진보성 유무를 판단할 때에는 진보성 판단의 대상이 된 발명의 명세서에 개시되어 있는 기술 을 알고 있음을 전제로 하여 사후적으로 통상의 기술자가 그 발명을 쉽게 발명할 수 있는지를 판단하여 서는 아니 된다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"사후적 고찰에 의하여 진보성을 부정해서는 안 된다."},{"id":143,"text":"독립항의 진보성이 인정되는 경우에는 그 독립항을 인용하는 종속항도 예외 없이 진보성이 인정된다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"종속항은 독립항의 구성을 모두 포함하므로 독립항의 진보성이 인정되는 경우 종속항 역시 진보성 이 인정된다."},{"id":144,"text":"선행기술이 미완성 발명이거나 표현이 불충분하거나 또는 일부 내용에 흠결이 있다면, 통상의 기술자 가 기술상식이나 경험칙에 의하여 쉽게 기술내용을 파악할 수 있다고 하더라도 진보성 판단의 대비 자료 로 인용할 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"미완성·불충분한 자료라도 통상의 기술자가 기술상식 등에 의하여 그 내용을 쉽게 파악할 수 있다 면 선행발명이 될 수 있다."},{"id":145,"text":"신규성 판단에 있어서 ‘공지(公知)된 발명’이란 특허출원 전에 국내 또는 국외에서 그 내용이 비밀상태 로 유지되지 않고 불특정인에게 알려 지거나 알려질 수 있는 상태에 있는 발명을 의미한다. 여기서 ‘불특 정인’이란 그 발명에 대한 비밀준수 의무가 없는 자를 말한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"공지란 불특정인이 인식하거나 인식할 수 있는 상태에 놓인 것을 의미한다."},{"id":146,"text":"신규성 판단에 있어서 ‘특허출원 전’이란 특허출원일의 개념이 아닌 특허출원의 시, 분, 초까지도 고려 한 자연시(自然時, 외국에서 공지된 경 우 한국시간으로 환산한 시간) 개념이다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"신규성 판단에서는 출원일뿐 아니라 출원 시점을 기준으로 선행기술의 선후를 판단한다."},{"id":147,"text":"불특정인에게 공장을 견학시킨 경우, 그 제조상황을 보았을 경우에 제조공정의 일부에 대하여는 장치 의 외부를 보아도 그 제조공정의 내용을 알 수 없는 것으로서, 그 내용을 알지 못하면 그 기술의 전체를 알 수 없는 경우에도 견학자가 그 장치의 내부를 볼 수 있거나 그 내부에 대하여 공장의 종업원에게 설명 을 들을 수 있는 상황(공장 측에서 설명을 거부하지 않음)으로서 그 내용을 알 수 있을 때에는 그 기술은 공연히 실시 된 것으로 본다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"통상의 기술자가 실시된 상태에서 기술내용을 쉽게 알 수 있다면 공연히 실시된 것으로 본다."},{"id":148,"text":"카탈로그가 제작되었으면 배부, 반포되는 것이 사회통념이므로 카탈로그의 배부범위, 비치장소 등에 관하여 구체적인 증거가 없다고 하더라 도 그 카탈로그가 배부, 반포되었음을 부인할 수는 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"판례는 카탈로그의 성질과 거래관행 등을 고려하여 반포 사실을 경험칙상 인정할 수 있다고 본다."},{"id":149,"text":"내부에 특징이 있는 발명에 대해 그 외형 사진만이 간행물에 게재되어 있는 경우에 그 발명은 게재된 것이라고 할 것이다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"외형 사진만으로 내부의 기술적 구성을 통상의 기술자가 파악할 수 없다면 발명이 간행물에 기재 된 것으로 볼 수 없다."},{"id":150,"text":"인체를 처치하는 방법이 치료 효과와 비치료 효과를 동시에 가지는 경우, 양자를 구별 및 분리할 수 없 는 방법은 치료방법으로 간주되어 산업 상 이용 가능한 것으로 인정하지 않는다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"비치료적 용도로 한정되고 비치료적 목적과 효과를 분리할 수 있는 경우에는 산업상 이용가능성이 인정될 수 있다."},{"id":151,"text":"인체에도 적용할 수 있으나 청구범위의 기재에서 동물에게만 한정하여 특허 청구항을 명시하는 의료 행위는 산업상 이용 가능성이 있는 것으 로 취급한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"청구범위에서 동물에만 한정한 경우 특허의 대상이 될 수 있다. 의료인에 의한 의료행위가 아니더라도 발명의 목적, 구성 및 효과 등에 비 추어 보면 인간의 질병을 치 료, 예방 또는 건강상태의 증진 내지 유지 등을 위한 처치방법의 발명인 경우에는 산업상 이용 가능성이 없는 것으로 취 급한다."},{"id":152,"text":"인간의 수술, 치료 또는 진단에 사용하기 위한 의료 기기 그 자체, 의약품 그 자체 등은 산업상 이용 가 능성이 없는 것으로 취급한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"의료기기 그 자체나 의약품 그 자체는 산업상 이용 가능한 발명에 해당한다."},{"id":153,"text":"의료기기의 작동방법 또는 의료기기를 이용한 측정방법 발명은 그 구성에 인체와 의료기기 간의 상호 작용이 인체에 직접적이면서 일시적이 아닌 영향을 주는 경우 또는 실질적인 의료행위를 포함하는 경우 를 제외하고는 산업상 이용 가능한 것으로 취급한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"실질적인 의료행위에 해당하지 않는 의료기기의 작동·측정방법은 산업상 이용가능성이 인정될 수 있다."},{"id":154,"text":"甲은 2021. 5. 15. 학회에서 발명 A 를 공개하고 2021. 9. 15. 출원하였으나 출원서에 자기공지 예외 문구를 누락하였다. 甲은 2021. 12. 15. 특허등록결정등본을 송달받았고, 설정등록 전인 2022. 3. 30. 소정의 수수료를 내고 자기공지 예외취지의 서류를 제출하였다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"공지예외주장에는 법정기간과 절차가 있으므로 지문과 같은 시점의 제출만으로 인정되지 않는다."},{"id":155,"text":"甲은 2022. 9. 1. 발명 A 를 공개한 후 2023. 1. 5. 원특허출원을 하였으나 공지예외를 주장하지 않 았고, 거절이유 통지에 따른 의견서 제출 기간 내에 분할출원을 실시하면서 공지예외를 주장하였다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"법정기간 내 분할출원에서 적법하게 공지예외주장을 할 수 있다."},{"id":156,"text":"甲은 국내우선권주장출원을 하면서 선출원보다 늦게 자기공지된 발명 A 에 대하여 공지의 예외를 주 장하였다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"국내우선권주장출원에서도 공지예외주장의 요건을 충족하면 적용될 수 있다."},{"id":157,"text":"甲은 2020. 2. 1. 발명 A 를 박람회에 출품하고 2020. 12. 1. 공지예외를 주장하면서 특허출원하였 다. 한편 乙은 박람회에서 발명 A 를 지득 하고 2020. 5. 2. 간행물에 전재(轉載)하였는바, 甲이 이 사실 과 함께 자신의 의사에 반한 공지임을 입증하였다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"의사에 반한 공지에 해당하는 경우에도 공지예외의 적용이 가능하다."},{"id":158,"text":"甲은 2020. 2. 1. 발명 A 를 학회에서 발표하였는데, 그 내용이 강연집에 실리게 되었다. 甲은 학회발 표에 대해서만 적법한 공지예외 주장 절 차를 밟았다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"발표의 후속 절차로 통상 이루어진 반복 공개라면 공지예외의 적용범위에 포함될 수 있다."},{"id":159,"text":"출원발명의 수치범위가 선행발명의 수치범위에 포함된다면, 특허발명에 진보성을 인정할 수 있는 다 른 구성요소가 없는 경우 출원발명의 수 치한정이 임계적 의의를 가지는 때에 한하여 진보성이 인정된다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"단순한 수치한정이라도 임계적 의의 등 특별한 기술적 의미가 있으면 진보성이 인정될 수 있다."},{"id":160,"text":"파라미터발명은 청구항의 기재 자체만으로는 기술적 구성을 명확하게 이해할 수 없는 경우가 있으므 로, 파라미터발명의 진보성은 발명의 설 명 또는 도면 및 출원시의 기술상식을 참작하여 발명을 명확하게 파악하여 판단한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"파라미터발명은 청구범위의 기술적 의미를 명확히 파악한 후 선행기술과 대비한다."},{"id":161,"text":"제조방법이 기재된 물건발명의 특허요건을 판단함에 있어서 그 기술적 구성을 제조방법 자체로 한정 하여 출원 전에 공지된 선행기술과 비교 하여 진보성 판단을 하여야 한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"제조방법 자체로 물건의 구성을 한정하여 판단하는 것이 아니라 청구범위 전체에 의해 특정되는 물건의 구조·성질 등을 기준으로 판단한다."},{"id":162,"text":"의약화합물 분야에 속하는 결정형 발명은 구성만으로 효과의 예측이 쉽지 않으므로 구성의 곤란성을 판단할 때 발명의 효과가 선행발명에 비 하여 현저하다면 구성의 곤란성을 추론할 수도 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"화학·의약 분야에서는 현저한 효과가 구성의 곤란성을 뒷받침하는 중요한 자료가 될 수 있다."},{"id":163,"text":"선택발명의 경우 공지된 화합물이 갖는 효과와 질적으로 다르거나 양적으로 현저한 효과의 차이가 있 다는 점이 발명의 설명에 명확히 기재되 어 있다면 이를 기초로 진보성 판단을 할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"선택발명의 효과가 질적으로 다르거나 양적으로 현저하면 진보성을 인정하는 자료가 될 수 있다."},{"id":164,"text":"발명의 신규성 판단에 제공되는 대비 발명은 반드시 그 기술적 구성 전체가 명확하게 표현된 것뿐만 아니라, 미완성 발명이라고 하더라도 그 기술분야에서 통상의 지식을 가진 자가 기술상식이나 경험칙에 의하여 쉽게 기술내용을 파악할 수 있는 범위 내에서는 신규성 판단을 위한 선 행자료로서의 지위를 가진 다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"미완성 발명이라도 통상의 기술자가 기술상식이나 경험칙에 따라 그 내용을 쉽게 파악할 수 있다 면 선행기술이 될 수 있다."},{"id":165,"text":"선택발명의 신규성을 부정하기 위해서는 선행발명이 선택발명을 구성하는 하위개념을 구체적으로 개 시하고 있어야 하고, 이에는 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자가 선행문헌의 기재 내용과 출원시의 기술 상식에 기초하여 선행문헌으로부터 직접적으로 선택 발명의 존재를 인식할 수 있 는 경우도 포함된다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"선택발명의 신규성을 부정하려면 선행발명에서 선택발명의 하위개념이 구체적으로 개시되어야 한 다."},{"id":166,"text":"구성요소의 범위를 수치로써 한정하여 표현한 발명이 그 출원 전에 공지된 발명과 수치한정의 유무 또는 범위에서만 차이가 있는 경우에는, 그 한정된 수치범위가 공지된 발명에 구체적으로 개시되어 있거 나, 그렇지 않더라도 그러한 수치한정이 그 발명이 속하는 기술분야에서 통상 의 지식을 가진 자가 적절 히 선택할 수 있는 주지ㆍ관용의 수단에 불과하고 이에 따른 새로운 효과도 발생하지 않는다면 그 신규 성이 부정된 다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"단순한 수치한정만으로 신규성이 인정되는 것은 아니며 선행기술의 구체적 개시 여부와 주지·관용 적 선택인지 등을 판단한다."},{"id":167,"text":"발명을 논문으로 발표하더라도 신규성 상실사유가 발생한 날로부터 12개월 이내에 출원하는 경우 신 규성 상실의 예외를 인정받을 수 있으 나, 제3 자가 해당 논문을 읽고 동일 발명에 대하여 먼저 출원을 하 는 경우에는 신규성 상실의 예외를 인정받은 특허출원은 선출원주의의 위 반으로 특허를 받을 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"공지예외가 인정되면 해당 공지는 선출원주의 판단에서도 일정한 범위에서 특허요건 판단의 장애 가 되지 않는다."},{"id":168,"text":"제조방법이 기재된 물건발명의 신규성을 판단하는 경우, 그 기술적 구성을 제조방법의 기재를 포함하 여 청구범위의 모든 기재에 의하여 특정 되는 구조나 성질 등을 가지는 물건으로 파악하여 선행기술과 비 교하여 신규성 결여 여부를 살펴야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"제조방법이 기재된 물건발명도 청구범위 전체의 기재에 의해 특정되는 물건을 기준으로 신규성을 판단한다. 분할출원은 출원서에 최초로 첨부된 명세서 또는 도면에 기재된 사항의 범위 내에서 할 수 있으며, 원 출원이 외국어출원인 경우에 국어번역문이 제출되지 않았다면 원문에 기재 된 범위 내에서 분할출원할 수 있다."},{"id":169,"text":"분할출원된 명세서에 기재된 발명의 내용이 분할 후 원출원서에 기재된 발명의 내용과 동일하다면, 적법한 분할출원이 아니라는 점을 근거로 거절결정이 된다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"분할출원의 적법성은 단순히 양 출원의 내용이 동일하다는 이유만으로 판단하는 것이 아니다."},{"id":170,"text":"분할출원에서 자기공지예외적용의 주장을 하는 경우, 그 증명서류는 분할출원일부터 30일이 되는 날 까지 제출하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"분할출원에서 공지예외주장을 하는 경우 법정기간 내 증명서류를 제출하여야 한다."},{"id":171,"text":"분할출원은 특허출원서에 최초로 첨부한 명세서에 청구범위가 적혀 있는 경우에만 가능하므로 최초 로 첨부한 명세서에 청구범위가 적혀 있 지 아니한 경우에는 분할출원을 할 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"최초 명세서에 청구범위가 없다는 이유만으로 분할출원 자체가 불가능한 것은 아니다."},{"id":172,"text":"분할출원은 특허결정등본을 송달받은 이후에도 가능하나, 특허권설정등록을 받으려는 날이 3개월보 다 짧은 경우에는 분할출원을 할 수 없 다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"특허결정 후의 분할출원에는 법정 기간과 요건이 적용되며 지문과 같은 ‘3개월’ 제한은 없다. 특허출원인의 의사에 반한 공지가 있어 이 를 주장하고자 하는 경우, 특허출원시에 그 취지와 증명서 류를 제출하여야 하나, 보완수수료를 납부하면 보정기간에 그 취지를 적은 서류 또는 이 를 증명할 수 있 는 서류를 제출할 수 있다."},{"id":173,"text":"무권리자의 특허출원에 해당한다는 이유로 특허거절결정이 확정된 경우, 정당한 권리자의 출원에 대 한 심사청구는 무권리자 출원일부터 3년이 경과한 이후라도 정당한 권리자의 출원일부터 30일 이내에 청구할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"정당한 권리자의 보호를 위해 심사청구기간에 관한 특칙이 인정된다."},{"id":174,"text":"분할출원을 기초로 특허법 제54 조(조약에 의한 우선권 주장)에 따른 우선권을 주장하고자 하는 경우, 분할출원을 한 날부터 3개월 이내에 우선권 주장 서류를 특허청장에게 제출할 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"분할출원을 기초로 조약우선권을 새롭게 주장하는 것은 허용되지 않는다."},{"id":175,"text":"특허출원에 대한 최후거절이유통지에 따른 보정이 각하된 경우에 이에 대하여 독립하여 불복할 수 없 고, 심판에서 다투는 경우에는 특허거절 결정에 대한 심판에서 다툴 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"보정각하결정 자체에 독립하여 불복하는 것이 아니라 거절결정불복심판에서 다툴 수 있다."},{"id":176,"text":"특허출원인은 특허출원서에 최초로 첨부한 명세서에 청구범위를 적지 아니한 경우에도 특허법 제42 조의2(특허출원일 등) 제3 항에 따른 기한이 지난 후에는 변경출원을 한 날부터 30일이 되는 날까지 명 세서에 청구범위를 적는 보정을 할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"청구범위 미기재 출원에 관한 보정기간에는 법정 특칙이 적용된다. 청구범위가 기재되지 아니한 명세서가 첨부된 특허출원에 대하여 특 허출원인이 출원심사청구서를 제 출한 경우에는 부적법한 서류로서 반려처분 대상이 된다."},{"id":177,"text":"출원이 법령에 정한 방식에 위반하였으나 반려 대상이 아닌 경우에는 보정명령을 받게 되고, 보정명 령을 받은 자가 지정된 기간 내에 보정을 하지 아니하는 경우에는 그 특허에 관한 절차는 무효가 될 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"반려사유가 아닌 방식 위반은 보정명령의 대상이 되고, 기간 내 보정하지 않으면 절차가 무효가 될 수 있다."},{"id":178,"text":"요약서는 특허출원서류의 일부로 필요적으로 제출되어야 할 서류이고, 요약서에만 기재되어 있고 발 명의 명세서에 기재를 빠뜨린 경우에는 보정을 할 수 있는 기간 내에 요약서 기재내용을 명세서에 추가 할 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"요약서에만 기재되어 있다는 이유로 그 내용을 명세서에 자유롭게 추가할 수 있는 것은 아니다."},{"id":179,"text":"특허출원인은 출원시에는 명세서에 청구범위를 적지 않을 수 있으나 이 경우에는 출원일(우선권 주장 을 수반하는 특허출원의 경우 최우선 일)부터 1년 2개월이 되는 날까지 명세서에 청구범위를 적는 보정 을 하여야 하고, 출원인은 청구범위를 기재하는 보정을 하여야 출원심사청 구가 가능하다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"청구범위 미기재 특허출원에 대해서는 법정기간 내 청구범위를 보정해야 하며 심사청구와의 관계 에서도 특칙이 적용된다."},{"id":180,"text":"특허법 제42 조 제4 항 제1 호가 정한 명세서 기재요건을 충족하는지는 특허출원 당시의 기술수준을 기 준으로 하여 그 발명이 속하는 기술 분야에서 통상의 지식을 가진 사람의 입장에서 청구범위에 기재된 발 명과 대응되는 사항이 발명의 설명에 기재되어 있는지에 의하여 판단하 여야 하므로, 특허출원 당시의 기 술수준에 비추어 발명의 설명에 개시된 내용을 청구범위에 기재된 발명의 범위까지 확장 또는 일반화할 수 있다면 청구범위는 발명의 설명에 의하여 뒷받침된다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"발명의 설명에 의해 뒷받침되는지는 출원 당시 통상의 기술자 관점에서 판단한다."},{"id":181,"text":"발명의 구성의 곤란성 여부 판단이 불분명한 경우에는 특허발명이 선행발명에 비하여 이질적이거나 양적으로 현저한 효과를 가지고 있더라 도 진보성은 부정된다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"현저한 효과는 구성의 곤란성을 뒷받침하는 중요한 자료가 될 수 있다."},{"id":182,"text":"특허발명의 진보성을 판단할 때에는 청구항에 기재된 복수의 구성을 분해한 후 각각 분해된 개별 구 성요소들이 공지된 것인지 여부만을 따져 서는 아니 되고, 특유의 과제해결원리에 기초하여 유기적으로 결합한 전체로서의 구성의 곤란성을 따져 보아야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"진보성은 구성요소를 단순히 분해하여 각각 공지인지 여부만으로 판단하지 않는다."},{"id":183,"text":"효과의 현저성은 특허발명의 명세서에 기재되어 통상의 기술자가 인식하거나 추론할 수 있는 효과를 중심으로 판단하여야 하고, 만일 그 효과 가 의심스러울 때에는 그 기재 내용의 범위를 넘지 않는 한도에 서 출원일 이후에 추가적인 실험 자료를 제출하는 등의 방법으로 그 효과를 구 체적으로 주장ㆍ입증하는 것이 허용된다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"출원 후 실험자료도 명세서에 기재된 효과의 범위를 넘어서는 새로운 효과를 추가하는 것이 아니 라면 보완자료로 제출할 수 있다."},{"id":184,"text":"의약용도발명에서는 통상의 기술자가 선행발명들로부터 특정 물질의 특정 질병에 대한 치료효과를 쉽게 예측할 수 있는 정도에 불과하다면 그 진보성이 부정되고, 이러한 경우 선행발명들에서 임상시험 등에 의한 치료효과가 확인될 것까지 요구된다고 볼 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"치료효과의 예측 가능성이 충분하다면 임상시험 결과까지 반드시 요구되는 것은 아니다. 실제로 완성된 발명이 존재한다고 하더라도 명 세서와 도면에 그 발명이 기재되지 아니한 경우 발명의 완성여부는 반드시 발명의 설명 중의 구체적 실시예에 한정되어 판단되는 것은 아니다."},{"id":185,"text":"의약의 용도발명에 있어서는 특정물질의 의약용도가 약리기전만으로 기재되어 있더라도 명세서의 다 른 기재나 기술상식에 비추어 의약으로 서의 구체적인 용도를 명확하게 파악할 수 있다면 특허법이 정한 청구항의 명확성 요건을 충족하는 것으로 볼 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"명세서와 기술상식을 종합하여 구체적 의약용도를 파악할 수 있으면 명확성 요건을 충족할 수 있 다."},{"id":186,"text":"의약이라는 물건의 발명에 있어서 투여주기와 단위투여량은 조성물인 의약물질을 구성하는 부분이 아니라 의약물질을 인간 등에게 투여하는 방법으로서 의료행위에 불과하거나 그 청구범위의 기재에 의 하여 얻어진 최종적인 물건 자체에 관한 것이 아니어서 발명의 구성요소로 볼 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"투여주기와 단위투여량은 의약 조성물 자체의 구성요소가 아니라 투여방법에 관한 사항으로 본다."},{"id":187,"text":"미생물을 이용한 발명의 출원에 있어서 국내에 현존하지 아니하고 국외에 현존할 뿐인 경우 명세서 제출 당시인 출원시를 기준으로 국내의 통 상의 기술자가 이를 용이하게 입수할 수 있다고 인정될 때에는 이를 기탁하지 아니할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"국외에 존재하더라도 국내 통상의 기술자가 용이하게 입수할 수 있다면 기탁 의무가 면제될 수 있 다."},{"id":188,"text":"식물발명의 경우 출원발명의 명세서에 그 기술분야의 평균적 기술자가 출원발명의 결과물을 재현할 수 있도록 그 과정이 기재되어 있어야 하 며, 그 결과물인 식물이나 식물소재를 기탁함으로써 명세서의 기재를 보충하거나 대체할 수는 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"식물 자체 또는 식물소재의 기탁으로 명세서 기재를 보충하거나 대체할 수 있는 경우가 인정된다."},{"id":189,"text":"인간의 질병을 경감하고 예방하거나 건강을 증진시키기 위한 방법은 산업상 이용가능성이 인정될 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"인간에 대한 치료·예방 등 의료행위는 원칙적으로 산업상 이용가능성이 부정된다."},{"id":190,"text":"인체의 일부를 필수구성요소로 하여 치료효과와 미용효과를 동시에 가지는 수술방법은 산업상 이용 가능성이 인정될 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"인체를 대상으로 하는 수술방법은 의료행위에 해당하므로 산업상 이용가능성이 부정된다. 기계적 방식으로 인체의 피부를 마사지하여 화 장품이 피부에 잘 스며들도록 하는 피부미용법은 산업 상 이용가능성이 인정될 수 없다."},{"id":191,"text":"인체에도 적용할 수 있으나 청구범위의 기재에서 동물에게만 한정하여 특허 청구항을 명시하는 의료 행위는 산업상 이용가능성이 인정될 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"청구범위가 동물에 한정된 의료행위라면 산업상 이용가능성이 인정된다."},{"id":192,"text":"특허법에 따라 선서한 통역인이 특허심판원에 대하여 거짓으로 통역을 한 경우 그 통역인에 대한 벌 금은 5 천만원이다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허법상 위증 관련 벌금은 5 천만원이다."},{"id":193,"text":"법인의 업무에 관하여 그 대표자가 특허권을 침해한 경우 그 대표자에 대한 벌금은 1 억원이다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"대표자의 특허권 침해에 대한 법정 최고 벌금액은 1 억원이다."},{"id":194,"text":"법인의 업무에 관하여 그 종업원이 특허된 것이 아닌 방법을 사용하기 위하여 광고에 그 방법이 특허 또는 특허출원된 것으로 혼동하기 쉬운 표시를 한 경우 법인에 대한 벌금은 6 천만원이다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"허위표시 관련 법인의 벌금은 6 천만원이다."},{"id":195,"text":"법인의 업무에 관하여 그 종업원이 전용실시권을 침해한 경우 법인에 대한 벌금은 3 억원이다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"전용실시권 침해에 대한 법인의 벌금은 3 억원이다."},{"id":196,"text":"개인이 부정한 행위로 특허권의 존속기간 연장등록에 대한 결정을 받은 경우 개인에 대한 벌금은 3 천 만원이다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"부정한 방법으로 존속기간 연장등록 결정을 받은 경우의 벌금은 3 천만원이다."},{"id":197,"text":"국립대학법인은 특허출원인 및 특허에 관한 심판과 소송의 당사자가 될 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"법인격을 가진 국립대학법인은 권리능력과 당사자능력을 가진다."},{"id":198,"text":"우리나라와 조약이나 협정이 체결되어 있지 않은 국가가 자국의 법률에 의하여 해당 국가 내에 주소 나 영업소가 없는 우리나라 국민에게 특 허권 또는 특허에 관한 권리를 인정하는 경우, 그 국가의 국민은 우리나라에서 특허의 출원인이나 심판과 소송의 당사자가 될 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허법상 상호주의에 따라 상대국이 우리 국민에게 권리를 인정하면 그 국가 국민에게도 인정된다."},{"id":199,"text":"특허출원하고자 하는 발명이 2 인 이상 공동으로 이루어진 경우 특허출원시에 발명자 전원이 공동출 원하지 아니하였다면, 그 출원 후에 공동 발명자 중 1 인이 나머지 공동발명자로부터 특허를 받을 수 있는 권리의 지분 모두를 이전받아 단독권리자가 되는 경우, 특허법 제44 조(공동 출원) 규정 위반의 하자는 치 유되지 아니한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"공동발명자 전원의 지분이 한 사람에게 이전되어 단독권리자가 되면 공동출원 위반의 하자가 치유 될 수 있다."},{"id":200,"text":"특허를 받을 수 있는 권리를 이전하기로 하는 계약은 명시적으로는 물론 묵시적으로도 이루어질 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허를 받을 수 있는 권리의 양도계약은 명시적·묵시적 의사표시 모두 가능하다."},{"id":201,"text":"무권리자의 출원과 정당한 권리자의 출원 사이에 동일한 발명에 대한 제3 자의 출원이 있는 경우, 정당 한 권리자의 출원일은 제3 자의 출원 일보다 앞서므로 정당한 권리자의 출원은 제3 자의 출원으로 인하여 거절되지 않으며, 오히려 제3 자의 출원이 정당한 권리자의 출원에 의하 여 거절된다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"정당한 권리자의 출원은 무권리자 출원의 출원일로 소급하는 효과가 인정된다."},{"id":202,"text":"甲은 특허법 제30 조의 규정을 적용받기 위하여 2019. 9. 1.부터 1년 이내에 특허출원하였으므로 특 허를 받을 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"2019. 9. 1. 공개로부터 1년 이내에 출원하였다."},{"id":203,"text":"甲은 특허법 제30 조를 적용받고자 하는 취지를 특허출원서에 기재하고, 이를 증명할 수 있는 서류를 2020. 5. 1. 판매한 신제품(A+B)에 대 해서만 제출하면 특허를 받을 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"원칙적으로 각 공개행위에 관한 증명서류가 필요하나, 밀접·불가분한 공개행위에 대해서는 예외가 인정될 수 있다."},{"id":204,"text":"乙이 자체 개발한 신제품(A+B)을 2020. 7. 1. 판매한 경우, 甲은 특허법 제30 조의 규정을 적용받는 다고 하더라도 제1 항 및 제2 항에 대해 특허를 받을 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"공지예외는 제3 자의 독립적인 공개까지 소급하여 없애는 제도가 아니므로 신규성 판단에 영향을 준다."},{"id":205,"text":"丙이 甲의 판매제품을 인지하지 못한 상태에서 개발한 발명 B 를 2020. 7. 1. 특허출원한 경우, 甲은 제1 항에 대해서 특허를 받을 수 있지만, 제2 항에 대해서는 특허를 받을 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"공지예외의 소급효가 없으므로 선출원 관계에 따라 제2 항은 특허를 받을 수 없다."},{"id":206,"text":"丁이 甲의 판매제품을 인지하지 못한 상태에서 자신이 개발한 발명을 2020. 7. 1. 특허출원(제1 항: A, 제2 항: B)한 경우, 丁은 제1 항 및 제2항 모두 특허를 받을 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"甲의 공개가 선행하므로 丁의 출원은 신규성 문제가 발생한다."},{"id":207,"text":"발명(AB)에 이를 수 있는 동기가 선행의 인용발명에 기재된 A 와 주지기술 B 의 결합에 의하여 쉽게 발명할 수 있다는 유력한 근거가 되는 경 우에는 진보성이 없을 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"선행기술의 결합동기는 진보성 부정의 중요한 판단요소이다."},{"id":208,"text":"발명(AB)이 선행의 인용발명에 기재된 A 와 주지기술 B 의 결합으로부터 당업자의 통상의 창작능력의 발휘에 해당하는 경우에는 진보성이 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"통상의 창작능력의 발휘에 불과하면 진보성이 부정된다."},{"id":209,"text":"발명(AB)의 결합에 의하여 얻어지는 효과가 선행의 인용발명에 기재된 A 및 주지기술 B 가 가지고 있 는 효과보다 더 나은 효과가 없는 경우 에는 진보성이 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"구성 결합에 따른 현저한 효과가 없는 경우 진보성 부정에 유리한 사정이 된다."},{"id":210,"text":"발명(AB)이 선행의 인용발명에 기재된 A 와 본 특허출원 명세서의 실시예에 기재된 구성요소 B 를 전 제로 결합하여 통상의 기술자가 쉽게 발 명할 수 있는 경우에는 진보성이 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"진보성 판단에서 특허출원 명세서의 실시예를 선행기술처럼 전제로 삼을 수 없다."},{"id":211,"text":"발명(AB)의 구성요소 A 와 B 를 각각 분해하여 선행의 인용발명에 기재된 A 와 주지기술 B 를 비교하지 않고, 구성요소 A 와 B 를 유기적 결합 에 의한 발명 전체로 대비한 결과, 발명(AB)을 쉽게 발명할 수 있는 경우에는 진보성이 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"발명은 전체적으로 판단하되, 전체로 보아 쉽게 도출되면 진보성이 부정된다."},{"id":212,"text":"甲이 영어로 특허출원을 한 취지는 영어논문의 번역 및 국어명세서 작성에 시간이 많이 소요되는 것 을 감안하여 선출원주의의 지위를 빨리 확보하기 위함이다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"외국어특허출원은 신속하게 선출원 지위를 확보할 수 있도록 도입되었다."},{"id":213,"text":"甲이 영어로 특허출원을 할 수 있어도 영문저널에 게재되었기 때문에 특허법 제30 조(공지 등이 되지 아니한 발명으로 보는 경우)의 규정을 적용받기 위해서는 특허출원서에 그 취지를 기재하여야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"공지예외 적용을 받으려면 법에서 정한 의사표시가 필요하다."},{"id":214,"text":"甲은 영문저널에 게재된 날부터 1년 2개월이 되는 날까지 그 명세서 및 도면의 국어 번역문을 제출해 야 하고 그 국어번역문은 보정된 것으로 본다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"국어번역문 제출기간에 관한 규정의 기산점과 효력을 잘못 서술한 지문이다."},{"id":215,"text":"甲이 특허출원서에 최초로 첨부된 명세서의 국어번역문을 제출하지 않은 경우, 그 외국어특허출원은 국어번역문의 제출 기한이 되는 날의 다 음 날에 취하한 것으로 본다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"정해진 기간까지 국어번역문을 제출하지 않으면 그 외국어특허출원은 취하 간주된다."},{"id":216,"text":"甲이 성분 A 와 B 의 배합에 대하여 논문과 다르게 2: 1 로 잘못된 국어번역문을 제출한 경우, 그 잘못 된 국어번역문을 정정할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"외국어특허출원의 국어번역문에 잘못이 있는 경우 법이 정한 범위에서 정정이 가능하다."},{"id":217,"text":"누구나 마음대로 출입할 수 있으며 그 출입자가 비밀유지의무를 부담하지 않는 장소에 특정 발명이 설치되었다면 그 발명은 공지된 것으로 보 아야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"불특정다수가 인식할 수 있는 상태에 놓이면 공지에 해당한다."},{"id":218,"text":"카탈로그가 제작되었으면 배부, 반포되는 것이 사회통념이므로 카탈로그의 배부범위, 비치장소 등에 관하여 구체적인 증거가 없다고 하더라 도 그 카탈로그가 배부, 반포되었음을 부인할 수는 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"카탈로그의 제작만으로 당연히 반포되었다고 단정할 수 없으므로 이 지문은 판례상 그대로 보면 틀릴 여지가 있다."},{"id":219,"text":"박사학위 논문은 제출할 때 공지된 것이 아니라 논문심사에 통과된 이후 인쇄되어 공공도서관 등에 입고되거나 불특정다수인에게 배포됨으 로써 그 내용이 공지된 것으로 본다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"단순 제출 시점이 아니라 공공도서관 입고나 배포 등 불특정다수가 인식할 수 있는 상태가 되어야 한다."},{"id":220,"text":"법원은 특허출원 후에 작성된 문건들에 기초하여 특정 발명이 특허출원 전에 공지 또는 공연실시된 것인지 여부를 결정할 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"증거의 작성시기와 공지·공연실시 시점은 반드시 일치할 필요가 없다."},{"id":221,"text":"신규성 판단에 있어서의 ‘특허출원 전’이란 개념은 외국에서 공지된 경우에 한국시간으로 환산하는 시, 분, 초까지도 고려한 자연시 개념이 아 니라 특허출원일의 개념이다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"‘특허출원 전’은 자연시의 선후를 고려하는 개념으로 본다."},{"id":222,"text":"출원발명이 자연법칙을 이용한 것인지 여부는 청구항 전체로서 판단하여야 하므로, 청구항에 기재된 발명의 일부에 자연법칙을 이용하고 있 는 부분이 있더라도 청구항 전체로서 자연법칙을 이용하고 있지 않다고 판단될 때에는 특허법상의 발명에 해당하지 않는다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"발명의 성립성은 청구항 전체를 기준으로 판단한다."},{"id":223,"text":"발명의 각 단계가 컴퓨터의 온라인상에서 처리되는 것이 아니라 오프라인상에서 처리되고, 소프트웨 어와 하드웨어가 연계되는 시스템이 구 체적으로 실현되고 있지 않더라도 발명의 성립성이 인정될 수 있 다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"소프트웨어 관련 발명은 소프트웨어와 하드웨어가 구체적인 협동관계를 이루어야 한다."},{"id":224,"text":"무성생식 식물은 특허등록이 될 수 있으나 유성생식 식물은 신규성ㆍ진보성 등의 특허요건을 충족하 더라도 특허등록이 될 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"식물 자체라고 해서 유성생식 여부만으로 특허등록이 배제되는 것은 아니다."},{"id":225,"text":"미생물 관련 발명의 특허출원 시에 제출된 명세서에 당해 미생물의 수탁번호ㆍ기탁기관의 명칭 및 기 탁연월일을 기재하고 기탁사실 증명 서 류를 제출하였다면, 분할출원서에는 이미 제출된 증명서류의 내 용과 동일하여 이를 원용하고자 하는 경우에도 그 취지를 명기할 필요가 없 다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"분할출원에서 기존 서류를 원용하려면 원용 취지를 표시해야 한다. 인간의 치료방법에 관한 발명은 특허법상 불특허 규정이 없으므로 신 규성ㆍ진보성 등의 특허요건이 충족된다면 특허를 받을 수 있다."},{"id":226,"text":"특정 물질의 의약용도가 약리기전만으로 기재되어 있다면 발명의 상세한 설명 등 명세서의 다른 기재 나 기술상식에 의하여 의약으로서의 구 체적인 용도를 명확하게 파악할 수 있더라도 특허법 제42 조 제4 항 제2 호가 정한 청구항의 명확성 요건을 충족하는 것으로 볼 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"다른 기재와 기술상식에 의해 구체적인 용도를 명확하게 파악할 수 있으면 명확성 요건을 충족할 수 있다."},{"id":227,"text":"약사법에 따라 품목허가를 받은 의약품과 특허침해 의약품이 약학적으로 허용 가능한 염 등에서 차이 가 있다면 통상의 기술자가 이를 쉽게 선택할 수 있는 정도에 불과하고 그 치료효과나 용도가 실질적으 로 동일하더라도 존속기간이 연장된 특허권의 효력은 침해제품에 미치지 아 니한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"단순한 염의 차이만으로 연장된 특허권의 효력이 당연히 배제되는 것은 아니다."},{"id":228,"text":"의약이라는 물건의 발명에서 대상 질병 또는 약효와 함께 투여용법과 투여용량을 부가하더라도 이러 한 투여용법과 투여용량은 의료행위 그 자체에 해당하므로 이러한 투여용법과 투여용량의 부가에 의하 여 별개의 의약용도발명이 된다고 볼 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"의약발명에서 투여용법·투여용량의 한정도 새로운 의약용도발명의 구성으로 인정될 수 있다."},{"id":229,"text":"의약용도발명에서는 ‘통상의 기술자’가 선행발명들로부터 특정 물질의 특정 질병에 대한 치료효과를 쉽게 예측할 수 있더라도 선행발명들에 서 임상시험 등에 의한 치료효과가 확인되어야 그 진보성이 비로 소 부정될 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"반드시 임상시험 결과가 있어야만 진보성이 부정되는 것은 아니다."},{"id":230,"text":"의약용도발명의 특허청구범위에 기재되는 약리기전은 특정 물질이 가지고 있는 의약 용도를 특정하 는 한도 내에서만 발명의 구성요소로서 의미를 가질 뿐 약리기전 그 자체가 특허청구범위를 한정하는 구 성요소라고 볼 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"약리기전 자체보다는 그 기재가 특정 의약용도를 한정하는지 여부가 중요하다."},{"id":231,"text":"성질 또는 특성 등에 의해 물(物)을 특정하려고 하는 기재를 포함하는 특허발명과 이와 다른 성질 또 는 특성 등에 의해 물을 특정하고 있는 인 용발명을 대비할 때, 특허발명의 청구범위에 기재된 성질 또는 특성이 다른 정의 또는 시험ㆍ측정방법에 의한 것으로 환산한 결과 인용발명의 대응되는 것과 유사한 경 우에는 달리 특별한 사정이 없는 한 양 발명은 발명에 대한 기술적인 표현만 달리할 뿐 실질적으로는 유 사한 것으로 보아 진보성을 인정하기 어렵다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"표현 방식이나 측정방법이 달라도 실질적으로 동일한 기술적 의미라면 진보성을 인정하기 어렵다."},{"id":232,"text":"출원 전에 공지된 발명이 가지는 구성요소의 범위를 수치로 한정한 특허발명은 그 과제 및 효과가 공 지된 발명의 연장선상에 있고 수치한정 의 유무에서만 차이가 있을 뿐 그 수치범위 내외에서 현저한 효과 의 차이가 생기지 않는다면, 진보성이 부정된다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"단순한 수치한정이고 현저한 효과가 없다면 진보성이 부정될 수 있다."},{"id":233,"text":"제법한정 물건발명의 기술적 구성을 파악함에 있어 청구항에 제조방법과는 다른 기재가 있는 경우에 도 제조방법 자체만으로 한정하여 출원 전에 공지된 선행기술과 비교하여 진보성이 있는지 여부를 살펴 야 한다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"제법한정 물건발명은 제조방법만으로 보아서는 안 되고 물건 자체의 구성으로 판단한다."},{"id":234,"text":"청구항에 기재된 발명이용도의 변경 또는 용도의 추가적 한정에 의해서만 선행기술과 구별되는 경우, 출원시 기술상식을 참작할 때 그 용도의 변경 또는 추가적 한정에 의해 더 나은 효과가 없으면 진보성은 인정되지 않는다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"용도 한정에 따른 현저한 효과가 없다면 진보성이 부정될 수 있다."},{"id":235,"text":"여러 선행문헌을 인용하여 특허발명의 진보성을 판단할 때에, 그 인용되는 기술을 조합 또는 결합하 면 해당 특허발명에 이를 수 있다는 암시, 동기 등이 선행문헌에 제시되어 있는 경우 진보성은 부정될 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"선행기술의 결합에 대한 동기나 암시는 진보성 판단에서 중요한 요소이다."},{"id":236,"text":"선행기술에서 구성요소가 무엇인지 여부는 주요사실에 해당하므로 당사자의 자백 대상이 될 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"주요사실에 대해서는 자백의 효력이 인정될 수 있다."},{"id":237,"text":"표현이 불충분하거나 일부 흠결이 있는 선행기술은 언제나 진보성 판단의 자료가 될 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"통상의 기술자가 기술상식 등에 의해 내용을 파악할 수 있다면 선행기술로 이용될 수 있다."},{"id":238,"text":"간행물에 발명이 기재되었다고 하려면 통상의 기술자가 그 기재로부터 쉽게 실시할 수 있을 정도로 구성 등이 파악되어야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"단순한 존재가 아니라 기술내용이 파악될 수 있어야 한다."},{"id":239,"text":"내부적인 특징을 가진 발명이라도 외형 사진만으로 그 구성이 파악되지 않는 경우에는 간행물에 발명 이 기재되었다고 할 수 없다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"외형만으로 내부 구성이 파악되지 않으면 해당 발명이 기재되었다고 보기 어렵다. 선행기술 판단의 기준은 출원일이 아니라 출원시이며, 국내우선권에서는 항상 선출원의 출원일만 기 준으로 한다."},{"id":240,"text":"특허발명의 청구범위가 발명의 설명에 의하여 뒷받침되어야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허법상 명세서의 기재요건이다."},{"id":241,"text":"발명의 설명은 통상의 기술자가 발명을 쉽게 실시할 수 있도록 명확하고 상세하게 기재되어야 한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"실시가능성 요건에 관한 규정이다."},{"id":242,"text":"명세서의 배경기술 기재의무를 위반하면 그 자체로 반드시 특허등록 무효사유가 된다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"배경기술 기재의무 위반이 곧바로 별도의 무효사유가 되는 것은 아니다."},{"id":243,"text":"명세서에 기재된 용어는 특별한 정의가 없다면 통상의 기술자에게 일반적으로 받아들여지는 의미로 명세서 전체에 걸쳐 통일되게 해석한다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"명세서의 용어는 전체적인 문맥을 고려하여 해석한다."},{"id":244,"text":"甲이 공개학회에서 발명을 발표한 경우, 출원서에 공지예외 적용 취지를 적고 증명서류를 제출하면 일정 요건 아래 공지된 것으로 보지 않을 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"특허법 제30 조의 공지예외 규정이다."},{"id":245,"text":"공지예외의 증명서류는 반드시 최초 출원과 동시에만 제출할 수 있고 이후에는 보완할 수 없다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"법이 정한 기간과 절차에 따라 사후 보완이 가능하다."},{"id":246,"text":"공지예외 적용을 받기 위해 최초 출원 때 취지를 기재하지 않았더라도 이후 전혀 적용받을 방법이 없 다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"일정한 보완 절차를 통하여 적용될 수 있는 경우가 있다."},{"id":247,"text":"수치한정발명에서 선행기술과 수치범위만 다르고 그 범위에서 현저한 효과가 없다면 진보성이 부정 될 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"단순한 수치한정이고 특별한 효과가 없다면 진보성이 부정될 수 있다. 여러 선행문헌의 결합에 대한 동기나 암시가 있다면 결합에 의해 쉽 게 발명할 수 있다는 이유로 진보 성이 부정될 수 있다."},{"id":248,"text":"무권리자가 먼저 특허출원한 경우 정당한 권리자는 일정한 요건 아래 그 출원의 출원일을 소급하여 특허를 받을 수 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"무권리자의 특허출원과 정당한 권리자의 보호에 관한 규정이다."},{"id":249,"text":"공동발명자 중 한 사람이 다른 공동발명자의 동의 없이 특허를 받을 수 있는 권리의 지분을 자유롭게 양도할 수 있다.","chapter":"특허요건 및 특허출원","answer":"X","explanation":"공유인 특허를 받을 수 있는 권리의 지분 양도에는 다른 공유자의 동의가 필요하다."},{"id":250,"text":"특허결정 후에도 원출원에서 권리화하지 못한 발명을 별도로 권리화할 수 있는 기회가 있다.","chapter":"특허요건 및 특허출원","answer":"O","explanation":"분할출원 등의 방법으로 별도 권리화를 할 수 있다.. Ⅲ특허권 및 실시권. Ⅲ특허권 및 실시권 문항 수: 108 개 Ⅲ. 특허권 및 실시권 문항 수: 108개"},{"id":251,"text":"특허법 제87 조(특허권의 설정등록 및 등록공고)에 따라 특허청장은 출원인의 요청이 있으면 발명자 의 성명 및 주소를 생략하여 등록공고를 할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"출원인의 요청만으로 발명자의 성명과 주소를 생략할 수 있다는 규정은 없다."},{"id":252,"text":"특허법 제103 조(선사용에 의한 통상실시권)에 따른 통상실시권을 가진 자는 특허권자에게 상당한 대 가를 지급하여야 한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"선사용에 의한 통상실시권은 법정통상실시권이므로 상당한 대가 지급을 요건으로 하지 않는다."},{"id":253,"text":"특허법 제103 조의2(특허권의 이전청구에 따른 이전등록 전의 실시에 의한 통상실시권)제1 항에 따른 통상실시권을 가진 자는 이전등록된 특허권자에게 상당한 대가를 지급하여야 한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"해당 법정통상실시권에는 특허권자에게 상당한 대가를 지급하는 규정이 있다. 특허법 제104 조(무효심판청구 등록 전의 실시에 의한 통 상실시권)제1 항에 따른 통상실시권을 가진 자는 특허권자 또는 전용실시권자에게 상당한 대가를 지급하여야 한다."},{"id":254,"text":"특허법 제183 조(재심에 의하여 통상실시권을 상실한 원권리자의 통상실시권)제1 항에 따른 통상실시 권을 가진 자는 특허권자 또는 전용실 시권자에게 상당한 대가를 지급하여야 한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"재심에 의하여 권리관계가 변동되는 경우 인정되는 법정통상실시권에는 상당한 대가에 관한 규정 이 있다."},{"id":255,"text":"특허법 제182 조(재심에 의하여 회복한 특허권에 대한 선사용자의 통상실시권)에 따라 성립한 통상실 시권은 등록하지 않으면 그 후에 특허 권 또는 전용실시권을 취득한 자에 대해서 그 효력이 발생하지 않 는다.","chapter":"특허권 및 실시권","answer":"X","explanation":"해당 통상실시권은 법률상 인정되는 권리로서 지문의 등록요건을 적용하여 대항력을 판단하지 않 는다."},{"id":256,"text":"특허권자가 업으로 실시할 수 있는 전(全)범위를 전용실시권자에게 허락하는 것도 가능하다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허발명의 전부에 대한 전용실시권 설정도 가능하다."},{"id":257,"text":"방법발명에 관한 특허권자로부터 허락을 받은 실시권자가 제3 자에게 전용품의 제작을 의뢰하여 그로 부터 전용품을 공급받아 방법발명을 실시하는 경우에 있어서 그러한 제3 자의 전용품 생산ㆍ양도 등의 행위는 특허권의 간접침해에 해당한다고 볼 수 없다.","chapter":"특허권 및 실시권","answer":"O","explanation":"정당한 실시권자의 실시를 위한 전용품 제작·공급이라는 사정 때문에 제3 자의 행위가 곧바로 간접 침해가 되는 것은 아니다."},{"id":258,"text":"설정계약으로 전용실시권의 범위에 관하여 특별한 제한을 두고도 이를 등록하지 않은 경우, 전용실시 권자가 등록되어 있지 않은 제한을 넘어 특허발명을 업으로서 실시하더라도 특허권자에 대하여 특허권 침해가 성립하는 것은 아니다.","chapter":"특허권 및 실시권","answer":"O","explanation":"전용실시권의 제한에 관한 미등록 사항은 특허권자와 전용실시권자 사이의 관계에서 제3 자와 달 리 처리되는 문제가 있다. 판례상 미등록 제 한을 특허권자가 근거로 침해를 주장할 수 없는 경우가 있다."},{"id":259,"text":"특허법 제89 조(허가등에 따른 특허권의 존속기간의 연장)에 따른 특허권 존속기간의 연장등록을 받 는 데에 필요한 허가등을 신청할 수 있는 자의 범위에 전용실시권자는 포함되지 않는다.","chapter":"특허권 및 실시권","answer":"X","explanation":"필요한 허가 등을 신청할 수 있는 자에는 법에서 정한 전용실시권자 등이 포함될 수 있으므로 전용 실시권자를 일률적으로 제외할 수 없다."},{"id":260,"text":"전용실시권을 실시사업(實施事業)과 함께 이전하는 경우 전용실시권자는 특허권자의 동의를 받지 않 아도 전용실시권을 이전할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"전용실시권은 원칙적으로 특허권자의 동의가 필요하지만 실시사업과 함께 이전하는 경우에는 특 칙이 적용된다."},{"id":261,"text":"특허가 방법 발명인 경우에 그 방법의 실시에만 사용하는 물건을 생산ㆍ양도ㆍ대여ㆍ수출 또는 수입 하거나 그 물건의 양도 또는 대여의 청약 을 하는 행위를 업으로서 하는 경우에는 특허권 또는 전용실시 권을 침해한 것으로 본다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허법 제127 조의 간접침해에 해당하는 내용이다. 법원은 특허권 또는 전용실시권 침해소송에서 당사자의 신청에 의하여 상대방 당사 자에게 해당 침해 의 증명 또는 침해로 인한 손해액의 산정에 필요한 자료의 제출을 명할 수 있다. 당사자가 정당한 이유 없이 자료제출명령에 따르 지 아니한 때에는 법원은 자료의 기재에 대한 상대방의 주장을 진실한 것으로 인정할 수 있다."},{"id":262,"text":"특허발명 실시계약 체결 이후에 특허가 무효로 확정되었더라도 특허발명 실시계약이 원시적으로 이 행불능 상태에 있었다거나 그 밖에 특허 발명 실시계약 자체에 별도의 무효사유가 없는 한, 특허권자는 원칙적으로 특허발명 실시계약이 유효하게 존재하는 기간 동안 실시료의 지급 을 청구할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허가 사후적으로 무효가 되었다는 이유만으로 실시계약 자체가 소급하여 당연히 무효가 되는 것 은 아니다."},{"id":263,"text":"특허권 침해소송에서 손해액의 산정에 반드시 필요한 자료라는 이유로 법원이 피고에게 자료의 제출 을 명한 경우, 그 자료가 특허법 제132 조(자료의 제출)에 따른 ‘영업비밀’에 해당한다면 피고는 그 자료 의 제출을 거절할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"영업비밀이라는 이유만으로 자료제출명령을 무조건 거부할 수 있는 것은 아니다. 법원은 영업비밀 보호를 위한 조치를 취하면서 자료제출을 명할 수 있다."},{"id":264,"text":"특허권 등의 침해로 인한 손해액의 추정에 관한 특허법 제128 조(손해배상청구권 등)제2 항에서 말하 는 이익은 침해자가 침해행위에 따라 얻게 된 것으로서 그 내용에 특별한 제한은 없으나, 이 규정은 특허 권자에게 손해가 발생한 경우에 그 손해액을 평가하는 방법을 정한 것에 불 과하여 침해행위에도 불구하 고 특허권자에게 손해가 없는 경우에는 적용될 여지가 없으며, 다만 손해의 발생에 관한 주장ㆍ입증의 정도에 있 어서는 경업관계 등으로 인하여 손해 발생의 염려 내지 개연성이 있음을 주장ㆍ입증하는 것으 로 충분하다.","chapter":"특허권 및 실시권","answer":"O","explanation":"손해액 추정규정은 손해의 발생을 전제로 한다. 손해가 전혀 없는 경우에는 적용되지 않으며, 손해 발생에 대해서는 일정 정도의 염려·개연성 을 입증하는 것으로 충분하다. 특허법상 ‘허가 등에 따른"},{"id":265,"text":"특허법상 ‘허가 등에 따른 특허권의 존속기간 연장제도’에 관한 설명 특허발명을 실시하기 위하여 다른 법령에 따라 허가를 받거나 등록 등 을 하여야 하고, 그 허가 또는 등 록 등을 위하여 필요한 유효성ㆍ안전성 등의 시험으로 인하여 장기간이 소요되는 대통령령으로 정하는 발명 인 경우에는 그 실시할 수 없었던 기간에 대하여 5년의 기간까지 수차례 그 특허권의 존속기간을 연 장할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"허가 등에 따른 존속기간 연장은 한 차례만 가능하다. 따라서 ‘수차례’라는 표현이 틀렸다."},{"id":266,"text":"특허발명의 실시를 위한 허가등에 소요된 기간 중, 허가등을 받은 자에게 책임있는 사유로 소요된 기 간은 ‘실시할 수 없었던 기간’에 포함되지 아니한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"허가 등을 받은 자의 책임 있는 사유로 지연된 기간은 특허발명을 실시할 수 없었던 기간으로 보지 않는다."},{"id":267,"text":"특허권 존속기간의 연장등록을 받는데 필요한 허가등을 신청할 수 있는 자의 범위에는 특허권자 외에 도 전용실시권자 및 등록된 통상실시권 자가 포함된다.","chapter":"특허권 및 실시권","answer":"O","explanation":"허가 등을 실제로 신청할 수 있는 자에는 특허권자뿐 아니라 법이 정하는 전용실시권자와 등록된 통상실시권자도 포함된다."},{"id":268,"text":"특허권 존속기간의 연장등록출원의 출원인은 해당 특허권자여야 하고, 만약 특허권이 공유인 경우에 는 공유자 모두가 공동으로 특허권 존속 기간의 연장등록출원을 하여야 한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"연장등록출원은 특허권자가 하며, 공유 특허권인 경우에는 공유자 전원이 공동으로 출원해야 한다."},{"id":269,"text":"존속기간이 연장된 의약품 특허권의 효력이 미치는 범위는 연장등록된 특허권의 청구범위만을 기준 으로 엄격히 판단하여야 하고, 특허발명 을 실시하기 위하여 「약사법」에 따라 품목허가를 받은 의약품과 특정 질병에 대한 치료효과를 나타낼 것으로 기대되는 특정한 유효성분, 치료효과 및 용도가 동일한지 여부를 고려해서는 안 된다.","chapter":"특허권 및 실시권","answer":"X","explanation":"연장된 특허권의 효력범위는 단순히 청구범위만 보는 것이 아니라 허가대상 의약품의 유효성분·용 도 등 법에서 정한 허가사항과의 관계를 고 려하여 판단한다. 특허권 남용 금지에 관한 특허법상 규정이 삭제된 이후에도 법원은 특허권 남용의 법리를 수용하고 있으나, 특허권 남용이 인 정되는 경우에도 특허권이 당연 무효가 되는 것은 아니며 그 특허권의 행사가 제한될 뿐이다."},{"id":270,"text":"특허발명을 실시하려는 자는 그 특허발명이 천재지변이나 그 밖의 불가항력 또는 대통령령으로 정하 는 정당한 이유 없이 계속하여 3년 이상 국내에서 실시되고 있지 아니하고 특허권자 또는 전용실시권자 와 합리적인 조건으로 통상실시권 허락에 관한 협의를 하였으나 특허권자 또 는 전용실시권자가 합의를 거부한 경우, 특허청장에게 통상실시권 설정의 재정을 청구할 수 없다.","chapter":"특허권 및 실시권","answer":"X","explanation":"이 경우는 오히려 법정 요건을 충족하면 통상실시권 설정의 재정을 청구할 수 있는 전형적인 경우 이다."},{"id":271,"text":"2 이상의 의약이 혼합되어 제조되는 의약의 발명에 관한 특허권의 효력은 「약사법」에 따른 조제행위
