<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>민법·특허법·상표법 O/X</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{max-width:780px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:#f4f6f9ee;backdrop-filter:blur(12px);padding:12px 14px;border-bottom:1px solid #e5e7eb}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:19px;font-weight:850}.homebtn{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px}
.progress{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:9px}.progress>i{display:block;height:100%;background:#111827;width:0}
main{padding:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #00000008}.btn{border:0;border-radius:13px;padding:13px;background:#eef1f5;font-weight:800;font-size:14px}.back{background:#fff;border:1px solid #e5e7eb}.subjectgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.subject{min-height:90px;text-align:left}.subject b{display:block;font-size:17px}.subject small{display:block;color:#6b7280;font-size:11px;margin-top:6px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wrong{background:#fff0f3;color:#9f1239}.chapters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chapter{text-align:left;border:1px solid #e5e7eb;background:#fff;border-radius:13px;padding:12px}.chapter b{font-size:13px}.chapter small{display:block;color:#6b7280;font-size:11px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8fafc;border-radius:13px;padding:11px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:#6b7280}
.meta{display:flex;justify-content:space-between;color:#6b7280;font-size:12px;margin-bottom:9px}.q{font-size:19px;line-height:1.7;font-weight:750;white-space:pre-wrap;word-break:keep-all}.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.ox button{height:70px;background:#fff;border:2px solid #e5e7eb;border-radius:15px;font-size:28px;font-weight:900}.feedback{margin-top:14px;padding:14px;border-radius:14px;line-height:1.55}.good{background:#ecfdf5;color:#065f46}.bad{background:#fff1f2;color:#9f1239}.ex{margin-top:7px;color:#374151;font-size:14px}.next{width:100%;margin-top:12px;padding:14px;border:0;border-radius:13px;background:#111827;color:white;font-weight:800}
@media(max-width:560px){.subjectgrid{grid-template-columns:1fr}.chapters{grid-template-columns:1fr}.actions{grid-template-columns:repeat(3,1fr)}.q{font-size:18px}}
</style></head><body><div class="app"><header><div class="top"><div class="brand">⚖️ 민법 · 특허법 · 상표법 O/X</div><button class="homebtn" onclick="home()">처음으로</button></div><div class="progress"><i id="bar"></i></div></header><main id="app"></main></div>
<script>
window.__JOOMINOX_DATA__={"civil":[{"id":1,"text":"임대차계약에서 차임불증액의 특약이 있더라도 그 후 특약을 그대로 유지 시키는 것이 신의칙에 반한다고 인정될 정도의 사정변경이 있는 경우에는 임대인의 차임증액청구가 인정될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":2,"text":"회사의 이사가 재직 중에 채무액과 변제기가 특정되어 있는 회사채무에 대 하여 보증계약을 체결한 후 사임한 경우, 특별한 사정이 없는 한 이사직 사 임이라는 사정변경을 이유로 보증계약을 일방적으로 해지할 수는 없다.","chapter":"민법총칙","answer":"O"},{"id":3,"text":"건물의 소유를 목적으로 한 토지의 임차인이 임대차계약을 체결할 당시 임 대인과의 사이에 건물 기타 지상시설 일체를 포기하기로 약정한 경우, 토지 임차인이 위 약정에 위반하여 지상물매수청구권을 행사하는 것은 특별한 사정이 없는 한 신의칙에 반한다.","chapter":"민법총칙","answer":"X"},{"id":4,"text":"부재자로부터 재산의 처분권한을 위임받은 자는 부재자의 생사불명을 이유로 법원에 의해 부재자의 재산관리인으로 선임된 이후에도 부재자의 재산처분에 법원의 허가를 받을 필요가 없다.","chapter":"민법총칙","answer":"X"},{"id":5,"text":"부재자 재산관리인이 선임결정이 취소되기 전에 법원의 허가를 받고 한 처분행위는 부재자에 대한 실종기간이 만료된 후에 이루어졌더라도 유효하고 그 효과는 부재자의 재산상속인에게 미친다.","chapter":"민법총칙","answer":"O"},{"id":6,"text":"후순위상속인이라도 부재자에 대한 실종선고의 여부에 따라 상속지분의 차이가 생기 는 경우에는 부재자에 대한 실종선고를 청구할 수 있는 이해관계인에 해당한다.","chapter":"민법총칙","answer":"X"},{"id":7,"text":"실종자를 당사자로 한 판결이 확정된 후에 실종선고가 확정되어 그 사망간주의 시점 이 소 제기 이전으로 소급하는 경우, 그 판결은 당사자능력이 없는 사망자를 상대로 한 판결로서 소급하여 무효이다.","chapter":"민법총칙","answer":"X"},{"id":8,"text":"실종선고가 이미 확정된 자에 대하여 그 실종선고가 취소됨이 없이 다시 실종선고가 내려진 경우, 새로이 선고된 실종선고를 기초로 상속관계를 판단하여야 한다.","chapter":"민법총칙","answer":"X"},{"id":9,"text":"재단법인의 정관변경은 그 변경방법을 정관에서 정한 때에는 주무관청의 허가를 얻지 않아도 효력이 있다.","chapter":"민법총칙","answer":"X"},{"id":10,"text":"재단법인의 기본재산에 관한 근저당권 설정행위는 특별한 사정이 없는 한 주무관청의 허가를 얻을 필요가 없다.","chapter":"민법총칙","answer":"O"},{"id":11,"text":"법인과 이사의 이익이 상반되는 사항에 관하여 이해관계인 또는 검사의 청구가 있는 경우, 법원은 임시이사를 선임하여야 한다.","chapter":"민법총칙","answer":"X"},{"id":12,"text":"사원총회의 결의로 정관의 규범적 의미와 다른 해석이 표명된 경우, 그 결의에 의한 해석은 법원을 구속한다.","chapter":"민법총칙","answer":"X"},{"id":13,"text":"청산 중인 법인의 청산인은 채권신고기간 내에는 채권자에 대한 변제를 할 수 없으므 로 법인은 그 기간 동안 채권자에 대한 지연배상책임을 면한다.","chapter":"민법총칙","answer":"X"},{"id":14,"text":"甲이 乙에게 대표자로서의 모든 권한을 포괄적으로 위임하여 乙이 포괄적 수임인으로 서 A를 대표하여 행한 대행행위는 원칙적으로 A에 대하여 효력이 있다.","chapter":"민법총칙","answer":"X"},{"id":15,"text":"甲이 정관에 기재된 대표권에 관한 제한을 위반하여 거래행위를 한 경우, 그와 같은 대표권 제한 사실에 대한 거래 상대방의 선의에 관한 증명책임은 그 상대방에게 있다.","chapter":"민법총칙","answer":"X"},{"id":16,"text":"甲이 A의 대표자로서 타인 간의 금전채무를 보증하는 계약을 체결하면서 사원총회의 결의를 거치지 않았다면 특별한 사정이 없는 한 그 보증계약은 무효이다.","chapter":"민법총칙","answer":"X"},{"id":17,"text":"A가 그 소유의 부동산에 대하여 丙에게 매매계약상 소유권이전채무를 부담하고 있는 경우, 甲이 그 채무에 대하여 소멸시효 중단의 효력이 있는 승인을 한 것은 총유물의 관리 및 처분행위라고 볼 수 없다.","chapter":"민법총칙","answer":"O"},{"id":18,"text":"A가 甲의 고의의 불법행위로 인해 손해를 입은 丁에 대해 민법 제35조의 손해배상책 임을 지는 경우, 丁에게 과실이 있었더라도 과실상계의 법리를 적용할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":19,"text":"매매계약이 불공정한 법률행위에 해당하는지는 매매계약이 체결된 당시를 기준으로 판단한다.","chapter":"민법총칙","answer":"O"},{"id":20,"text":"매매계약이 불공정한 법률행위로서 무효인 경우, 특별한 사정이 없는 한 그 매매계약 에 관한 부제소합의도 무효이다.","chapter":"민법총칙","answer":"O"},{"id":21,"text":"불공정한 법률행위로 무효인 경우, 당사자가 이를 추인하면 그때부터는 무효인 법률 행위가 유효로 된다.","chapter":"민법총칙","answer":"X"},{"id":22,"text":"불공정한 법률행위로서 무효인 경우에도 무효행위의 전환에 관한 민법 제138조가 적 용될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":23,"text":"대리인에 의한 법률행위의 경우, 경솔과 무경험은 대리인을 기준으로 판단하고 궁박 상태에 있었는지의 여부는 본인을 기준으로 판단한다.","chapter":"민법총칙","answer":"O"},{"id":24,"text":"채무자의 법률행위가 통정허위표시로 무효인 경우에도 채권자취소권의 대상이 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":25,"text":"매도인이 채무불이행을 이유로 하여 매매계약을 적법하게 해제한 후에도 매수인은 착 오를 이유로 그 계약을 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":26,"text":"동기의 착오가 상대방의 부정한 방법에 의하여 유발된 경우에는 동기가 표시되지 않 았더라도 표의자는 착오를 이유로 의사표시를 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":27,"text":"매도인이 제3자의 기망행위에 의해 매수인과 매매계약을 체결한 경우, 매도인이 그 제3자에게 사기에 의한 불법행위를 이유로 손해배상을 청구하기 위해서는 먼저 그 매 매계약을 취소하여야 한다.","chapter":"민법총칙","answer":"X"},{"id":28,"text":"표의자가 재단법인의 설립을 위해 서면에 의한 출연행위를 한 경우, 법인이 성립되고 출연된 재산이 기본재산이더라도 착오에 의한 의사표시의 취소 요건을 갖추면 표의자 는 이를 이유로 출연행위를 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":29,"text":"복대리인은 대리인이 자신의 이름으로 선임한 본인의 대리인이다.","chapter":"민법총칙","answer":"O"},{"id":30,"text":"법정대리인이 부득이한 사유로 복대리인을 선임한 경우, 법정대리인은 본 인에게 대하여 그 선임감독에 관한 책임이 있다.","chapter":"민법총칙","answer":"O"},{"id":31,"text":"임의대리인이 부득이한 사유로 복대리인을 선임한 경우, 임의대리인은 본 인에게 대하여 그 선임감독에 관한 책임이 있다.","chapter":"민법총칙","answer":"O"},{"id":32,"text":"복임권이 없는 대리인에 의하여 선임된 복대리인의 권한도 권한을 넘은 표 현대리의 기본대리권이 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":33,"text":"대리권 수여의 표시에 의한 표현대리에서 대리인이 대리인이라고 하지 않았더라도 사 회통념상 대리권을 추단할 수 있는 직함이나 명칭을 사용하는 것을 본인이 묵인한 경 우에는 대리권 수여의 표시가 있은 것으로 볼 수 있다.","chapter":"민법총칙","answer":"O"},{"id":34,"text":"권한을 넘은 표현대리는 특별한 사정이 없는 한, 대리인이 사술을 써서 대리행위의 표시없이 단지 본인의 성명을 모용하여 자기가 마치 본인인 것처럼 기망하여 본인 명 의로 직접 법률행위를 한 경우에도 성립될 수 있다.","chapter":"민법총칙","answer":"X"},{"id":35,"text":"대리권 소멸 후의 표현대리에 관한 민법 제129조는 법정대리인의 대리권 소멸에 관하 여서는 적용될 수 없다.","chapter":"민법총칙","answer":"X"},{"id":36,"text":"지방자치단체가 사경제주체로서 한 법률행위에 대해서는 표현대리에 관한 법리가 적 용되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":37,"text":"학교법인을 대표하는 이사장이 사립학교법상 규정을 위반하여 이사회의 심의ㆍ결정없 이 학교법인의 기본재산을 처분하는 행위에 대해서도 권한을 넘은 표현대리에 관한 규정이 준용될 수 있다.","chapter":"민법총칙","answer":"X"},{"id":38,"text":"乙이 무권대리인임을 계약체결 당시 丙이 알았더라도 丙은 상당한 기간을 정하여 甲 에게 계약의 추인 여부의 확답을 최고할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":39,"text":"甲이 丙에게 계약을 이미 추인하였더라도 丙이 계약체결 당시 乙이 무권대리인임을 알지 못하였다면, 丙은 甲 또는 乙에 대하여 계약을 철회할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":40,"text":"甲이 계약 내용 중 일부에 대하여 추인하였더라도 丙의 동의를 얻지 못하는 한 그 추 인은 효력이 없다.","chapter":"민법총칙","answer":"O"},{"id":41,"text":"甲은 乙에 대한 추인거절의 의사표시로써 丙에게 대항할 수 없으나, 丙이 그 사실을 안 때에는 대항할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":42,"text":"乙이 甲을 단독으로 상속하여 X토지의 소유자가 되면, 특별한 사정이 없는 한 乙은 본인의 지위에서 매매계약의 추인을 거절할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":43,"text":"취소권자의 상대방에 대한 채무의 일부 이행","chapter":"민법총칙","answer":"X"},{"id":44,"text":"취소권자에 대한 상대방의 이행 청구","chapter":"민법총칙","answer":"O"},{"id":45,"text":"취소권자와 상대방 사이의 경개계약 체결","chapter":"민법총칙","answer":"X"},{"id":46,"text":"취소권자의 채무자로서의 담보제공","chapter":"민법총칙","answer":"X"},{"id":47,"text":"취소권자의 취소할 수 있는 행위로 취득한 권리의 일부 양도","chapter":"민법총칙","answer":"X"},{"id":48,"text":"조건이 법률행위의 당시 이미 성취한 것인 경우에는 그 조건이 해제조건이면 그 법률행위는 조건없는 법률행위로 한다.","chapter":"민법총칙","answer":"X"},{"id":49,"text":"조건이 법률행위의 당시에 이미 성취할 수 없는 것인 경우에는 그 조건이 정 지조건이면 그 법률행위는 무효로 한다.","chapter":"민법총칙","answer":"O"},{"id":50,"text":"당사자가 불확정한 사실이 발생한 때를 이행기한으로 정한 경우, 그 사실이 발생한 때는 물론 그 사실의 발생이 불가능하게 된 때에도 그 이행기한은 도래한 것으로 보아야 한다.","chapter":"민법총칙","answer":"O"},{"id":51,"text":"기한이익 상실의 특약은 특별한 사정이 없는 한 정지조건부 기한이익 상실 의 특약으로 추정된다.","chapter":"민법총칙","answer":"X"},{"id":52,"text":"피담보채무의 소멸을 이유로 물상보증인이 제기한 저당권설정등기의 말소를 구하는 소에 채권자 겸 저당권자가 응소하여 피담보채권의 존재를 주장한 경우","chapter":"민법총칙","answer":"O"},{"id":53,"text":"채권의 양수인이 채권양도의 대항요건을 갖추지 못한 상태에서 채무자를 상대로 재판 상 청구를 한 경우","chapter":"민법총칙","answer":"X"},{"id":54,"text":"금전채권의 실현을 목적으로 채권자가 그 금전채권을 피담보채권으로 하여 근저당권 설정등기청구의 소를 제기한 경우 월 이내에 채무자의 승인이 있는 경우","chapter":"민법총칙","answer":"X"},{"id":55,"text":"채권자가 채무자에 대하여 최고를 한 후, 6개","chapter":"민법총칙","answer":"X"},{"id":56,"text":"채권자가 채권에 대한 지급명령 신청이 각하된 후, 6개월 이내에 법원에 채무이행을 구하는 소를 제기한 경우","chapter":"민법총칙","answer":"X"},{"id":57,"text":"甲을 상속한 乙이 甲 소유의 X토지를 상속한 경우","chapter":"민법총칙","answer":"X"},{"id":58,"text":"甲이 乙의 소유명의로 등기되어 있는 X토지에 관한 소유권확인의 소에서 승소 판결 을 받은 경우","chapter":"민법총칙","answer":"O"},{"id":59,"text":"甲 소유의 X토지를 보상금 지급을 정지조건으로 재결수용에 의해 乙이 수용한 경우","chapter":"민법총칙","answer":"X"},{"id":60,"text":"甲 소유의 X토지를 乙이 공매로 낙찰받고 매각대금을 완납한 경우","chapter":"민법총칙","answer":"X"},{"id":61,"text":"甲 소유의 X토지 위에 설정된 乙의 저당권의 피담보채권이 모두 변제된 경우","chapter":"민법총칙","answer":"X"},{"id":62,"text":"부동산 매수인이 그 목적물을 인도받아서 이를 사용ㆍ수익하고 있는 경우에는 그 매 수인의 소유권이전등기청구권은 소멸시효에 걸리지 않는다.","chapter":"민법총칙","answer":"O"},{"id":63,"text":"신축 중인 건물에 관한 소유권이전등기청구권의 소멸시효는 건물완공시부터 기산한다.","chapter":"민법총칙","answer":"O"},{"id":64,"text":"토지에 대한 점유취득시효가 완성된 후 점유자가 그 토지에 대한 점유를 상실하면 특 별한 사정이 없는 한 시효완성을 원인으로 한 소유권이전등기청구권도 즉시 소멸한다.","chapter":"민법총칙","answer":"X"},{"id":65,"text":"채권담보의 목적으로 이루어진 부동산 양도담보에 있어서 피담보채무가 변제된 이후 에 양도담보권설정자가 행사하는 소유권이전등기청구권은 물권적 청구권으로서 시효 로 소멸하지 아 니한다.","chapter":"민법총칙","answer":"O"},{"id":66,"text":"부동산에 관하여 무효인 등기가 경료된 경우, 그 무효등기의 말소등기청구권과 말소 등기청구에 갈음하여 하는 진정명의회복을 위한 소유권이전등기청구권의 법적 성질은 모두 소유권에 기한 방해배제청구권이다.","chapter":"민법총칙","answer":"O"},{"id":67,"text":"甲의 X토지에 乙이 1번 저당권, 丙이 2번 저당권을 취득하고 丁이 X토지를 가압류 한 후에 丙이 X토지의 소유권을 취득한 경우, 丙의 저당권은 혼동으로 소멸하지 않는다.","chapter":"민법총칙","answer":"O"},{"id":68,"text":"토지임차권이 대항요건을 갖춘 후에 그 토지에 제3자의 저당권이 설정된 경우, 토지 소유권과 임차권이 동일인에게 귀속하더라도 물권의 혼동 규정이 준용되어 임차권은 소멸하지 않는다.","chapter":"민법총칙","answer":"O"},{"id":69,"text":"부동산의 공유자 일부의 공유지분 포기에 따른 물권변동은 다른 공유자 명의로 지분 이전등기를 하여야 그 효력이 발생한다.","chapter":"민법총칙","answer":"O"},{"id":70,"text":"유치권자가 유치권을 포기하기로 한 경우, 유치물을 채무자에게 인도하여야 그 유치 권이 소멸한다. 목","chapter":"민법총칙","answer":"X"},{"id":71,"text":"근저당권자가 저당 적물의 소유권을 취득함으로써 근저당권이 혼동으로 소멸하더라 도, 그 소유권취득이 무효인 것으로 밝혀지면 소멸하였던 근저당권은 당연히 부활한다.","chapter":"민법총칙","answer":"O"},{"id":72,"text":"부동산에 대한 점유취득시효가 완성된 경우, 소유명의자는 점유자가 시효가 완성되기까 지 그 부동산으로부터 얻은 이익에 대하여 부당이득반환청구를 할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":73,"text":"토지에 관하여 점유취득시효 완성에 따라 소유권이전등기가 마쳐진 경우, 제3자가 등 기명의자의 취득시효 기간 중 일부 기간 동안 해당 토지 일부에 관하여 직접적ㆍ현실 적인 점유를 한 사실이 있으면 그 등기는 원인무효의 등기가 된다.","chapter":"민법총칙","answer":"X"},{"id":74,"text":"취득시효 완성 사실을 알면서 소유자로부터 그 부동산을 매수하여 소유권이전등기를 마친 자는 특별한 사정이 없는 한 소유자의 등기의무를 승계한다.","chapter":"민법총칙","answer":"X"},{"id":75,"text":"취득시효기간의 완성 전에 소유자의 채권자에 의하여 시효취득 목적물이 압류 또는 가압류가 된 경우, 취득시효는 중단된다.","chapter":"민법총칙","answer":"X"},{"id":76,"text":"소유권의 취득시효를 완성한 자가 취득시효완성으로 인한 소유권이전등기청구권을 타 인에게 양도하려는 경우, 소유명의인의 동의 또는 승낙을 요하지 않는다.","chapter":"민법총칙","answer":"O"},{"id":77,"text":"전세권 존속기간이 시작되기 전에 마쳐진 전세권설정등기는 특별한 사정이 없는 한 유효한 것으로 추정된다.","chapter":"민법총칙","answer":"O"},{"id":78,"text":"임대차보증금반환채권을 담보할 목적으로 임대인과 임차인이 전세권설정계약을 체결 하였고 전세권자인 임차인이 그 목적물을 사용ㆍ수익한 경우, 특별한 사정이 없는 한 그 전세권설정계약은 임대차계약과 양립할 수 없는 범위에서 통정허위표시에 해당하 여 무효이다.","chapter":"민법총칙","answer":"O"},{"id":79,"text":"토지의 전세권이 존속기간 만료로 종료된 경우, 최선순위 전세권자의 채권자는 전세 권이 설정된 토지에 대한 경매절차에서 채권자대위권에 기하여 자기 이름으로 전세권 에 대한 배당요구를 할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":80,"text":"전세권설정자는 전세권자에 대하여 전세권자에게 책임있는 사유로 인하여 전세목적물 이 멸실됨에 따른 손해배상채권 이외의 다른 채권을 가지고 전세금반환채권에 대하여 물상대위권을 행사한 전세권저당권자에게 상계 등으로 대항할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":81,"text":"토지의 전세권이 존속기간 만료로 종료된 경우, 전세권설정자는 전세권저당권자가 존 재하더라도 전세금반환채권에 대한 압류 등이 없는 한 전세권자에 대하여만 전세금반 환의무를 부담한다.","chapter":"민법총칙","answer":"O"},{"id":82,"text":"甲에게 乙과의 위 매매계약에 관한 적법한 해제권이 발생하였다면 이후 甲의 과실로 X토지가 현저히 훼손되었더라도 甲의 해제권은 소멸하지 않는다.","chapter":"민법총칙","answer":"X"},{"id":83,"text":"X토지가 토지거래허가구역내의 토지이고 甲과 乙의 매매계약이 주무관청의 허가를 받지 않아 유동적 무효의 상태에 있는 경우, 甲은 乙의 채무불이행을 이유로 위 매매 계약을 해제할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":84,"text":"甲의 해제권 행사가 있기 이전에 乙이 丙에게 X토지를 처분함으로써 이후 甲의 해제 권 행사에 따른 乙의 원물반환이 불가능하게 된 경우, 乙이 甲에게 원상회 복의무로써 반환하여야 할 금 액은 甲의 해제권 행사 당시의 목적물의 대가이다.","chapter":"민법총칙","answer":"X"},{"id":85,"text":"계약해제로 인한 원상회복의무가 이행지체에 빠진 이후의 지연손해금률에 관하여 약정 이 있는 경우, 그 지연손해금률이 법정이율보다 낮더라도 약정에 따른 지연손해금률 이 적용된다.","chapter":"민법총칙","answer":"O"},{"id":86,"text":"乙이 甲에 대한 X토지의 소유권이전등기청구권을 丁에게 양도하고 이를 甲에게 통지 한 후 甲과 乙의 매매계약이 해제된 경우, 특별한 사정이 없는 한 丁은 민법 제548조 제1항 단서에 의해 보 호되는 제3자에 해당한다.","chapter":"민법총칙","answer":"X"},{"id":87,"text":"원본채권이 양도된 경우, 이미 변제기에 도달한 이자채권은 원본채권의 양도당시 그 이자채권도 양도한다는 의사표시가 없는 한 당연히 양도되지는 않는다.","chapter":"민법총칙","answer":"O"},{"id":88,"text":"보유주식 일정량을 담보로 제공하기로 한 담보약정에 기한 채권은 일종의 제한종류채 권이다.","chapter":"민법총칙","answer":"O"},{"id":89,"text":"채권의 성질 또는 당사자의 의사표시로 달리 정한 바가 없는 이상, 특정물의 인도는 채권성립 당시에 그 물건이 있던 장소에서 해야 한다.","chapter":"민법총칙","answer":"O"},{"id":90,"text":"제한종류채권에 관하여 당사자가 합의하여 급부 목적물을 특정하거나 특정방법 또는 지정권자를 정하는 경우에는 그에 따라야 한다.","chapter":"민법총칙","answer":"O"},{"id":91,"text":"토지소유자가 수필의 토지 중 일정 면적을 상대방에게 매도한 경우, 양도할 토지 의 위치가 확정되지 않았다면 특별한 사정이 없는 한 상대방의 채권은 종 류채권에 해 당한다.","chapter":"민법총칙","answer":"X"},{"id":92,"text":"민법상 조합의 조합원이 조합을 탈퇴할 권리는 특별한 사정이 없는 한 피대위권리가 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":93,"text":"이혼으로 인한 재산분할청구권은 협의 또는 심판에 의해 구체적 내용이 형성되기 전 에는 특별한 사정이 없는 한 채권자대위권의 목적이 될 수 없다.","chapter":"민법총칙","answer":"O"},{"id":94,"text":"채권자가 자기의 금전채권을 보전하기 위하여 채무자의 금전채권을 대위행사하는 경 우, 제3채무자로 하여금 직접 대위채권자 자신에게 이행하도 록 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":95,"text":"채권자가 채권자대위권을 행사하는 경우, 수임인의 비용상환청구권에 관한 민법 제688 조를 준용하여 채무자에게 그비용의 상환을 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":96,"text":"비법인사단이 총유재산에 관한 권리를 행사하지 않고 있어 비법인사단의 채권자가 그 권리를 대위행사하는 경우에는 사원총회의 결의를 거쳐야 한다.","chapter":"민법총칙","answer":"X"},{"id":97,"text":"채권자취소권의 행사로 채무자가 부동산소유명의를 회 복한 경우, 채무자가 그 부동산 을 제3자에게 처분하였다면 이는 무권리자의 처분으로서 효력이 없다.","chapter":"민법총칙","answer":"O"},{"id":98,"text":"채무자의 재산적 법률행위라 하더라도 채무자의 책임재산이 아 닌 재산에 관한 법률행 위인 경우에는 채권자취소권의 대상이 될 수 없다.","chapter":"민법총칙","answer":"O"},{"id":99,"text":"사해행위 이전에 성립한 채권이 사해행위 이후에 양도되었다면 그 채권양수인은 채권 자취소권을 행사할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":100,"text":"채권자가 채권자취소권을 행사하는 경우, 사해행위의 취소만을 먼저 청구한 다 음원 상회 복을 나중에 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":101,"text":"수익자를 상대로 한 사해행위취소소 송에서는 수익자의 선의 여부만이 문제 되고 수익 자의 선의에 과실이 있는지 여부는 묻지 않는다.","chapter":"민법총칙","answer":"O"},{"id":102,"text":"전세권 존속 중에는 장래에 그 전세권이 소멸하는 경우에 전세금반환채권이 발생하는 것을 조건으로 그 장래의 조건부 채권을 양도할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":103,"text":"A채무의 이행을 담보할 목적으로 유효한 채권양도가 이루어진 이후 A채무가 변제로 소멸된 경우, 양도된 채권의 채무자는 이를 이유로 채권양수인의 양수금 청구를 거절 할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":104,"text":"채권자와 채무자 사이의 채권양도금지 특약에 대하여 선의인 채권양수인으로부터 다 시 채권을 양수한 악의의 전득자는 채권을 유효하게 취득할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":105,"text":"임대인이 임대차보증금반환채권의 양도 통지를 받은 후에는 임차인과 임대차계약의 갱신에 관하여 명시적으로 합의하더라도 그 합의의 효과는 보증금반환채권의 양수인 에게 미치지 않는다.","chapter":"민법총칙","answer":"O"},{"id":106,"text":"주채권과 분리하여 보증채권만을 양도하기로 하는 약정은 그 효력이 없다.","chapter":"민법총칙","answer":"O"},{"id":107,"text":"면책적 채무인수가 있더라도 종전채무자의 채무에 대한 보증은 보증인의 동의 없이도 존속한다.","chapter":"민법총칙","answer":"X"},{"id":108,"text":"면책적 채무인수가 있으면 인수채무의 소멸시효는 중단되고 채무인수일로부터 새로이 시효가 진행된다.","chapter":"민법총칙","answer":"O"},{"id":109,"text":"면책적 채무인수에서 채권자는 승 낙 또는 거절의 의사표시를 채무자와 인수인 모두에 게 하여야 한다. 첩","chapter":"민법총칙","answer":"X"},{"id":110,"text":"채무자와 인수인의 합의에 의한 중 적 채무인수에서 채권자의 수익의 의사표시는 그 채무인수 계약의 효력발생을 위한 요건이다.","chapter":"민법총칙","answer":"X"},{"id":111,"text":"채무자와 인수인이 면책적 채무인수의 약정을 한 경우, 채권자의 승 낙이 없더라도 채 무자는 채무를 면한다.","chapter":"민법총칙","answer":"X"},{"id":112,"text":"丙이 수익의 의사표시를 한 후, 甲과 乙이 丙의 권리를 임의로 소멸시 키는 약정을 하 더라도 특별한 사정이 없는 한 丙에 대하여는 그 효력이 없다.","chapter":"민법총칙","answer":"O"},{"id":113,"text":"丙은 乙에게 의사표시의 흠결이 있었다 하더라도 특별한 사정이 없는 한 이를 이유로 매매계약을 취소할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":114,"text":"丙이 수익의 의사표시를 한 이후라도 甲은 丙의 동의 없이 乙의 채무불이행을 이유로 매매계약을 해제할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":115,"text":"丙의 甲에 대한 대여금채권이 소멸한 경우, 乙은 이를 이유로 丙에게 매매대금의 지 급을 거절할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":116,"text":"乙이 丙에게 매매대금을 지급한 후 매매계약이 해제된 경우, 특별한 사정이 없는 한 乙은 계약해제에 기한 원상회 복을 원인으로 丙에게 그 반환을 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":117,"text":"채권자는 물상보증인이 되려는 자에게 주채무자의 신용상태를 조사해서 고지할 신의 칙상 의무를 부담한다.","chapter":"민법총칙","answer":"X"},{"id":118,"text":"병원은 입원환자의 휴대품 등의 도난을 방지함에 필요한 적절한 조치를 강구하여 줄 신의칙상 보호의무를 부담한다.","chapter":"민법총칙","answer":"O"},{"id":119,"text":"숙박업자는 투숙고객에게 객실을 사용ㆍ수익하게 할 의무를 넘어서 고객의 안전을 배 려하여야 할 신의칙상 보호의무를 부담한다.","chapter":"민법총칙","answer":"O"},{"id":120,"text":"사적 자치의 영역을 넘어 공공질서를 위하여 공익적 요구를 선행시켜야 할 경우, 신 의칙은 합법성의 원칙을 희생하여서라도 구체적 신뢰보호의 필요성이 인정되는 경우 에 한하여 예외적으로 적용된다.","chapter":"민법총칙","answer":"O"},{"id":121,"text":"어떤 법률관계가 신의칙에 위반되는지의 여부는 법원의 직권조사사항이다.","chapter":"민법총칙","answer":"O"},{"id":122,"text":"乙이 포괄적 수임인으로서 행한 대행행위의 효력은 원칙적으로 A에게 미 친다.","chapter":"민법총칙","answer":"X"},{"id":123,"text":"乙이 A의 사무집행과 관련한 불법행위로 丙에게 손해를 입힌 경우, 丙은 A에게 법인의 불법행위책임에 따른 손해배상을 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":124,"text":"乙이 자신의 사익을 도모하기 위해 A의 사무를 처리하다가 丁에게 손해를 입힌 경우에는 법인의 불법행위책임에 있어서 직무관련성이 부정된다.","chapter":"민법총칙","answer":"X"},{"id":125,"text":"甲이 乙에게 대표자로서의 권한을 포괄적으로 위임하고 대표이사로서의 직 무를 전혀 집행하지 않은 것은 그 자체로 이사의 선관주의의무에 위반하는 행위이다.","chapter":"민법총칙","answer":"O"},{"id":126,"text":"甲이 자신의 의사무능력을 이유로 乙과 체결한 저당권설정계약의 무효를 주장하는 것은 특별한 사정이 없는 한 신의칙에 반한다.","chapter":"민법총칙","answer":"O"},{"id":127,"text":"甲은 선의 ㆍ악의를 불문하고 받은 이익이 현존하는 한도에서 乙에게 그 이 익을 반환할 의무를 부담한다.","chapter":"민법총칙","answer":"X"},{"id":128,"text":"甲이 丙에 대한 부당이득반환채권을 乙에게 양도할 의무와 乙의 저당권등 기말소의무는 동시이행관계에 있다.","chapter":"민법총칙","answer":"O"},{"id":129,"text":"독립한 물건이라도 부동산은 종물이 될 수 없다.","chapter":"민법총칙","answer":"X"},{"id":130,"text":"주물의 점유로 인한 시효취득의 효력은 점유하지 않은 종물에도 미친다.","chapter":"민법총칙","answer":"X"},{"id":131,"text":"주물에 대한 압류의 효력은 원칙적으로 종물에 미치지 않는다.","chapter":"민법총칙","answer":"X"},{"id":132,"text":"주물 그 자체의 효용과 직접 관계가 없더라도 주물의 소유자의 상용에 공여되고 있는 물건은 종물이다.","chapter":"민법총칙","answer":"X"},{"id":133,"text":"원본채권이 양도되는 경우, 특별한 의사표시가 없으면 이미 변제기에 도달한 이자채 권은 함께 양도되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":134,"text":"甲과 丙이 체결한 매매계약은 반사회적 법률행위로서 무효이다.","chapter":"민법총칙","answer":"O"},{"id":135,"text":"乙은 甲을 대위함이 없이 직접 丙에 대하여 그 소유권이전등기의 말소를 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":136,"text":"乙은 甲에 대한 소유권이전등기청구권을 보전하기 위하여 甲과 丙 사이의 매매계약에 대하여 채권자취소권을 행사할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":137,"text":"丁이 丙을 소유권자로 믿고 丙으로부터 X건물을 매수하여 소유권이전등기 를 마친 경우, 丁은 甲과 丙 사이의 매매계약의 유효를 주장할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":138,"text":"상대방 있는 의사표시에 관하여 제3자가 표의자를 강박한 경우, 표의자는 상대방이 그 사실을 알았거나 알 수 있었을 경우에 한하여 강박에 의한 의사표시를 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":139,"text":"매매목적물에 하자가 있는 사실을 착오로 알지 못하고 매매계약을 체결한 매수인은 착오로 인한 의사표시의 취소 요건을 갖추더라도 매도인의 하자담보책임이 성립하는 경우에는 착오를 이유로 그 계약을 취소할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":140,"text":"통정허위표시로 매매계약이 체결된 경우, 매도인이 그 계약상 채무를 이행하지 않더 라도 매수인은 매도인에게 채무불이행으로 인한 손해배상을 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":141,"text":"경과실로 인한 착오로 의사표시를 한 자가 착오를 이유로 그 의사표시를 취소한 경우, 상대 방은 이로 인해 손해를 입더라도 표의자에게 불법행위로 인한 손해배상을 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":142,"text":"상대방이 표의자의 착오를 알고 이용한 경우에는 착오가 표의자의 중대한 과실로 인 한 것이더라도 표의자는 착오를 이유로 의사표시를 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":143,"text":"상대방 있는 의사표시는 원칙적으로 상대방에게 도달되어야 효력이 발생한다.","chapter":"민법총칙","answer":"O"},{"id":144,"text":"청약자가 청약의 의사표시를 발송한 후 사망한 경우에도 그 의사표시의 효력에 영향 을 미치지 아니한다.","chapter":"민법총칙","answer":"O"},{"id":145,"text":"적법하게 성립된 매매에 관하여 해제사유가 발생한 경우, 해제의 의사가 상대방 당사 자의 미성년 자(子)에게 도달하면 그 즉시 해제의 효력이 발생한다.","chapter":"민법총칙","answer":"X"},{"id":146,"text":"상대방이 부당하게 등기취급 우편물의 수취를 거부함으로써 우편물의 내용을 알 수 있는 객관적 상태의 형성을 방해한 것이 신의성실의 원칙에 반한다고 인정되는 경우, 수취 거부 시에 의사표시의 효력이 생긴 것으로 보아야 한다.","chapter":"민법총칙","answer":"O"},{"id":147,"text":"의사표시가 담긴 우편물이 상대방의 집에 도달하자 가사도우미가 수취한 후 개봉하지 않은 채 식탁 위에 두었는데, 그 즈음 우연히 그 집을 방문한 의사표시자가 그 미개 봉된 우편물을 회수하여 가지고 간 경우, 그 의사표시가 도달한 것으로 볼 수 없다.","chapter":"민법총칙","answer":"O"},{"id":148,"text":"법정대리인은 원칙적으로 부득이한 사유가 있는 때에 한하여 복임권이 있다.","chapter":"민법총칙","answer":"X"},{"id":149,"text":"법정대리인이 부득이한 사유로 복대리인을 선임한 경우, 법정대리인은 그 선임감독에 관한 책임이 있다.","chapter":"민법총칙","answer":"O"},{"id":150,"text":"임의대리인에게는 원칙적으로 복대리인을 선임할 권한이 없다.","chapter":"민법총칙","answer":"O"},{"id":151,"text":"임의대리인이 본인의 승낙을 얻어 복대리인을 선임한 경우, 임의대리인은 그 선임감 독에 관한 책임이 있다.","chapter":"민법총칙","answer":"O"},{"id":152,"text":"임의대리의 목적인 법률행위의 성질상 대리인 자신에 의한 처리가 필요하지 아니한 경우, 본인이 복대리 금지의 의사를 명시하지 아니하는 한 복대리인의 선임에 관하여 묵시적인 승낙이 있는 것으로 보는 것이 타당하다.","chapter":"민법총칙","answer":"O"},{"id":153,"text":"乙이 위 계약을 적법하게 추인하면, 丙은 甲을 상대로 계약상의 책임이나 무권대리인 의 책임을 일절 물을 수 없다.","chapter":"민법총칙","answer":"O"},{"id":154,"text":"乙이 甲에게 추인의 의사표시를 한 경우, 丙은 乙의 추인 사실을 몰랐다면 계약당시 乙의 무권대리사실에 관하여 선의인 때에 한하여 위 계약을 철회할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":155,"text":"乙이 추인을 거절한 경우, 丙은 무권대리사실에 관하여 선의ㆍ무과실이라면 甲에게 과실이 없더라도 甲을 상대로 무권대리인으로서의 책임을 추궁할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":156,"text":"甲이 무권대리인으로서 책임을 부담하는 경우, 丙은 위 계약에서의 위약금 조항의 효 력을 주장할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":157,"text":"만일 丙이 丁에게 위 부동산을 매도한 경우, 乙이 丁에게만 추인의 의사를 표시하면 추인의 효력은 발생하지 아니한다.","chapter":"민법총칙","answer":"X"},{"id":158,"text":"미성년자가 체결한 계약이 법정대리인의 동의없음을 이유로 취소할 수 있는 경우, 계 약당사자인 미성년자는 단독으로 그 계약을 취소할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":159,"text":"계약을 체결할 수 있는 권한만을 가진 임의대리인이 상대방의 사기로 계약을 체결한 경우, 그 임의대리인은 그 계약을 취소할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":160,"text":"미성년자인 임의대리인이 계약을 체결한 경우, 본인은 미성년자에 의한 대리행위라는 이유로 취소할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":161,"text":"전세권자의 사기에 의해 건물에 전세권이 설정되고 그 건물이 양도된 경우, 건물양수 인은 전세권자의 사기를 이유로 전세권 설정 계약을 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":162,"text":"미성년자가 단독으로 발급받은 신용카드를 이용하여 구입한 물품의 대금을 성년자가 되어 이의없이 결제한 후에도 그 물품구입계약을 미성년자의 행위임을 이유로 취소할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":163,"text":"乙은 甲을 상대로 허가가 나오는 것을 조건으로 하여 잔금과 상환으로 이전등기를 해 달라고 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":164,"text":"허가가 나오기 전이라도 甲은 乙이 잔금기일에 잔금을 지급하지 않았다는 것을 이유 로 위 계약을 해제할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":165,"text":"위 계약이 확정적으로 무효가 된 경우, 그에 관해 귀책사유가 있는 당사자도 계약의 무효를 주장할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":166,"text":"거래허가를 신청하기 전에는 乙의 기망행위로 위 계약을 체결하였더라도 甲은 그 계 약을 취소할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":167,"text":"만일 계약 당시 합의에 따라 계약금을 乙이 丙에게 지급하였는데 그 후 위 계약이 확 정적으로 무효가 된 경우, 특별한 사정이 없는 한 乙은 丙을 상대로 지급한 계약금 상당액의 반환을 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":168,"text":"채권자가 채무자에게 등기우편으로 이행청구를 한 경우, 법에서 정한 후속수단을 취 하지 않으면 그 이행청구만으로는 시효가 중단되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":169,"text":"채권자가 채무자를 상대로 제기한 소송에서, 피고인 채무자에게 소송서류가 송달된 적이 없는 상태에서 판결이 선고되더라도 시효중단의 효력은 있다.","chapter":"민법총칙","answer":"O"},{"id":170,"text":"채무자가 채권자를 상대로 채무부존재확인소송을 제기하여 채권자가 이를 적극적으로 다툰 경우, 그 소가 법원에 접수된 때부터 시효중단의 효력이 인정된다.","chapter":"민법총칙","answer":"X"},{"id":171,"text":"채권양수인이 채무자를 상대로 소를 제기하였다가 채무자에 대한 양도통지가 없었다는 각 이유로 청구가 기 되어 확정된 후, 양도통지를 하고 그 확정된 때로부 터 6개월 내에 前訴)제기 시로 소급하여 발생한다. 다시 소를 제기한 경우, 시효중단의 효력은 전소(","chapter":"민법총칙","answer":"O"},{"id":172,"text":"채권자가 연대채무자의 1인에 대하여 가압류를 한 경우, 다른 연대채무자의 채무에 대해서는 시효가 중단되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":173,"text":"명인방법에 의하여 공시되는 수목의 집단 중 토지로부터 분리된 수목은 선의취득의 대상이 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":174,"text":"무권리자로부 터 연립주택의 입주권을 평온ㆍ공연하게 선의ㆍ무과실로 매수하더라도 매수인은 입주권에 관한 선의취득을 주장할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":175,"text":"법정대리인의 동의를 받지 않은 미성년자로부 터 타인 소유의 자전거를 선의로 매수한 자는 그 미성년자가 제한 능력을 이유로 매매계약을 취소하더라도 선의취득에 기해 그 자전거의 소유권을 취득한다.","chapter":"민법총칙","answer":"X"},{"id":176,"text":"甲소유의 발전기를 임차하여 공장에서 사용 중인 乙이 발전기의 소유자를 乙로 오신 한 丙에게 그 발전기를 매도함과 동시에 이를 丙으로부 터 임차하여 점유의 이전없이 공장에서 계속 사용하고 있는 경우, 丙은 발전기의 소유권을 선의취득 할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":177,"text":"선의취득의 대상이 된 금반지가 유실물일 때에는 유실자는 유실한 날로부터 2년 내에 그 금반지의 반환을 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":178,"text":"甲이 丙을 점유매개자로 하여 X토지를 간접적으로 점유하였더라도 甲은 시효취득을 주장할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":179,"text":"乙이 X토지를 2015. 2. 1. 丙에게 매도하여 현재 丙이 소유권자로 등기되어 있는 경 우, 甲은 丙에게 취득시효의 완성을 주장할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":180,"text":"乙이 丙에게 무효인 매매계약에 기하여 2022. 2. 1. 소유권이전등기를 마쳐주었다면, 甲은 乙을 대위하여 丙 명의의 등기의 말소를 구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":181,"text":"乙의 채권자 丙이 채권을 보전하기 위하여 2018. 2. 1. X토지를 가압류 한 경우, 취득 시효의 진행은 중단된다.","chapter":"민법총칙","answer":"X"},{"id":182,"text":"X토지에 관하여 甲의 취득시효가 완성된 경우, 乙은 甲에 대하여 취득시효 기간 동안 X토지를 점유하여 얻은 이득의 반환을 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":183,"text":"공유자는 다른 공유자의 동의없이 자기의 지분을 담보로 제공할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":184,"text":"공유물의 변경은 공유자의 지분의 과반수로써 결정한다.","chapter":"민법총칙","answer":"X"},{"id":185,"text":"공유물의 관리에 관한 사항은 공유자의 과반수로써 결정한다. 분","chapter":"민법총칙","answer":"X"},{"id":186,"text":"합유자는 달리 정함이 없는 한 전원의 동의없이 합유물에 대한 지 을 처 하지 못한다. 분","chapter":"민법총칙","answer":"O"},{"id":187,"text":"총유물에 대한 보존행위는 달리 정함이 없는 한 비법인사단을 구성하는 각 사원이 할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":188,"text":"채권자는 자기 소유의 물건에 대하여는 유치권을 취득할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":189,"text":"임대인과 임차인 사이에 건물명도시 권리금을 반환하기로 약정한 경우, 임차인은 권 리금반환청구권을피담보채권으로 하여 그 건물에 대하여 유치권을 행사할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":190,"text":"당사자가 미리 유치권의 발생을 배제하기로 하는 특약을 하는 것도 가능하다.","chapter":"민법총칙","answer":"O"},{"id":191,"text":"어떠한 물건에 관련하여 채권이 발생한 후 채권자가 그 물건의 점유를 취득한 경우에 도 유치권이 성립할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":192,"text":"유치권자가 소유자의 승낙 없이 유치목적물을 임대한 경우, 임차인의 점유는 소유자 에게 대항할 수 있는 적법한 권원에 기한 것이다.","chapter":"민법총칙","answer":"X"},{"id":193,"text":"구분지상권을 목적으로 하는 저당권의 설정도 가능하다.","chapter":"민법총칙","answer":"O"},{"id":194,"text":"저당권 등기가 위법하게 말소된 후 그 저당부동산이 경매절차에서 매각된 경우, 저당 권자는 매수인을 상대로 말소된 저당권 등기의 회복을 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":195,"text":"피담보채무의 소멸로 무효가 된 저당권 등기의 유용은 등기부상 이해관계가 있는 제3 자가 생기지 않은 경우에 허용된다.","chapter":"민법총칙","answer":"O"},{"id":196,"text":"저당부동산에 대한 압류가 있으면 압류 이후의 저당권설정자의 저당부동산에 관한 차 임채권에도 저당권의 효력이 미친다.","chapter":"민법총칙","answer":"O"},{"id":197,"text":"금전채권이 아닌 채권을 피담보채권으로 하는 저당권을 설정하면서 그 평가액을 등기 한 경우, 채권자는 제3자에 대한 관계에 있어서 그 등기된 평가액의 한도에서만 저당 권을 주장할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":198,"text":"특정물매매에 있어서 매수인의 대금지급채무가 이행지체에 빠졌다고 하더라도 그 목 까 적물이 매수인에게 인도될 때 지는 매수인은 매매대금의 이자를 지급할 필요가 없다.","chapter":"민법총칙","answer":"O"},{"id":199,"text":"특정물매매의 경우, 매수인이 매매대금을 지급하지 않더라도 인도받지 않은 목적물로 부 터 생긴 과실에 대한 수취권은 특별한 사정이 없는 한 매수인에게 귀속된다.","chapter":"민법총칙","answer":"X"},{"id":200,"text":"채권자는 특정물에 관한 자신의 채권을 보전하기 위하여 채무자의 제3채무자에 대한 그 특정물에 관한 권리만을 대위행사할 수 있다. 7 7 파트를 지정하여 매매하는 것을 내용으로 하는 아","chapter":"민법총칙","answer":"O"},{"id":201,"text":"103동 60 호, 10 동 203호 등으로 아 파트분양계약은 수량을 지정한 매매가 아닌 특정물을 목적으로 한 매매에 해당한다.","chapter":"민법총칙","answer":"O"},{"id":202,"text":"채권자가 특정물채권을 보전하기 위해 채권자취소권을 행사하는 것은 허용되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":203,"text":"농지취득자격증명 발급신청권은 채권자대위권의 행사대상이 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":204,"text":"채권자대위권 행사의 효과는 채무자에게 귀속되는 것이므로 채권자대위소송의 제기로 인한 피대위채권의 소멸시효 중단의 효과는 채무자에게 생긴다.","chapter":"민법총칙","answer":"O"},{"id":205,"text":"취득시효의 대상인 부동산의 소유자가 취득시효 완성 후에 그 부동산을 처분하여 점 유자의 시효취득을 원인으로 한 소유권이전등기청구권이 침해된 경우, 그 점유자는 소유권이전등기청구권의 보전을 위해 채권자취소권을 행사할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":206,"text":"채권자는 원칙적으로 자신의 채권액을 초과하여 채권자취소권을 행사할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":207,"text":"사해행위에 해당하는지가 문제되는 법률행위가 수익자의 대리인에 의하여 이루어진 때에는 특별한 사정이 없는 한 수익자의 사해의사는 대리인을 표준으로 결정한다.","chapter":"민법총칙","answer":"O"},{"id":208,"text":"丁이 변제기에 甲을 상대로 채무이행의 소를 제기하여 승소 판결이 확정된 경우, 그 소멸시효 중단의 효과는 乙과 丙에게도 발생한다.","chapter":"민법총칙","answer":"O"},{"id":209,"text":"乙이 丁에 대해 상계적상에 있는 2억 원의 채권을 가지고 있으나 상계하지 아니한 경 우, 丙은 乙의 丁에 대한 2억 원의 채권 중 1억 원에 한해 상계할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":210,"text":"丙이 채무 3억 원의 지급에 갈음하여 자신이 소유하는 부동산의 소유권을 丁에게 이 전하기로 하는 경개계약을 丁과 유효하게 체결한 경우, 丁에 대한 甲과 乙의 채무는 소멸한다. 멸","chapter":"민법총칙","answer":"O"},{"id":211,"text":"丁이 甲에 대해 채무 전부를 면제한 경우, 丁에 대한 乙과 丙의 채무 전부도 소 한다.","chapter":"민법총칙","answer":"X"},{"id":212,"text":"丙이 丁의 위 채권(3억 원)을 유효하게 양수한 경우, 甲과 乙은 丙에게 각 1억 원을 변제하여야 한다.","chapter":"민법총칙","answer":"O"},{"id":213,"text":"중첩적 채무인수는 채권자와 채무인수인과의 합의가 있는 이상 채무자의 의사에 반하여서도 이루어질 수 있다.","chapter":"민법총칙","answer":"O"},{"id":214,"text":"면책적 채무인수가 있은 경우, 인수채무의 소멸시효기간은 특별한 사정이 없는 한 채무인수와 동시에 이루어진 채무인수인의 채무승인에 따라 채무 인수일로부터 새로이 진행된다.","chapter":"민법총칙","answer":"O"},{"id":215,"text":"채무자와 채무인수인의 합의에 의한 중첩적 채무인수는 제3자를 위한 계약 에 해당하지 않으며, 채권자는 채무인수인에게 수익의 의사를 표시하지 않 더라도 채무인수인에 대하여 직접 청구할 권리를 갖는다.","chapter":"민법총칙","answer":"X"},{"id":216,"text":"의사표시의 불일치로 인해 계약이 성립하지 않는 경우, 그로 인해 손해를 입은 당사 자는 상대방이 계약의 불성립을 알았거나 알 수 있었음을 이유로 계약체결상의 과실 로 인한 손해배상을 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":217,"text":"은행 직원이 예금자로부 터 돈을 받아 확인한 후에는 실제로 입금하지 않아도 예금자 와 은행 사이에 예금계약이 성립한다.","chapter":"민법총칙","answer":"O"},{"id":218,"text":"甲이 자신의 X건물을 乙에게 1억 원에 팔겠다는 청약을 하였는데, 이 사실을 모르는 乙이 甲에게 X건물을 1억 원에 구입하겠다고 청약을 한 경우에 두 청약이 상대방에 게 도달한 때에 계약은 성립한다.","chapter":"민법총칙","answer":"O"},{"id":219,"text":"매도인이 매수인에게 매매계약의 합의해제를 청약하였는데, 매수인이 그 청약에 대하 여 조건을 붙여 승낙한 경우에는 합의해제의 청약이 실효된다.","chapter":"민법총칙","answer":"O"},{"id":220,"text":"임대인이 임대목적물에 대한 소유권 기타 이를 임대할 권한이 없다고 하더라도 임대 차계약은 유효하게 성립할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":221,"text":"부담부 증여에서 상대방의 부담의무 불이행을 이유로 한 증여자의 계약해제는 이미 분 이행한 부 에 대하여는 영향을 미치지 아니한다.","chapter":"민법총칙","answer":"X"},{"id":222,"text":"증여계약 성립 이후에 그 계약이 존 속하는 동안 서면을 작성한 경우에는 그때부터 당 사자가 임의로 이를 해제할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":223,"text":"재단법인의 설립을 위하여 서면에 의해 출연하였더라도 착오취소를 위한 요건이 갖춰 진 경우, 출연자는 착오를 이유로 출연의 의사표시를 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":224,"text":"서면에 의하지 않음을 이유로 증여계약을 해제하는 경우에는 원칙적으로 형성권의 제 척 기간의 적용을 받지 않는다.","chapter":"민법총칙","answer":"O"},{"id":225,"text":"정기의 급여를 목적으로 한 증여는 특별한 사정이 없는 한 증여자의 사망으로 인하여 그 효력을 잃 는다.","chapter":"민법총칙","answer":"O"},{"id":226,"text":"보수의 수 령 여부와 관계없이 수임인은 선량한 관리자의 주의의무를 부담한다.","chapter":"민법총칙","answer":"O"},{"id":227,"text":"수임인이 위임사무의 처리로 인하여 받은 금전을 위임인에게 반환할 경우, 특별한 사 료 준 정이 없는 한 위임종 시를 기 으로 그 금전의범위가 정해진다.","chapter":"민법총칙","answer":"O"},{"id":228,"text":"위임인이 성년후견개시심판을 받더라도 위임이 종료되는 것은 아니다.","chapter":"민법총칙","answer":"O"},{"id":229,"text":"위임계약의 당사자는 특별한 이유 없이도 언제든지 위임계약을 해지할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":230,"text":"수임인이 위임인의 지명에 의하여 복수임인을 선임한 경우, 위임인에 대하여 그 선임 감독에 관한 책임을 진다.","chapter":"민법총칙","answer":"X"},{"id":231,"text":"실종선고로 甲의 사망이 의제된 시점은 2022. 3. 10.이다.","chapter":"민법총칙","answer":"X"},{"id":232,"text":"甲의 실종선고가 취소되지 않더라도 甲이 살아 있는 것이 증명되었으므로, 보험회사 는 乙을 상대로 한 사망보험금 반환소송에서 승소할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":233,"text":"甲에 대한 실종선고가 취소되면, 선의인 乙은 현존이익 한도에서 보험금을 반환하면 된다.","chapter":"민법총칙","answer":"O"},{"id":234,"text":"실종선고를 취소하지 않는 한, 甲은 공직선거권이 없다.","chapter":"민법총칙","answer":"X"},{"id":235,"text":"법원에 의해 甲의 실종선고가 취소되면, 그 때부터 장래를 향하여 甲에 대한 실종선 고의 효력이 부정된다.","chapter":"민법총칙","answer":"X"},{"id":236,"text":"2023. 2. 18. 현재 甲은 이미 성년이 되었으므로, 매매계약을 취소할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":237,"text":"만일 甲이 2022. 2. 17. 丁의 동의 없이 매매계약을 추인하였더라도, 甲은 위 매매계약 을 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":238,"text":"만일 甲이 2022. 5. 15. 丁의 동의 없이 매매계약을 추인한 경우, 그 추인은 유효하다.","chapter":"민법총칙","answer":"O"},{"id":239,"text":"만일 甲이 2022. 10. 5. 아무런 이의를 제기하지 않고 乙로부터 매매대금을 수령한 경 우, 매매계약을 취소할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":240,"text":"2023. 2. 18. 현재 甲은 위 매매계약을 丁의 동의 없이 유효하게 추인할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":241,"text":"생전처분으로 재단법인을 설립하는 때에는 증여에 관한 규정을 준용한다.","chapter":"민법총칙","answer":"O"},{"id":242,"text":"유언으로 재단법인을 설립하는 때에는 출연재산(지명채권)은 유언의 효력이 발생한 때로 부터 법인에 귀속한 것으로 본다.","chapter":"민법총칙","answer":"O"},{"id":243,"text":"이사의 대표권에 대한 제한은 이를 등기하지 아니하면 그 효력이 없다.","chapter":"민법총칙","answer":"X"},{"id":244,"text":"재단법인의 목적을 달성할 수 없는 때에는 설립자나 이사는 주무관청의 허가를 얻어 설 립의 취지를 참작하여 그 목적 기타 정관의 규정을 변경할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":245,"text":"재단법인의 설립자가 그 명칭, 사무소소재지 또는 이사임면의 방법을 정하지 아니하 고 사망한 때에는 이해관계인 또는 검사의 청구에 의하여 법원이 이를 정한다.","chapter":"민법총칙","answer":"O"},{"id":246,"text":"배와 노","chapter":"민법총칙","answer":"X"},{"id":247,"text":"자물쇠와 열쇠","chapter":"민법총칙","answer":"X"},{"id":248,"text":"주유소건물과 주유기","chapter":"민법총칙","answer":"X"},{"id":249,"text":"횟집과 수족관","chapter":"민법총칙","answer":"X"},{"id":250,"text":"주유소부지와 그 지하에 매설된 유류저장탱크","chapter":"민법총칙","answer":"O"},{"id":251,"text":"2023년 2월 10일(금요일) 오후 10시 30분부터 12시간이라고 한 경우, 기간의 만료점은 2023년 2월 11일(토요일) 오전 10시 30분이 된다.","chapter":"민법총칙","answer":"O"},{"id":252,"text":"2004년 1월 17일 오후 2시에 태어난 甲이 성년이 되는 시점은 2023년 1월 17일 24시이다.","chapter":"민법총칙","answer":"X"},{"id":253,"text":"2022년 11월 30일 오전 10시부터 3개월이라고 한 경우, 기간의 만료점은 2023년 2월 28일(화요일) 24시이다.","chapter":"민법총칙","answer":"O"},{"id":254,"text":"2023년 5월 1일부터 10일간이라고 한 경우, 기간의 만료점은 2023년 5월 10일(수요일) 24시이다.","chapter":"민법총칙","answer":"O"},{"id":255,"text":"사원총회소집일 1주일 전에 통지를 발송하도록 한 경우, 사원총회소집일이 2023년 3 월 10일(금요일) 오후 2시면 소집통지를 늦어도 3월 2일 24시까지 발송하여야 한다.","chapter":"민법총칙","answer":"O"},{"id":256,"text":"보험금청구권의 소멸시효는 보험계약자가 보험회사에 보험금을 청구한 때 로부터 진행한다.","chapter":"민법총칙","answer":"X"},{"id":257,"text":"동일한 채권자에게 다수의 채무를 부담하는 채무자가 변제 충당을 지정하 지 않고 일부 금원을 변제한 경우, 특별한 사정이 없는 한 그 변제는 모든 채무에 대한 승인으로서 소멸시효를 중단하는 효력이 있다.","chapter":"민법총칙","answer":"O"},{"id":258,"text":"중첩적 채무인수에 의하여 인수인이 부담하는 채무에 대해서는 기존채무와 동일한 소멸시효기간이 적용된다.","chapter":"민법총칙","answer":"O"},{"id":259,"text":"보험계약자가 보험금을 부정 취득할 목적으로 다수의 보험계약을 체결한 것이 민법 제103조(반사회질서의 법률행위)에 의해 무효로 된 경우, 보험 자가 지급한 보험금에 대한 부당이득반환청구권은 10년의 민사 소멸시효기 간이 적용된다.","chapter":"민법총칙","answer":"X"},{"id":260,"text":"행정기관에 진정서를 제출하여 상대방을 궁지에 빠뜨린 다음 이를 취하하는 조건으로 거액의 급부를 제공받기로 약정한 것은 불공정한 법률행위에 해당한다.","chapter":"민법총칙","answer":"X"},{"id":261,"text":"법률행위의 성립시에는 존재하지 않았던 급부간의 현저한 불균형이 그 이후 외부적 사정의 급격한 변화로 인하여 발생하였다면 다른 요건이 충족되는 한 그때부터 불공 정한 법률행위가 인정된다.","chapter":"민법총칙","answer":"O"},{"id":262,"text":"불공정한 법률행위의 성립요건으로 요구되는 무경험이란 일반적인 생활체험의 부족이 아니라 해당 법률행위가 행해진 바로 그 영역에서의 경험 부족을 의미한다.","chapter":"민법총칙","answer":"X"},{"id":263,"text":"법률행위가 현저히 공정을 잃었고, 어느 한 당사자에게 궁박의 사정이 존재한다고 하 여도 그 상대방에게 이러한 사정을 이용하려는 폭리행위의 악의가 없었다면 불공정한 법률행위는 인정되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":264,"text":"불공정한 법률행위를 할 때 당사자간에 그 법률행위의 불공정성을 이유로 하여 법률 행위의 효력을 다툴 수 없다는 합의가 함께 행해졌다면 그러한 합의는 유효하다.","chapter":"민법총칙","answer":"X"},{"id":265,"text":"통정허위표시에 의한 법률행위도 채권자취소권의 대상인 사해행위가 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":266,"text":"임대차보증금반환채권을 담보할 목적으로 임대인과 임차인이 체결한 전세권설정계약 은 특별한 사정이 없는 한 임대차계약의 내용과 양립할 수 없는 범위에서만 통정허위 표시로 인정된다.","chapter":"민법총칙","answer":"X"},{"id":267,"text":"차명(借名)으로 대출받으면서 명의대여자에게는 법률효과를 귀속시키지 않기로 하는 합의가 대출기관과 실제 차주 사이에 있었다면 명의대여자의 명의로 작성된 대출계약 은 통정허위표시이다.","chapter":"민법총칙","answer":"O"},{"id":268,"text":"통정허위표시에 따른 선급금 반환채무 부담행위에 기하여 선의로 그 채무를 보증한 자는 보증채무의 이행 여부와 상관없이 허위표시의 무효로부터 보호받는 제3자에 해당한다.","chapter":"민법총칙","answer":"O"},{"id":269,"text":"파산관재인은 그가 비록 통정허위표시에 대해 악의였다고 하더라도 파산채권자 모두 가 악의로 되지 않는 한 선의의 제3자로 인정된다.","chapter":"민법총칙","answer":"O"},{"id":270,"text":"법률행위의 자연적 해 석이 행해지는 경우, 표시상의 착오는 문제될 여지가 없다.","chapter":"민법총칙","answer":"O"},{"id":271,"text":"의사의 수술 후 환자에게 새로이 발생한 증세에 대하여 그 책임소재와 손해배상 여부를 둘러싸고 분쟁이 있다가 화해계약이 체결되었다면, 이후에 그 증세가 수술로 인한 것이 아니라는 것이 밝혀졌더라도 의사는 착오를 이유로 위 화해계약을 취소할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":272,"text":"해제되어 이미 실효된 계약도 착오취소의 대상이 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":273,"text":"착오가 법률행위 내용의 일부에만 관계된 경우라면 일부무효의 법리가 유추적용되어 일부취소가 인정될 수도 있다.","chapter":"민법총칙","answer":"O"},{"id":274,"text":"예술품의 위작(僞作)을 진품으로 착각한 매도인의 말을 믿고서 과실 없이 진품에 상 응하는 가격으로 그 위작을 구입한 매수인이 매도인에게 하자담보책임을 물을 수 있 다면 그는 착오취소를 주장할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":275,"text":"대리권은 대리인의 권리이자 의무의 성격을 갖는다.","chapter":"민법총칙","answer":"X"},{"id":276,"text":"대리권 남용에 대해 진의 아닌 의사표시에 관한 민법 제107조 제1항 단서가 유추적용 되는 경우, 선의의 제3자 보호에 관한 동조 제2항도 함께 유추적용된다.","chapter":"민법총칙","answer":"O"},{"id":277,"text":"복대리인은 본인의 대리인이므로 원대리인의 복임행위는 본인을 위한 대리행위이다.","chapter":"민법총칙","answer":"X"},{"id":278,"text":"대리권이 이미 소멸한 원대리인에 의해 선임된 복대리인의 대리행위에 대해서는 대리 권 소멸 후의 표현대리(제129조)가 성립할 여지가 없다.","chapter":"민법총칙","answer":"X"},{"id":279,"text":"자신에게 유효한 대리권이 있다고 과실 없이 믿었던, 행위능력 있는 선의의 무권대리 인은 본인의 추인이 없더라도 상대방에 대한 무권대리인의 책임에 관한 민법 제135조 에 따른 책임을 지지 않는다.","chapter":"민법총칙","answer":"X"},{"id":280,"text":"甲과 乙이 관할관청으로부터 허가를 받으면 유동적 무효상태에 있던 위 매매계약은 소급해서 유효로 된다.","chapter":"민법총칙","answer":"O"},{"id":281,"text":"乙의 매수인 지위를 丙이 이전받는다는 취지의 약정을 甲, 乙, 丙이 한 경우, 그와 같 은 합의는 甲과 乙간의 위 매매계약에 관한 관할관청의 허가가 있어야 비로소 효력이 발생한다.","chapter":"민법총칙","answer":"O"},{"id":282,"text":"보전의 필요성이 인정되는 한 乙은 甲에 대한 토지거래허가 신청절차의 협력의무 이 행청구권을 피보전권리로 하여 甲의 권리를 대위 행사할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":283,"text":"甲과 乙이 관할관청에 토지거래허가를 신청하여 그 허가를 받은 후에도 乙은 다른 사 유가 없는 한 계약금을 포기하고 위 매매계약을 해제할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":284,"text":"乙은 특별한 사정이 없는 한 위 매매계약의 허가를 받기 전까지 부당이득반환청구권 을 행사하여 甲에게 이미 지급한 계약금의 반환을 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":285,"text":"이행지체의 경우 채권자는 채무자를 상대로 상당한 기간을 정하여 이행을 청구하면서 그 기간 내에 이행이 없으면 계약은 당연히 해제된 것으로 한다는 취지의 해제조건부 해제권 행사를 할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":286,"text":"동산에 대한 소유권유보부 매매의 경우 물권행위인 소유권이전의 합의가 매매대금의 완납을 정지조건으로 하여 성립한다.","chapter":"민법총칙","answer":"O"},{"id":287,"text":"부첩(夫妾)관계의 종료를 해제조건으로 하는 증여계약은 무효이다.","chapter":"민법총칙","answer":"O"},{"id":288,"text":"불확정기한의 경우 기한사실의 발생이 불가능한 것으로 확정되어도 기한은 도래한 것 으로 본다.","chapter":"민법총칙","answer":"O"},{"id":289,"text":"기한이익 상실의 특약은 특별한 사정이 없는 한 형성권적 기한이익 상실의 특약으로 추정된다.","chapter":"민법총칙","answer":"O"},{"id":290,"text":"甲이 개인이 아니라 지방자치단체인 경우 등기부취득시효를 주장할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":291,"text":"甲의 무과실은 전 시효기간을 통하여 인정되어야 하는 것은 아니다.","chapter":"민법총칙","answer":"O"},{"id":292,"text":"甲이 X토지에 대하여 무효의 중복된 소유권보존등기를 마친 경우에는 등기부취득시효를 주장할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":293,"text":"甲 → 乙 → 丙의 순으로 매매계약이 체결된 경우, 3자간 중간생략등기의 합의가 있더 라도 乙의 甲에 대한 소유권이전등기청구권이 소멸되는 것은 아니다.","chapter":"민법총칙","answer":"O"},{"id":294,"text":"가등기에 의하여 순위 보전의 대상이 되어 있는 물권변동청구권이 양도된 경우, 양도 인과 양수인의 공동신청으로 그 가등기상 권리의 이전등기를 가등기에 대한 부기등기 의 형식으로 경료할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":295,"text":"무효인 3자간 등기명의신탁에서 부동산을 매수하여 인도받아 계속 점유하는 명의신탁 자의 매도인에 대한 소유권이전등기청구권은 소멸시효에 걸리지 않는다.","chapter":"민법총칙","answer":"O"},{"id":296,"text":"매수인의 매도인에 대한 소유권이전청구권 보전을 위한 가등기가 경료된 경우, 소유 권이전등기를 청구할 어떤 법률관계가 있다고 추정되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":297,"text":"임야소유권 이전등기에 관한 특별조치법 에 의한 소유권보존등기가 경료된 임야에 관하여 그 임야를 사정받은 사람이 따로 있는 것이 사후에 밝혀졌다면, 그 등기는 실 체적 권리관계에 부합하는 등기로 추정되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":298,"text":"공유물분할청구는 부동산의 구분소유적 공유관계에서 인정되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":299,"text":"지분권자로서의 사용권을 사실상 포기하는 공유자 사이의 특약은 그 사실을 알지 못하고 공유지분을 취득한 특정승계인에게 승계되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":300,"text":"비법인사단의 채권자가 채권자대위권에 기하여 비법인사단의 총유재산에 관 한 권리를 적법하게 대위행사하는 경우에도 사원총회의 결의 등 비법인사단 의 내부적인 의사결정절차를 거쳐야 한다.","chapter":"민법총칙","answer":"X"},{"id":301,"text":"부동산의 합유자 중 일부가 사망한 경우 합유자 사이에 특별한 약정이 없는 한 해당 부동산은 잔존 합유자가 2인 이상일 때에는 잔존 합유자의 합유로 귀속된다.","chapter":"민법총칙","answer":"O"},{"id":302,"text":"자기 소유 토지에 분묘를 설치한 甲이 그 토지를 乙에게 양도하면서 분묘 이장 의 특약을 하지 않음으로써 분묘기지권을 취득한 경우, 특별한 사정이 없는 한 甲은 분묘기지권이 성립한 때가 아니라 지료청구를 받은 날부터 지료지급의무가 있다.","chapter":"민법총칙","answer":"X"},{"id":303,"text":"지상권자 甲의 지료 지급 연체가 토지소유권의 양도 전후에 걸쳐 이루어진 경우 토지양수인 乙에 대한 연체기간이 2년이 되지 않는다면 乙은 지상권소멸청구를 할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":304,"text":"甲 소유의 대지와 건물 모두 乙에게 매도되었으나 대지에 관하여서만 소유권이 전등기가 경료된 경우에 甲과 乙 사이에 관습법상의 법정지상권이 인정된다.","chapter":"민법총칙","answer":"X"},{"id":305,"text":"건물 소유자 甲과 토지 소유자 乙 사이에 건물의 소유를 목적으로 하는 토지 임 대차계약을 체결한 경우에도 관습법상의 법정지상권이 인정된다.","chapter":"민법총칙","answer":"X"},{"id":306,"text":"채권자는 피 보전채권의 변제기 전에 채권자대위권을 행사해서 피대위채권의 시효중단 을 위한 이행청구를 하지 한다. 못","chapter":"민법총칙","answer":"X"},{"id":307,"text":"임대인의 동의없는 임차권의 양도는 당사자 사이에서는 유효하므로 임차권의 양수인 은 임대인의 권한을 대위 행사할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":308,"text":"조합원이 조합을 탈퇴 할 권리는 일 신전속적 권리가 아니므로, 특별한 사정이 없는 한 피대위권리가 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":309,"text":"채권자가 채무자의 토지 소유권이전등기청구권을 대위행사한 후 이를 채무자에게 통지 한 경우, 채무자가 그 토지 소유권을 이전받는 것은 처분권제한에 위배되어 무효이다.","chapter":"민법총칙","answer":"X"},{"id":310,"text":"제3채무자가 직 접 대위채권자에게 금전을 지급하도록 하는 채권자대위소송의 결이 판 확정된 경우, 대위채권자의 채권자는 대위채권자가 제3채무자로부터 지급받을 권리를 압류할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":311,"text":"채권자취소권은 재 판상으로만 행사할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":312,"text":"채권자가 채무자 소유의 부동산에 저당권을 설정받아 채권전액에 대한 우선변제권을 확 탁 보하고 있다면, 그 채무의 수 보증인은 사전구상권을 보전권리로 하여 채무자의 피 법률행위를 사해행위로 취소하지 한다. 못","chapter":"민법총칙","answer":"O"},{"id":313,"text":"저당권이 설정된 부동산이 사해행위로 양도된 후 그 저당권의 실행으로 양수인인 수 익자에게 배당이 되었다면 취소채권자는 수익자를 상대로 배당금 상당액의 반환을 청 구할 수 있다. 복","chapter":"민법총칙","answer":"O"},{"id":314,"text":"사해행위 취소로 등기명의를 회 한 부동산을 채무자가 제3자에게 처분한 경우, 취소 뿐 복 채권자 만 아니라 사해행위 취소와 원상회 의 효력을 받는 채권자도 명의인을 상대 로 등기의 말 소를 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":315,"text":"취소채권자는 수익자가 사해행위로 취 한 득 근 저당권에 배당된 배당금을 가 압류한 수 익자의 채권자에 대하여서도 우선하여 배당을 받을 수 있다.","chapter":"민법총칙","answer":"X"},{"id":316,"text":"특정물채권의 채무자는 이행기에 이행하여도 손 해를 면할 수 없는 경우가 아 닌 한, 이행지체 중 에 과실없이 목적물이 멸 실되더라도 배상 임을 부담한다. 책","chapter":"민법총칙","answer":"O"},{"id":317,"text":"원본채권이 시효로 소 멸한 경우 그로부터 발생한 지분적 이자채권도 함께 소멸한다.","chapter":"민법총칙","answer":"O"},{"id":318,"text":"금전채무불이행에 따른 통상손해배상의 경우 채권자는 자신의 손해를 증명할 필요가 없다.","chapter":"민법총칙","answer":"O"},{"id":319,"text":"채무자가 금전채무를 이행하지 않아 발생한 확정된 지연손해금에 대하여 채권자가 이행 청구를 하는 경우 그 지연손해금에 대하여 다시 지연손해금의 지급을 구할 수는 없다.","chapter":"민법총칙","answer":"X"},{"id":320,"text":"무권대리에서 상대방이 그의 선택에 따라 행사할 수 있는 계약의 이행 또는 손해배상 청구권은 선택권을 행사할 수 있는 때부터 소멸시효가 진행한다.","chapter":"민법총칙","answer":"O"},{"id":321,"text":"甲이 자 신의 유일한 재산인 X부동산을 매도한 경우 甲의 일반채권자는 그 매매계약 을 사해행위로 취소할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":322,"text":"丁이 자 신의 유일한 재산을 처분한 경우 乙은 이를 사해행위로 취소할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":323,"text":"乙에게 2억 원을 변제한 丁은 丙에 대하여 변제자대위를 하지 못한다.","chapter":"민법총칙","answer":"O"},{"id":324,"text":"丙이 5억 원 전액을 변제한 후 대위등기를 하기 전에 B가 X부동산을 취득하여 소유 권이전등기를 마친 상황이라면 丙은 B에 대하여 변제자대위를 할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":325,"text":"B가 X부동산을 취득하여 소유권이전등기를 마친 후 乙의 저당권실행경매로 B가 X부동 산의 소유권을 상실하더라도 B는 丙은 물론 丁에 대하여도 변제자대위를 하지 못한다.","chapter":"민법총칙","answer":"O"},{"id":326,"text":"임차권양도를 금지하는 임대차계약상 특약이 임대차계약에 기한 임대보증 금반환채권의 양도를 금지하는 것으로 볼 수는 없다.","chapter":"민법총칙","answer":"O"},{"id":327,"text":"채무자가 양도인에게 이의를 보류하지 않고 승낙을 하였을 경우, 승낙 당 시 이미 상계를 할 수 있는 원인이 있었다는 사정을 양수인이 알고 있었다 면 승낙 이후에 상계적상이 생기더라도 채무자는 양수인에게 상계로 대항 할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":328,"text":"부동산 명의신탁자가 유효한 명의신탁약정을 해지한 다음 제3자에게 ‘ 명의 신탁 해지를 원인으로 한 소유권이전등기청구권 ’ 을 양도하였다면, 명의수탁 자가 그 양도에 대하여 동의하지 않더라도 양수인은 명의수탁자에 대하여 직접 소유권이전등기청구를 할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":329,"text":"임대인의 지위는 원 칙 적으로 임대인과 임대목적물을 양수한 자의 계약만으 로 양도 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":330,"text":"채무자가 채무액 일부를 지급하면서 이자 아 닌 원본에 충당할 것을 지정하고 채권자 가 이를 이의 없이 수령하여 묵시적 합의가 인정되는 때에는 지급된 금전은 원본에 충당된다.","chapter":"민법총칙","answer":"O"},{"id":331,"text":"원금채무는 소 멸시효가 완성되지 않았으나 이자채무는 소멸시효가 완성된 상태에서 채무자가 변제충당을 지정하지 않고 채무의 일부를 변제한 때에는 특별한 사정이 없 는 한 이자채무에 먼저 충당된다.","chapter":"민법총칙","answer":"O"},{"id":332,"text":"상계가 금지되는 채권이라고 하더라도 압류금지채권에 해당하지 않는 한 강제집행에 의한 전부명령의 대상이 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":333,"text":"피용자의 고의의 불법행위로 인하여 사용자책임이 성립하는 경우, 사용자는 자신의 고의가 없음을 주장하여 피해자의 손해배상채권을 수동채권으로 하는 상계권을 행사 할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":334,"text":"소 멸시효가 완성된 채권이 그 완성 전에 상계할 수 있었던 것이면 채권자는 그 채권 을 자동채권으로 하여 상계할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":335,"text":"매매계약상 매도인의 소유권이전의무가 이행불 능 이 되어 생 긴 손해 배 상채 무와 매수인의 대금지급채무","chapter":"민법총칙","answer":"O"},{"id":336,"text":"매매계약상 매도인의 소유권이전의무와 매수인의 대금지급의무 중 어 느 하 나를 선이행의무로 약정한 경우, 각 의무의 이행기가 모두 지 난 후의 쌍 방 의 의무","chapter":"민법총칙","answer":"O"},{"id":337,"text":"근저당권 실행을 위한 경매가 무효로 되어 근저당권자가 채무자인 소유자 를 대위하여 낙 찰 자에 대한 소유권이전등기 말 소청구권을 행사하는 경우, 낙 찰 자의 소유권이전등기 말 소의무와 근저당권자의 배 당금반환의무","chapter":"민법총칙","answer":"X"},{"id":338,"text":"요약자는 원 적으로 제3자의 권리와 별도로 낙약자에 대하여 제3자에게 급부를 이행 할 것을 요구할 수 있는 권리를 가진다.","chapter":"민법총칙","answer":"O"},{"id":339,"text":"제3자가 수익의 의사표시를 한 경우, 계약의 당사자가 제3자의 권리를 임의로 변경ㆍ 멸 소 시키는 행위를 하더라도 특별한 사정이 없는 한 제3자에 대하여 효력이 없다.","chapter":"민법총칙","answer":"O"},{"id":340,"text":"요약자와 수익자 사이의 법률관계(대가관계)의 효력 상실을 이유로 요약자는 약자와 요 낙 낙 약자 사이의 법률관계(기본관계)상 약자에게 부담하는 채무의 이행을 거 할 수 있다. 절","chapter":"민법총칙","answer":"X"},{"id":341,"text":"채무자와 인수인 사이의 계약으로 체결되는 중첩 적 채무인수의 경우, 채권자의 수익 의 의사표시는 그 계약의 성립요건 또는 효력발생요건이 아니다.","chapter":"민법총칙","answer":"O"},{"id":342,"text":"낙약자와 요약자 사이의 계약(기본관계)이 무효가 된 경우, 낙약자는 특별한 사정이 없 는 한 제3자를 상대로 그가 제3자에게 한 급부를 부당이득으로 반환 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":343,"text":"타인 권리의 매매로 인한 담보 임으로 매수인이 계약을 해제한 경우, 매수인이 진정 한 권리자인 타인에게 직 접 목적물을 반환한 때에는 그 반환한 범위에서 매도인에게 반환할 의무를 부담하지 않는다.","chapter":"민법총칙","answer":"O"},{"id":344,"text":"사정변경을 이유로 한 계약의 해제나 해지에서 사정변경에 대한 가 성이 있었는 예견 능 지는 개별적 사정을 고려하지 않고 추상적ㆍ일반적으로 단하여야 한다. 판","chapter":"민법총칙","answer":"X"},{"id":345,"text":"매수인의 사망으로 매수인의 지위를 상속한 상속인 이 매매계약을 해제하려면, 특별 들 한 사정이 없는 한 전원이 해제의 의사표시를 하여야 한다.","chapter":"민법총칙","answer":"O"},{"id":346,"text":"조합계약에서는 계약을 해제 또는 해지하고 조합원에게 그로 인한 원상회 복의 의무를 부담지 울 수는 없다.","chapter":"민법총칙","answer":"O"},{"id":347,"text":"계약이 합의에 따라 해제되거나 해지된 경우, 특별한 사정이 없는 한 채무불이행으로 인한 손 해배상을 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":348,"text":"예약완결권을 재판상 행사하는 경우, 소장 부본이 제척기간 내에 상대방에게 송달되 어야만 제척기간 내에 행사한 것으로 본다.","chapter":"민법총칙","answer":"O"},{"id":349,"text":"당사자들이 약정한 예약완결권의 행사기간은 그 매매예약이 성립한 때부터 10년을 초 과하더라도 무방하다.","chapter":"민법총칙","answer":"O"},{"id":350,"text":"매매예약 성립 후 당사자일방의 매매예약 완결권의 행사 전에 상대방의 매매목적물이 멸실된 경우, 매매예약 완결의 의사표시가 있더라도 매매의 효력이 생기지 않는다.","chapter":"민법총칙","answer":"O"},{"id":351,"text":"계약이행의 착수가 있기 전에 매도인이 민법 제565조(해약금) 제1항에 따라 계약을 해제하려면, 계약금의 배액을 상환하거나 적어도 이행제공 상태에 두어야 한다.","chapter":"민법총칙","answer":"O"},{"id":352,"text":"매수인이 매매목적물을 대금지급 전에 인도받았다면 대금지급의무와 소유권이전등기 의무가 동시이행관계에 있더라도 민법 제587조(과실의 귀속, 대금의 이자)에 의한 매 매대금이자를 지급할 의무가 있다.","chapter":"민법총칙","answer":"X"},{"id":353,"text":"조합재산을 구성하는 개개의 재산에 대한 합유지분을 압류 기타 강제집행의 대상으로 삼을 수 있다.","chapter":"민법총칙","answer":"X"},{"id":354,"text":"2인으로 구성된 조합에서 1인이 탈퇴하여 조합관계가 종료되는 경우, 특별한 사정이 없는 한 해산이나 청산을 거쳐야 조합재산은 남은 조합원의 단독소유에 속하게 된다.","chapter":"민법총칙","answer":"X"},{"id":355,"text":"2인으로 구성된 조합에서 1인이 존속기한을 정하지 않고 부동산 사용권을 출자하였다가 탈퇴한 경우, 특별한 사정이 없는 한 탈퇴 시 남은 조합원의 부동산 사용권은 소멸한다.","chapter":"민법총칙","answer":"X"},{"id":356,"text":"공동이행방식의 건설공동수급체의 구성원인 조합원이 그 출자의무를 불이행하면, 특 별한 사정이 없는 한 출자의무의 불이행을 이유로 이익분배 자체를 거부할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":357,"text":"조합원이 다른 조합원 전원의 동의 하에 조합지분을 양도하면, 조합원 지위의 변동은 조합지분의 양도양수에 관한 약정으로 써 바로 효력이 생긴다.","chapter":"민법총칙","answer":"O"},{"id":358,"text":"쌍무계약에서 당사자 쌍방의 귀책사유 없이 일방의 채무가 후발적으로 불능이 된 경 우, 상대방은 이미 이행한 급부에 대하여 부당이득반환을 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":359,"text":"집행력 있는 정본을 가진 채권자가 배당요구의 종기까지 적법한 배당요구를 하지 않 아 배당에서 제외된 경우, 배당금을 수령한 다른 채권자를 상대로 부당이 득반환청구 를 할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":360,"text":"과세관청이 3자간 등기명의 신탁에 따라 해당 부동산의 공부상 소유자가 된 명의수탁 자에게 재산세 부과처분을 하여 명의수탁자가 재산세를 납부한 경우, 그는 명의신탁 자나 그 상속인을 상대로 재산세 상당액에 대한 부당이득반환청구를 할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":361,"text":"임차인이 임대차계약 종료 후 임대차건물을 계속 점유하였으나, 본래의 임대차계약상 의 목적에 따라 사용ㆍ수익하지 아니하여 실 질적인 이득을 얻은 바가 없는 경우, 임 득반환의무를 부담하지 않는다. 차인은 차임 상당의 부당이","chapter":"민법총칙","answer":"O"},{"id":362,"text":"송금의뢰인과 수취인 사이에 계좌이체의 원인이 되는 법률관계가 존재하지 않는데도 송금의뢰인의 착오송금으로 인해 수취인이 계좌이체금액에 해당하는 예금채권을 취득 한 경우, 송금의뢰인이 수취인에 대하여 부당이득반환청구권을 갖는다.","chapter":"민법총칙","answer":"O"},{"id":363,"text":"채무자가 소멸시효완성 전에 채권자의 권리행사를 현저하게 곤란하게 하여 시효가 완성된 경우, 채무자가 시효의 완성을 주장하는 것은 권리 남용이 된다.","chapter":"민법총칙","answer":"O"},{"id":364,"text":"권리남용은 당사자의 주장이 없더라도 법원은 직권으로 판단할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":365,"text":"거래당사자가 유치권을 자신의 이익을 위하여 고의적으로 작출하여 유 치권의 최우선순위 담보권으로서의 지위를 부당하게 이용함으로써 신의 성실의 원칙에 반한다고 평가되는 경우에는 유치권의 남용이 된다.","chapter":"민법총칙","answer":"O"},{"id":366,"text":"권리남용으로 인정되는 경우, 남용의 구체적 효과는 권리의 종류와 남 용의 결과에 관계없이 권리의 박탈이라는 점에서는 동일하다.","chapter":"민법총칙","answer":"X"},{"id":367,"text":"법인의 정관에 이사의 해임사유에 관한 규정이 있는 경우, 법인으로서 는 이사의 중대한 의무위반 등의 특별한 사정이 없는 이상 정관에서 정 하지 아니한 사유로 이사를 해임할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":368,"text":"이사와 감사의 성명ㆍ주소는 등기사항이다.","chapter":"민법총칙","answer":"X"},{"id":369,"text":"법인과 이사의 이익이 상반되는 경우, 법원이 선임한 특별대리인은 그 사항에 대하여 법인을 대표한다.","chapter":"민법총칙","answer":"O"},{"id":370,"text":"이사의 대표권 제한이 정관에 기재된 경우, 이를 등기하지 않아도 악의 의 제3자에게 대항할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":371,"text":"비법인사단은 부동산소유권에 관하여 등기의무자가 될 수 없다.","chapter":"민법총칙","answer":"X"},{"id":372,"text":"비법인사단의 해산에 따른 청산절차에는 사단법인의 청산인에 관한 민법 규정을 유추 적용할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":373,"text":"비법인사단의 대표자가 행한 타인에 대한 업무의 포괄적 위임과 그에 따른 포괄적 수 임인의 대행행위는 비법인사단에 대하여 그 효력이 있다.","chapter":"민법총칙","answer":"X"},{"id":374,"text":"비법인사단의 채무는 구성원의 지분비율에 따라 귀속한다.","chapter":"민법총칙","answer":"X"},{"id":375,"text":"이사의 결원으로 인하여 손해가 생길 염려가 있더라도 이해관계인은 법원에 임시이사 의 선임을 청구할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":376,"text":"상계에는 시기(始期)를 붙이지 못한다.","chapter":"민법총칙","answer":"O"},{"id":377,"text":"현상광고에 정한 행위의 완료에 조건이나 기한을 붙일 수 있다.","chapter":"민법총칙","answer":"O"},{"id":378,"text":"무상임치와 무이자 소비대차의 경우, 채무자만이 기한이익을 갖는다.","chapter":"민법총칙","answer":"X"},{"id":379,"text":"조건의 성취로 인하여 이익을 받을 당사자가 신의성실에 반하여 조건을 성취시킨 때 에는 상대방은 그 조건이 성취하지 아니한 것으로 주장할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":380,"text":"부관이 붙은 법률행위에 있어서 부관에 표시된 사실이 발생한 때뿐만 아니라 발생하 지 않는 것으로 확정된 때에도 그 채무를 이행하여야 한다고 보는 것이 상당한 경우 에는 표시된 사실의 발생 여부가 확정되는 것을 불확정기한으로 정한 것으로 본다.","chapter":"민법총칙","answer":"O"},{"id":381,"text":"부동산에 부속된 동산을 분리하면 그 동산의 경제적 가치가 없는 경우에는 타인이 권 원에 의하여 동산을 부속시킨 경우라도 그 동산은 부동산소유자에게 귀속된다.","chapter":"민법총칙","answer":"O"},{"id":382,"text":"집합물에 대한 양도담보권자가 점유개정의 방법으로 양도담보권설정계약 당시 존재하 는 집합물의 점유를 취득한 후 양도담보권설정자가 자기 소유의 집합물을 이루는 물 건을 반입한 경우, 나중에 반입된 물건에는 양도담보권의 효력이 미치지 않는다.","chapter":"민법총칙","answer":"X"},{"id":383,"text":"적법한 경작권 없이 타인의 토지를 경작하였다면 그 경작한 입도(立稻)가 성숙한 경 우에도 경작자는 그 입도의 소유권을 갖지 못한다.","chapter":"민법총칙","answer":"X"},{"id":384,"text":"종물은 주물의 처분에 따르므로, 당사자의 특약으로 종물만을 별도로 처분할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":385,"text":"입목에 관한 법률에 의하여 소유권보존등기가 마쳐진 입목은 토지와 분리하여 양도될 수 있으나, 저당권의 객체는 될 수 없다.","chapter":"민법총칙","answer":"X"},{"id":386,"text":"소멸시효에 관한 규정은 강행규정이지만, 법률행위에 의하여 경감할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":387,"text":"공유물분할청구권은 공유관계가 존속하는 한 별도로 소멸시효가 진행되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":388,"text":"부당이득반환청구권의 소멸시효는 청구권이 성립한 때로부터 진행하고, 원칙적으로 권 리의 존재나 발생을 알지 못하였다고 하더라도 소멸시효의 진행에 장애가 되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":389,"text":"부동산매수인이 소유권이전등기 없이 부동산을 인도받아 사용ㆍ수익하다가 제3자에게 그 부동산을 처분하고 점유를 승계하여 준 경우, 소유권이전등기청구권의 소멸시효가 진행되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":390,"text":"원인채권의 지급을 확보하기 위하여 어음이 수수된 당사자 사이에 채권자가 어음채권 에 관한 집행권원에 기하여 한 배당요구는 그 원인채권의 소멸시효를 중단시키는 효력 이 없다.","chapter":"민법총칙","answer":"X"},{"id":391,"text":"불공정한 법률행위에도 무효행위 전환의 법리가 적용될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":392,"text":"불공정한 법률행위로서 무효인 경우에도 추인하면 유효로 된다.","chapter":"민법총칙","answer":"X"},{"id":393,"text":"불공정한 법률행위에 관한 규정은 부담 없는 증여의 경우에도 적용된다.","chapter":"민법총칙","answer":"X"},{"id":394,"text":"경매에서 경매부동산의 매각대금이 시가에 비하여 현저히 저렴한 경우, 불공정한 법 률행위에 해당하여 무효이다.","chapter":"민법총칙","answer":"X"},{"id":395,"text":"법률행위가 현저하게 공정을 잃은 경우, 특별한 사정이 없는 한 그 법률행위는 궁박 ㆍ경솔ㆍ무경험으로 인해 이루어진 것으로 추정된다.","chapter":"민법총칙","answer":"X"},{"id":396,"text":"법률에 관한 착오는 그것이 법률행위 내용의 중요부분에 관한 것이라 하더라도 착오 를 이유로 취소할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":397,"text":"착오로 인한 의사표시의 취소에 관한 민법 제109조 제1항은 당사자의 합의로 그 적용 을 배제할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":398,"text":"착오한 표의자의 중대한 과실 유무에 관한 증명책임은 의사표시의 효력을 부인하는 착오자에게 있다.","chapter":"민법총칙","answer":"X"},{"id":399,"text":"상대방이 표의자의 착오를 알고 이용한 경우, 그 착오가 표의자의 중대한 과실로 인 한 것이라고 하더라도 표의자는 착오에 의한 의사표시를 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":400,"text":"표의자가 착오를 이유로 의사표시를 취소한 경우, 취소로 인하여 손해를 입은 상대방 은 표의자에게 불법행위로 인한 손해배상을 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":401,"text":"乙은 특별한 사정이 없는 한 매매계약을 해제할 권한이 없다.","chapter":"민법총칙","answer":"X"},{"id":402,"text":"乙이 미성년자인 경우, 甲은 乙의 제한능력을 이유로 X토지에 대한 매매계약을 취소 할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":403,"text":"丙과의 매매계약이 불공정한 법률행위에 해당하는지 여부가 문제된 경우, 매도인의 무경험은 甲을 기준으로 판단한다.","chapter":"민법총칙","answer":"O"},{"id":404,"text":"乙이 丙으로부터 매매대금을 수령한 경우, 甲에게 이를 아직 전달하지 않았더라도 특 별한 사정이 없는 한 丙의 매매대금채무는 소멸한다.","chapter":"민법총칙","answer":"X"},{"id":405,"text":"甲이 乙에게 매매계약의 체결과 이행에 관한 포괄적 대리권을 수여한 경우, 특별한 사정이 없는 한 乙은 약정된 매매대금 지급기일을 연기하여 줄 권한을 가진다.","chapter":"민법총칙","answer":"X"},{"id":406,"text":"제한능력자의 법률행위에 대한 법정대리인의 추인은 취소의 원인이 소멸된 후에 하여 야 그 효력이 있다.","chapter":"민법총칙","answer":"X"},{"id":407,"text":"취소할 수 있는 법률행위로 취득한 권리를 취소권자의 상대방이 제3자에게 양도한 경 우, 법정추인이 되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":408,"text":"법률행위의 취소를 전제로 한 소송상의 이행청구나 이를 전제로 한 이행거절에는 취 소의 의사표시가 포함되어 있다고 볼 수 있다.","chapter":"민법총칙","answer":"O"},{"id":409,"text":"취소할 수 있는 법률행위는 취소권자가 추인할 수 있는 후에 이의를 보류하지 않고 이행청구를 하면 추인한 것으로 본다.","chapter":"민법총칙","answer":"O"},{"id":410,"text":"취소권자가 취소할 수 있는 법률행위를 적법하게 추인한 경우, 그 법률행위를 다시 취소할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":411,"text":"甲이 허가신청절차에 협력하지 않으면 乙은 甲에 대하여 협력의무의 이행을 소구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":412,"text":"甲이 허가신청절차에 협력할 의무를 이행하지 않더라도 특별한 사정이 없는 한 乙은 이를 이유로 계약을 해제할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":413,"text":"甲과 乙이 허가신청절차 협력의무의 이행거절의사를 명백히 표시한 경우, 매매계약은 확정적으로 무효가 된다.","chapter":"민법총칙","answer":"O"},{"id":414,"text":"매매계약이 乙의 사기에 의해 체결된 경우, 甲은 토지거래허가를 신청하기 전에 사기 를 이유로 계약을 취소함으로써 허가신청절차의 협력의무를 면할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":415,"text":"X토지가 중간생략등기의 합의에 따라 乙로부터 丙에게 허가 없이 전매된 경우, 丙은 甲에 대하여 직접 허가신청절차의 협력의무 이행청구권을 가진다.","chapter":"민법총칙","answer":"X"},{"id":416,"text":"丙이 乙의 대리행위가 유권대리라고 주장하는 경우, 그 주장 속에는 표현대리의 주장 이 포함된 것으로 보아야 한다.","chapter":"민법총칙","answer":"X"},{"id":417,"text":"丙이 계약체결 당시에 乙에게 매매계약 체결의 대리권이 없음을 알았더라도 丙의 甲 에 대한 최고권이 인정된다.","chapter":"민법총칙","answer":"O"},{"id":418,"text":"丙이 계약체결 당시에 乙에게 매매계약 체결의 대리권이 없음을 알았더라도 계약을 철회할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":419,"text":"乙의 행위가 권한을 넘은 표현대리로 인정되는 경우, 丙에게 과실(過失)이 있다면 과 실상계의 법리에 따라 甲의 책임이 경감될 수 있다.","chapter":"민법총칙","answer":"X"},{"id":420,"text":"丙이 乙의 대리행위가 권한을 넘은 표현대리라고 주장하는 경우, 乙에게 매매계약체 결의 대리권이 있다고 丙이 믿을 만한 정당한 이유가 있었는지의 여부는 계약성립 이 후의 모든 사정을 고려하여 판단해야 한다.","chapter":"민법총칙","answer":"X"},{"id":421,"text":"사정변경을 이유로 계약의 해제가 인정되는 경우는 계약준수 원칙의 예외에 해당한다.","chapter":"민법총칙","answer":"O"},{"id":422,"text":"사용자는 근로계약에 수반되는 신의칙상의 부수의무로서 피용자가 노무를 제공하는 과정에서 건강을 해치는 일이 없도록 필요한 조치를 강구하여야 할 의무를 부담한다.","chapter":"민법총칙","answer":"O"},{"id":423,"text":"채권자가 채권을 확보하기 위하여 제3자의 부동산을 채무자에게 명의신탁 하도록 한 다음 그 부동산에 대하여 강제집행을 하는 행위는 신의칙상 허용되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":424,"text":"아파트 분양자는 아파트 단지 인근에 쓰레기 매립장이 건설예정인 사실을 분양계약자에게 고지할 신의칙상 의무를 부담한다.","chapter":"민법총칙","answer":"O"},{"id":425,"text":"甲의 법정대리인은 특별한 사정이 없는 한 매매계약을 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":426,"text":"甲은 법정대리인의 동의가 없었다는 이유로 자신이 체결한 매매계약을 원칙적으로 취소 할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":427,"text":"乙은 매매계약을 체결할 당시 甲이 17세라는 것을 알았던 경우에도 甲의 법정대리인 에게 매매계약을 추인할 것인지 여부의 확답을 촉구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":428,"text":"甲이 매매계약에 대하여 법정대리인의 동의서를 위조하였고, 乙이 이를 믿고 계약을 체결한 경우, 甲의 법정대리인도 매매계약을 취소할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":429,"text":"매매계약을 체결할 당시 甲이 17세라는 것을 乙이 알았던 경우, 乙은 매매계약과 관련한 자신의 의사표시를 철회할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":430,"text":"민법상 재단법인은 비영리법인이다.","chapter":"민법총칙","answer":"O"},{"id":431,"text":"사원자격의 득실에 관한 규정은 재단법인 정관의 필요적 기재사항에 해당한다.","chapter":"민법총칙","answer":"X"},{"id":432,"text":"해산한 법인은 청산의 목적범위 내에서만 권리가 있고 의무를 부담한다.","chapter":"민법총칙","answer":"O"},{"id":433,"text":"이사의 대표권에 대한 제한은 이를 등기하지 않으면, 제3자가 악의이더라도 대항하지 못한다.","chapter":"민법총칙","answer":"O"},{"id":434,"text":"청산종결의 등기가 마쳐졌더라도 청산사무가 종료되지 않은 경우에는 그 범위 내에서 청산법인으로서 존속한다.","chapter":"민법총칙","answer":"O"},{"id":435,"text":"착오가 의사표시자의 중대한 과실로 인한 경우에는 상대방이 그 착오를 알고 이를 이용하였더라도 의사표시자는 착오를 이유로 의사표시를 취소할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":436,"text":"통정허위표시의 무효는 선의의 제3자에게 대항하지 못하며, 이때 제3자는 선의이면 족하고 무과실을 요하지 않는다.","chapter":"민법총칙","answer":"O"},{"id":437,"text":"무효인 가등기를 유효한 등기로 전용할 것을 약정하였다면, 무효행위의 전환이론에 따라 무효인 가등기는 그 등기시로 소급하여 유효로 전환된다.","chapter":"민법총칙","answer":"X"},{"id":438,"text":"취소권을 행사할 수 있는 기간의 경과 여부는 당사자가 주장하여야 하므로, 법원이 이를 당연히 조사하고 고려해야 할 사항은 아니다.","chapter":"민법총칙","answer":"X"},{"id":439,"text":"유동적 무효인 토지거래계약이 확정적으로 무효가 된 경우, 이에 대해 귀책사유가 있는 자는 계약의 무효를 주장할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":440,"text":"공무원 甲이 사직의 의사표시를 하는 것과 같은 사인의 공법행위에도 진의 아닌 의사 표시에 관한 민법 규정이 적용된다.","chapter":"민법총칙","answer":"X"},{"id":441,"text":"甲이 상대방 乙에게 진의 아닌 의사표시의 무효를 주장하는 경우, 乙의 악의나 과실 유무는 甲이 증명해야 한다.","chapter":"민법총칙","answer":"O"},{"id":442,"text":"채무자 甲의 법률행위가 통정허위표시로서 무효인 경우에도 그 법률행위가 채권자 취소권의 요건을 갖추었다면, 甲의 채권자 乙은 채권자취소권을 행사할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":443,"text":"통정허위표시의 제3자가 악의라도 그 전득자가 통정허위표시에 대하여 선의인 때에는 전득자에게 허위표시의 무효를 주장할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":444,"text":"의사표시의 상대방이 의사표시를 받은 때에 제한능력자인 경우에는 의사표시자는 원칙 적으로 그 의사표시로써 대항할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":445,"text":"동기의 착오가 상대방에 의하여 제공되거나 유발된 경우에는 착오를 이유로 취소할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":446,"text":"법률행위 내용의 중요부분에 대한 착오를 판단할 때, 의사표시자의 경제적인 불이익 여부는 문제되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":447,"text":"착오를 이유로 한 취소권은 추인할 수 있는 날로부터 3년 내에, 법률행위를 한 날로부터 10년 내에 행사하여야 한다.","chapter":"민법총칙","answer":"O"},{"id":448,"text":"법률행위가 사기에 의한 것으로서 취소되는 경우, 그 법률행위가 동시에 불법행위를 구성하는 때에는 취소의 효과로 생기는 부당이득반환청구권과 불법행위로 인한 손해 배상청구권을 중첩적으로 행사할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":449,"text":"제3자의 사기로 인하여 계약을 체결한 경우, 그 제3자에 대하여 불법행위로 인한 손 해배상을 청구하기 위해서는 먼저 그 계약을 취소해야 한다.","chapter":"민법총칙","answer":"X"},{"id":450,"text":"제척기간이 경과하면 그 기산일에 소급하여 권리소멸의 효과가 발생한다.","chapter":"민법총칙","answer":"X"},{"id":451,"text":"제척기간은 권리자의 청구나 압류 등이 있으면 중단되고 그때까지 경과된 기간은 산입 되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":452,"text":"점유보호청구권의 행사기간은 제척기간이기 때문에 점유보호청구권은 재판상 재판외 에서 행사할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":453,"text":"제척기간이 지난 후에는 당사자가 책임질 수 없는 사유로 그 기간을 준수하지 못하였 더라도 추후에 보완될 수 없다.","chapter":"민법총칙","answer":"O"},{"id":454,"text":"채권양도의 통지는 그 양도인이 채권이 양도되었다는 사실을 채무자에게 알리는 행위 이므로, 채권양도의 통지만으로 제척기간의 준수에 필요한 권리의 재판외 행사가 이루 어졌다고 볼 수 있다.","chapter":"민법총칙","answer":"X"},{"id":455,"text":"乙이 무권대리인임을 알았던 丙은 甲에게 乙의 대리행위에 대한 추인 여부의 확답을 최고할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":456,"text":"丙이 매매계약을 적법하게 철회하였다면 乙의 무권대리행위는 확정적으로 무효가 되어 그 후에는 甲이 매매계약을 추인할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":457,"text":"甲이 乙에 대하여 매매계약에 관한 추인의 의사표시를 한 경우, 이러한 추인의 의사 표시를 丙이 알지 못하였다면 丙은 철회할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":458,"text":"丙이 매매계약을 철회하는 경우, 철회의 효과를 다투는 甲은 丙이 乙에게 대리권이 없다는 사실에 관하여 악의임을 증명할 책임이 있다.","chapter":"민법총칙","answer":"O"},{"id":459,"text":"乙이 甲을 단독상속한 경우, 乙은 甲의 지위에서 무권대리임을 이유로 매매계약의 무효를 주장하는 것은 허용되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":460,"text":"甲의 원금반환채권은 10년간 행사하지 아니하면 소멸시효가 완성한다.","chapter":"민법총칙","answer":"O"},{"id":461,"text":"甲이 乙을 사기죄로 고소하여 형사소송이 제기되었는데, 이 과정에서 배상명령을 신청 하지 않은 경우에는 甲의 대여금채권의 소멸시효는 중단되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":462,"text":"甲이 乙을 상대로 대여금반환청구의 소를 제기하였다가 이후 그 소를 취하한 경우에도 甲의 대여금반환청구의 소제기로 인한 시효중단의 효력은 유지된다.","chapter":"민법총칙","answer":"X"},{"id":463,"text":"乙의 재산에 대하여 甲의 가압류가 있는 경우에도 시효중단의 효력이 인정되지만, 당연무효의 가압류는 소멸시효의 중단사유에 해당하지 않는다.","chapter":"민법총칙","answer":"O"},{"id":464,"text":"甲이 乙에게 대여금반환채무의 이행을 최고한 경우, 최고 후 6개월 내에 재판상의 청구를 하였다면 최고시에 시효중단의 효력이 발생한다.","chapter":"민법총칙","answer":"O"},{"id":465,"text":"乙이 임의대리인이라면 乙은 행위능력자임을 요하지 않는다.","chapter":"민법총칙","answer":"O"},{"id":466,"text":"乙의 대리행위가 무권대리라는 이유로 甲이 무효를 주장하는 경우, 乙의 대리행위가 권한을 넘은 표현대리행위라는 주장 및 증명책임은 丙에게 있다.","chapter":"민법총칙","answer":"O"},{"id":467,"text":"매매계약의 체결에 관한 권한을 수여받은 乙이 甲을 대리하여 매매계약을 체결한 경우, 乙은 특별한 사정이 없는 한 甲을 대리하여 매매계약의 해제 등 일체의 처분권을 행사 할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":468,"text":"甲으로부터 아파트에 관한 일체의 관리권한을 위임받아 甲으로 가장하여 아파트를 丙에게 임대한 乙이 다시 甲으로 가장하여 임차인 丙에게 아파트를 매도하였다면, 권한을 넘은 표현대리의 법리를 유추적용할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":469,"text":"대리권 수여행위는 묵시적인 의사표시로도 할 수 있으므로, 乙이 甲의 대리인의 외양을 가지고 행위하는 것을 甲이 알면서도 이의를 하지 않고 방임하는 등 사실상의 용태에 의하여 대리권의 수여가 추단되는 경우도 있다.","chapter":"민법총칙","answer":"O"},{"id":470,"text":"종기 있는 법률행위는 기한이 도래한 때로부터 그 효력을 잃는다.","chapter":"민법총칙","answer":"O"},{"id":471,"text":"기한의 이익은 이를 포기할 수 있지만, 상대방의 이익을 해하지 못한다.","chapter":"민법총칙","answer":"O"},{"id":472,"text":"조건이 법률행위 당시 이미 성취한 것인 경우에는 그 조건이 해제조건이면 그 법률 행위는 조건 없는 법률행위로 한다.","chapter":"민법총칙","answer":"X"},{"id":473,"text":"조건 있는 법률행위의 당사자는 조건의 성부가 미정인 동안에 조건의 성취로 인하여 생길 상대방의 이익을 해하지 못한다.","chapter":"민법총칙","answer":"O"},{"id":474,"text":"조건의 성취로 인하여 불이익을 받을 당사자가 신의성실에 반하여 조건의 성취를 방해한 때에는 상대방은 그 조건이 성취한 것으로 주장할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":475,"text":"甲은 丙에게 소유권에 기하여 X토지의 반환을 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":476,"text":"乙의 甲에 대한 소유권이전등기청구권의 소멸시효는 진행되지 않는다.","chapter":"민법총칙","answer":"O"},{"id":477,"text":"丙은 乙의 甲에 대한 소유권이전등기청구권을 대위하여 행사할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":478,"text":"甲은 丙에 대해 불법점유를 이유로 임료 상당의 부당이득반환을 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":479,"text":"X토지를 제3자가 불법점유하고 있다면, 丙은 제3자에 대하여 소유권에 기한 물권적 청구권을 행사할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":480,"text":"점유권은 혼동이나 소멸시효에 의해 소멸하지 않는다.","chapter":"민법총칙","answer":"O"},{"id":481,"text":"소유권은 소멸시효에 의해 소멸하지 않지만, 타인이 시효취득하면 상대적으로 소멸할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":482,"text":"전세권에 저당권이 설정된 경우, 전세목적물에 대한 소유권과 전세권이 동일인에게 귀속되더라도 전세권은 혼동에 의해 소멸하지 않는다.","chapter":"민법총칙","answer":"O"},{"id":483,"text":"후순위 저당권이 있는 부동산의 소유권을 선순위 저당권자가 아무런 조건 없이 증여 받아 취득한 경우, 혼동에 의해 저당권은 소멸한다.","chapter":"민법총칙","answer":"X"},{"id":484,"text":"부동산공유자의 공유지분포기의 의사표시가 다른 공유자에게 도달하더라도 그 공유지 분이 바로 소멸하는 것은 아니고, 다른 공유자는 자신에게 귀속될 공유지분에 관하여 소유권이전등기를 청구할 수 있을 뿐이다.","chapter":"민법총칙","answer":"O"},{"id":485,"text":"취득시효기간 만료 전에 등기부상 소유명의가 변경된 사실은 취득시효의 중단사유가 될 수 없다.","chapter":"민법총칙","answer":"O"},{"id":486,"text":"취득시효의 중단사유인 재판상 청구에는 소유권 침해의 경우, 그 소유권을 기초로 하는 방해배제 및 손해배상 또는 부당이득반환청구소송도 포함된다.","chapter":"민법총칙","answer":"O"},{"id":487,"text":"취득시효를 주장하는 자가 소를 제기한 데 대하여 권리자가 피고로서 응소하고 그 소송에서 적극적으로 권리를 주장하여 그것이 받아들여진 경우에는 시효중단사유인 재판상 청구에 해당한다.","chapter":"민법총칙","answer":"O"},{"id":488,"text":"시효중단의 효력은 당사자 및 그 승계인에 미치므로, 그 중단효과가 발생한 후의 특정승계인 또는 포괄승계인은 중단 당시의 당사자의 점유기간을 승계하여 시효 취득을 주장할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":489,"text":"소유권이전등기의 말소를 구하는 소를 제기하였다가 그 소를 취하한 후, 그로부터 6개월 내에 다시 취하된 소와 동일한 내용의 소를 제기한 경우, 후소가 제기된 때로부터 취득 시효의 진행이 중단된다.","chapter":"민법총칙","answer":"X"},{"id":490,"text":"질물의 과실에 대해서도 질권의 효력이 미친다.","chapter":"민법총칙","answer":"O"},{"id":491,"text":"질권설정을 위한 인도는 현실의 인도에 한하지 않고 점유개정에 의하더라도 무방하다.","chapter":"민법총칙","answer":"X"},{"id":492,"text":"질권자가 질물을 점유하고 있더라도 피담보채권의 소멸시효 진행에 영향을 미치지 않는다.","chapter":"민법총칙","answer":"O"},{"id":493,"text":"건물의 임대인이 임대차에 관한 채권에 의하여 그 건물에 부속한 임차인 소유의 동산을 압류한 때에는 질권과 동일한 효력이 있다.","chapter":"민법총칙","answer":"O"},{"id":494,"text":"질권설정자에게 처분권한이 없더라도 채권자가 평온 공연하게 선의이며 과실 없이 질권설정을 받은 경우, 채권자는 동산질권을 선의취득한다.","chapter":"민법총칙","answer":"O"},{"id":495,"text":"채권자가 채무자의 직접점유를 통하여 간접점유하는 경우에는 유치권은 성립하지 않는다.","chapter":"민법총칙","answer":"O"},{"id":496,"text":"유치권자는 채권의 변제를 받기 위하여 유치물을 경매할 수 있고, 매각대금에서 후순위 권리자보다 우선변제를 받을 수 있다.","chapter":"민법총칙","answer":"X"},{"id":497,"text":"수급인이 자신의 노력과 재료를 들여 신축한 건물에 대한 소유권을 원시취득한 경우, 수급인은 공사대금을 지급받을 때까지 유치권을 행사할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":498,"text":"유치권의 피담보채권의 소멸시효기간이 확정판결 등에 의하여 10년으로 연장된 경우, 유치권이 성립된 부동산의 매수인은 종전의 단기소멸시효를 원용할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":499,"text":"공사대금채권에 기하여 유치권을 행사하는 자가 스스로 보존에 필요한 범위 내에서 유치물인 주택에 거주하며 사용하는 경우에도 소유자는 유치권의 소멸을 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":500,"text":"甲은 전세권 존속 중에는 장래에 그 전세권이 소멸하는 경우에 전세금반환채권이 발생하는 것을 조건으로 그 장래의 조건부 채권을 양도할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":501,"text":"乙이 甲에게 전세금의 반환을 지체한 경우, 甲은 X주택의 A부분이 아니라 전부에 대하여 경매를 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":502,"text":"경매절차에서 X주택이 매각된 경우, 甲은 X주택의 전부에 대하여 후순위권리자보다 전세금을 우선 변제받을 수 없다.","chapter":"민법총칙","answer":"X"},{"id":503,"text":"甲의 채권자 丙이 甲의 전세권에 저당권을 취득한 경우, 전세권의 존속기간이 만료되 더라도 丙은 전세권 자체에 대하여 저당권을 실행할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":504,"text":"甲의 전세권이 존속하는 동안에 乙이 X주택을 丁에게 매도하고 丁명의로 소유권이전 등기를 마쳐준 경우, 乙은 전세금반환의무를 면하게 된다.","chapter":"민법총칙","answer":"O"},{"id":505,"text":"甲이 담보권실행을 통지할 때에 청산금이 없더라도 2개월의 청산기간이 지나기 전에는 가등기에 기한 본등기를 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":506,"text":"甲이 담보권실행을 통하여 우선변제 받게 되는 이자나 지연배상금 등 피담보채권의 범위는 청산금 지급 당시를 기준으로 확정된다.","chapter":"민법총칙","answer":"X"},{"id":507,"text":"甲이 담보권실행을 통지하고 2개월의 청산기간이 지난 경우, 청산금의 지급이 없더라도 乙은 대여금을 변제하고 가등기말소를 청구할 수는 없다.","chapter":"민법총칙","answer":"X"},{"id":508,"text":"甲이 주관적으로 평가한 청산금의 액수가 정당하게 평가된 청산금의 액수에 미치지 못하면 담보권실행 통지는 효력이 없다.","chapter":"민법총칙","answer":"X"},{"id":509,"text":"甲이 담보권실행을 위해 통지하여야 할 청산금의 평가액은 통지 당시의 목적부동산 가액에서 그 당시의 목적부동산에 존재하는 모든 피담보채권액을 공제한 차액이다.","chapter":"민법총칙","answer":"X"},{"id":510,"text":"乙의 승낙에는 조건을 붙일 수 있다.","chapter":"민법총칙","answer":"O"},{"id":511,"text":"乙이 이의 없이 승낙을 하더라도 특별한 사정이 없는 한 乙에게는 甲의 대여금채권의 성립이나 소멸에 영향을 미치는 사정을 丙에게 알려야 할 주의의무가 없다.","chapter":"민법총칙","answer":"O"},{"id":512,"text":"丙이 甲의 대여금채권에 양도금지특약이 있다는 사실을 알았더라도 그 후 乙이 승낙 하였다면, 채권양도는 다른 약정이 없는 한 그 성립 당시로 소급하여 유효하게 된다.","chapter":"민법총칙","answer":"X"},{"id":513,"text":"乙이 이의 없이 승낙을 하였더라도 그 때까지 발생한 乙의 甲에 대한 항변사유를 丙이 중대한 과실로 알지 못하였다면, 乙은 甲에 대한 그 항변사유로 丙에게 대항할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":514,"text":"甲의 대여금채권에 관하여 보증인 丁이 있는 경우, 다른 약정이 없는 한 丁에 대한 보증채권의 양도에 관하여 별도의 대항요건을 갖추지 않더라도 甲의 대여금채권과 함께 丁에 대한 보증채권 역시 丙에게 이전된다.","chapter":"민법총칙","answer":"O"},{"id":515,"text":"A채권의 존재뿐만 아니라 그 발생원인도 甲이 증명할 책임이 있다.","chapter":"민법총칙","answer":"X"},{"id":516,"text":"A채권은 丙에게 대항할 수 있는 권리가 아니어도 된다.","chapter":"민법총칙","answer":"O"},{"id":517,"text":"토지거래허가신청절차의 협력의무이행청구권도 A채권이 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":518,"text":"丙은 특별한 사정이 없는 한 甲에 대하여 A채권의 소멸시효가 완성되었음을 항변할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":519,"text":"丙은 甲에 대하여 A채권의 발생원인이 된 법률행위가 무효라는 사실을 주장하여 A 채권의 인정 여부를 다툴 수 있다.","chapter":"민법총칙","answer":"O"},{"id":520,"text":"채권자취소소송의 확정판결에 따라 丙 명의의 소유권이전등기가 말소 되면 乙은 소유권이전등기명의의 회복으로 X토지의 소유권을 취득한다.","chapter":"민법총칙","answer":"X"},{"id":521,"text":"甲의 대여금채권이 乙과 丙 사이의 매매계약 전에 성립되었다면 그 액수나 범위가 구체적으로 확정되지 않아도 피보전채권이 된다.","chapter":"민법총칙","answer":"O"},{"id":522,"text":"甲이 사해행위의 취소만을 먼저 구한 다음 원상회복을 나중에 청구하는 경우, 사해행위취소청구가 채권자취소권의 행사기간 내에 제기되었다면 원상회복청구는 그 기간이 지난 뒤에도 할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":523,"text":"채권자취소소송의 확정판결에 따라 丙 명의의 소유권이전등기가 말소 된 후, 乙이 회복된 소유권이전등기명의를 기화로 丁에게 X토지를 매도 하고 소유권이전등기를 마쳐준 경우, 사해행위취소와 원상회복의 효력을 받는 乙의 다른 일반채권자 戊는 丁을 상대로 소유권이전등기말소를 청구할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":524,"text":"중첩적 채무인수는 채권자와 인수인 사이의 합의가 있으면 채무자의 의사에 반해서도 할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":525,"text":"면책적 채무인수가 있는 경우, 인수채무의 소멸시효기간은 채무인수에 따라 중단되고 채무인수일로부터 새로이 진행한다.","chapter":"민법총칙","answer":"O"},{"id":526,"text":"채권자의 승낙에 의하여 채무인수의 효력이 생기는 경우, 채권자가 승낙을 거절하면 그 이후에는 채권자가 다시 승낙하여도 채무인수로서의 효력이 생기지 않는다.","chapter":"민법총칙","answer":"O"},{"id":527,"text":"면책적 채무인수에 대한 채권자의 승낙은 묵시적으로도 가능하며, 채권자가 승낙을 하지 않는 대신 직접 인수인을 상대로 인수채무의 이행을 청구하는 것도 묵시적 승낙 에 해당한다.","chapter":"민법총칙","answer":"O"},{"id":528,"text":"매수인이 매매목적물에 관한 임대차보증금반환채무를 인수하면서 그 채무액을 매매 대금에서 공제하기로 약정한 경우, 임차인의 승낙이 없으면 병존적 채무인수로 본다.","chapter":"민법총칙","answer":"X"},{"id":529,"text":"계약금의 일부만 지급된 경우, 수령자는 실제 지급된 계약금이 아니라 약정계약금의 배액을 상환하고 계약을 해제할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":530,"text":"계약당사자 일방이 채무의 이행기 전에 이미 채무의 이행에 착수하였다면 특별한 사정이 없는 한 계약당사자는 해제권을 행사할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":531,"text":"계약당사자가 계약금에 기한 해제권을 배제하기로 하는 약정을 하였다면, 각 당사자는 해제권을 행사할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":532,"text":"계약금을 수령한 매도인이 매수인에 대하여 해제권을 행사하기 위해서는 수령한 계약 금의 배액의 이행제공을 하여야 하며 매수인이 수령을 거부하는 경우, 이를 공탁하여야 한다.","chapter":"민법총칙","answer":"O"},{"id":533,"text":"토지거래허가구역 내의 토지에 관한 매매계약의 당사자가 토지거래허가신청절차의 협력의무를 이행하여 관할관청으로부터 거래허가를 받았더라도, 그러한 사정만으로 는 아직 이행의 착수가 있다고 볼 수 없다.","chapter":"민법총칙","answer":"X"},{"id":534,"text":"甲은 乙이 발송한 편지를 2018. 9. 19. 받았는데, 甲이 2018. 9. 24. 개봉하여 읽었다면 매매계약은 2018. 9. 24. 성립한다.","chapter":"민법총칙","answer":"X"},{"id":535,"text":"乙이 승낙의 의사표시를 하였으므로, 乙이 발송한 편지를 甲이 2018. 9. 25.까지 받지 못하였더라도 매매계약은 성립한다.","chapter":"민법총칙","answer":"X"},{"id":536,"text":"甲은 乙이 발송한 편지를 2018. 9. 20. 받았다면, 매매계약은 그 때부터 성립하고 효력이 발생한다.","chapter":"민법총칙","answer":"X"},{"id":537,"text":"乙이 발송한 편지가 2018. 9. 26. 甲에게 도달하였고 甲이 2018. 9. 27. 연착의 통지를 한 경우, 매매계약은 성립하지 않는다.","chapter":"민법총칙","answer":"O"},{"id":538,"text":"乙이 2018. 9. 17. 매수하겠다는 편지를 발송하기 전까지 특별한 사정이 없는 한 甲은 乙에 대하여 매각의 의사표시를 철회할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":539,"text":"근저당권 실행을 위한 경매가 무효로 된 경우, 매수인의 채무자에 대한 소유권이전등기 말소의무와 근저당권자의 매수인에 대한 배당금반환의무는 동시이행관계에 있다.","chapter":"민법총칙","answer":"X"},{"id":540,"text":"동시이행관계에 있는 쌍방의 채무 중 어느 한 채무가 이행불능이 됨으로 인하여 발생한 손해배상채무는 다른 채무와 동시이행관계에 있지 않다.","chapter":"민법총칙","answer":"X"},{"id":541,"text":"가압류등기가 있는 부동산 매매계약의 경우, 특별한 사정이 없는 한 매도인의 가압류 등기의 말소의무는 매수인의 대금지급의무와 동시이행관계에 있지 않다.","chapter":"민법총칙","answer":"X"},{"id":542,"text":"쌍방의 채무가 동시이행관계에 있는 경우, 상대방 채무의 이행제공이 없더라도 채무자가 이행기에 채무를 이행하지 않으면 이행지체의 책임을 진다.","chapter":"민법총칙","answer":"X"},{"id":543,"text":"부동산 매매계약에서 매수인이 부가가치세를 부담하기로 약정한 경우, 특별한 사정이 없는 한 부가가치세를 포함한 매매대금 전부와 부동산 소유권이전등기의무가 동시이행 관계에 있다.","chapter":"민법총칙","answer":"O"},{"id":544,"text":"계약이 합의해제된 경우, 특별한 사정이 없는 한 채무불이행으로 인한 손해배상청구는 할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":545,"text":"매도인이 매수인에게 매매계약의 합의해제를 청약하였더라도 매수인이 그 청약에 대하여 조건을 붙여 승낙한 경우, 매도인의 청약은 실효된다.","chapter":"민법총칙","answer":"O"},{"id":546,"text":"계약이 일부이행된 경우, 그 원상회복에 관하여 의사가 일치되지 않아도 계약의 묵시적 합의해제가 인정될 수 있다.","chapter":"민법총칙","answer":"X"},{"id":547,"text":"매매계약을 합의해제한 후 그 합의해제를 무효화시키고, 해제된 매매계약을 부활시키는 약정은 적어도 당사자 사이에서는 가능하다.","chapter":"민법총칙","answer":"O"},{"id":548,"text":"당사자 사이에 약정이 없는 이상 합의해지로 인하여 반환할 금전에 그 받은 날로부터 이자를 붙여서 반환할 의무는 없다.","chapter":"민법총칙","answer":"O"},{"id":549,"text":"甲은 丙에게 X토지의 반환을 청구할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":550,"text":"甲은 乙에 대한 임대차계약상의 차임청구권을 상실한다.","chapter":"민법총칙","answer":"X"},{"id":551,"text":"甲과 乙 사이의 임대차계약은 무단전대를 이유로 甲의 해지의 의사표시가 없더라도 해지의 효력이 발생한다.","chapter":"민법총칙","answer":"X"},{"id":552,"text":"임대차 및 전대차기간 만료시에 丙이 신축한 건물이 X토지에 현존하고 甲이 임대차 계약의 갱신을 거절한 경우, 丙은 甲에게 건물매수를 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":553,"text":"甲과 乙 사이의 임대차계약이 존속하더라도 甲은 X토지의 불법점유를 이유로 丙에게 차임상당의 부당이득반환을 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":554,"text":"부작위채권은 권리의 불행사가 있을 수 없으므로 소멸시효의 대상이 되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":555,"text":"주채무자가 시효완성의 이익을 포기한 경우 보증인은 주채무의 시효소멸을 원용 할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":556,"text":"“시효의 중단은 당사자 및 그 승계인 간에만 효력이 있다”는 규정(민법 제169조) 에서 ‘승계인’에는 특정승계인이 포함되지 아니한다.","chapter":"민법총칙","answer":"X"},{"id":557,"text":"기한을 정하지 않은 채권의 소멸시효의 기산점은 채권이 발생된 때가 아니라 이 행청구를 받은 때이다.","chapter":"민법총칙","answer":"X"},{"id":558,"text":"단기 소멸시효에 걸리는 채권이라도 판결에 의하여 확정되면 그 소멸시효기간은 10년이다.","chapter":"민법총칙","answer":"O"},{"id":559,"text":"법률행위가 무효임을 알고 당사자가 추인한 때에는 새로운 법률행위로 추정한다.","chapter":"민법총칙","answer":"X"},{"id":560,"text":"취소할 수 있는 법률행위의 상대방이 확정된 경우에는 그 취소는 그 상대방에 대한 의사표시로 하여야 한다.","chapter":"민법총칙","answer":"O"},{"id":561,"text":"취소권은 법률행위를 추인할 수 있는 날로부터 5년 뒤에도 소멸하지 않는다.","chapter":"민법총칙","answer":"X"},{"id":562,"text":"폭리행위는 그 무효원인이 해소되지 않았더라도 당사자의 추인이 있으면 유효로 될 수 있다.","chapter":"민법총칙","answer":"X"},{"id":563,"text":"미성년을 이유로 취소할 수 있다는 사실을 알고 법정대리인의 동의 없이 법률행 위를 한 미성년자가 그 법률행위를 적법하게 취소한 경우, 미성년자는 그 행위 로 받은 이익에 이자를 붙여서 반환하여야 한다.","chapter":"민법총칙","answer":"X"},{"id":564,"text":"온천에 관한 권리는 관습법상의 물권이나 준물권이라고 볼 수 없다.","chapter":"민법총칙","answer":"X"},{"id":565,"text":"관습법은 사회의 거듭된 관행과 법적 확신이 없어도 성립된다.","chapter":"민법총칙","answer":"X"},{"id":566,"text":"관습은 당사자의 주장ㆍ입증을 기다림이 없이 법원이 직권으로 이를 확정하여야 한다.","chapter":"민법총칙","answer":"X"},{"id":567,"text":"공동선조와 성과 본을 같이하는 후손이면 미성년자라도 성별의 구별 없이 당연 히 종중의 구성원이 된다.","chapter":"민법총칙","answer":"O"},{"id":568,"text":"관습법이 사회생활규범으로 승인되었다면 사회를 지배하는 기본적 이념이나 사 회질서의 변화로 인하여 그 관습법을 적용하여야 할 시점에 있어서의 전체 법질 서에 부합하지 않게 되었더라도 그 법규범으로서의 효력이 인정된다.","chapter":"민법총칙","answer":"X"},{"id":569,"text":"미성년자는 임의대리인이 될 수 없다.","chapter":"민법총칙","answer":"X"},{"id":570,"text":"법정대리인이 미성년자에게 영업을 허락한 후 그 허락을 취소한 경우에 미성년 자는 그 영업허락의 취소 전에 그 영업을 위하여 한 상품주문행위를 미성년임을 이유로 취소할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":571,"text":"미성년자가 법정대리인의 동의 없이 법률행위를 한 경우에 법정대리인의 취소권 이 기간경과로 소멸되지 않는 한, 미성년자는 성년이 되기 전까지만 취소할 수 있고 성년이 된 후에는 취소할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":572,"text":"甲이 乙과 계약을 체결할 당시 乙이 미성년자임을 알고 계약했더라도 甲은 철회 권을 행사할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":573,"text":"미성년자가 법정대리인의 동의 없이 법률행위를 하면서 특약에 의하여 미성년을 이유로 한 취소를 하지 않기로 한 경우에는 미성년을 이유로 그 법률행위를 취 소할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":574,"text":"도박자금에 제공할 목적으로 금전을 대차한 때에 그 대차계약으로 인한 금전의 반환을 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":575,"text":"반사회질서행위의 무효는 이를 주장할 이익이 있는 자라면 누구든지 그 무효를 주장할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":576,"text":"법률행위의 성립과정에 강박이라는 불법적 방법이 사용된 데에 불과한 때에는 반사회질서행위로서 무효라고 할 수는 없다.","chapter":"민법총칙","answer":"O"},{"id":577,"text":"본처가 남편의 과거 부첩(夫妾)관계를 용서한 때에는 그것이 손해배상청구권의 포기라고 해석되는 한 그대로의 법적 효력이 인정될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":578,"text":"법률행위가 반사회질서행위로 무효인지 여부는 그 효력이 발생한 때를 기준으로 판단하여야 한다.","chapter":"민법총칙","answer":"X"},{"id":579,"text":"乙이 丙을 기망한 경우, 丙은 의사표시를 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":580,"text":"丙이 乙을 기망한 경우, 甲은 의사표시를 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":581,"text":"丙이 乙을 기망한 경우, 乙은 의사표시를 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":582,"text":"권리능력 없는 사단의 구성원은 그가 사단의 대표자이거나 사원총회의 결의를 거 쳤다 하더라도 그 사단의 재산에 관한 제3자와의 소송에서 당사자가 될 수 없다.","chapter":"민법총칙","answer":"X"},{"id":583,"text":"권리능력 없는 사단의 사원이 집합체로서 물건을 소유한 경우에는 합유로 한다.","chapter":"민법총칙","answer":"O"},{"id":584,"text":"권리능력 없는 사단에 구성원이 없게 되었다면 그 사단은 바로 소멸하여 소송상 의 당사자능력을 상실한다.","chapter":"민법총칙","answer":"X"},{"id":585,"text":"권리능력 없는 사단의 대표자는 필요한 경우에 자신의 업무를 타인에게 포괄적 으로 위임할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":586,"text":"권리능력 없는 사단의 사원의 지위는 규약에 의해서라도 양도나 상속될 수 없다.","chapter":"민법총칙","answer":"X"},{"id":587,"text":"회사의 이사가 채무액과 변제기가 특정되어 있는 회사 채무를 보증한 경우에는 이사직 사임이라는 사정변경을 이유로 일방적으로 보증계약 을 해지할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":588,"text":"공무원의 불법행위에 따른 국가배상청구권의 소멸시효 기간이 지났으 나 국가가 소멸시효 완성을 주장하는 것이 신의성실의 원칙에 반하는 권리남용으로 허용될 수 없어 배상책임을 이행한 경우, 국가가 사건의 은폐ㆍ조작 등 권리남용에 해당하게 된 원인행위를 적극적으로 주도한 공무원에게 구상권을 행사하는 것은 신의칙상 허용되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":589,"text":"주식회사 대표이사의 대표권 남용행위의 상대방이 그와 같은 사정을 알았던 경우에 회사는 상대방의 악의를 증명하여 행위의 효과를 부인 할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":590,"text":"재산권의 거래계약에 있어서 일방 당사자에게 상대방에 대한 고지의무 가 인정되는 경우에는 상대방이 고지의무의 대상이 되는 사실을 이미 알고 있는 때에도 여전히 고지의무를 부담한다.","chapter":"민법총칙","answer":"X"},{"id":591,"text":"부동산 거래에 있어 거래 상대방이 일정한 사정에 관한 고지를 받았더 라면 그 거래를 하지 않았을 것임이 경험칙상 명백한 경우에는 신의성 실의 원칙상 사전에 상대방에게 그와 같은 사정을 고지할 의무가 있 다.","chapter":"민법총칙","answer":"O"},{"id":592,"text":"법인의 정관에 법인 대표권의 제한에 관한 규정이 있다면, 그러한 취지가 등기되 어 있지 않은 경우에도 법인은 그 제한으로써 악의의 제3자에게 대항할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":593,"text":"법인의 정관에 이사의 해임사유에 관한 규정이 있는 경우에는 이사의 중대한 의무 위반이 있더라도 법인은 정관에서 정하지 아니한 사유로 이사를 해임할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":594,"text":"법인과 이사의 법률관계는 신뢰를 기초로 한 위임 유사의 관계이고, 위임계약은 원래 해지의 자유가 인정되어 쌍방 누구나 정당한 이유 없이도 언제든지 해지할 수 있으며, 다만 불리한 시기에 부득이한 사유 없이 해지한 경우에 한하여 상대 방에게 그로 인한 손해배상책임을 부담할 뿐이다.","chapter":"민법총칙","answer":"X"},{"id":595,"text":"이사의 임기가 만료되었더라도 아직 임기가 만료되지 아니한 다른 이사 들로 법 인이 정상적인 활동을 할 수 있는 경우에는 임기만료된 이사로 하여금 이사로서 직무를 행사하게 할 필요가 없고, 법인의 정상적인 활동이 가능한지 여부는 이 사의 임기만료시뿐만 아니라 이후의 사정까지도 종합적으로 고 려하여 판단하여 야 한다.","chapter":"민법총칙","answer":"O"},{"id":596,"text":"대표권 없는 이사도 법인의 기관이므로 그의 행위로 인하여 민법 제35조 소정의 법인의 불법행위가 성립할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":597,"text":"의사능력이 란 자신의 행위의 의미나 결과를 정상적인 인식력과 예기력을 바탕으 로 합리적으로 판단할 수 있는 정신적 능력 내지 지능을 말한다.","chapter":"민법총칙","answer":"O"},{"id":598,"text":"의사능력의 유무는 구체적인 법률행위와 관련하여 개별적으로 판단되어야 한다.","chapter":"민법총칙","answer":"O"},{"id":599,"text":"미성년자가 의사무능력 상태에서 법정대리인의 동의 없이 법률행위를 한 경우, 법정대리인은 미성년을 이유로 법률행위를 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":600,"text":"어떤 법률행위에 그 일상적인 의미만을 이해하여서는 알기 어려운 특별한 법률 적인 의미나 효과가 부여되어 있는 경우에도 의사능력이 인정되기 위하여 그 행 위의 일상적인 의미에 대한 이해만으로 족하고 법률적인 의미나 효과에 대한 이 해는 요구되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":601,"text":"의사무능력자의 법률행위에 있어서는 그 행위의 무효를 주장하는 자가 의사능력 이 없었 음을 증명하여야 한다.","chapter":"민법총칙","answer":"O"},{"id":602,"text":"복대리인은 대리인의 대리인이다.","chapter":"민법총칙","answer":"X"},{"id":603,"text":"임의대리인은 그 책임으로 언제든지 복대리인을 선임할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":604,"text":"대리인이 대리권 소멸 후 선임한 복대리인과 상대방 사이의 법률행위에도 상대 방이 대리권 소멸 사실을 알지 못하여 복대리인에게 적법한 대리권이 있는 것으 로 믿었고 그와 같이 믿은 데 과실이 없다면, 대리권소멸 후의 표현대리(민법 제 129조)가 성립할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":605,"text":"법정대리인이 부득이한 사유로 복대리인을 선임한 경우에는 그 부적임 또는 불 성실함을 알고 본인에 대한 통지나 그 해임을 태만한 때가 아니면 책임이 없다.","chapter":"민법총칙","answer":"X"},{"id":606,"text":"대리인의 사망으로 대리권이 소멸한 경우에도 복대리권은 소멸하지 않는다.","chapter":"민법총칙","answer":"X"},{"id":607,"text":"취득시효 완성 후 등기 경료 전에 그 부동산이 제3자에게 명의신탁된 경우, 점 유자는 시효완성을 이유로 그 제3자의 소유권 행사를 저지할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":608,"text":"취득시효 기간의 계산에 있어 시효기간 동 안 소유자에 변경이 없는 경우에는 그 기산점을 어디에 두던지 간에 취득시효 완성을 주장할 수 있는 시점에서 보아 그 기간이 경과된 사실이 확정되면 된다.","chapter":"민법총칙","answer":"O"},{"id":609,"text":"甲의 취득시효 완성 당시 미등기로 남아 있 던 토지의 소유자가 취득시효 완성 후에 그 명의로 소유권보존등기를 마쳤다면, 甲은 토지소유자에 대하여 취득시 효의 완성을 주장할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":610,"text":"국유재산이 일반재산이던 당시에 취득시효가 완성되었다면 그 후 행정재산으로 되었다고 하더라도 시효취득을 원인으로 하는 소유권이전등기를 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":611,"text":"점유자가 취득시효기간이 경과한 후 소유자와의 분쟁을 간편하게 해결하기 위하 여 상대방에게 매수제의를 하였다면, 점유자의 점유는 타주점유로 전환된다.","chapter":"민법총칙","answer":"X"},{"id":612,"text":"甲이 丙에게 한 처분행위는 특별한 사정이 없는 한 무효이다.","chapter":"민법총칙","answer":"X"},{"id":613,"text":"乙의 甲에 대한 본등기청구권은 乙의 가등기가 존속하는 동안 소멸시효에 걸리 지 않는다.","chapter":"민법총칙","answer":"X"},{"id":614,"text":"乙이 甲에게 본등기를 청구하여 乙 명의로 본등기가 이루어지면, 丙의 등기는 말 직권 소된다.","chapter":"민법총칙","answer":"O"},{"id":615,"text":"乙이 가등기에 기한 본등기를 하면, 乙의 소유권취득의 효력은 가등기를 한 때 급 로 소 한다.","chapter":"민법총칙","answer":"X"},{"id":616,"text":"丙 명의의 소유권이전등기가 원인무효라면 가등기권리자인 乙이 직접 그 말소를 구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":617,"text":"甲 소유의 동산을 乙이 丙 에게 양도하고 이 다시 丙 에게 양도한 경우, 만약 丁 丙의 선의취득이 인정된다면 丁 의 선의취득 여부는 문제되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":618,"text":"반환청구권의 양도에 의한 소유권의 양도의 경우에는 대항요건을 갖추었더라도 선의취득이 인정되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":619,"text":"甲이 자신의 소유 동산을 乙에게 매 도하여 인도하고, 乙이 다시 에게 도하 丙 매 여 인도한 경우, 甲과 乙의 매매 가 사회질서에 반하여 무효라면 은 선의, 무과 丙 실이더라도 선의취득할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":620,"text":"점유보조자가 횡령한 물건은 민법 제250조(도품, 유실물에 대한 특례)의 도품에 해당한다.","chapter":"민법총칙","answer":"X"},{"id":621,"text":"甲 소유 동산을 점유하는 乙이 에게 丙 도함과 동시에 매 으로부터 임차하기로 丙 약정한 경우 은丙 현 실인도를 받기 전이라도 그 동산을 선의취득할 수 있다.
