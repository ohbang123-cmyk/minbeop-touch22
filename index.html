<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>민법·특허법·상표법 O/X</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{max-width:780px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:#f4f6f9ee;backdrop-filter:blur(12px);padding:12px 14px;border-bottom:1px solid #e5e7eb}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:19px;font-weight:850}.homebtn{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px}
.progress{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:9px}.progress>i{display:block;height:100%;background:#111827;width:0}
main{padding:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #00000008}.btn{border:0;border-radius:13px;padding:13px;background:#eef1f5;font-weight:800;font-size:14px}.back{background:#fff;border:1px solid #e5e7eb}.subjectgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.subject{min-height:90px;text-align:left}.subject b{display:block;font-size:17px}.subject small{display:block;color:#6b7280;font-size:11px;margin-top:6px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wrong{background:#fff0f3;color:#9f1239}.chapters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chapter{text-align:left;border:1px solid #e5e7eb;background:#fff;border-radius:13px;padding:12px}.chapter b{font-size:13px}.chapter small{display:block;color:#6b7280;font-size:11px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8fafc;border-radius:13px;padding:11px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:#6b7280}
.meta{display:flex;justify-content:space-between;color:#6b7280;font-size:12px;margin-bottom:9px}.q{font-size:19px;line-height:1.7;font-weight:750;white-space:pre-wrap;word-break:keep-all}.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.ox button{height:70px;background:#fff;border:2px solid #e5e7eb;border-radius:15px;font-size:28px;font-weight:900}.feedback{margin-top:14px;padding:14px;border-radius:14px;line-height:1.55}.good{background:#ecfdf5;color:#065f46}.bad{background:#fff1f2;color:#9f1239}.ex{margin-top:7px;color:#374151;font-size:14px}.next{width:100%;margin-top:12px;padding:14px;border:0;border-radius:13px;background:#111827;color:white;font-weight:800}
@media(max-width:560px){.subjectgrid{grid-template-columns:1fr}.chapters{grid-template-columns:1fr}.actions{grid-template-columns:repeat(3,1fr)}.q{font-size:18px}}
</style></head><body><div class="app"><header><div class="top"><div class="brand">⚖️ 민법 · 특허법 · 상표법 O/X</div><button class="homebtn" onclick="home()">처음으로</button></div><div class="progress"><i id="bar"></i></div></header><main id="app"></main></div>
<script>
let D={},S={sub:'',mode:'',chapter:'',queue:[],i:0,locked:false,pool:'',stats:JSON.parse(localStorage.getItem('ox_stats_final3')||'{}'),seen:JSON.parse(localStorage.getItem('ox_seen_final3')||'{}')};
const CH={민법:['민법총칙','채권총론','채권각론','물권법'],특허법:['특허절차','특허요건 및 특허출원','특허권 및 실시권','특허심판·소송','국제출원(PCT)','실용신안','특허침해'],상표법:['상표의 개념·사용·식별력','상표등록요건·출원·심사·등록','상표권·사용권·이전·질권·소멸','상표권 효력·침해·손해배상·보상','상표심판·소송·재심·권리범위','국제상표등록·마드리드·조약우선권','단체표장·지리적표시·증명표장·업무표장·특수표장']};
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function data(){return S.sub==='민법'?D.civil:S.sub==='특허법'?D.patent:D.trademark} function K(q){return S.sub+'_'+q.id} function save(){localStorage.setItem('ox_stats_final3',JSON.stringify(S.stats));localStorage.setItem('ox_seen_final3',JSON.stringify(S.seen))}
function wc(sub,ch=''){let a=sub==='민법'?D.civil:sub==='특허법'?D.patent:D.trademark;return a.filter(q=>(!ch||q.chapter===ch)&&(S.stats[sub+'_'+q.id]?.w||0)>0).length}
function totalA(){return Object.values(S.stats).reduce((a,x)=>a+(x.a||0),0)} function totalW(){return Object.values(S.stats).reduce((a,x)=>a+(x.w||0),0)}
function home(){bar.style.width='0%';app.innerHTML=`<div class="card"><h2>과목 선택</h2><div class="subjectgrid"><button class="btn subject" onclick="selectSub('민법')"><b>민법</b><small>1,347개 · 4대단원</small></button><button class="btn subject" onclick="selectSub('특허법')"><b>특허법</b><small>646개 · 7대단원</small></button><button class="btn subject" onclick="selectSub('상표법')"><b>상표법</b><small>493개 · 7대단원</small></button></div></div><div class="card"><h2>전체 통계</h2><div class="stats"><div class="stat"><b>${totalA()}</b><span>풀이</span></div><div class="stat"><b>${totalW()}</b><span>오답</span></div><div class="stat"><b>${totalA()?Math.round((totalA()-totalW())/totalA()*100):0}%</b><span>정답률</span></div></div></div>`}
function selectSub(s){S.sub=s;let a=data();app.innerHTML=`<button class="btn back" onclick="home()">← 과목 선택</button><div class="card"><h2>${s}</h2><div class="actions"><button class="btn" onclick="start('all')">전체</button><button class="btn" onclick="start('random')">랜덤</button><button class="btn wrong" onclick="start('wrong')">오답만 (${wc(s)})</button></div><h3>대단원</h3><div class="chapters">${CH[s].map((c,i)=>`<button class="chapter" onclick='start("chapter",${JSON.stringify(c)})'><b>${i+1}. ${E(c)}</b><small>${a.filter(q=>q.chapter===c).length}문제 · 오답 ${wc(s,c)}개</small></button>`).join('')}</div></div>`}
function start(mode,ch=''){S.mode=mode;S.chapter=ch;let a=data().slice();if(ch)a=a.filter(q=>q.chapter===ch);if(mode==='wrong')a=a.filter(q=>(S.stats[K(q)]?.w||0)>0);if(!a.length){alert('해당 조건의 문제가 없습니다.');return}let pool=S.sub+'|'+(ch||'ALL')+'|'+mode;let seen=S.seen[pool]||[];let rem=a.filter(q=>!seen.includes(q.id));if(!rem.length){seen=[];rem=a.slice();S.seen[pool]=[]}rem.sort(()=>Math.random()-.5);S.queue=rem;S.i=0;S.pool=pool;S.locked=false;render()}
function render(){let q=S.queue[S.i];bar.style.width=((S.i+1)/S.queue.length*100)+'%';app.innerHTML=`<button class="btn back" onclick="selectSub('${S.sub}')">← ${S.sub}</button><div class="card"><div class="meta"><span>${S.i+1} / ${S.queue.length}</span><span>${E(q.chapter)}</span></div><div class="q">${E(q.text)}</div><div class="ox"><button onclick="answer('O')">O</button><button onclick="answer('X')">X</button></div><div id="fb"></div></div>`}
function answer(v){if(S.locked)return;S.locked=true;let q=S.queue[S.i],k=K(q),s=S.stats[k]||{a:0,w:0};s.a++;let ok=v===q.answer;if(!ok)s.w++;S.stats[k]=s;let seen=S.seen[S.pool]||[];if(!seen.includes(q.id))seen.push(q.id);S.seen[S.pool]=seen;save();let f=document.getElementById('fb');f.className='feedback '+(ok?'good':'bad');f.innerHTML=`<b>${ok?'✅ 정답':'❌ 오답'}</b><div>정답: <b>${q.answer}</b></div>${q.explanation?`<div class="ex">${E(q.explanation)}</div>`:''}<button class="next" onclick="next()">다음 문제</button>`}
function next(){if(S.i+1<S.queue.length){S.i++;S.locked=false;render()}else{alert('한 바퀴 완료했습니다.');selectSub(S.sub)}}
Promise.all([fetch('data/civil.json').then(r=>r.json()),fetch('data/patent.json').then(r=>r.json()),fetch('data/trademark.json').then(r=>r.json())]).then(([c,p,t])=>{D={civil:c,patent:p,trademark:t};home()}).catch(()=>app.innerHTML='<div class="card">데이터 로딩 오류. data 폴더가 함께 업로드되었는지 확인하세요.</div>');
</script></main></body></html>
