사용권자가 지정상품에 등록상 표를 사용함으로써 수요자에게 상품의 품질을 오인하게 한 경우에는 상표등록이 취소 된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":398,"text":"공유인 상표권의 상표권자에 대하여 상표등록의 취소심판을 청구할 경우에는 공유자 모두를 피청구인으로 청구하여야 한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":399,"text":"상표권자ㆍ전용사용권자 또는 통상사용권자 중 어느 누구도 정당한 이유 없이 등록상 표를 그 지정상품에 대하여 취소심판청구일 전 계속하여 2년 이상 국내에서 사용하고 있지 아니한 경우에는 상표권자는 취소심판청구와 관계되는 지정상품에 관한 상표등 록의 취소를 면할 수 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":400,"text":"등록상표의 지정상품이 둘 이상인 경우에는 지정상품마다 해당 등록상표에 대한 상표 등록의 무효심판을 청구할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":401,"text":"선출원에 의한 타인의 등록상표와 유사한 상표로서 그 지정상품과 유사한 상품에 사 용하는 상표에 해당하는 것을 이유로 한 상표등록의 무효심판은 상표등록일부터 5년 의 제척기간 내에 청구하여야 한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":402,"text":"일반인의 통상적인 도덕관념인 선량한 풍속에 어긋나는 등 공공의 질서를 해칠 우려 가 있는 상표에 해당하는 것을 이유로 한 상표등록의 무효심판은 상표등록일부터 5년 의 제척기간 내에 청구하여야 한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":403,"text":"타인의 상품을 표시하는 것이라고 수요자들에게 널리 인식되어 있는 상표와 유사한 상표로서 그 타인의 상품과 유사한 상품에 사용하는 상표에 해당하는 것을 이유로 한 상표등록의 무효심판은 상표등록일부터 5년의 제척기간 내에 청구하여야 한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":404,"text":"심판장은 상표등록의 무효심판이 청구된 경우에는 그 취지를 해당 상표권의 전용사용 권자와 그 밖에 상표에 관한 권리를 등록한 자에게 통지하여야 한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":405,"text":"당사자는 확정된 심결에 대하여 재심을 청구할 수 있으며, 재심청구는 일반재심 사유와 사해심결에 관한 재심사유로 나 눌 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":406,"text":"재심의 심리는 재심청구이유의 범위 내에서 하여야 한다. 따라서 심판관은 당사 자가 주장한 사항에 대해서만 심리하여야 한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":407,"text":"대리권의 흠결을 이유로 하여 재심을 청구하는 경우에 재심청구기간은 청구인 또는 법정대리인이 심결 등본의 송달에 의하여 심결이 있은 것을 안 날로부터 기산한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":408,"text":"심판에 대한 재심의 절차에 관하여는 그 성질에 반하지 아니하는 범위에서 심판 의 절차에 관한 규정을 준용한다. 표","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":409,"text":"상 등록이 취소된 후 재심에 의하여 그 효력이 회복된 경우 상 권의 효력은 해 표 표 善意)로 해당 등록상표 당 심결이 확정된 후 그 회복된 상 권의 등록 전에 선의( 와 같은 상표를 그 지정상품과 같은 상품에 사용한 행위에는 미치지 아니한다. 치상표에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":410,"text":"제척기간(상표법 제122조) 경과 전에 특정한 선등록상표(X)에 근거하여 상표법 제34조(상표등록을 받을 수 없는 상표)제1항제7호를 이유로 한 등록무효심판을 청구한 경우라면, 제척기간 경과 후에 그 심판절차에서 새로운 선등록상표(X')에 근거하여 등록무효를 주장하는 것도 허용된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":411,"text":"상표권자가 상표법 제119조제1항제2호(사용권자의 부정사용으로 인한 취소)단서 에서 요구되는 '상당한 주의를 하였다'고 하기 위해서는 사용권자에게 오인ㆍ혼동 행위를 하지 말라는 주의나 경고를 한 정도로는 부족하지만, 그렇다고 사용권자 를 실질적인 지배하에 둘 정도의 주의가 요구되는 것은 아니다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":412,"text":"복수의 유사상표를 사용하다가 그 중 일부만 등록한 상표권자가 미등록의 사용상표 를 계속 사용하여, 그것이 등록상표만 사용한 경우에 비하여 수요자가 상품 출처 를 오인ㆍ혼동할 우려가 더 커지게 되더라도 상표법 제119조제1항제1호(부정사용 에 의한 취소)에 규정된 등록상표와 유사한 상표의 사용으로 볼 수는 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":413,"text":"등록상표의 일부 지정상품에 대한 취소심판절차에서 상표법 제119조제1항제3호 (불사용에 의한 취소)의 상표등록 취소사유를 주장하였다가 그 후의 심결취소소송 절차에서 상표법 제119조제1항제1호(부정사용에 의한 취소)의 상표등록 취소사 유를 추가로 주장할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":414,"text":"거절결정불복심판청구를 기각하는 심결의 취소소송 계속 중에 출원인이 당해 상표출 원을 취하한 경우 비록 출원에 대한 거절결정을 유지하는 심결이 있었다 하더라도 그 심결의 취소를 구할 이익이 없으므로 심결취소의 소는 부적법하게 된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":415,"text":"乙이 상표등록출원시 X'상표의 사용 및 등록에 대하여 甲의 승낙을 얻지 않고 출원하였으므로 상표법 제34조(상표등록을 받을 수 없는 상표)제1항제6호의 명백 한 무효사유를 가지고 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":416,"text":"乙의 지정상품 b가 甲의 영업 a와 밀접한 관계에 있는 경우라도 상호와 상표는 별개이므로 甲은 乙의 등록상표 X'에 대하여 상표법 제34조제1항제9호를 무효사유 로 주장할 수 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":417,"text":"권리범위 확인심판에서 甲이 자신의 상호 사용이 상표법 제90조제1항제1호의 '상표권의 효력이 미치지 아니하는 경우'에 해당한다고 주장하더라도 이는 특허 심판원의 판단사항이 아니다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":418,"text":"권리범위 확인심판에서 甲이 표장의 동일ㆍ유사여부 등 다른 주장은 하지 아니 하고 오로지 자신이 상표법 제99조제2항의 '선사용에 따른 상표를 계속 사용할 권리'를 가지고 있다는 것만을 주장할 경우 특허심판원은 甲의 청구를 각하하는 심결을 하여야 한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":419,"text":"乙의 상표등록 후 甲과 乙간에 '甲이 상호X와 동일한 표장을 b상품에 대하여 상표 등록출원하고, X상표등록출원에 대한 등록여부결정시까지 乙이 자신의 상표권을 포기 한다'는 합의에 따라 포기등록이 이루어지더라도 甲의 출원은 등록받을 수 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":420,"text":"상표등록출원 시 우선권 주장을 하지 않았더라도 우선권 주장 기간 내에 출원한 경우에는 추후 출원서를 보정하여 우선권 주장을 할 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":421,"text":"동맹국에서 정식으로 수리되어 출원일이 부여된 정규 출원은 출원이 취하된 경우에도 우선권 주장의 기초 출원이 될 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":422,"text":"국제상표등록출원의 출원인이 우선권 주장을 하는 경우에는 지식재산처장 에게 우선권 증명서류를 제출하지 아니하더라도 우선권 주장은 효력을 상실하지 아니한다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":423,"text":"우선권 주장을 수반한 상표등록출원을 기초로 하여 분할출원하는 경우 우선권이 인정되기 위해서는 분할출원시 별도로 우선권 주장을 해야 한다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":424,"text":"국제상 등록출원이 거절결정된 경우 출원인은 재심사를 청구하거나 거절결정 불복심판을 청구하여불복할 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":425,"text":"국제상표등록출원의 승계는 출원인이 국제사무국에 명의변경 신고를 하지 아니하면 그 효력이 발생하지 아니한다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":426,"text":"심사관은 상 표등록결정을 한 국제상표등록출원에 대하여 명백한 거절이유를 발견한 경우에는 직권으로 상표등록결정을 취소하고 그 국제상표등록출원을 다시 심사할 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":427,"text":"국제상표등록출원인은 상표법 제58조(손실보상청구권)에 따른 손실보상청구권의 발생을 위하여 국제상표등록출원에 관한 상표 및 지정상품과 동일한 상표 및 상품을 사용하는 자에게 출원공고 전이라도 해당 상표등록출원의 사본을 제시하며 서면으로 경고할 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":428,"text":"국제상 표등록출원인이 거절이유에 대한 의견서 제출 기간 내에 의견서를 제출하지 못한 경우 의견서 제출 기간 만료일부터 2개월 내에 상표에 관한 절차를 계속 진행할 것을 신청하고 거절이유에 대한 의견서를 제출할 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":429,"text":"마드리드 의정서에 의한 국제출원(지리적 표시 단체표장을 포함)은 기초출원이나 기 초등록된 상표견본을 기초로 출원을 해야 하고, 상표의 부기적(附記的)인 부분의 삭제 에 해당되는 경우에는 지정국에서 상표 견본의 보정이 허용된다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":430,"text":"국제상표등록출원에 대해서는 업무표장에 관한 규정을 적용하지 아니한다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":431,"text":"마드리드 의정서에 의한 국제상표등록출원을 통해 지리적 표시 단체표장 및 지리적 표시 증명표장의 등록을 받고자 하는 자는 국제등록일(사후지정의 경우에는 사후지정 일) 또는 보정통지를 받은 날로부터 3개월 이내에 그 취지를 기재한 서류와 지리적 표시의 정의에 합치함을 입증할 수 있는 서류를 정관 또는 규약과 함께 제출하여야 한다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":432,"text":"국제출원서와 그 출원에 필요한 서류는 특허청장에게 도달한 날부터 그 효력이 발생 하며, 우편으로 제출된 경우에도 예외 없이 동일하다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":433,"text":"국제등록의 명의인은 국제등록된 지정국을 추가로 지정하려는 경우에는 산업통상자원 부령으로 정하는 바에 따라 특허청장에게 사후지정을 신청할 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":434,"text":"국내 에서 영리를목적 으로 하지 / 아니 하는 업무를 하는 자는 국제 상표 등록 출원 으로 자 기의업무표장울 등록 받을 4 있 다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":435,"text":"국제 상표 등록 출원 을 (하려는 자가 상표 의부기적 ( 빠 8369) 인 PES 삭제한경우 에는 상표 등록 출원 의요지를변경한 것으로 볼수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":436,"text":"국제 상표 등록 출원 을 하려는 자가 상표 등록 출원 을한 경우 증명표장 등록 출원 으로 변경 할수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":437,"text":"국계 상표 륭목 출원 을 하려는 자가 E 이상의 상품 을지정 상품 으로 하여 상표 등록 출원 을한 경우 일정 기간 내에 E 이상의 상표 등록 출원 으로 분할할수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":438,"text":"국제 상표 등록 출원 을 하려는 자가 파리협약에 따른 우선권 주장을한경우 에는 최초로 출원 한국가의정부가인정 하는 상표 등록 출원 의연월일을 적은 서면, 상표 및지정상 품의 등본을 3 개월 이내에 특허 청장 에게 제출 하여야 한다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":439,"text":"국제 상표 등록 출원 의기초가 되는 국제 등록 의 전부 또는 일부가소멸된경우 에는 그 소멸된범위 에서 해당 국제 상표 등록 출원 은지정 상품 의 전부 또는 일부에 대하여 취하 된 것으로 본다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":440,"text":"국제 등록 명의인은국제 등록 된지정국을추가로지정 하는 사후지정을 신청할 수 있고, 이 경우 국제 등록 된지정 상품 의 전부 또는 일부에 대하여 사후지정을할수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":441,"text":"국제 출원 은본국관청에 계속 중인 기초 출원 또는 기초 등록 을기초로 하여 출원 하여야 한다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":442,"text":"국제 등록 은기초 출원 ( 등록 ) 에종속적 이므로 기초 출원 일로 부터 5 년이경과 하기 전까지 기초 출원 ( 등록 ) 이실효 되면 취소 된다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":443,"text":"국제 출원 서와그 출원 에 필요한 ARE 특허 청장 에게 도달한날 부터 그효력이 발생 하며, 우편 으로 제출된경우 에도 또한 같다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":444,"text":"무역관련지적재산권에 관한 협정(TRIPS)상 상표 불사용으로 인하여 상표등록을 취소하기 위한 계속적인 불사용의 최소기간은 3년이다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":445,"text":"국내에 영업소가 없는 외국인은 그 외국인이 속하는 국가에서 우리나라 국민에게 그 국민과 같은 조건으로 상표권을 인정하는 경우 상표권 또는 상표에 관한 권리를 누릴 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":446,"text":"국내에 주소가 없는 외국인은 우리나라가 그 외국인에 대하여 상표권 또는 상표에 관한 권리를 인정하고, 그 외국인이 속하는 국가에서도 대한민국 국민에게 같은 조건으로 권리를 인정하는 경우 상표권 등을 누릴 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":447,"text":"국내에 주소가 없는 외국인은 우리나라와 그 외국인이 속하는 국가 사이에 체결된 자유무역협정에서 상표권 또는 상표에 관한 권리를 인정하는 경우 상표권 등을 누릴 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":448,"text":"TRIPS 협정은 상표권의 강제사용권을 각 국가가 자율적으로 결정하도록 하고 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":449,"text":"상 법 제11 조제1항각호의 사유에 의하여 상 표등록을 취소한다는 심결이 확정 표 되었을 경우 그 상 권은 그때부터 소멸된다. 표 9","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":450,"text":"상 법 제11 조제1항제3호의 불사용을 이유로 하는 상 등록취소심판에 있어 지 표 정상 이 품 둘 품 이상 있는 경우 일부 지정상 에 관하여 청구할 수는 있지만 유사 품 범위에 속하는 지정상 은 모두 포함하여 청구하여야 한다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":451,"text":"상표법 제119조제1항제2호의 부정사용을 이유로 하는 상표등록취소심판에서 상 표권자가 등록상표를 사용한 것인지 아니면 그와 유사한 상표를 사용한 것인지 에 관한 판단기준은 상표법 제119조제1항제3호의 불사용을 이유로 하는 상표등 록취소심판에서의 상표 동일성 판단기준과 동일하다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":452,"text":"상표법 제119조제1항제3호의 불사용을 이유로 하는 상표등록취소심판은 누구든 지 청구할 수 있지만, 등록상표권의 침해자가 청구하는 것은 부당한 이익을 얻 기 위한 것이므로 침해자에 의한 등록취소심판청구는 심판청구권의 남용에 해당 하여 부적법하다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":453,"text":"불사용의 상 가 상당기간 태 계 표 속된 등록상 의 이전이 있는 경우, 상 법 제11 표 9 조제1항제3호의 불사용에 대한 '정당한 이유'를 판단함에 있어서 당해 상 의 이 표 전등록 이후의 사정만 참 작할 것이 아니고 그 이전등록 이전의 속된 불사용의 계 사정도 함 께 려 고 해야 한다. 디자인보호제도 및 목적에 관한 설명으로 옳지 않은 것은?","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":454,"text":"출원공고결정 전에 지정상품의 범위의 감축 또는 상표의 부기적인 부분의 삭제 를 하는 보정은 국제상표등록출원의 요지를 변경하지 아니하는 것으로 본다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":455,"text":"상표법 제40조(출원공고결정 전의 보정)에 따른 지정상품의 보정이 오기의 정정 또는 불명료한 기재의 석명에 해당하지 아니하는 것으로 상표권 설정등록이 있 은 후에 인정된 경우에는 그 국제상표등록출원은 그 보정서를 제출한 때에 상표 등록출원을 한 것으로 본다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":456,"text":"상표권 설정등록이 있은 후에 지정상품의 보정이 지정상품의 범위의 감축에 해당 하지 아니하는 것으로 인정된 경우, 그 국제상표등록출원에 관한 상표권은 무효 의 대상이 된다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":457,"text":"상표법 제41조(출원공고결정 후의 보정)에 따라 출원인은 의견서 제출기간 내에 최초의 국제상표등록출원의 요지를 변경하지 아니하는 범위에서 지정상품 및 상표 를 보정할 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":458,"text":"국제상표등록출원은 최초의 출원에 대한 등록여부결정 또는 심결이 확정되기 전 에 통상의 단체표장등록출원으로 변경하기 위하여 보정할 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":459,"text":"甲의 출원상표 X 및 지정상품 a가 미국인 乙이 미국에서 출원하여 등록받은 X' 상표 및 a'상품과 유사하고, 甲은 상표등록출원 당시 乙이 미국에서 생산하는 상품 을 수입하여 판매하는 대리점에 해당한다고 할 경우, 乙이 甲의 상표등록출원에 대하여 이의신청이나 정보제공을 하지 않더라도 甲의 상표등록출원은 거절될 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":460,"text":"상기 ①의 경우 乙이 甲의 상표출원에 대하여 명시적으로 동의한 경우에만 甲의 출원은 유효하게 상표등록을 받을 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":461,"text":"2017년 2월 24일에 甲의 출원에 대한 상표등록여부를 결정할 때, 甲의 출원상표 X 와 표장과 지정상품 면에서 각각 유사한 乙의 등록상표 X'가 2016년 4월 8일에 포기 등록되어 소멸된 사실이 확인된 경우, 甲의 출원은 乙의 소멸된 등록상표 X'로 인하여 거절된다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":462,"text":"甲의 출원상표 X와 유사한 상표를 유사한 지정상품에 선출원하여 선등록한 乙 의 등록상표 X'가 甲의 상표출원시 존재할 경우에도 乙의 등록상표 X'가 2017년 2월 24일에 존속기간 만료로 소멸되면 甲의 출원은 상표등록을 받을 수 있다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":463,"text":"甲의 출원이 2017년 2월 24일에 상표등록된 경우 특허청장은 상표권자의 성명ㆍ 주소 및 상표등록번호 등을 상표공보에 게재하여 등록공고를 하여야 한다.","chapter":"국제상표등록·마드리드·조약우선권","answer":"","explanation":""},{"id":464,"text":"증명 표장을 출원하거나 등록을 받은 자는 그 증명표장과 동일ㆍ유사한 표장을 단체 표장으로 등록받을 수 없지만, 업무표장으로 등록받을 수는 있다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":465,"text":"상품의 품질 등 특성을 증명하고 관리하는 것을 업으로 할 수 있는 자라도 자기의 영업에 관한 상품에 사용하려는 경우에는 증명표장의 등록을 받을 수 없다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":466,"text":"지리적 표시를 사용할 수 있는 상품을 판매하는 자만으로 구성된 법인은 직접 사용하기 위한 표장에 대해 지리적 표시 단체표장등록을 받을 수 있다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":467,"text":"\"동음이의어 지리적 표시\"란 같은 상품에 대한 지리적 표시가 타인의 지리적 표시와 발음은 같지만, 의미는 다른 지리적 표시를 말한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":468,"text":"국내에서 영리를 목적으로 업무를 하는 자는 자기의 업무인 경우에 한하여 업무표장을 등록받을 수 있다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":469,"text":"상표권자는 상표법 제98조에 따라 상표를 사용할 권리를 가진 자에게 그 자의 업무에 관한 상품과 자기의 업무에 관한 상품 간에 혼동을 방지하는 데 필요한 표시를 하도록 청구할 수 있다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":470,"text":"상표권자는 상표법 제99조 제1항에 따라 상표를 사용할 권리를 가지는 자에게 그 자의 상품과 자기의 상품 간에 출처의 오인이나 혼동을 방지하는 데 필요한 표시를 하도록 청구할 수 있다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":471,"text":"상표법 제223조의 동음이의어 지리적 표시 등록단체표장에 관한 규정상 둘 이상의 지리적 표시 등록단체표장이 서로 동음이의어 지리적 표시에 해당하는 경우 각 단체표장권자와 그 소속 단체원은 지리적 출처에 대하여 수요자가 혼동하지 아니하도록 하는 표시를 등록단체표장과 함께 사용하여야 한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":472,"text":"상표법 제223조(동음이의어 지리적 표시 등록단체표장의 표시)를 위반한 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":473,"text":"누구든지 등록을 하지 아니한 상표 또는 상표등록출원을 하지 아니한 상표를 등록상표 또는 등록출원상표인 것 같이 상품에 표시하는 행위를 하여서는 아니 되며, 이를 위반한 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":474,"text":"저명한 고인(故人)을 비방하는 상표에 해당하는지 여부는 상표등록여부결정을 할 때 를 기준으로 판단한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":475,"text":"상표 그 자체 또는 상표가 상품에 사용되는 경우 수요자에게 주는 의미와 내용 등이 일반인의 통상적인 도덕관념인 선량한 풍속에 어긋나는 등 공공의 질서를 해칠 우려 가 있는 상표에 해당하는지 여부는 상표등록여부결정을 할 때를 기준으로 판단한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":476,"text":"저명한 타인의 성명을 포함하는 상표에 해당하는지 여부는 상표등록여부결정을 할 때 를 기준으로 판단한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":477,"text":"수요자들에게 현저하게 인식되어 있는 타인의 상품이나 영업과 혼동을 일으키게 하는 상표에 해당하는지 여부는 상표등록출원을 한 때를 기준으로 판단한다. 다만, 이와 관 련하여 타인에 해당하는지 여부는 상표등록여부결정을 할 때를 기준으로 판단한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":478,"text":"동업관계를 통하여 타인이 사용하는 상표임을 알면서 그 상표와 유사한 상표를 유사 한 상품에 등록출원한 상표에 해당하는지 여부는 상표등록여부결정을 할 때를 기준으 로 판단한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":479,"text":"위치상표는 표장이 사용되는 위치에 식별력이 인정되는 것이기는 하나 표장의 위치가 요부라고는 볼 수 없다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":480,"text":"위치상표에서는 지정상품에 일정한 형상이나 모양 등이 부착되는 특정 위치를 설명하기 위하여 지정상품의 형상을 표시하는 부분을 필요로 하게 된다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":481,"text":"특정 위치에 부착된 표장은 수요자의 입장에선 상표가 아니라 디자인적 요소로 보는 것이 일반적이므로 위치상표로 등록받기 위해서는 그 표장이 수요자들에게 상품의 출처표시로 인식된다는 것을 입증하여야 한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":482,"text":"위치상표는 비록 일정한 형상이나 모양 등이 그 자체로는 식별력을 가지지 아니 하더라도 지정상품의 특정 위치에 부착되어 사용됨으로써 당해 상품에 대한 거래 자 및 수요자 대다수에게 특정인의 상품을 표시하는 것으로 인식되기에 이르렀다 면, 사용에 의한 식별력을 취득한 것으로 인정받아 상표로서 등록될 수 있다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":483,"text":"위치상표란 '기호ㆍ문자ㆍ도형 각각 또는 그 결합이 일정한 형상이나 모양을 이 루고, 이러한 일정한 형상이나 모양이 지정상품의 특정 위치에 부착되는 것에 의하여 자타상품을 식별하게 되는 표장'을 말한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":484,"text":"입체적 형상만으로 이 어진 상 를 출원하는 경우 출원인은 심사관이 출원상 표 를 정확히 파악할 수 있도록 장에 관한 표 명을 출원서에 반 시 기재하여야 설 드 한다. 품 표","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":485,"text":"지정상 의 입체적 형상으로 된 상 의 경우에, 그 입체적 형상이 해당 지정상 품 이 거래되는 시장에서 그 상 품 등의 통상적ㆍ기본적인 형 에 해당하여 수요 태 품 자가 상 의 출 처표 시로 인식할 수 있는 정도에 이 지 못하 다면 상 법 제 르 였 표 표 33조(상 등록의 요건)제1항제3호에 해당한다. 표","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":486,"text":"상 법 제107조(권리침해에 대한 금지청구권 등)에 의한 금지청구를 인정할 것 인지의 판단은 사실심 변 론종 결 당시를 기준으로 하여야 하고, 상 법 제10 조 표 9 (손해배상의 청구)에 의한 손해배상청구를 인정할 것인지의 판단은 침해행위 당 시를 기준으로 하여야 한다는 것이 판례의 입장이다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":487,"text":"입체적 형상과 문 표 자가 결합된 상 에 있어, 입체적 형상 자체에는 식별력이 없 더라도 식별력이 있는문 표 자가 결합하여 상 가 전체적으로 식별력이 있다면 상 표 표 법 제33조(상 등록의 요건)제1항제3호에 해당하지 아니한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":488,"text":"소리상표의 상표등록출원서에 적는 '상표에 관한 설명'의 기재사항을 고치는 것 은 요지변경에 해당하지 아니한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":489,"text":"단체표장과 달리 증명표장은 법인뿐만 아니라 개인도 출원하여 등록받을 수 있다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":490,"text":"상표ㆍ단체표장 또는 업무표장을 출원하거나 등록을 받은 자는 그 상표 등과 동일ㆍ 유사한 표장을 지정상품의 동일ㆍ유사여부와 상관없이 증명표장으로 등록받을 수 없다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":491,"text":"증명표장등록출원의 지정상품은「증명의 대상」과「증명의 내용」이 함께 기재 되어야 하며, 그 중 어느 하나가 기재되어 있지 않거나 그 기재가 불명확한 경 우 실무상 상표법 제38조(1상표1출원)제1항의 거절이유를 적용하고 있다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":492,"text":"증명표장은 정관에서 정한 기준을 충족한 자이면 누구나 사용할 수 있으므로 증 명표장권자도 정관에서 정한 기준을 충족하면 자기의 영업에 관한 상품에 이를 사용할 수 있다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""},{"id":493,"text":"증명표장등록출원에 있어 표장의 동일ㆍ유사여부는 증명표장은 물론 상표ㆍ업무 표장ㆍ단체표장 등과의 유사여부를 함께 고려하여 판단하여야 한다.","chapter":"단체표장·지리적표시·증명표장·업무표장·특수표장","answer":"","explanation":""}]};

let S=
{sub:'',mode:'',chapter:'',queue:[],i:0,locked:false,pool:'',stats:JSON.parse(localStorage.getItem('ox_stats_final3')||'{}'),seen:JSON.parse(localStorage.getItem('ox_seen_final3')||'{}')};
const CH={민법:['민법총칙','채권총론','채권각론','물권법'],특허법:['특허절차','특허요건 및 특허출원','특허권 및 실시권','특허심판·소송','국제출원(PCT)','실용신안','특허침해'],상표법:['상표의 개념·사용·식별력','상표등록요건·출원·심사·등록','상표권·사용권·이전·질권·소멸','상표권 효력·침해·손해배상·보상','상표심판·소송·재심·권리범위','국제상표등록·마드리드·조약우선권','단체표장·지리적표시·증명표장·업무표장·특수표장']};
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function data(){return S.sub==='민법'?D.civil:S.sub==='특허법'?D.patent:D.trademark} function K(q){return S.sub+'_'+q.id} function save(){localStorage.setItem('ox_stats_final3',JSON.stringify(S.stats));localStorage.setItem('ox_seen_final3',JSON.stringify(S.seen))}
function wc(sub,ch=''){let a=sub==='민법'?D.civil:sub==='특허법'?D.patent:D.trademark;return a.filter(q=>(!ch||q.chapter===ch)&&(S.stats[sub+'_'+q.id]?.w||0)>0).length}
function totalA(){return Object.values(S.stats).reduce((a,x)=>a+(x.a||0),0)} function totalW(){return Object.values(S.stats).reduce((a,x)=>a+(x.w||0),0)}
function home(){bar.style.width='0%';app.innerHTML=`<div class="card"><h2>과목 선택</h2><div class="subjectgrid"><button class="btn subject" onclick="selectSub('민법')"><b>민법</b><small>1,347개 · 4대단원</small></button><button class="btn subject" onclick="selectSub('특허법')"><b>특허법</b><small>646개 · 7대단원</small></button><button class="btn subject" onclick="selectSub('상표법')"><b>상표법</b><small>493개 · 7대단원</small></button></div></div><div class="card"><h2>전체 통계</h2><div class="stats"><div class="stat"><b>${totalA()}</b><span>풀이</span></div><div class="stat"><b>${totalW()}</b><span>오답</span></div><div class="stat"><b>${totalA()?Math.round((totalA()-totalW())/totalA()*100):0}%</b><span>정답률</span></div></div></div>`}
function selectSub(s){S.sub=s;let a=data();app.innerHTML=`<button class="btn back" onclick="home()">← 과목 선택</button><div class="card"><h2>${s}</h2><div class="actions"><button class="btn" onclick="start('all')">전체</button><button class="btn" onclick="start('random')">랜덤</button><button class="btn wrong" onclick="start('wrong')">오답만 (${wc(s)})</button></div><h3>대단원</h3><div class="chapters">${CH[s].map((c,i)=>`<button class="chapter" onclick='start("chapter",${JSON.stringify(c)})'><b>${i+1}. ${E(c)}</b><small>${a.filter(q=>q.chapter===c).length}문제 · 오답 ${wc(s,c)}개</small></button>`).join('')}</div></div>`}
function start(mode,ch=''){S.mode=mode;S.chapter=ch;let a=data().slice();if(ch)a=a.filter(q=>q.chapter===ch);if(mode==='wrong')a=a.filter(q=>(S.stats[K(q)]?.w||0)>0);if(!a.length){alert('해당 조건의 문제가 없습니다.');return}let pool=S.sub+'|'+(ch||'ALL')+'|'+mode;let seen=S.seen[pool]||[];let rem=a.filter(q=>!seen.includes(q.id));if(!rem.length){seen=[];rem=a.slice();S.seen[pool]=[]}rem.sort(()=>Math.random()-.5);S.queue=rem;S.i=0;S.pool=pool;S.locked=false;render()}
function render(){let q=S.queue[S.i];bar.style.width=((S.i+1)/S.queue.length*100)+'%';app.innerHTML=`<button class="btn back" onclick="selectSub('${S.sub}')">← ${S.sub}</button><div class="card"><div class="meta"><span>${S.i+1} / ${S.queue.length}</span><span>${E(q.chapter)}</span></div><div class="q">${E(q.text)}</div><div class="ox"><button onclick="answer('O')">O</button><button onclick="answer('X')">X</button></div><div id="fb"></div></div>`}
function answer(v){if(S.locked)return;S.locked=true;let q=S.queue[S.i],k=K(q),s=S.stats[k]||{a:0,w:0};s.a++;let ok=v===q.answer;if(!ok)s.w++;S.stats[k]=s;let seen=S.seen[S.pool]||[];if(!seen.includes(q.id))seen.push(q.id);S.seen[S.pool]=seen;save();let f=document.getElementById('fb');f.className='feedback '+(ok?'good':'bad');f.innerHTML=`<b>${ok?'✅ 정답':'❌ 오답'}</b><div>정답: <b>${q.answer}</b></div>${q.explanation?`<div class="ex">${E(q.explanation)}</div>`:''}<button class="next" onclick="next()">다음 문제</button>`}
function next(){if(S.i+1<S.queue.length){S.i++;S.locked=false;render()}else{alert('한 바퀴 완료했습니다.');selectSub(S.sub)}}
home();
</script></main></body></html>
