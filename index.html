","chapter":"민법총칙","answer":"O"},{"id":622,"text":"무상의 지 역권 설정도 가능하다.","chapter":"민법총칙","answer":"O"},{"id":623,"text":"요역지의 불법점유자는 지역권을 시효취득할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":624,"text":"지역권자 甲이 그 소유 토지를 乙에게 매도하고 이전등기한 경우, 특별한 사정 이 없는 한 乙은 지역권의 이전등기 없이는 지역권을 취득하지 못한다.","chapter":"민법총칙","answer":"X"},{"id":625,"text":"지역권자는 승역지의 점유를 침탈한 제3자를 상대로 지역권에 기초하여 승역지 의 반환을 청구할 수 없다. 역 람","chapter":"민법총칙","answer":"O"},{"id":626,"text":"요 지를 여러 사 이 공유하는 경우 공유자 중 한 사 람에 대한 지역권의 소멸 시효 중단은 다른 공유자를 위하여 효력이 있다.","chapter":"민법총칙","answer":"O"},{"id":627,"text":"제3자가 공유물의 이용을 방해하고 있는 경우 공유자는 그의 지 각 분에 기하여 독 단 으로 공유물 전부에 대한 방해의 제거를 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":628,"text":"제3자가 공유물의 이용을 방해하고 있는 경우 각 공유자는 제3자에 대하여 자신 분 비율 의 지 의 분 에 해당하는 부 에 한하여 부당이득의 반환을 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":629,"text":"공유물분할의 소는 공유자 전원이 당사자로 되어야 하므로, 원고를 제외한 공유 자 모두가 피고로 된다.","chapter":"민법총칙","answer":"O"},{"id":630,"text":"부동산 공유자의 공유지분 포기의 의사표시가 다른 공유자에게 도달하더라도 등 기를 하여야 공유지분 포기에 따른 물권변동의 효력이 발생한다.","chapter":"민법총칙","answer":"O"},{"id":631,"text":"공유자 중 1인이 다른 공유자의 동의 없이 공유토지 전부를 매도하여 타인 명의 로 소유권이전등기가 마쳐진 경우, 다른 공유자는 그 공유물 전부에 관해 소유 권이전등기의 말소를 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":632,"text":"세금체납을 이유로 한 체납처분압류가 되어 있는 부동산에 대한 경매절차가 개 시되기 전에 유치권을 취득한 유치권자는 그 경매절차의 매수인에게 유치권을 주장할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":633,"text":"아직 변제기에 이르지 아니한 채권에 기해서는 유치권을 행사할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":634,"text":"매도인이 중도금만 받고서 매수인에게 부동산의 소유권을 이전한 경우, 매도인 은 잔금채권을 피담보채권으로 하여 매수인에 대하여 유치권을 행사할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":635,"text":"부동산 근저당권에 기한 압류의 효력이 발생한 후에 취득한 유치권으로 그 근저 당권에 기한 경매절차의 매수인에게 대항할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":636,"text":"건물신축공사를 도급받은 수급인이 사회통념상 독립한 건물이 되지 못한 정착물 을 토지에 설치한 상태에서 공사가 중단된 경우, 토지에 대하여 유치권을 행사 할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":637,"text":"甲과 乙의 증여계약은 무효이다.","chapter":"민법총칙","answer":"O"},{"id":638,"text":"甲은 乙 명의의 이전등기의 말소를 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":639,"text":"甲은 乙을 상대로 주택의 명도를 청구할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":640,"text":"만약 乙이 丙에게 주택을 양도하고 이전등기를 해준 경우 甲은 丙 명의 의 이전등기의 말소를 청구할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":641,"text":"채무자의 법률행위가 통정허위표시로 무효인 경우에는 채권자취소권의 대상이 될 수 없다.","chapter":"민법총칙","answer":"X"},{"id":642,"text":"매매계약을 원인으로 하는 가등기에 기하여 본등기가 경료된 경우, 사해행위 요 건의 구비 여부는 특별한 사정이 없는 한 본등기를 한 시점을 기준으로 판단하 여야 한다.","chapter":"민법총칙","answer":"X"},{"id":643,"text":"부동산이 이중( 二重)으로 매도되고 제2매수인에게 소유권이전등기가 이루어진 경우, 제1매수인은 자신의 소유권이전등기청구권을 보전하기 위하여, 매도인과 제2매수인 사이에 이루어진 양도행위에 대하여 채권자취소권을 행사할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":644,"text":"채무자가 저당권이 설정되어 있는 자신의 유일한 재산을 양도한 경우, 저당권의 피담보채권액이 그 재산의 가액을 초과하더라도 당해 재산의 양도는 사해행위에 해당한다.","chapter":"민법총칙","answer":"X"},{"id":645,"text":"채권자가 채무자와 수익자 사이의 부동산 매매계약을 사해행위로 취소함에 따라 수익자 명의의 소유권이전등기가 말소되어 채무자의 등기명의가 회복된 경우, 채무자는 그 부동산의 소유권을 제3자에게 유효하게 양도할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":646,"text":"乙이 Y노트북을 선택하고 그 의사를 甲에게 전달한 경우, 乙은 특별한 사정이 없는 한 甲의 동의 없이도 이를 철회할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":647,"text":"乙은 Y노트북을 선택하면서 조건을 붙일 수 있다.","chapter":"민법총칙","answer":"X"},{"id":648,"text":"乙이 X노트북을 선택하더라도 채권의 목적물은 Y노트북으로 확정된다.","chapter":"민법총칙","answer":"X"},{"id":649,"text":"乙은 X노트북을 선택하고 丙에게 X노트북의 반환을 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":650,"text":"乙은 X노트북을 선택하고 甲에게 채무불이행을 이유로 손해배상을 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":651,"text":"丙이 보증계약 후 乙의 변제기를 연장해 준 경우, 특별한 사정이 없는 한 甲은 주채무의, 보증계약 당시의 이행기가 되더라도 乙에게 미리 구상권을 행사할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":652,"text":"甲이 丙에게 변제한 이후 乙과 丙의 계약이 해제되어 소급적으로 소멸한 경우, 甲은 丙을 상대로 이미 이행한 급부를 부당이득으로 반환청구할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":653,"text":"乙이 채무를 변제하고도 그 사실을 甲에게 통지하지 않고 있던 중에 甲이 이러 한 사실을 모르고 乙에 대한 사전통지 없이 채무를 변제한 경우, 甲은 乙에 대 하여 자기의 변제가 유효함을 주장할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":654,"text":"丙이 乙에 대한 대금채권을 실행하기 위해 乙의 재산을 압류하더라도 甲의 보증 채무의 소멸시효는 중단되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":655,"text":"甲이 변제로 乙의 채무를 소멸시 킨 경우, 甲은 乙이 그 당시에 이익을 받은 한 도에서 구상할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":656,"text":"乙은 丙에게 채권양도에 대한 승낙을 하면서 조건을 붙일 수 있다.","chapter":"민법총칙","answer":"O"},{"id":657,"text":"甲으로부터 채권양도통지 권한을 위임받은 丙이 대리관계를 현명하지 않고 丙 명의의 채권양도통지서를 乙에게 발송하여 도달한 경우, 특별한 사정이 없는 한 그 양도통지는 효력이 없다.","chapter":"민법총칙","answer":"O"},{"id":658,"text":"甲이 乙에게 채권양도 사실을 통지한 후에 乙이 甲에게 금전을 빌려주었다면, 乙은 그 대여금반환채권에 의한 상계로써 丙에게 대항할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":659,"text":"채권양도에 대한 乙의 승낙이 있은 후에 채권양도계약이 해제되어 甲이 乙에게 양도철회통지를 한 경우, 乙은 이로써 丙의 채무이행청구에 대하여 대항할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":660,"text":"甲이 乙에게 채권양도의 사실을 통지하였으나 양도행위가 적법하게 취소된 경 우, 乙이 이 사실을 모르고 丙에게 변제하였다면 이를 가지고 甲에게 대항할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":661,"text":"채무인수인은 특별한 의사표시가 없으면 자신의 구( 舊)채무자에 대한 항변사유 를 가지고 채권자에게 대항할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":662,"text":"채무자와 인수인 사이의 계약에 의해 채무인수가 이 루어지는 경우, 채권자가 승 낙을 거절하면 이후에 다시 승낙을 하더라도 면책적 채무인수의 효력이 발생하 지 않는다.","chapter":"민법총칙","answer":"X"},{"id":663,"text":"토지매수인이 토지에 관한 매도인의 채무를 인수하면서 그 채무액을 매매대금에 서 공제하기로 약정한 경우, 특별한 사정이 없는 한 면책적 채무인수에 해당한다.","chapter":"민법총칙","answer":"X"},{"id":664,"text":"채무자 아 닌 제3자가 설정한 근저당권에 관하여 그 제3자의 동의를 얻어 채무인 수를 원인으로 채무자를 교체하는 변경등기가 마쳐졌다면, 특별한 사정이 없는 한 그 근저당권은 그 후 채무인수인이 다른 원인으로 부담하는 채무까지 담보한다.","chapter":"민법총칙","answer":"X"},{"id":665,"text":"채무자와 인수인 간의 중첩적 채무인수계약의 경우에 채권자는 인수인에 대하여 수익의 의사표시 없이도 직 접 청구할 권리를 갖는다.","chapter":"민법총칙","answer":"O"},{"id":666,"text":"乙이 甲과의 계약을 해제하기 위해서는 상당한 기간을 정해 이행을 최고하여야 한다.","chapter":"민법총칙","answer":"X"},{"id":667,"text":"乙이 甲과의 계약을 해제하면 乙은 甲에 대해 원상회 복청구권을 갖는데, 그 권 리의 소멸시효는 해제권이 발생한 때로부터 진행한다.","chapter":"민법총칙","answer":"X"},{"id":668,"text":"乙이 甲과의 계약을 해제하기 위해서는 甲의 소유권이전등기의무와 동시이행관 계에 있는 잔대금지급의무의 이행제공을 하여야 한다.","chapter":"민법총칙","answer":"X"},{"id":669,"text":"만약 丙이 아직 甲에게 매매대금을 지급하지 않았다면, 乙은 甲과의 계약을 해 제하지 않고 丙을 상대로 甲에게 지급할 매매대금을 자신에게 대상(代償)으로 지급하라고 청구할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":670,"text":"만약 丁이 甲의 乙에 대한 채무의 이행을 보증하였고 乙이 甲의 채무불이행을 이유로 계약을 해제하였다면, 丁은 특별한 사정이 없는 한 甲의 乙에 대한 원상 회복의무에 대해 책임을 부담한다.","chapter":"민법총칙","answer":"O"},{"id":671,"text":"건물 임차인은 임대인에게 지 급한 보증금의 반환을 위하여 그 임차목적물에 대 해 유 치권을 주장할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":672,"text":"임차인의 차임연체를 이유로 임대차계약이 해지되어, 임대인이 임차목적물의 인 도와 연체차임의 지 급을 구하는 소송을 제기한 경우 그 소송비용은 특별한 합의 가 없는 한 보증금에서 당연히 공제될 수 없다.","chapter":"민법총칙","answer":"X"},{"id":673,"text":"임대차계약이 계속되는 동 안에 임차인이 차임지급을 연체한 경우, 그 연체차임 은 임대인의 별도의 의사표시 없이 보증금에서 당연히 공제되는 것은 아니다.","chapter":"민법총칙","answer":"O"},{"id":674,"text":"보증금반환채권에 대해 전부 명령이 있은 후, 임대인의 임차인에 대한 연체차임 채권이 발생하였다면 그 전부명령은 임차목적물을 반환할 때까지 임대인의 임차 인에 대한 그 채권을 보증금에서 공제한 잔액에 대해서만 효력을 가진다.","chapter":"민법총칙","answer":"O"},{"id":675,"text":"임대보증금이 지급된 임대차계약에서 차임채권에 관하여 추심명령이 송달된 경 우, 당해 임대차계약이 종료되어 목적물이 반환될 때에는 그 때까지 추심되지 않은 잔존 차임채권 상당액도 임대보증금에서 공제된다.","chapter":"민법총칙","answer":"O"},{"id":676,"text":"임대차계약이 합의해지된 후, 임차인이 임차목적물을 계속 점유하 으나, 이를 였 사용ㆍ수익하지 않았다면 임대인은 임차인에게 차임상당 의 부당이득반환을 청 액 구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":677,"text":"타인 소유의 토 지 위에 권한 없이 건물을 소유하고 있는 자는 이를 사용ㆍ수익 하지 않았더라도 특별한 사정이 없는 한, 그 자체만으로 지소유자에게 지의 토 토 차임에 상당하는 부당이득반환의무를 부담한다.","chapter":"민법총칙","answer":"O"},{"id":678,"text":"임차인이 임대차계약 종료 후 임차건물을 계속 점유하 으나, 임차인의 사정으 였 로 인해 임차건물을 사용ㆍ수익하지 아니하여 이익을 지 한 경우, 임차인은 얻 못 액 차임 상당 의 부당이득반환의무를 부담하지 않는다.","chapter":"민법총칙","answer":"X"},{"id":679,"text":"甲이 乙에게 부동산을 매 도하고 목적물을 인도하지 않은 상 에서 乙로부터 중 태 도금까지 받았으나 매매 음 였 계약이 처 부터 무효 다면, 甲은 선의 더라도 乙로부 였 터 받은 금전에 받은 날로부터 이자를 가산하여 반환하여야 한다.","chapter":"민법총칙","answer":"O"},{"id":680,"text":"甲 소유의 토지에 대한 사용권한 없이 미등기 건물을 신축한 乙로부터 그 건물 을 丙이 매수하여, 이전등기를 넘겨받지 않았으나 그것에 대하여 사실상의 처분 권을 갖고 있는 경우, 乙은 특별한 사정이 없는 한 甲에게 건물 부지부분에 관 한 차임에 상당하는 부당이득반환의무를 부담한다.","chapter":"민법총칙","answer":"O"},{"id":681,"text":"피용자의 불법행위에 기한 손해배상채무가 시효로 인해 소멸하더라도, 그것에 의해 사용자책임에 기한 손해배상채무까지 소멸하는 것은 아니다.","chapter":"민법총칙","answer":"O"},{"id":682,"text":"도급인이 수급인에 대하여 특정한 행위를 지휘하는 등의 노무도급의 경우에 도 급인은 수급인의 불법행위에 대해 사용자책임을 질 수 있다.","chapter":"민법총칙","answer":"O"},{"id":683,"text":"지입차량의 차주가 고용한 운전자의 과실로 인한 불법행위로 인해 타인에게 손 해가 발생한 경우, 그 운전자의 불법행위에 대해 지입회사는 사용자책임을 질 수 있다.","chapter":"민법총칙","answer":"O"},{"id":684,"text":"피용자가 제3자와의 공동불법행위로 피해자에게 손해를 입힌 경우, 사용자가 피 용자의 부담부분을 초과하여 피해자에게 손해를 배상하면 사용자는 제3자에게 그 초과부분에 대해 구상권을 행사할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":685,"text":"피용자와 제3자와의 공동불법행위로 인해 손해를 입은 피해자에게 사용자가 채 권을 가지고 있으나 사용자가 상계할 수 있음에도 상계하지 않는 경우, 제3자는 사용자의 부담부분 범위 내에서 사용자의 채권을 가지고 피해자에게 상계할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":686,"text":"甲이 변제기에 도 하지 않은 채권을 乙에게 매 도하면서 그 채무자의 자력을 담 보한 경우, 甲은 변제기의 자력을 담보한 것으로 추정한다.","chapter":"민법총칙","answer":"O"},{"id":687,"text":"甲의 채권자 丙 이 甲 소유의 물건에 흠 결이 있다는 것을 상 에서 담보권 실 안 태 매 였 행을 위한 경 를 신청하 고 乙이 그 물건을 경락받은 경우, 乙은 그 물건에 흠 음 결이 있 을 이유로 丙에게 손해배상을 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":688,"text":"매수인 乙이 매도인 甲으로부터 취득한 목적물에 대한 소유권을 제3자의 저당권 의 실행으로 잃게 된 경우, 乙은 매매의 목적물에 저당권이 설정되어 있다는 사 실을 계약체결 당시에 알고 있었더라도 甲과의 계약을 해제할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":689,"text":"매도인 甲이 계약을 체결할 당시에 매매목적물에 대한 소유권이 자신에게 속하 지 않는다는 사실을 알지 못하였고, 그 소유권을 취득하여 매수인 乙에게 이전 할 수 없는 경우, 甲은 손해를 배상하고 乙과의 계약을 해제할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":690,"text":"가 압류 의 목적이 된 부동산을 甲으로부터 수한 乙이 그 가 매 에 기한 강제집 압류 였 행으로 소유권을 상실하 고, 그로 인해 손해를 입은 경우, 乙은 계약체결 당시 에 가 압류 존 의 재를 알고 있었더라도 손해배상을 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":691,"text":"해제권자가 그 상대방으로부터 인도받은 목적물을 자신의 과실( 過失)로 인해 반 환할 수 없게 된 경우에 그 해제권은 소멸한다.","chapter":"민법총칙","answer":"O"},{"id":692,"text":"당사자가 수인인 경우에 적용되는 해제권의 불가 분성에 관한 규정(민법 제547 조)에 대해 당사자는 특약으로 그 적용을 배제할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":693,"text":"해제권의 행사기간을 정하지 아니한 때에는 상대방은 상당한 기간을 정하여 해 제권행사 여부의 확 답을 해제권자에게 최고할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":694,"text":"계약에서 위약시의 해제권을 배제하기로 약정하지 않은 경우, 어 느 일방에 대한 약정해제권의 유보는 채무불이행으로 인한 법정해제권의 발생에 영향을 주지 않 는다.","chapter":"민법총칙","answer":"O"},{"id":695,"text":"매수인이 매도인의 채무불이행을 이유로 계약금 반환을 구하는 소를 제기함으로 써 계약해제권을 행사하고 그 소장이 송달된 후, 그 소를 취하하고 본래의 매매 계약의 이행을 구하는 소를 제기하면 매도인은 매매계약상의 의무를 이행하여야 한다.","chapter":"민법총칙","answer":"X"},{"id":696,"text":"관습법은 법원(法源)으로서 법령에 저촉되지 않는 한, 법칙으로서의 효력이 있다.","chapter":"민법총칙","answer":"O"},{"id":697,"text":"미등기 무허가건물의 매수인은 그 소유권이전등기를 경료하지 않으면 건물의 소유권을 취득할 수 없지만, 소유권에 준하는 관습상의 물권이 인정될 수는 있다.","chapter":"민법총칙","answer":"X"},{"id":698,"text":"종중의 명칭사용이 그에 관한 관습에 어긋난다고 하여도, 그러한 사실만으로 그 종중의 실체를 부인할 수는 없다.","chapter":"민법총칙","answer":"O"},{"id":699,"text":"사실인 관습은 사적 자치가 인정되는 분야의 제정법이 임의규정인 경우에는 법률 행위의 해석기준이 되므로, 이를 재판의 자료로 할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":700,"text":"제정법규와 배치되는 사실인 관습의 효력을 인정하려면, 그러한 관습을 인정할 수 있는 당사자의 주장과 입증이 있어야 할 뿐만 아니라 그 관습이 임의규정에 관한 것인지 여부를 심리ㆍ판단해야 한다.","chapter":"민법총칙","answer":"O"},{"id":701,"text":"특별한 사정이 없는 한 乙, 丙, 丁은 모두 甲의 실종선고에 대하여 이해 관계가 있는 자로서 실종선고를 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":702,"text":"乙의 甲에 대한 이혼판결이 2016. 5. 10. 확정되었더라도, 그 후 甲에 대 한 실종선고로 사망간주시점이 소급되면, 이혼판결은 사망자를 상대로 한 것이므로 무효가 된다.","chapter":"민법총칙","answer":"X"},{"id":703,"text":"甲에 대한 실종선고로 X건물은 이미 상속되었는데, 2015. 6. 10. 甲의 생존사실이 밝혀진 경우, 실종선고가 취소되기 전에는 위 상속은 효력이 있다.","chapter":"민법총칙","answer":"O"},{"id":704,"text":"甲이 乙에게 한 A의 업무에 대한 포괄적 위임과 그에 따른 乙의 대행 행위는 A에게 그 효력이 미친다.","chapter":"민법총칙","answer":"X"},{"id":705,"text":"비법인사단은 자연인과 달리 명예권을 가질 수 없으므로, A의 명예를 훼손한 乙에 대하여 A가 손해배상을 청구할 수는 없다.","chapter":"민법총칙","answer":"X"},{"id":706,"text":"甲의 불법행위로 乙에게 손해가 발생한 경우, 甲의 행위가 직무에 관한 것이 아님을 乙이 알았다면, 乙은 A에 대하여 민법 제35조 제1항에 따른 불법행위책임을 물을 수 없다.","chapter":"민법총칙","answer":"O"},{"id":707,"text":"甲의 불법행위로 乙에게 손해가 발생한 경우, 甲의 행위가 법령의 규정 에 위배되더라도 외관상 객관적으로 직무에 관한 행위라고 인정된다면, A는 乙에 대하여 민법 제35조 제1항에 따른 불법행위책임을 진다.","chapter":"민법총칙","answer":"O"},{"id":708,"text":"어떤 토지가 지적공부상 1필의 토지로 등록되면 특별한 사정이 없는 한, 그 경계는 지적도상의 경계에 의하여 특정된다.","chapter":"민법총칙","answer":"O"},{"id":709,"text":"입목등기를 하지 않은 수목은 명인방법을 갖추더라도 독립된 물건이 될 수 없다.","chapter":"민법총칙","answer":"X"},{"id":710,"text":"주물 소유자의 사용에 공여되고 있는 물건은 주물 자체의 효용과 관계없는 물건 이라도 종물이 된다.","chapter":"민법총칙","answer":"X"},{"id":711,"text":"성숙한 농작물은 명인방법을 갖추어야 경작자의 소유가 된다.","chapter":"민법총칙","answer":"X"},{"id":712,"text":"토지등기부에 분필등기가 되면 「공간정보의 구축 및 관리 등에 관한 법률」이 정하는 바에 따른 분할절차를 밟지 않아도 분필의 효과가 발생한다.","chapter":"민법총칙","answer":"X"},{"id":713,"text":"강제집행을 면할 목적으로 부동산에 허위의 근저당권을 설정하는 행위","chapter":"민법총칙","answer":"O"},{"id":714,"text":"의무의 강제에 의하여 얻어지는 채권자의 이익에 비하여 과도하게 중한 위약벌의 약정","chapter":"민법총칙","answer":"X"},{"id":715,"text":"뇌물로 받은 금전을 소극적으로 은닉하기 위하여 이를 임치하는 약정","chapter":"민법총칙","answer":"O"},{"id":716,"text":"해외연수 후 그 비용과 관련하여 일정기간 동안 소속회사에서 근무해야 한다는 사규나 약정","chapter":"민법총칙","answer":"O"},{"id":717,"text":"공무원의 직무에 관한 사항에 대하여 특별한 청탁을 하게 하고, 그에 대한 보수로 금전을 지급하기로 하는 약정","chapter":"민법총칙","answer":"X"},{"id":718,"text":"민법상의 법률행위에 관한 규정은 특별한 사정이 없는 한 소송행위에는 적용이 없으므로, 소송행위가 강박에 의하여 이루어지더라도 이를 이유로 취소할 수는 없다.","chapter":"민법총칙","answer":"O"},{"id":719,"text":"매도인의 기망에 의하여 타인 소유의 물건을 매도인의 것으로 알고 매수한 자는 만일 그것이 타인의 물건인 줄 알았더라면 매수하지 아니하였을 사정이 있는 경우, 매도인의 사기를 이유로 매매계약을 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":720,"text":"상대방의 사기에 속아 신원보증서류에 서명날인한다는 착각에 빠진 상태로 연대 보증서면에 서명날인한 경우, 이러한 표시상의 착오에서는 착오 이외에 사기를 이유로도 연대보증계약을 취소할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":721,"text":"은행 출장소장은 은행 또는 은행과 동일시할 수 있는 자이므로, 그의 사기에 속아 은행과 대출계약을 체결한 사람은 은행이 그 사기사실을 알았거나 알 수 있었을 경우에 한하여 대출계약을 취소할 수 있는 것은 아니다.","chapter":"민법총칙","answer":"O"},{"id":722,"text":"강박에 의한 법률행위가 동시에 불법행위를 구성하는 경우, 그 취소의 효과로 생기는 부당이득반환청구권과 불법행위로 인한 손해배상청구권은 경합하지만 중 첩적으로 행사할 수는 없다.","chapter":"민법총칙","answer":"X"},{"id":723,"text":"특별한 사정이 없는 한, 乙은 丙으로부터 중도금이나 잔금을 수령할 권한이 있다.","chapter":"민법총칙","answer":"O"},{"id":724,"text":"특별한 사정이 없는 한, 乙은 丙에게 약정된 매매대금 지급기일을 연기해 줄 권 한은 없다.","chapter":"민법총칙","answer":"O"},{"id":725,"text":"丙이 甲에 대하여 소유권이전등기를 청구하는 경우, 乙의 대리권 존재 사실에 대한 증명책임은 丙이 진다.","chapter":"민법총칙","answer":"O"},{"id":726,"text":"만약 乙이 甲을 위한 것임을 표시하지 않고 매매계약을 체결하였는데 乙이 甲의 대리인임을 丙이 알았다면, 그 계약의 효력은 甲에게 미친다.","chapter":"민법총칙","answer":"O"},{"id":727,"text":"乙이 丙으로부터 받은 매매대금을 유용할 배임적 의도를 갖고 있었고 丙이 이를 알았다면, 그 한도에서 乙은 무권대리가 된다.","chapter":"민법총칙","answer":"X"},{"id":728,"text":"甲은 乙 또는 丙을 상대로 매매계약을 추인할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":729,"text":"甲은 乙의 처분행위와 사문서위조행위를 불문에 붙이기로 합의하는 등 묵시적인 방법으로도 매매계약을 추인할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":730,"text":"乙이 甲을 단독으로 상속하여 X토지의 소유자가 되면, 乙은 본인의 지위에서 매매계약의 추인을 거절할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":731,"text":"丙이 매매계약 당시 乙이 무권대리인임을 알지 못하였다면, 丙은 본인의 추인이 있을 때까지 乙을 상대로 매수의 의사표시를 철회할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":732,"text":"丙이 상당한 기간을 정하여 매매계약의 추인 여부에 대한 확답을 최고하였으나 甲이 그 기간 내에 확답을 발하지 않으면 추인을 거절한 것으로 본다.","chapter":"민법총칙","answer":"O"},{"id":733,"text":"궁박, 경솔, 무경험은 모두 구비되어야 하는 요건이 아니라 그 중 일부만 갖추어 져도 충분하다.","chapter":"민법총칙","answer":"O"},{"id":734,"text":"궁박은 경제적인 것에 한정하지 않으며 정신적, 신체적인 원인에 기인하는 것을 포함한다.","chapter":"민법총칙","answer":"O"},{"id":735,"text":"무경험은 생활체험의 부족을 의미하는 것으로, 거래일반에 대한 경험부족이 아니라 특정영역에 있어서의 경험부족을 의미한다.","chapter":"민법총칙","answer":"X"},{"id":736,"text":"당사자 중 일방이 상대방의 궁박, 경솔 또는 무경험을 알면서 이를 이용하려는 의사가 있어야 한다.","chapter":"민법총칙","answer":"O"},{"id":737,"text":"불공정한 법률행위로서 무효인 경우, 추인에 의하여 무효인 법률행위가 유효로 될 수는 없지만, 무효행위의 전환에 관한 민법 제138조는 적용될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":738,"text":"정지조건부 채권양도에 있어서 정지조건이 성취되었다는 사실은 채권양도의 효력을 부정하는 자가 증명해야 한다.","chapter":"민법총칙","answer":"O"},{"id":739,"text":"어떤 법률행위에 정지조건이 붙어 있는지 여부는 그 조건의 존재를 주장하는 자가 증명해야 한다.","chapter":"민법총칙","answer":"O"},{"id":740,"text":"조건이 법률행위 당시에 이미 성취할 수 없는 것인 경우에 그 조건이 해제조건 이면 조건 없는 법률행위가 된다.","chapter":"민법총칙","answer":"O"},{"id":741,"text":"조건성취의 효력발생시기에 관한 민법의 규정은 임의규정이다.","chapter":"민법총칙","answer":"O"},{"id":742,"text":"조건부 법률행위에 있어서 조건의 내용 자체가 불법으로 무효인 경우, 특별한 사정이 없는 한 그 조건만을 분리하여 일부만 무효로 할 수는 없다.","chapter":"민법총칙","answer":"X"},{"id":743,"text":"A호텔의 음식료 채권은 1년의 소멸시효에 걸린다.","chapter":"민법총칙","answer":"O"},{"id":744,"text":"소멸시효가 완성되기 전에 A호텔이 소를 제기했으므로, 소멸시효의 진행이 중단된다.","chapter":"민법총칙","answer":"O"},{"id":745,"text":"A호텔이 소송을 취하하면 소멸시효 중단의 효력은 없으나, 6개월 내에 가압류를 하면 최초의 재판상 청구로 인하여 소멸시효가 중단된 것으로 본다.","chapter":"민법총칙","answer":"O"},{"id":746,"text":"A호텔의 청구에 대하여 기각판결이 확정된 후, A호텔이 재심을 청구하면 소멸 시효의 진행이 중단된다.","chapter":"민법총칙","answer":"X"},{"id":747,"text":"A호텔의 재판상 청구로 인한 소멸시효 중단의 효력은 乙에게도 미친다.","chapter":"민법총칙","answer":"O"},{"id":748,"text":"재산을 관리하는 후견인에 대한 제한능력자의 권리는 그가 능력자가 된 때로부터 6개월 내에는 소멸시효가 완성되지 아니한다.","chapter":"민법총칙","answer":"O"},{"id":749,"text":"채권자가 채무자를 상대로 법원에 신청한 화해가 불성립되어 채권자가 그로부터 1월내에 소를 제기한 경우, 채권의 소멸시효는 소제기 시부터 중단된다.","chapter":"민법총칙","answer":"X"},{"id":750,"text":"소멸시효의 기간만료 전 1년 내에 제한능력자에게 법정대리인이 없는 경우, 그 가 능력자가 되거나 법정대리인이 취임한 때로부터 1년 내에는 소멸시효가 완성 되지 아니한다.","chapter":"민법총칙","answer":"X"},{"id":751,"text":"상속재산에 대한 권리는 상속인의 확정, 관리인의 선임 또는 파산선고가 있는 때로부터 1년 내에는 소멸시효가 완성되지 아니한다.","chapter":"민법총칙","answer":"X"},{"id":752,"text":"채무자가 시효중단의 효력이 있는 승인을 하려면 채권자의 채권에 관한 처분의 능력이나 권한이 있어야 한다.","chapter":"민법총칙","answer":"X"},{"id":753,"text":"자연인이나 법인뿐만 아니라 권리능력 없는 사단도 시효취득의 주체가 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":754,"text":"취득시효 완성으로 인한 소유권취득의 효력은 점유를 개시한 때에 소급한다.","chapter":"민법총칙","answer":"O"},{"id":755,"text":"토지에 대한 취득시효가 완성된 후 토지소유자가 그 토지 위에 담장을 설치한 경우, 시효완성자는 소유권에 기한 방해배제청구권의 행사로서 토지소유자를 상 대로 담장의 철거를 청구할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":756,"text":"취득시효기간의 완성 전에 등기부상의 소유명의가 변경되었다 하더라도 이는 취득 시효의 중단사유가 될 수 없다.","chapter":"민법총칙","answer":"O"},{"id":757,"text":"미등기 부동산의 경우, 점유자가 취득시효기간의 완성만으로 등기 없이 소유권을 취득한다.","chapter":"민법총칙","answer":"X"},{"id":758,"text":"총유물에 관한 사원의 의무는 사원의 지위를 상실함으로써 상실된다.","chapter":"민법총칙","answer":"O"},{"id":759,"text":"총유물의 관리는 정관 기타 규약에 달리 정한 바가 없으면 사원총회의 결의에 의한다.","chapter":"민법총칙","answer":"O"},{"id":760,"text":"종중이 그 총유재산에 대한 보존행위로서 소송을 하는 경우에도 특별한 사정이 없는 한, 종중총회에서 전체 종원 과반수 이상의 결의를 거쳐야 한다.","chapter":"민법총칙","answer":"X"},{"id":761,"text":"비법인사단이 정관에 다른 정함이 있다는 등의 특별한 사정이 없음에도 불구 하고 사원총회 결의 없이 총유재산의 처분에 관하여 자기 명의로 제기한 소송은 소송요건의 흠결로서 부적법하다.","chapter":"민법총칙","answer":"O"},{"id":762,"text":"소유권이전등기청구소송에서 승소판결이 확정된 경우에도 등기하여야 소유권을 취득한다.","chapter":"민법총칙","answer":"O"},{"id":763,"text":"전세권이 법정갱신된 경우, 전세권자는 등기 없이도 전세권설정자나 그 목적물 을 취득한 제3자에 대하여 갱신된 권리를 주장할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":764,"text":"신축건물의 보존등기를 건물 완성 전에 하였더라도 그 후 건물이 완성된 이상 그 등기는 무효가 아니다.","chapter":"민법총칙","answer":"X"},{"id":765,"text":"무허가건물의 신축자는 등기 없이 소유권을 원시취득하지만 이를 양도하는 경우 에는 등기 없이 인도에 의하여 소유권을 이전할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":766,"text":"공유물분할의 소에서 공유부동산의 특정한 일부씩을 각각의 공유자에게 귀속시 키는 것으로 현물분할하는 내용의 조정이 성립하였다면, 그 조정이 성립한 때 물권변동의 효력이 발생한다.","chapter":"민법총칙","answer":"O"},{"id":767,"text":"소유권이전등기가 경료되어 있는 경우, 그 등기명의자는 제3자에 대하여서뿐만 아니라 그 전 소유자에 대하여서도 적법한 등기원인에 의하여 소유권을 취득한 것으로 추정된다.","chapter":"민법총칙","answer":"O"},{"id":768,"text":"허무인으로부터 등기를 이어받은 소유권이전등기는 원인무효이므로 그 등기명의 자에 대한 소유권추정은 깨어진다.","chapter":"민법총칙","answer":"O"},{"id":769,"text":"소유권이전등기의 원인으로 주장된 계약서가 진정하지 않은 것으로 증명된 경우 에도 등기는 적법한 것으로 추정된다.","chapter":"민법총칙","answer":"X"},{"id":770,"text":"등기가 원인 없이 말소된 경우에는 그 회복등기가 마쳐지기 전이라도 말소된 등 기의 등기명의인은 적법한 권리자로 추정된다.","chapter":"민법총칙","answer":"O"},{"id":771,"text":"신축된 건물의 소유권은 이를 건축한 사람이 원시취득하는 것이므로, 건물소유권 보존등기의 명의자가 이를 신축한 것이 아니라면 그 등기의 권리추정력은 깨어진다.","chapter":"민법총칙","answer":"O"},{"id":772,"text":"채권자와 채무자가 가등기담보권설정계약을 체결함에 있어 가등기 이후에 발생 될 채무도 피담보채무의 범위에 포함시키기로 한 약정은 유효하다.","chapter":"민법총칙","answer":"O"},{"id":773,"text":"가등기가 금전소비대차에 기한 차용금반환채무와 그 외의 원인으로 발생한 채무 를 동시에 담보할 목적으로 경료되었으나 그 후 금전소비대차에 기한 차용금반 환채무만이 남게 된 경우, 그 가등기담보에 「가등기담보 등에 관한 법률」이 적용된다.","chapter":"민법총칙","answer":"O"},{"id":774,"text":"양도담보 목적물이 소실되어 양도담보 설정자가 보험회사에 대하여 화재보험계 약에 따른 보험금청구권을 취득한 경우, 양도담보권자는 위 보험금청구권에 대 하여 양도담보권에 기한 물상대위권을 행사할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":775,"text":"양도담보권자는 사용ㆍ수익할 수 있는 정당한 권한이 있는 채무자나 그 채무자 로부터 사용ㆍ수익할 수 있는 권한을 승계한 자에 대하여 그 사용ㆍ수익을 하지 못한 것을 이유로 임료 상당의 손해배상이나 부당이득반환을 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":776,"text":"채무자가 채무를 변제하고 가등기말소를 구하는 경우, 채무변제와 담보가등기말 소는 동시이행관계가 아니라 채무변제가 선이행의무이다.","chapter":"민법총칙","answer":"X"},{"id":777,"text":"매매계약 당시 매매목적 토지의 소유권이 매도인에게 속하지 아니함을 알고 있 던 매수인은 소유권이전의무의 이행불능에 매도인의 귀책사유가 있더라도 채무 불이행을 이유로 계약을 해제하고 손해배상을 청구할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":778,"text":"이행보증계약에 기한 보증인의 보증금지급의무에 관하여 지급금지가처분결정이 있 었다고 하더라도, 이로써 보증인에게 지급거절의 권능이 발생한다고 할 수 없다.","chapter":"민법총칙","answer":"O"},{"id":779,"text":"매매의 대상인 권리가 타인에게 귀속되어 있다는 이유만으로 채무자의 계약에 따른 이행이 불능이라고 할 수는 없다.","chapter":"민법총칙","answer":"O"},{"id":780,"text":"부당이득반환의무는 이행기한의 정함이 없는 채무이므로 그 채무자는 이행청구 를 받은 그 다음 날부터 지체책임을 진다.","chapter":"민법총칙","answer":"O"},{"id":781,"text":"채무자가 채무 발생원인 내지 존재에 관한 잘못된 법률적 판단을 통하여 자신의 채무가 없다고 믿고 채무이행을 거부한 채 소송을 통하여 다툰 경우, 특별한 사 정이 없는 한 채무불이행에 관하여 채무자에게 고의나 과실이 인정된다.","chapter":"민법총칙","answer":"O"},{"id":782,"text":"채권자대위소송에서 제3채무자로 하여금 직접 대위채권자에게 금전의 지급을 명 하는 판결이 확정된 경우, 피대위채권이 변제 등으로 소멸하기 전이라면 채무자 의 다른 채권자가 이를 압류 또는 가압류할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":783,"text":"채권자대위소송에서 제3채무자는 채권자의 채무자에 대한 권리의 발생원인이 된 법률행위가 무효라거나 변제 등으로 소멸하였다는 등의 사실을 주장하여 채권자 의 채무자에 대한 권리가 인정되는지를 다툴 수 없다.","chapter":"민법총칙","answer":"X"},{"id":784,"text":"토지거래허가구역에 있는 토지의 매수인은 채권보전의 필요성 여부와 무관하게 토지거래허가 신청절차의 협력의무 이행청구권을 보전하기 위하여 매도인의 권 리를 대위하여 행사할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":785,"text":"이행인수 약정이 체결된 경우, 채무자는 인수인이 그 채무를 이행하지 아니하면 인수인에 대하여 채권자에게 이행할 것을 청구할 수 있으나, 채무자의 인수인에 대한 위 청구권을 채권자가 대위행사할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":786,"text":"지하도상가 내 점포의 사용청구권을 가지는 자는 상가의 소유자인 시(市)가 불 법점유자들에 대하여 가지는 점포의 인도청구권을 대위행사할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":787,"text":"채권자가 수익자를 상대로 사해행위 취소 및 원상회복으로 소유권이전등기의 말 소를 명하는 판결을 받았으나 말소등기를 마치지 않은 경우, 소송당사자가 아닌 다른 채권자가 위 판결에 따라 채무자를 대위하여 마친 말소등기는 등기절차상 의 흠에도 불구하고 실체관계에 부합하는 등기로서 유효하다.","chapter":"민법총칙","answer":"O"},{"id":788,"text":"채권자의 채권이 사해행위 이전에 성립한 이상 사해행위 이후에 양도되었다고 하더라도 양수인의 채권은 채권자취소권의 피보전채권이 될 수 있다.","chapter":"민법총칙","answer":"O"},{"id":789,"text":"주채무의 전액에 관하여 물상보증인의 담보로 채권자의 우선변제권이 확보되어 있다면, 연대보증인이 유일한 재산을 처분하였더라도 사해행위가 되지 않는다.","chapter":"민법총칙","answer":"X"},{"id":790,"text":"채무자의 수익자에 대한 채권양도가 사해행위로 취소되고, 그에 따른 원상회복으 로서 제3채무자에게 채권양도가 취소되었다는 취지의 통지가 이루어진 경우, 채 권자는 채무자를 대위하여 제3채무자에게 채권에 관한 지급을 청구할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":791,"text":"채권자가 채무자의 채권자취소권을 대위행사하는 경우, 채권자취소권을 대위행 사하는 채권자가 취소원인을 안 지 1년이 경과하였다고 하더라도 채무자가 취소 원인을 안 날로부터 1년, 법률행위가 있은 날로부터 5년 내라면 채권자취소의 소를 제기할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":792,"text":"甲이 1천만원의 채무에 대한 소멸시효 기간이 경과한 후 시효의 이익을 포기한 경우, 丙은 소멸시효를 원용하여 연대보증채무의 소멸을 주장할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":793,"text":"甲이 乙에게 8백만원의 채권을 가지고 있는 경우, 丙은 5백만원의 한도 내에서 만 상계를 할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":794,"text":"乙이 甲에 대한 채권을 丁에게 양도하고 확정일자 있는 증서로 甲에게 통지한 경우, 乙이 丙에게 보증채권 양도의 통지를 해야 丙에 대한 채권이 丁에게 이전 된다.","chapter":"민법총칙","answer":"X"},{"id":795,"text":"乙의 甲에 대한 채권에 시효중단 사유가 발생한 경우, 丙에게 통지 등 별도의 중단조치를 하지 않아도 丙에게 시효중단의 효력이 미친다.","chapter":"민법총칙","answer":"O"},{"id":796,"text":"甲의 채무가 본래 단기소멸시효에 걸리는 것이었지만 확정판결에 의해 소멸시효 기간이 10년으로 연장된 경우, 丙의 보증채무도 10년의 소멸시효기간이 적용된다.","chapter":"민법총칙","answer":"X"},{"id":797,"text":"이행인수인은 법정대위를 할 수 있는 변제할 정당한 이익이 있는 자에 해당하지 않는다.","chapter":"민법총칙","answer":"X"},{"id":798,"text":"채권자와 보증인 사이에 보증인이 주채무를 중첩적으로 인수하기로 약정한 경 우, 특별한 사정이 없는 한 보증인은 주채무자에 대한 관계에서는 종전의 보증 인의 지위를 그대로 유지한다.","chapter":"민법총칙","answer":"O"},{"id":799,"text":"부동산 매수인이 매매목적물에 설정된 근저당권의 피담보채무를 이행인수한 뒤 그 변제를 게을리 하여 근저당권이 실행됨으로써 매도인이 매매목적물에 대한 소유권을 상실한 경우, 이는 매수인의 책임 있는 사유로 소유권이전등기의무가 이행불능으로 된 경우에 해당하고 그에 대하여 매도인의 과실도 인정된다.","chapter":"민법총칙","answer":"X"},{"id":800,"text":"계약당사자로서의 지위가 제3자에게 이전되는 경우, 계약상 지위를 전제로 한 권리관계가 이전될 뿐만 아니라 불법행위에 기한 손해배상청구권도 별도의 채권 양도절차 없이 제3자에게 당연히 이전된다.","chapter":"민법총칙","answer":"X"},{"id":801,"text":"채무자와 인수인의 합의에 의한 중첩적 채무인수의 경우, 채권자의 수익의 의사 표시는 계약의 성립요건이 아니라 효력발생요건이다. 각 1억원의 대여금채권을 가지고 있었는데, 그 후 甲의 채","chapter":"민법총칙","answer":"X"},{"id":802,"text":"가압류의 효력 발생 당시 乙의 채권과 甲의 채권의 변제기가 모두 도래한 경우, 乙은 상계로써 丙에게 대항할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":803,"text":"가압류 효력발생 당시 乙의 채권이 변제기에 도달하지 않은 경우, 乙의 채권의 변제기가 甲의 채권의 변제기와 동시에 도래하면, 乙은 상계로써 丙에게 대항할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":804,"text":"가압류의 효력발생 당시 乙의 채권이 변제기에 도달하지 않은 경우, 甲의 채권 의 변제기 후에 乙의 채권이 변제기에 도달하더라도 乙은 상계로써 丙에게 대항 할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":805,"text":"가압류 효력발생 당시 乙의 채권이 변제기에 도달하지 않은 경우, 乙의 채권의 변제기가 甲의 채권의 변제기보다 먼저 도래하면 乙은 상계로써 丙에게 대항할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":806,"text":"가압류 효력발생 당시 비록 甲과 乙의 채권이 변제기에 도달하였더라도 乙이 甲 에 대하여 상계의 의사표시를 하지 않은 경우, 특별한 사정이 없는 한 乙은 상 계로써 丙에게 대항할 수 없다. 품보관창고를 필요로 하는 乙의 요청에 따라 그 소유의 X토지를 乙","chapter":"민법총칙","answer":"X"},{"id":807,"text":"X주택의 소유권이전의무가 甲의 과실로 이행불능이 된 경우, 乙은 丙의 동의 없 이 매매계약을 해제할 수 있다.","chapter":"민법총칙","answer":"O"},{"id":808,"text":"甲과 丙 간의 금전소비대차계약이 취소되더라도 甲과 乙 간의 매매계약은 유효 하다.","chapter":"민법총칙","answer":"O"},{"id":809,"text":"甲과 乙 간의 매매계약이 乙의 사기를 이유로 취소된 경우, 丙이 그 사실을 몰 랐더라도 丙은 선의의 제3자로서 보호받지 못한다.","chapter":"민법총칙","answer":"O"},{"id":810,"text":"만약 丙이 甲의 대리인으로서 乙을 기망하여 乙이 위 매매계약을 체결한 경우, 乙은 丙의 대금지급청구를 거절할 수 있을 뿐이고 위 매매계약을 취소할 수는 없다.","chapter":"민법총칙","answer":"O"},{"id":811,"text":"甲의 채무불이행으로 위 매매계약이 해제된 경우, 乙이 丙에게 매매대금의 일부 를 이미 지급하였더라도, 특별한 사정이 없는 한 乙은 丙을 상대로 부당이득을 원인으로 이미 지급한 대금의 반환을 청구할 수 없다. 택을 대금 1억원에 매도하면서 계","chapter":"민법총칙","answer":"X"},{"id":812,"text":"만약 계약 당시 乙이 계약금 5백만원을 지급하였더라도 계약의 이행 착수 전이 라면, 甲은 1천만원을 상환하고 위 매매계약을 해제할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":813,"text":"甲의 채권자 丙이 2015. 2. 15. 甲의 잔대금 채권을 가압류한 경우라면, 丙은 민 법 제548조 제1항 단서에 의해 보호받을 수 있는 제3자에 해당한다.","chapter":"민법총칙","answer":"X"},{"id":814,"text":"2015. 3. 1. 丁이 乙과 X주택에 대하여 매매예약을 하고 그에 기해 소유권이전등 기청구권 보전을 위한 가등기를 마쳤다면, 위 매매계약의 해제에도 불구하고 丁 은 매매예약에 기한 본등기를 할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":815,"text":"乙 명의의 등기말소 전인 2015. 4. 20. 乙로부터 X주택의 일부를 임차하여 주택 임대차보호법상 대항력을 갖춘 임차인은 위 매매계약이 해제된 사실을 알고 있 었더라도 X주택에 대한 甲의 명도청구에 대항할 수 있다.","chapter":"민법총칙","answer":"X"},{"id":816,"text":"X주택을 사용한 乙이 계약의 해제로 이를 甲에게 반환하는 경우, X주택이 乙의 사용으로 인해 훼손되었다고 볼 수 없는 경우에도 그 사용이익 외에 감가상각비 를 별도로 산정하여 반환하여야 한다. 영업공간을 제공하고, 乙과 丙은 각 1억원을 출자하여 A식당을 공동","chapter":"민법총칙","answer":"O"},{"id":817,"text":"甲과 乙은 丙에 대하여 3천 5백만원의 손해배상채무를 부담한다.","chapter":"민법총칙","answer":"O"},{"id":818,"text":"甲이 丙에 대한 대여금채권을 자동채권으로 하여 2천만원을 상계한 경우, 乙은 丙에 대하여 4백 5십만원의 손해배상채무를 부담하게 된다.","chapter":"민법총칙","answer":"O"},{"id":819,"text":"甲이 丙에게 손해배상채무를 전액 배상한 경우, 甲의 乙에 대한 구상채권의 소멸시효 는 10년으로 완성되고, 그 기산점은 甲이 현실로 丙에게 손해배상금을 지급한 때이다.","chapter":"민법총칙","answer":"O"},{"id":820,"text":"甲이 丙에게 1천만원을 배상한 경우, 甲은 乙에 대하여 구상할 수 없다.","chapter":"민법총칙","answer":"X"},{"id":821,"text":"甲의 보증인 丁이 丙에 대하여 손해배상채무를 변제한 경우, 丁은 乙에게 乙의 부담부분에 한하여 구상권을 행사할 수 있다. 차인에게 불리한 약정을 하여도 그 효력이 인정되는 것은?","chapter":"민법총칙","answer":"O"},{"id":822,"text":"사업자와 고객 사이에 교섭이 이루어진 약관 조항도 「약관의 규제에 관한 법률」에 정한 약관에 해당한다.","chapter":"민법총칙","answer":"X"},{"id":823,"text":"약관조항이 무효로 되면, 민법상 일부무효의 법리에 따라 그 전부를 무효로 함이 원칙이다.","chapter":"민법총칙","answer":"X"},{"id":824,"text":"약관에 정하여진 사항이 거래상 일반적이고 공통된 것이어서 고객이 별도의 설명 없이도 충분히 예상할 수 있었던 사항이더라도, 사업자에게 명시ㆍ설명 의무가 있다.","chapter":"민법총칙","answer":"X"},{"id":825,"text":"사업자가 고객의 대리인과 계약을 체결하는 경우, 설명의무의 상대방이 계약자 본인에 국한되는 것은 아니므로 그 대리인에게 약관을 설명하는 것으로 충분하다.","chapter":"민법총칙","answer":"X"},{"id":826,"text":"동일한 약관집 내의 대다수의 조항들이 교섭되고 변경된 사정이 있다고 하더라 도, 변경되지 아니한 나머지 소수의 조항들에 대해서 교섭이 이루어진 것으로 추정할 수는 없다.","chapter":"민법총칙","answer":"O"},{"id":827,"text":"수탁보증인의 사전구상권에 관한 민법 제442조는 원칙적으로 물상보증인에 게도 적용되므로 물상보증인은 사전구상권을 행사할 수 있다.","chapter":"채권총론","answer":"O"},{"id":828,"text":"물상보증인이 담보권의 실행으로 타인의 채무를 담보하기 위하여 제공한 부동산의 소유권을 잃은 경우, 물상보증인이 채무자에게 구상할 수 있는 범위는 특별한 사정이 없는 한 매수인이 매각대금을 완납한 때의 부동산시 가가 아니라 매각대금을 기준으로 하여야 한다.","chapter":"채권총론","answer":"O"},{"id":829,"text":"근저당권의 물상보증인은 민법 제357조에서 말하는 채권의 최고액만을 변 제하면 근저당권설정등기의 말소청구를 할 수 있고, 채권최고액을 초과하 는 부분의 채권액까지 변제할 의무가 있는 것이 아니다.","chapter":"채권총론","answer":"X"},{"id":830,"text":"대위변제자와 채무자 사이의 구상금에 관한 지연손해금 약정은 특별한 사정이 없는 한 변제자대위권의 행사에는 적용될 수 없다.","chapter":"채권총론","answer":"O"},{"id":831,"text":"근저당권의 피담보채권이 확정되기 전에는 그 채권의 일부가 대위변제되더라도 그 근 저당권이 대위변제자에게 이전될 수 없다.","chapter":"채권총론","answer":"O"},{"id":832,"text":"보증인이 채무를 변제한 후 저당권의 등기에 대위를 부기하지 않아도 그 저당물에 후 순위 근저당권을 취득한 제3자에 대하여 채권자를 대위할 수 있다.","chapter":"채권총론","answer":"O"},{"id":833,"text":"채무자로부터 담보부동산을 취득한 후에 채무를 변제한 제3자는 물상보증인에 대하여 채권자를 대위할 수 있다.","chapter":"채권총론","answer":"X"},{"id":834,"text":"수인( 數人 )의 물상보증인 중 1인이 채무를 변제한 때에는 다른 물상보증인에 대하여 각 액 비례 부동산의 가 에 하여 채권자를 대위한다.","chapter":"채권총론","answer":"O"},{"id":835,"text":"타인 소유의 토지 위에 권한 없이 건물을 소유하고 있는 자는 이를 사용ㆍ수익하지 않았더라도 특별한 사정이 없는 한, 그 자체만으로 토지소유자에게 토지의 차임에 상 당하는 부당이득반환의무를 부담한다.","chapter":"채권총론","answer":"O"},{"id":836,"text":"물상대위권을 행사하지 아 니하여 우선변제권을 상실한 저당권자는 저당목적물에 갈음 한 보상금으로 이득을 얻은 다른 채권자에 대하여 그 이익을 부당이득으로 반환청구 할 수 없다.","chapter":"채권총론","answer":"O"},{"id":837,"text":"채권자가 채무자에게 지급되어야 할 대상(代償)청구의 대상이 되는 보상금을 어떤 사 유로 직접 자신의 명의로 지급받았다면 채무자에 대한 관계에서 바로 부당이득이 된 다.","chapter":"채권총론","answer":"X"},{"id":838,"text":"법률상 원인 없이 제3자에 대한 채권을 취득한 경우, 채권의 이득자가 아직 그 채권을 현실적으로 추심하지 못하였다면 손실자는 채권의 이득자에 대하여 그 채권 가 에 해 액 당하는 금전의 반환을 청구할 수 없다.","chapter":"채권총론","answer":"O"},{"id":839,"text":"채무자가 피해자로부터 횡령한 금전을 자신의 채권자에 대한 채무변제에 사용하는 경 우, 채권자가 변제를 수령하면서 그 금전이 횡령한 것이라는 사실에 대하여 악의 또 는 중대한 과실이 없는 한 채권자의 금전취득은 피해자에 대한 관계에서 법률상 원인 이 있는 것으로 보아야 한다.","chapter":"채권총론","answer":"O"},{"id":840,"text":"토지에 관하여 근저당권을 설정함과 아울러 그 토지의 담보가치가 저감하는 것을 막 기 위해 채권자 앞으로 건물의 소유를 목적으로 하는 지상권이 설정된 경우, 피담보 채권의 변제로 근저당권이 소멸하더라도 그 지상권은 소멸하지 않는다.","chapter":"채권총론","answer":"X"},{"id":841,"text":"존속기간의 만료로 지상권이 소멸할 당시에 건물이 현존한 경우, 지상권자가 계약갱 신청구권을 행사하더라도 지상권설정자가 이를 거절하면 지상권은 갱신되지 않는다.","chapter":"채권총론","answer":"O"},{"id":842,"text":"지상권이 소멸한 때 지상권설정자가 상당한 가액을 제공하여 건물의 매수를 청구한 때에는 지상권자는 정당한 이유없이 이를 거절하지 못한다.","chapter":"채권총론","answer":"O"},{"id":843,"text":"건물의 소유를 목적으로 하는 지상권에서 그 건물이 멸실되더라도 존속기간이 만료되 멸되지 않는다. 지 않은 한 지상권은 소","chapter":"채권총론","answer":"O"},{"id":844,"text":"무상(無償)의 지상권자는 언제든지 지상권을 포기할 수 있지만, 지상권이 저당권의 목 적인 때에는 저당권자의 동의가 있어야 포기할 수 있다.","chapter":"채권총론","answer":"O"},{"id":845,"text":"동산질권은 선의취득의 대상이 될 수 있다.","chapter":"채권총론","answer":"O"},{"id":846,"text":"저당권으로 담보한 채권을 질권의 목적으로 한 때에는 그 저당권등기에 질권의 부기 등기를 하여야 그 효력이 저당권에 미친다.","chapter":"채권총론","answer":"O"},{"id":847,"text":"근질권이 설정된 금전채권에 대하여 제3자의 압류로 강제집행절차가 개시된 경우, 근질 권의 피담보채권은 근질권자가 그 강제집행이 개시된 사실을 알게 된 때에 확정된다.","chapter":"채권총론","answer":"O"},{"id":848,"text":"채무자의 부탁으로 그의 채무를 담보하기 위하여 자기 소유의 동산에 질권을 설정한 자는 그 채무의 이행기가 도래한 때 채무자에게 미리 구상권을 행사할 수 있다.","chapter":"채권총론","answer":"X"},{"id":849,"text":"질물의 변형물인 금전 기타 물건에 대하여 이미 제3자가 압류한 경우, 질권자 스스로 이를 압류하지 않아도 물상대위권을 행사할 수 있다.","chapter":"채권총론","answer":"O"},{"id":850,"text":"공동불법행위자 甲과 乙중 甲의 손해배상채무가 시효로 소 멸한 후에 乙이 피해자에게 자기의 부담 부 분을 넘는 손해를 배상한 경우, 乙은 甲을 상대로 구상권을 행사할 수 없다.","chapter":"채권총론","answer":"X"},{"id":851,"text":"자신의 과실에 의해 초래된 급박한 위난을 피하기 위해 부득이 타인에게 손해를 가한 자는 그 손해에 대한 배상책임을 지지 않는다.","chapter":"채권총론","answer":"X"},{"id":852,"text":"공작물의 설치ㆍ보존의 하자로 인해 타인에게 입힌 손해에 대하여 점유자가 면책된 경우, 그 공작물의 소유자는 과실이 없어도 배상책임을 진다.","chapter":"채권총론","answer":"O"},{"id":853,"text":"피용자와 제3자가 공동불법행위에 따른 손해배상채무를 부담하는 경우, 사용자가 피 용자와 제3자의 책임비율에 의해 정해진 부담부분을 초과하여 피해자에게 배상하더라 도 제3자에 대하여 구상권을 행사할 수 없다.","chapter":"채권총론","answer":"X"},{"id":854,"text":"불법행위로 인하여 건물이 훼손되어 사용 및 수리가 불가능한 경우, 손해배상액의 기 준이 되는 건물의 시가에는 원칙적으로 건물의 철거비용이 포함된다.","chapter":"채권총론","answer":"X"},{"id":855,"text":"결산기에 확정된 채권액이 채권최고액을 넘는 경우, 채무자 겸 근저당권설정자는 최 고액을 임의로 변제하더라도 근저당권등기의 말소를 청구할 수 없다.","chapter":"채권총론","answer":"O"},{"id":856,"text":"공동근저당권자가 X건물과 Y건물에 대하여 공동저당을 설정한 후, 제3자가 신청한 X건 물에 대한 경매절차에 참가하여 배당을 받으면, Y건물에 대한 피담보채권도 확정된다.","chapter":"채권총론","answer":"X"},{"id":857,"text":"공동근저당권자가 후순위근저당권자에 의하여 개시된 경매절차에서 피담보채권의 일 부를 배당받은 경우, 우선변제 받은 금액에 관하여는 다시 공동근저당권자로서 우선 변제권을 행사할 수 없다.","chapter":"채권총론","answer":"O"},{"id":858,"text":"원본의 이행기일을 경과한 후 발생하는 지연 손해금 중 1년이 지난 기간에 대한 지연 손해금도 근저당권의 채권최고액 한도에서 전액 담보된다.","chapter":"채권총론","answer":"O"},{"id":859,"text":"근저당권의 피담보채권인 원본채권이 확정된 후에 발생하는 이자나 지연손해금 채권 은 그 근저당권의 채권최고액의 범위에서 여전히 담보된다.","chapter":"채권총론","answer":"O"},{"id":860,"text":"공동불법행위자 들 중에 고의로 불법행위를 행한 자가 있는 경우, 모든 공동불법행위 자가 과실상계의 주장을 할 수 없다.","chapter":"채권총론","answer":"X"},{"id":861,"text":"위법행위 시점과 손해의 발생 시점에 시간적 간격이 있는 경우, 불법행위로 인한 재 산상 손해에 대한 배상책임이 성립하는 시기는 손해의 발생 시점이다.","chapter":"채권총론","answer":"O"},{"id":862,"text":"금전을 대여한 채권자가 고의 또는 과실로 이자제한법을 위반하여 최고이자율을 초과 하는 이자를 받아 채무자에게 손해를 입힌 경우, 특별한 사정이 없는 한 불법행위가 성립한다.","chapter":"채권총론","answer":"O"},{"id":863,"text":"민법 제756조(사용자의 배상책임)의 사용관계는 실제로 지휘ㆍ감독하고 있는지 여부 에 의하여 결정되는 것이 아니라 객관적으로 지휘ㆍ감독을 하여야 할 관계에 있는지 여부에 따라 결정된다.","chapter":"채권총론","answer":"O"},{"id":864,"text":"불법행위로 인한 손해배상채무는 특별한 사정이 없는 한 채무 성립과 동시에 지연손 해금이 발생한다.","chapter":"채권총론","answer":"O"},{"id":865,"text":"동산매매계약에서 매도인 甲이 매수인 乙에 대해 잔금 지급기일 도과를 이유로 지연 손해금을 청구하려면 甲은 자기 채무의 이행제공을 계속하여야 한다.","chapter":"채권총론","answer":"O"},{"id":866,"text":"신축 중인 상가를 乙에게 분양한 甲이 분양대금의 중도금지급기한을 1층 골조공사 완 료시로 약정한 경우, 1층 골조공사 완료 후 乙이 그 사실을 안 날의 다음 날부터 중 도금지급채무의 지체책임을 진다.","chapter":"채권총론","answer":"O"},{"id":867,"text":"이행기의 정함이 없는 매매대금채권을 甲으로부터 양수한 丙이 채무자 乙을 상대로 그 이행을 구하는 소를 제기하고 소송 계속 중 甲이 乙에 대해 채권양도통지를 한 경 우, 특별한 사정이 없는 한 乙은 채권양도통지가 도달된 날의 다음 날부터 이행지체 의 책임을 진다.","chapter":"채권총론","answer":"O"},{"id":868,"text":"매수인 乙이 매도인 甲의 영업소에서 쌀 10포대를 받아가기로 약정한 경우, 乙이 변 제기 이후에 오지 않은 이상 甲은 지연에 따른 손해배상책임을 지지 않는다.","chapter":"채권총론","answer":"O"},{"id":869,"text":"甲은 乙로부터 1억 원을 빌리면서 5회에 걸쳐 매회 2천만 원씩 분할상환하되, 분할변 제기한을 1회라도 지체하였을 때는 기한의 이익을 잃는 것으로 특약한 경우, 특별한 사정이 없는 한 甲은 1회 변제기한이라도 지체하면 미상환금액 전부에 대하여 지체책 임을 진다.","chapter":"채권총론","answer":"X"},{"id":870,"text":"수임인이 위임사무의 처리과정에서 받은 물건으로 위임인에게 인도할 목적물이 대체 물이더라도 당사자 사이에는 특정된 물건과 같은 것으로 보아야 한다.","chapter":"채권총론","answer":"O"},{"id":871,"text":"채권의 성질 또는 당사자의 의사표시로 달리 정한 바가 없는 이상, 특정물의 인도는 채권성립 당시의 그 물건의 소재지에서 한다.","chapter":"채권총론","answer":"O"},{"id":872,"text":"제한종류채권에서 채무자가 지정권자인 경우, 채권의 기한이 도래한 후 채권자의 최고 에도 불구하고 채무자가 이행할 물건을 지정하지 않으면 그 지정권은 채권자에게 이전 한다.","chapter":"채권총론","answer":"O"},{"id":873,"text":"채권액이 외국통화로 지정된 금액채권인 외화채권의 경우, 채권자는 대용급부권을 행 사하여 우리나라 통화로 환산하여 청구할 수 없다.","chapter":"채권총론","answer":"X"},{"id":874,"text":"이자제한법상 제한이자를 초과하는 이자채권을 자동채권으로 하여 상계의 의사표시를 하더라도 그 상계의 효력은 발생하지 않는다.","chapter":"채권총론","answer":"O"},{"id":875,"text":"토지거래허가구역 내의 토지에 관하여 허가를 조건으로 매매계약을 체결한 경우, 그 허가 전에는 거래계약상의 채무를 이행할 수 없게 되더라도 그에 따른 손해배상책임 을 지지 않는다.","chapter":"채권총론","answer":"O"},{"id":876,"text":"쌍무계약에서 당사자 일방이 부담하는 채무의 일부만이 채무자의 책임 있는 사유로 이행할 수 없게 된 경우, 이행가능한 나머지 부분만의 이행으로 계약목적을 달성할 수 없다면 채무의 이행은 전부가 불능이라고 보아야 한다.","chapter":"채권총론","answer":"O"},{"id":877,"text":"민법상 임대차에서 목적물을 사용ㆍ수익하게 할 임대인의 의무는 임대인이 임대차목 적물의 소유권을 상실한 것만으로 이행불능이 된다.","chapter":"채권총론","answer":"X"},{"id":878,"text":"매매목적물에 관하여 매도인의 다른 채권자가 강제경매를 신청하여 그 절차가 진행 중에 있다는 사유만으로 매도인의 채무가 이행불능이 되는 것은 아니다.","chapter":"채권총론","answer":"O"},{"id":879,"text":"쌍무계약에서 당사자 일방의 급부뿐만 아니라 상대방의 반대급부도 전부 이행불능이 된 경우, 특별한 사정이 없는 한 당사자 일방은 상대방에게 대상청구를 할 수 없다.","chapter":"채권총론","answer":"O"},{"id":880,"text":"채무자와 채무인수인 사이의 면책적 채무인수에서 채권자가 승낙을 거절하였더라도 다시 승낙하면 채무인수의 효력이 생긴다.","chapter":"채권총론","answer":"X"},{"id":881,"text":"채무자와 채무인수인 사이의 면책적 채무인수에서 채권자가 채무인수인에게 인수금의 지급을 청구하더라도 채무인수의 승낙으로 볼 수 없다.","chapter":"채권총론","answer":"X"},{"id":882,"text":"채무자와 채무인수인 사이의 면책적 채무인수에서 채권자의 승낙이 없는 경우, 채무 자와 인수인 사이에는 이행인수로서의 효력도 인정될 수 없다.","chapter":"채권총론","answer":"X"},{"id":883,"text":"채권자와 채무인수인 사이의 중첩적 채무인수는 채무자의 의사에 반하여도 이루어질 수 있다.","chapter":"채권총론","answer":"O"},{"id":884,"text":"면책적 채무인수의 경우, 채무인수인은 채무자에 대한 항변사유로 채권자에게 대항할 수 있다.","chapter":"채권총론","answer":"X"},{"id":885,"text":"甲과 乙이 공유하는 부동산을 丙에게 공동으로 임대한 경우, 임대차 종료 시 甲과 乙 은 지분비율에 따라 丙에게 임대차보증금을 반환할 채무를 부담한다.","chapter":"채권총론","answer":"X"},{"id":886,"text":"丙에 대해 불가분채권을 가지고 있는 甲과 乙 중 甲이 丙에게 이행을 청구하여 丙이 이행지체에 빠진 경우, 丙은 乙에게도 이행지체 책임을 진다.","chapter":"채권총론","answer":"O"},{"id":887,"text":"甲과 乙이 공유하는 부동산을 丙이 무단으로 점유ㆍ사용하고 있는 경우, 특별한 사정 이 없는 한 甲과 乙은 丙에 대해 지분 비율에 따른 부당이득반환청구권을 갖는다.","chapter":"채권총론","answer":"O"},{"id":888,"text":"甲이 乙의 丙에 대한 채무를 중첩적으로 인수하는 경우, 甲과 乙은 원칙적으로 연대 채무를 부담한다.","chapter":"채권총론","answer":"O"},{"id":889,"text":"甲의 채권자 丁이 甲의 연대채무자 乙, 丙에 대한 채권 중 甲의 乙에 대한 채권에 대 해 압류 및 추심명령을 발령받았더라도 甲은 丙에 대해 이행을 청구할 수 있다.","chapter":"채권총론","answer":"O"},{"id":890,"text":"甲이 丙에게 공사대금채권의 추심 기타 행사를 위임하면서 그 채권을 양도하였으나 양도의 원인인 위임이 해지된 경우, 공사대금채권은 甲에게 복귀한다.","chapter":"채권총론","answer":"O"},{"id":891,"text":"甲이 주채무자 乙에 대한 채권과 그의 보증인 丁에 대한 채권 중 丁에 대한 채권만을 양도하기로 한 경우, 그 약정은 효력이 없다.","chapter":"채권총론","answer":"O"},{"id":892,"text":"甲과 乙 사이에 채권양도금지특약이 있는 경우, 이와 같은 사실을 알고 있는 甲의 채 권자 戊가 甲의 乙에 대한 채권에 대해 압류 및 전부명령을 받았다면 乙은 戊에게 위 특약에 의해 대항할 수 없다.","chapter":"채권총론","answer":"O"},{"id":893,"text":"甲이 丙에게 공사대금채권 중 5,000만 원만 양도하고 乙에게 채권양도통지 후 乙이 甲에 대한 2,000만 원의 하자보수에 갈음하는 손해배상채권을 취득한 경우, 乙의 위 채권에 의한 상계는 각 분할된 채권액의 채권 총액에 대한 비율에 따라야 한다.","chapter":"채권총론","answer":"X"},{"id":894,"text":"甲의 丙에 대한 채권양도 및 乙에 대한 확정일자부 통지와 甲의 채권자 戊가 신청한 甲의 乙에 대한 채권에 대한 압류 및 전부명령이 乙에게 동시에 도달한 경우, 乙은 채권자를 알 수 없음을 이유로 변제공탁을 할 수 있다.","chapter":"채권총론","answer":"O"},{"id":895,"text":"甲은 乙에 대해 1,000만 원의 채무를 부담하고 있는데, 丙이 자신의 채 무로 오해하여 乙에게 1,000만 원을 지급한 경우, 제3자 변제에 해당하 지 않는다.","chapter":"채권총론","answer":"O"},{"id":896,"text":"甲이 그의 乙에 대한 공사대금채무의 담보로 乙의 유치권이 성립한 그 소유의 건물을 丙에게 매도하면서 소유권이전등기시까지 임대한 경우, 丙은 甲의 의사에 반하여 공사대금채무를 乙에게 변제할 수 없다.","chapter":"채권총론","answer":"X"},{"id":897,"text":"예금주 甲의 대리인이라고 주장하는 乙이 甲의 통장과 인감을 소지하고 丙은행에 예금반환청구를 한 경우, 대리인을 사칭한 乙은 채권의 사실 상 귀속자와 같은 외형을 갖추고 있지 아니하여 채권의 준점유자로 볼 수 없다.","chapter":"채권총론","answer":"X"},{"id":898,"text":"지시채권 증서 소지인 甲에 대한 乙의 변제는 乙이 甲의 권리 없음을 알았거나 중과실이 있는 경우를 제외하고 유효하다.","chapter":"채권총론","answer":"O"},{"id":899,"text":"甲이 乙을 상대로 위 대여금채무의 이행청구소송을 제기하였으나 2020. 9. 1. 원고패 소로 확정된 경우, 甲의 사해행위취소청구는 인용될 수 없다.","chapter":"채권총론","answer":"O"},{"id":900,"text":"乙이 2020. 9. 1. 甲의 위 대여금채권에 대한 담보로 그 소유의 X부동산에 저당권설정 등기를 한 경우, 우선변제적 효력이 미치는 범위 내에서는 甲의 채권자취소권 행사도 허용되지 않는다.","chapter":"채권총론","answer":"O"},{"id":901,"text":"甲이 위 대여금채권에 기해 2021. 1. 3. 乙 소유의 X부동산에 가압류를 한 후 乙은 丁 의 丙에 대한 채무를 담보하기 위해 X부동산에 대하여 2021. 1. 15. 丙과 저당권설정계 약을 체결하고 저당권설정등기를 마쳐준 경우, 甲은 채권자취소권을 행사할 수 있다.","chapter":"채권총론","answer":"O"},{"id":902,"text":"乙이 2020. 10. 3. 그 소유 X부동산(시가 6,000만 원)과 Y부동산(시가 4,000만 원)에 丁에 대한 3,000만 원의 피담보채무를 담보하기 위해 공동저당권을 설정한 후, 2021.","chapter":"채권총론","answer":"O"},{"id":903,"text":"甲과 乙이 미리 매매계약에서 丙의 권리를 변경 소멸할 수 있음을 유보한 경우, 이 러한 약정은 丙에 대해서도 효력이 있다.","chapter":"채권총론","answer":"O"},{"id":904,"text":"甲은 丙의 동의가 없는 한 乙의 채무불이행을 이유로 계약을 해제할 수 없다.","chapter":"채권총론","answer":"X"},{"id":905,"text":"제3자를 위한 계약의 체결 원인이 된 甲과 丙 사이의 법률관계가 취소된 경우, 특별 한 사정이 없는 한 乙은 丙에게 대금지급을 거절할 수 없다.","chapter":"채권총론","answer":"O"},{"id":906,"text":"乙의 채무불이행을 이유로 甲이 계약을 해제한 경우, 丙은 乙에게 자기가 입은 손해 에 대한 배상을 청구할 수 있다.","chapter":"채권총론","answer":"O"},{"id":907,"text":"甲과 乙의 매매계약이 취소된 경우, 乙이 丙에게 이미 매매대금을 지급하였다고 하더 라도 특별한 사정이 없는 한 乙은 丙을 상대로 부당이득반환청구를 할 수 없다.","chapter":"채권총론","answer":"O"},{"id":908,"text":"지상권은 1필 토지의 전부가 아닌 일부에 대해서는 성립할 수 없다.","chapter":"채권총론","answer":"X"},{"id":909,"text":"지상권자는 존속기간이 만료한 때에 지상물이 현존하는 경우, 지상권설정자에 대해 선택적으로 지상권의 갱신청구 또는 지상물의 매수청구를 할 수 있다.","chapter":"채권총론","answer":"X"},{"id":910,"text":"지상권은 지상물의 소유를 목적으로 토지를 사용하는 권리이므로, 지상권자는 지상권을 유보한 채 지상물 소유권만을 양도할 수 없다.","chapter":"채권총론","answer":"X"},{"id":911,"text":"지상권의 지료지급 연체가 토지소유권의 양도 전후에 걸쳐 이루어진 경우, 토지양수인 에 대한 연체기간이 2년 이상이면 토지양수인은 지상권의 소멸을 청구할 수 있다.","chapter":"채권총론","answer":"O"},{"id":912,"text":"금융기관이 토지에 저당권과 함께 지료 없는 지상권을 설정받으면서 채무자의 사용 수익권을 배제하지 않은 경우, 금융기관은 그 토지의 무단점유자에 대해 지상권침해 를 근거로 임료 상당의 손해배상을 청구할 수 있다.","chapter":"채권총론","answer":"X"},{"id":913,"text":"보증인은 보증채무에 대하여 위약금 또는 손해배상액을 예정할 수 있다.","chapter":"채권총론","answer":"O"},{"id":914,"text":"채무자가 보증인을 세울 의무가 있는 경우, 채권자가 보증인을 지명하였다면 보증인은 행위능력 및 변제자력이 없어도 된다.","chapter":"채권총론","answer":"O"},{"id":915,"text":"주채무자의 의사에 반하여 보증인이 된 자가 과실 없이 변제 기타 자기의 출재로 주채무를 소멸시킨 경우, 주채무자는 현존 이익의 한도에서 배상하여야 한다.","chapter":"채권총론","answer":"O"},{"id":916,"text":"채권자가 연대보증인에게 채무이행을 청구한 경우, 연대보증인은 채무자의 변제자력이 있는 사실 및 그 집행이 용이할 것을 증명하여 먼저 채무자에게 청구할 것과 그 재산에 대하여 집행할 것을 항변할 수 있다.","chapter":"채권총론","answer":"X"},{"id":917,"text":"주채무자의 부탁으로 보증인이 된 자가 과실 없이 변제 기타의 출재로 주채무를 소멸 시킨 경우, 보증인은 주채무자를 상대로 면책된 날 이후의 법정이자에 관하여 구상청구 를 할 수 있다.","chapter":"채권총론","answer":"O"},{"id":918,"text":"수인이 공동의 불법행위로 타인에게 손해를 가한 때에는 연대하여 그 손해를 배상할 책임이 있다.","chapter":"채권총론","answer":"O"},{"id":919,"text":"공동불법행위가 성립하기 위해서는 행위자 사이에 의사의 공통이나 행위공동의 인식은 필요하지 않다.","chapter":"채권총론","answer":"O"},{"id":920,"text":"공동불법행위자 중 1인의 변제는 변제된 금액의 한도 내에서 다른 공동불법행위자를 위하여 공동면책의 효력이 있다.","chapter":"채권총론","answer":"O"},{"id":921,"text":"가해자불명의 공동불법행위의 경우, 개별 행위자가 자기의 행위와 손해발생 사이에 인과관계가 없음을 증명하면 불법행위책임을 면한다.","chapter":"채권총론","answer":"O"},{"id":922,"text":"공동불법행위자 중 1인인 甲의 손해배상채무가 시효로 소멸한 후에, 다른 공동불법행 위자 乙이 피해자에게 자기의 부담부분을 넘는 손해를 배상하였더라도 乙은 甲에게 구상권을 행사할 수 없다.","chapter":"채권총론","answer":"X"},{"id":923,"text":"채권자지체 중에 채무자가 채권의 목적물을 보관하 던 중 그의 경과실로 목적물 이 멸실된 경우, 채무자는 그 멸실로 인한 책임이 없다.","chapter":"채권총론","answer":"X"},{"id":924,"text":"채권자지체 중에 이행불능이 된 경우, 채권자지체가 발생한 사실에 대한 증 명책 임은 채권자에게 있다.","chapter":"채권총론","answer":"X"},{"id":925,"text":"채권자지체로 인하여 채권의 목적물을 보관 또는 변제하기 위한 비용이 증가된 때에 그 증가 액은 채무자가 부담한다.","chapter":"채권총론","answer":"X"},{"id":926,"text":"이자 있는 채권의 경우에 채권자지체 중에도 채무자는 이자를 지 할 의무가 있다. 급","chapter":"채권총론","answer":"X"},{"id":927,"text":"민법 제538조 제1항의 ‘채권자의 수 령지체 중에 당사자 쌍방의 책임 없는 사유 로 채무를 이행할 수 없게 된 때’에 해당하기 위해서 채무자의 현실 제공 또는 구두 제공이 필요한 것은 아니다.","chapter":"채권총론","answer":"O"},{"id":928,"text":"甲이 丁에 대한 4천만원의 반대채권을 가지고 유효하게 상계한 경우, 丙은 2천 만원의 채무를 면한다.","chapter":"채권총론","answer":"X"},{"id":929,"text":"乙이 6천만원의 지급에 갈음하여 丁에게 자신의 주택의 소유권이전을 내용으로 하는 경개계약을 체결한 경우, 甲과 丙의 丁에 대한 연대채무는 소멸한다.","chapter":"채권총론","answer":"O"},{"id":930,"text":"甲이 丁에게 6천만원을 변제하고 과실(過失) 없이 바로 乙과 丙에게 구상하려는 데 乙이 무자력이 된 경우, 甲은 丙에게 3천만원을 구상할 수 있다.","chapter":"채권총론","answer":"O"},{"id":931,"text":"丁이 丙의 채무를 면제한 경우, 甲과 乙은 丁에 대해 4천만원에 대하여 연대채 무를 부담한다.","chapter":"채권총론","answer":"O"},{"id":932,"text":"甲이 乙과 丙에게 사전통지를 하지 않은 채 丁에게 채무 전부를 변제하고 乙과 丙에게 구상권을 행사하였는데 乙이 甲의 변제 전에 丁에 대하여 4천만원의 상 계적상인 반대채권을 갖고 있었던 경우, 乙의 丁에 대한 채권은 2천만원에 한하 여 甲에게 이전된다.","chapter":"채권총론","answer":"O"},{"id":933,"text":"甲과 乙 상호간의 채권이 상계로 인해 소멸하는 경우, 그 효력은 각 채무가 상 계할 수 있는 때로 소급하여 발생한다.","chapter":"채권총론","answer":"O"},{"id":934,"text":"丙은 甲의 乙에 대한 위 금전채권에 의한 상계로 乙에게 대항할 수 있다.","chapter":"채권총론","answer":"O"},{"id":935,"text":"甲과 乙이 상계금지 특약을 하였는데, 乙에 대해 보증금반환채무를 부담하는 A 가 그 특약 사실을 모른 채 甲의 乙에 대한 위 금전채권을 양수하고 채권양도의 대항요건을 갖춘 경우, A는 그 양수채권을 가지고 乙에 대한 자신의 채무와 상 계할 수 있다.","chapter":"채권총론","answer":"O"},{"id":936,"text":"만약 丁이 乙의 甲에 대한 대여금채권을 압류한 이후에 甲이 乙에게 자동차를 매도하여 위 금전채권을 취득하였다면, 甲은 乙에 대한 위 금전채권에 의한 상 계로써 丁에게 대항할 수 있다.","chapter":"채권총론","answer":"X"},{"id":937,"text":"만약 甲의 乙에 대한 위 금전채권이 고의의 불법행위로 인한 것이라면, 甲은 이 를 자동채권으로 하여 상계할 수 있다.","chapter":"채권총론","answer":"O"},{"id":938,"text":"전세권설정자가 전세권자에 대하여 민법 제315조에 정한 손해배상채권 이외의 다른 채권을 가지고 있더라도 특별한 사정이 없는 한, 이를 가지고 전세금반환 채권에 대하여 물상대위권을 행사한 전세권저당권자에게 상계로 대항할 수 없다.","chapter":"채권총론","answer":"O"},{"id":939,"text":"X건물에 대해 1순위 저당권자 甲, 2순위 전세권자 乙, 3순위 저당권자 丙이 있고 그 중 丙이 경매신청을 하여 丁에게 매각된 경우, 乙의 전세권은 소멸하되 2순위 로 우선변제권을 가진다.","chapter":"채권총론","answer":"O"},{"id":940,"text":"타인의 토지에 있는 건물에 전세권을 설정한 경우, 전세권의 효력은 그 건물의 소유를 목적으로 한 지상권에 미친다.","chapter":"채권총론","answer":"O"},{"id":941,"text":"지상권을 가진 건물소유자가 그 건물에 전세권을 설정하였으나 그가 2년 이상의 지료를 지급하지 아니한 경우, 토지소유자는 전세권자의 동의 없이 지상권 소멸 청구를 할 수 없다.","chapter":"채권총론","answer":"X"},{"id":942,"text":"전세권에 저당권이 설정되어 있는 경우에도 전세권의 존속기간이 만료되면 전세 권의 용익물권적 권능은 전세권설정등기의 말소등기 없이도 당연히 소멸한다.","chapter":"채권총론","answer":"O"},{"id":943,"text":"피담보채권을 저당권과 함께 양수한 자는 저당권 이전의 부기등기를 마치고 저 당권실행의 요건을 갖추고 있는 한 채권양도의 대항요건을 갖추고 있지 아니하 더라도 경매신청을 할 수 있다.","chapter":"채권총론","answer":"O"},{"id":944,"text":"저당권설정자로부터 저당토지에 용익권을 설정 받은 자가 그 토지에 건물을 축 조한 경우라도 그 후 저당권설정자가 그 건물의 소유권을 취득하였다면, 저당권 자는 토지와 함께 그 건물에 대하여 경매를 신청할 수 있다.","chapter":"채권총론","answer":"O"},{"id":945,"text":"피담보채권이 저당권과 분리되어 양도된 경우, 채권의 처분에 따르지 않는 저당 권은 소멸한다.","chapter":"채권총론","answer":"O"},{"id":946,"text":"저당부동산에 대하여 지상권을 취득한 제3자는 채무자의 의사에 반하여 저당권자 에게 그 부동산으로 담보된 채권을 변제하고 저당권의 소멸을 청구할 수 있다.","chapter":"채권총론","answer":"O"},{"id":947,"text":"저당권의 효력은 저당부동산에 대한 압류가 없더라도 저당권설정자가 그 부동산 으로부터 수취한 과실 또는 수취할 수 있는 과실에 미친다.","chapter":"채권총론","answer":"X"},{"id":948,"text":"甲이 A에게만 채권을 양도하였을 경우, A가 甲의 대리인으로서 乙에게 한 채권양도의 통지도 효력이 있다.","chapter":"채권총론","answer":"O"},{"id":949,"text":"甲이 乙에게 휴 대 폰 문 자로 양수인을 A로 한 채권양도의 통 지를 하였고 이에 따라 乙이 A에 대하여 채무를 변제하였는데, 그 후 다시 甲이 양 수인을 B로 한 확정일자 있는 증서로 채권양도통지를 하였더라도 乙의 A에 대한 채무변제는 유효하다.","chapter":"채권총론","answer":"O"},{"id":950,"text":"甲이 乙에게 양수인을 A로 한 단 순한 채권양도의 통지를 하였고, 그 후 乙이 아직 변제하지 않은 상 태 에서 다시 양수인을 B 로 한 확정일자 있 는 증서로 채권양도를 통 지하였다면 乙이 A에 대하여 한 변제로 B 에게 대항할 수 없다.","chapter":"채권총론","answer":"O"},{"id":951,"text":"채권양수인을 A로 한 양도 통지서의 확정일자는 2017. 1. 10.이고, B로 한 양도 통 지서의 확정일자는 2017. 1. 11.이었으나, 양수인 B 로 한 확정 일자 있는 증서가 먼 저 乙에게 도달하였을 경우, 乙은 B 에게 변제할 책 임이 있다.","chapter":"채권총론","answer":"O"},{"id":952,"text":"매매대금 채무를 담보하기 위하여 가등기를 한 경우에는 「가등기담보 등에 관한 법 률」이 적용된다.","chapter":"채권각론","answer":"X"},{"id":953,"text":"공동명의로 담보가등기를 마친 수인( 數人)의 채권자가 각자의 지분별로 별개의 독립 적인 매매 예약완결권을 가지는 경우에도, 채권자 중 1인은 단독으로 자신의 지분에 관하여 소유권이전의 본등기절차 이행청구를 할 수 없다.","chapter":"채권각론","answer":"X"},{"id":954,"text":"담보가등기권리자가 담보 목적부동산의 경매를 청구하는 방법을 선택하여 그 경매절차 가 진행 중인 때에는 특별한 사정이 없는 한 그 가등기에 따른 본등기를 청구할 수 없다.","chapter":"채권각론","answer":"O"},{"id":955,"text":"채권자가 평가한 청산금의 액수가 정당하게 평가된 청산금의 액수에 미치지 못하는 경우에는 담보권 실행통지로서의 효력이 없다.","chapter":"채권각론","answer":"X"},{"id":956,"text":"채무담보를 위하여 가등기가 경료되어 있는 경우, 특별한 사정이 없는 한 피담보채무 의 변제와 그 가등기말소절차의 이행의무는 동시이행관계에 있다.","chapter":"채권각론","answer":"X"},{"id":957,"text":"임대차보증금반환채권에 대하여 질권을 설정하는 경우, 그 채권증서인 임대차계약서 를 질권자에게 교부하여야 질권의 효력이 생긴다.","chapter":"채권각론","answer":"X"},{"id":958,"text":"저당권부채권에 질권을 설정하면서 그 부기등기를 마친 경우, 채권의 지연손해금을 별 도로 등기부에 기재하지 않더라도 지연손해금은 질권의 피담보채권의 범위에 속한다.","chapter":"채권각론","answer":"O"},{"id":959,"text":"담보가 없는 채권에 질권이 설정된 후 그 채권담보를 위하여 저당권이 설정된 경우, 저당권설정등기에 질권의 부기등기를 하지 않으면 질권의 효력이 저당권에 미치지 않 는다.","chapter":"채권각론","answer":"O"},{"id":960,"text":"질권설정자는 질권자의 동의없이 질권의 목적인 채권을 양도할 수 있다.","chapter":"채권각론","answer":"O"},{"id":961,"text":"질권설정자가 제3채무자에게 질권설정 사실을 통지한 후에는 제3채무자가 질권자의 동의 없이 질권의 목적인 채무를 질권설정자에게 변제하더라도 질권자에게 대항할 수 없다.","chapter":"채권각론","answer":"O"},{"id":962,"text":"채권자가 채무자의 이행거절을 이유로 해제권을 행사하는 경우, 특별한 사정이 없는 한 채권자는 이행기 전이라도 이행의 최고 없이 계약을 해제할 수 있다.","chapter":"채권각론","answer":"O"},{"id":963,"text":"이행기의 정함이 없는 채권을 양수한 채권양수인이 채무자를 상대로 그 이행을 구하 는 소를 제기하고 소송 계속 중 채무자에 대한 채권양도통지가 이루어진 경우에는 특 별한 사정이 없는 한 채무자는 채권양도통지가 도달된 다음 날부터 지체책임을 진다.","chapter":"채권각론","answer":"O"},{"id":964,"text":"채무불이행으로 인한 손해배상채무는 특별한 사정이 없는 한 채권자가 이행청구를 하 면 채무자는 그에 대한 지체책임을 부담한다.","chapter":"채권각론","answer":"O"},{"id":965,"text":"이행불능으로 인한 손해배상청구권은 본래의 채권이 시효로 소멸하더라도 본래의 채 권과 함께 소멸하지 않는다.","chapter":"채권각론","answer":"X"},{"id":966,"text":"부동산 이중매매의 매도인이 선의의 제2매수인에게 소유권이전등기를 마 쳐준 때에는 특별한 사정이 없는 한 매도인이 제1매수인에게 부담하는 소유권이전등기의무는 이행 불능의 상태에 있다.","chapter":"채권각론","answer":"O"},{"id":967,"text":"채권자가 주채무자에 대하여 상계적상이 있는 자동채권을 상계하지 않는 경우, 보증 인은 이를 이유로 보증채무의 이행을 거절할 수 있다.","chapter":"채권각론","answer":"X"},{"id":968,"text":"채권자의 연대보증인 중 1인에 대한 채무면제는 연대보증인 사이에 연대특약이 없더 라도 다른 연대보증인에 대하여 그 효력이 미친다.","chapter":"채권각론","answer":"X"},{"id":969,"text":"부진정연대채무자 상 호간에 구상권을 행사하기 위해서는 사전 또는 사후에 통지를 하 여야 한다.","chapter":"채권각론","answer":"X"},{"id":970,"text":"사용대차에서 공동차주의 목적물 반환의무는 원칙적으로 불가분채무이다.","chapter":"채권각론","answer":"X"},{"id":971,"text":"보증인의 부담이 주채무의 목적이나 형태보다 중한 때에는 주채무의 한도로 감축한다.","chapter":"채권각론","answer":"O"},{"id":972,"text":"저당권이 설정된 부동산의 매매계약을 체결하면서 매수인이 그 저당권의 피담보 채무를 이행인수하기로 약정한 경우, 매수인의 인수채무불이행으로 인한 손해배상채무와 매도인의 소유권이전등기의무는 동시이행관계에 있다.","chapter":"채권각론","answer":"O"},{"id":973,"text":"임대차계약을 체결하면서 임대차보증금을 전세금으로 하는 전세권설정등기 를 경료한 경우, 임대차보증금 반환의무와 전세권설정등기 말소의무는 동 시이행관계에 있다.","chapter":"채권각론","answer":"O"},{"id":974,"text":"가압류등기가 있는 부동산의 매매계약에서 매도인의 소유권이전등기의무 및 가압류등기의 말소의무는 매수인의 대금지급의무와 동시이행관계에 있다.","chapter":"채권각론","answer":"O"},{"id":975,"text":"X토지가 丙의 단독소유이고 甲이 丙으로부터 X토지의 소유권을 취득하여 乙에게 이전할 수 없는 경우, 乙이 위 계약체결 당시 X토지가 丙의 소유라 는 사실에 대해 선의였다면 乙은 민법 제570조에 따른 매도인의 담보책임 을 근거로 甲에게 손해배상을 청구할 수 있다.","chapter":"채권각론","answer":"O"},{"id":976,"text":"X토지의 실제 면적이 계약면적에 미달할 경우, 甲과 乙의 매매계약이 수량 을 지정한 매매에 해당할 때에 한하여 乙은 민법 제574조에 따른 매도인의 담보책임을 근거로 甲에게 대금감액청구권을 행사할 수 있다.","chapter":"채권각론","answer":"O"},{"id":977,"text":"乙이 X토지의 소유권을 보존하기 위하여 자신의 출재로 X토지에 설정된 저당권을 소멸시킨 경우, 乙이 위 매매계약의 체결당시에 저당권이 설정되 어 있었음을 알았다면 乙은 민법 제576조 제2항에 따른 매도인의 담보책임 을 근거로 甲에게 그 출재의 상환을 청구할 수 없다.","chapter":"채권각론","answer":"X"},{"id":978,"text":"甲은 특별한 사정이 없는 한, 乙의 안전을 배려할 보 호의무를 부담한다.","chapter":"채권각론","answer":"X"},{"id":979,"text":"甲이 乙의 사용ㆍ수익권을 보장하기 위하여 X건물을 수선한 경우, 그 수선기간 동안 乙의 사용ㆍ수익에 지장이 생 겼다 하더라도 乙은 그 지장의 한도에서 차임의 지급을 거절할 수 없다.","chapter":"채권각론","answer":"X"},{"id":980,"text":"임대차계약의 체결 당시에 乙이 필요 비상환청구권을 미리 포기하기로 약정한 경우, 특별한 사정이 없는 한 이 러한 약정은 乙에게 일방적으로 불리한 것으로서 그 사법상 효력이 인정되지 않는다.","chapter":"채권각론","answer":"X"},{"id":981,"text":"乙이 甲의 동의 없이 X건물을 丙에게 전대한 경우, 甲은 乙과의 임대차계약이 존속하 는 한도 내에서는 丙에게 X건물의 불법점유를 이유로 한 차임상당의 손해배상을 청 구할 수 없다.","chapter":"채권각론","answer":"O"},{"id":982,"text":"甲이 丁에게 X건물을 양도하고 소유권등기를 이전한 후 X건물의 임대차가 종료되어 丁이 乙에게 임대차보증금을 반환하여야 하는 경우, 丁이 甲의 지위를 승계하기 전 까 지 발생한 연체차임은 그에 관하여 채권양도의 요건을 갖추지 않는 한 임대차보증금 에서 공제되지 않는다.","chapter":"채권각론","answer":"X"},{"id":983,"text":"乙이 직접 X건물을 건 축하지 않고 이행대행자로서 丙을 사용하였다면 특별한 사정이 없는 한 乙은 도급계약을 불이행한 것으로 볼 수 있다.","chapter":"채권각론","answer":"X"},{"id":984,"text":"乙이 전적으로 자신의 노력과 재료로 X건물을 신축하였다면 특별한 사정이 없는 한 乙은 X건물의 소유권을 원시취득한다.","chapter":"채권각론","answer":"O"},{"id":985,"text":"乙이 甲에 대한 공사대금채권을 丁에게 양도한 경우, 특별한 사정이 없는 한 민법 제 666조에서 정하는 수급인의 저당권설정청구권도 이에 수반하여 丁에게 이전된다.","chapter":"채권각론","answer":"O"},{"id":986,"text":"乙의 甲에 대한 공사대금채권과 甲의 乙에 대한 지체상금채권은 특별한 사정이 없는 한 동시이행의 관계에 있지 않다.","chapter":"채권각론","answer":"O"},{"id":987,"text":"X건물이 완성되었으나 중요하지 않으면서도 보수에 과다한 비용이 요구되는 하자가 발생한 경우, 甲은 乙에게 그 하자보수를 청구할 수 없다.","chapter":"채권각론","answer":"O"},{"id":988,"text":"피용자의 고의에 의한 불법행위로 인하여 사용자가 사용자책임을 부담하는 경우, 사용 자책임의 범위를 정함에 있어서 피해자의 과실을 고려하여 그 책임을 제한할 수 없다. 휘ㆍ감독하고 있는지 여부에 의하여 결정되는 것이","chapter":"채권각론","answer":"X"},{"id":989,"text":"사용관계의 존재 여부는 실제로 지 아니라 객관적ㆍ규범적으로 지휘ㆍ감독을 하여야 할 관계에 있는지 여부에 따라 결정 된다.","chapter":"채권각론","answer":"O"},{"id":990,"text":"도급인이 수급인에 대하여 특정한 행위를 지 휘하는 등의 노무도급의 경우에 도급인은 수급인의 불법행위에 대해 사용자책임이 인정될 수 있다.","chapter":"채권각론","answer":"O"},{"id":991,"text":"피용자가 제3자와의 공동불법행위로 피해자에게 손해를 입 힌 경우, 사용자가 피용자 의 부담부분을 초과하여 피해자에게 손해를 배상하면 사용자는 제3자에게 그 초과부 분에 대해 구상권을 행사할 수 있다.","chapter":"채권각론","answer":"O"},{"id":992,"text":"부진정연대의 관계에 있는 사용자와 피용자의 피해자에 대한 손해배상 액이 달라진 경 우, 다 액채무자인 피용자가 손해배상액의 일부를 변제하면 이로 인하여 먼저 소멸하 는 부분은 그 피용자가 단독으로 채무를 부담하는 부분이다.","chapter":"채권각론","answer":"O"},{"id":993,"text":"이행보조자는 채무자의 의사 관여 아래 채무의 이행행위에 속하는 활동을 하는 자이면 충분하고, 반드시 채무자의 지시 또는 감독을 받는 관계에 있어야 하는 것은 아니다.","chapter":"채권각론","answer":"O"},{"id":994,"text":"이행기의 정함이 없는 지명채권을 양수한 채권양수인이 채무자를 상대로 그 이행을 구하는 소를 제기하고, 그 소송 계속 중 채무자에 대한 채권양도통지가 이 루어진 경 우에는 특별한 사정이 없는 한 채무자는 그 소가 제기된 날부터 채권양수인에 대해 이행지체의 책임을 진다.","chapter":"채권각론","answer":"X"},{"id":995,"text":"매매목적물에 관하여 이중으로 제3자와 매매계약을 체결하였다는 사실만 가지고는 먼 저 체결된 매매계약이 법률상 이행불능이라고 할 수 없다.","chapter":"채권각론","answer":"O"},{"id":996,"text":"매매목적물이 채무자의 과실에 의한 화재로 소실됨으로써 채무자의 매매목적물에 대 한 인도의무가 이행불능으로 된 경우, 채권자는 화재사고로 채무자가 지급받게 되는 화재보험금에 대하여 대상청구권을 행사할 수 있다.","chapter":"채권각론","answer":"O"},{"id":997,"text":"임대인이 임대물수선의무를 이행하기 위하여 제3자에게 도급을 주어 임차물을 공사하 던 중 그 수급인의 과실에 의한 임차물의 화재로 인해 임차인의 손해가 발생한 경우, 임대인은 임차인에 대하여 채무불이행에 따른 손해배상책임을 부담한다.","chapter":"채권각론","answer":"O"},{"id":998,"text":"숙박업자가 숙박계약에 따 른 의무를 다하지 못하여 투숙객이 사망한 경우, 숙박계약 의 당사자가 아니면서 그 사고로 인하여 정신적 고통을 받은 그 투숙객의 근친자는 그 투숙객에 대한 숙박계약상의 채무불이행을 이유로 숙박업자에게 위자료를 청구할 수 있다.","chapter":"채권각론","answer":"X"},{"id":999,"text":"채무불이행을 이유로 계약이 해제된 경우에 채권자는 이행이익의 배상 대신에 계약이 이행되리라고 믿고 지출한 비용을 채무불이행으로 인한 손해로 배상을 청구할 수 있 으며, 그 지출비용이 이행이익의 범위를 초과하더라도 그 전부를 청구할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1000,"text":"부동산매매계약에서 매도인의 이행거절로 인한 채무불이행에서의 손해액 산정은 이행 거절 당시의 부동산의 시가를 표 준으로 한다.","chapter":"채권각론","answer":"O"},{"id":1001,"text":"채무자의 채무불이행으로 인한 손해배상액이 예정되어 있는 경우에 채무불이행으로 및 확대에 채권자에게도 과실이 있다면 과실상계를 할 수 있다. 인한 손해의 발생","chapter":"채권각론","answer":"X"},{"id":1002,"text":"위약금이 위약벌로 해석되기 위해 특별한 사정이 주장ㆍ입증될 필요는 없으며, 도급 계약서에 계약보증금 외에 지체상금도 규정되어 있다면 이 자체로 계약보증금은 위약 벌이 된다.","chapter":"채권각론","answer":"X"},{"id":1003,"text":"부동산매매로 인한 소유권이전등기청구권이 양도된 경우, 양도인의 채무자에 대한 통 지만으로 채무자에 대한 대항력이 발생한다.","chapter":"채권각론","answer":"X"},{"id":1004,"text":"소송행위를 하게 하는 것을 주목적으로 지명채권의 양도가 이 루어진 경우, 그 채권양 도가 신탁법상의 신탁에 해당하지 않는 경우에는 유효이다.","chapter":"채권각론","answer":"X"},{"id":1005,"text":"주채무자에 대한 지명채권이 양도된 후 양수인이 보증인에게 보증채권을 행사하기 위 해서는 주채권의 양도에 대한 대항요건과 별도로 보증채권의 양도에 대한 대항요건을 갖추어야 한다.","chapter":"채권각론","answer":"X"},{"id":1006,"text":"선순위의 근저당권부채권을 양수한 채권자보다 후순위의 근저당권자는 ‘지명채권양도 의 대항요건을 갖추지 아니한 경우에 대항할 수 없는 제3자’에 포함되지 않는다.","chapter":"채권각론","answer":"O"},{"id":1007,"text":"채권자와 양수인 사이의 계약에 의해 지명채권이 양도된 경우, 양수인은 제3자에 대 한 대항요건을 구비하기 위함이라고 하더라도 그 채권자에게 채권양도통지절차의 이 행을 청구할 수 없다.","chapter":"채권각론","answer":"X"},{"id":1008,"text":"법정변제충당의 순위를 정함에 있어서 변제의 유예가 있는 채무에 대하여 는 유예기까지 변제기가 도래하지 않은 것과 같게 보아야 한다.","chapter":"채권각론","answer":"O"},{"id":1009,"text":"채권자의 태도로 보아 채무자가 채무의 이행제공을 하였더라도 그 수령을 거절하였을 것이 명 백 한 경우에도 채무자는 이행의 제공을 하지 않고 바로 변제공 탁 할 수는 없다.","chapter":"채권각론","answer":"X"},{"id":1010,"text":"변제공 탁 이 적법한 경우에는 채권자가 공 탁 물 출급청구를 하였는지와 관계 없이 공 탁 을 한 때 에 변제의 효력이 발생하지만, 그 후 공 탁 물 출급청구권 에 대하여 가 압류 집행이 된 경우에는 변제의 효력이 발생하지 아니한다.","chapter":"채권각론","answer":"X"},{"id":1011,"text":"매도인의 담보책임을 기 초 로 한 손해배상채권의 제 척 기간이 지 난 경우, 매 수인은 그 제 척 기간이 지나기 전에 상계할 수 있었을지라도 그 손해배상채 권을 자동채권으로 해서 매도인의 채권과 상계할 수 없다.","chapter":"채권각론","answer":"X"},{"id":1012,"text":"乙의 과실로 도자기가 멸실된 경우, 甲은 도자기 이전의무를 면하면서 얻은 이익이 있더라도 이를 乙에게 상환할 필요는 없다.","chapter":"채권각론","answer":"O"},{"id":1013,"text":"도자기가 2024. 2. 20. 지진으로 멸실된 경우, 甲은 乙에게 매매대금의 지급을 청구할 수 없다.","chapter":"채권각론","answer":"X"},{"id":1014,"text":"乙이 계약체결 당시 甲에게 매매대금을 지급하였는데, 도자기가 2024. 2. 20. 지진으로 멸실된 경우에 乙은 甲에게 부당이득반환을 청구할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1015,"text":"乙의 과실로 도자기가 멸실된 경우, 甲은 乙에게 매매대금의 지급을 청구할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1016,"text":"乙의 수령지체 중에 지진으로 도자기가 멸실된 경우, 甲은 乙에게 매매대금의 지급을 청구할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1017,"text":"乙이 일을 완성하기 전에 甲은 손해를 배상하고 계약을 해제할 수 있으며, 특별한 사정이 없는 한 甲은 乙에 대한 손해배상에 있어서 과실상계를 주 장할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1018,"text":"乙로부터 공사대금채권을 양수받은 자의 저당권설정청구에 의하여 甲이 신 축건물에 저당권을 설정하는 행위는 특별한 사정이 없는 한 甲의 채권자에 대한 사해행위에 해당하지 아니한다.","chapter":"채권각론","answer":"O"},{"id":1019,"text":"甲이 하자보수에 갈음 하여 손해배상을 청구하는 경우, 甲은 보수( )가 報酬 손해배상 을 액 초 과하더라도 乙이 그 손해배상채무를 이행할 까지 乙에게 때 액 그 보수 전 의 지급을 거절할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1020,"text":"완성된 건물에 중요한 하자가 있어 甲이 하자보수에 하여 손해배상을 갈음 청구하는 경우, 그 하자보수비는 건물의 완성시를 기 으로 산정해야 한다. 준","chapter":"채권각론","answer":"X"},{"id":1021,"text":"관리자가 사무의 적절한 관리를 함에 있어 과실없이 손해를 받은 때에는 본인에 대하 여 그 손해 전액의 보상을 청구할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1022,"text":"관리자가 본인을 위하여 본인의 의사에 부합하게 사무를 관리하면서 유익 비를 지출한 경우, 현존이익 한도에서 그 상환을 청구할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1023,"text":"상대방과의 약정에 따라 제3자의 사무를 관리한 경우, 그 관리자 와 제3자 사이에서는 원칙적으로 사무관리가 성립된다.","chapter":"채권각론","answer":"X"},{"id":1024,"text":"관리자에게 타인을 위해 사무를 처리하는 의사 와 관리자 자신의 이익을 위한 의사가 모두 있는 경우에는 사무관리가 성립할 수 없다.","chapter":"채권각론","answer":"X"},{"id":1025,"text":"관리자가 타인의 신체에 대한 급박한 위해를 면하게 하기 위하여 그 사무를 관리한 경우, 그의 경과실로 인해 발생한 본인의 손해를 배상할 책임이 없다.","chapter":"채권각론","answer":"O"},{"id":1026,"text":"타인의 권리의 매매에서 매도인이 그 권리를 매수인에게 이전할 수 없게 된 경우, 매도인의 손해배상 액 은 이행불능 당시의 목적물의 시가를 기 준 으 로 산정한다.","chapter":"채권각론","answer":"O"},{"id":1027,"text":"매매목적물의 일부가 계약 당시에 이미 멸실되어 매도인이 그 부분을 이전 할 수 없는 경우, 악의의 매수인은 대금 감액을 청구할 수 없다.","chapter":"채권각론","answer":"O"},{"id":1028,"text":"매매목적물이 유치권의 목적이 되어 있는 경우, 계약의 목적을 달성할 수 있더라도 선의의 매수인은 계약을 해제할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1029,"text":"매매당사자가 건축을 위해 매매한 토지에 대하여 건축허가를 받을 수 없어 건축이 불가능한 경우는 물건의 하자에 해당하며, 하자의 존부는 매매계약 성립시를 기 준으로 판단한다.","chapter":"채권각론","answer":"O"},{"id":1030,"text":"甲이 부동산을 증여받아 점유를 개시한 이후에 그 증여가 무권리자에 의한 것임을 알 볼 수 없다. 았더라도 그 점유가 타주점유가 된다고","chapter":"채권각론","answer":"O"},{"id":1031,"text":"甲의 통상의 필요비 청구가 부정되는 민법 제203조(점유자의 상환청구권) 제1항 단서 규정은 과실수취권이 없는 악의의 점유자에 대해서도 적용된다.","chapter":"채권각론","answer":"X"},{"id":1032,"text":"민법 제203조(점유자의 상환청구권) 제2항에서 유익비의 상환범위는 甲이 유익비로 지출한 금액과 현존하는 증가액 중에서 甲이 선택하는 것으로 정해진다.","chapter":"채권각론","answer":"X"},{"id":1033,"text":"점유물이 甲의 책임있는 사유로 인하여 멸실한 경우, 민법 제202조(점유자의 회복자 에 대한 책임)에 따르면 甲이 악의의 점유자로서 부담하는 손해배상범위와 선의이면 서 타주점유자로서 부담하는 손해배상범위는 다르다.","chapter":"채권각론","answer":"X"},{"id":1034,"text":"점유를 침탈당한 甲이 본권인 유치권 소멸에 따른 손해배상청구권을 행사하는 때에는 점유를 침탈당한 날부터 1년 내에 행사해야만 한다.","chapter":"채권각론","answer":"X"},{"id":1035,"text":"甲이 보증금반환채권에 대하여 질권을 설정하기 위해서는 질권설정의 합의 와 함께 임대차계약서를 교부하여야 한다.","chapter":"채권각론","answer":"X"},{"id":1036,"text":"甲과 乙이 丙의 동의 없이 매매대금과 보증금반환채권을 상계한 것은 질권 의 목적인 채무를 소멸하게 한 경우에 해당한다.","chapter":"채권각론","answer":"O"},{"id":1037,"text":"만약 甲이 2021. 4. 20. 보증금반환채권을 담보하기 위하여 X주택에 대한 근저당권을 설정 받았다면, 丙이 가진 질권의 효력은 당연히 근저당권에도 미친다.","chapter":"채권각론","answer":"X"},{"id":1038,"text":"乙이 X주택을 임차인인 甲에게 매도하였지만, 丙은 乙에게 직접 채무의 변 제를 청구할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1039,"text":"가등기담보권자가 목적물의 소유권을 취 득하려면 담보설정 당시 목적물의 평가액과 피담보채권액의 범위를 밝혀야 한다.","chapter":"채권각론","answer":"X"},{"id":1040,"text":"가등기담보권자의 청산금 지급채무와 가등기담보권설정자의 소유권이전등기 및 인도 채무는 동시이행관계에 있다.","chapter":"채권각론","answer":"O"},{"id":1041,"text":"목적부동산의 평가액이 채권액에 미달하여 청산금이 없다고 인정되는 때에는 그 뜻을 채무자에게 통지할 필요가 없다.","chapter":"채권각론","answer":"X"},{"id":1042,"text":"채권자가 담보목적부동산에 관하여 이미 소유권이전등기를 마친 경우에는 청산금을 채무자에게 지급하지 않더라도 담보목적부동산의 소유권을 취득한다.","chapter":"채권각론","answer":"X"},{"id":1043,"text":"채권자가 평가한 청산금의 액수가 정당하게 평가된 청산금의 액수에 미치지 못하는 경우에는 담보권 실행통지로서의 효력이 없다.","chapter":"채권각론","answer":"X"},{"id":1044,"text":"계약당사자 일방이 자 의 계약상 채무 이행에 장 가 될 수 있는 사유를 계약체결 시 에 예견할 수 있었음에도 상대방에게 고지하지 않은 경우, 그 사유로 인해 채무불이행 이 되는 것에 어떠한 잘못도 없었다면 채무불이행에 대한 귀책사유를 인정할 수 없다.","chapter":"채권각론","answer":"X"},{"id":1045,"text":"이행보조자의 행위가 채무자의 이행업무와 객관적, 외형적으로 관련된 경우, 그 행위 가 채권자에게 불법행위가 되더라도 채무자는 채권자에 대하여 책임을 부담한다.","chapter":"채권각론","answer":"O"},{"id":1046,"text":"매매목적물의 인도전 화재로 매도인이 수령할 화재보험금에 대하여 매수인이 대상청 구권을 행사할 수 있는 경우, 그 범위는 매매대금의 범위내로 제한되지 않는다.","chapter":"채권각론","answer":"O"},{"id":1047,"text":"대상청구권을 행사하려는 일방당사자가 부담하는 급부도 전부불 능이 된 경우, 대상청 구권의 행사는 허용되지 않는다.","chapter":"채권각론","answer":"O"},{"id":1048,"text":"이행기의 정함이 없는 채권을 양수한 자가 채무자를 상대로 이행의 소를 제기하고 소 송계속 중 채무자에 대하여 채권양도통지가 된 경우, 채무자는 원칙적으로 그 통지가 도달된 다음 날부터 이행지체책임을 진다.","chapter":"채권각론","answer":"O"},{"id":1049,"text":"이행인수인이 채권자에 대하여 채무자의 채무를 승인하더라도 특별한 사정이 없는 한 시효중단의 효력은 발생하지 않는다.","chapter":"채권각론","answer":"O"},{"id":1050,"text":"저당권이 설정된 부동산의 매수인이 피담보채무를 인수하면서 그 채무액을 매매대금 에서 공제하기로 하고 잔액만을 지급한 경우, 특별한 사정이 없는 한 매수인은 잔금 지급의무를 다한 것으로 볼 수 없다.","chapter":"채권각론","answer":"X"},{"id":1051,"text":"주택의 임차인이 대항력을 갖추었다면 그가 그 주택의 소유권을 취득하더라도 특별한 사정이 없는 한 임대인에 대한 보증금반환청구권은 혼동으로 소멸하지 않는다.","chapter":"채권각론","answer":"X"},{"id":1052,"text":"중첩적 채무인수에서 채무자와 인수인은 채권자에 대하여 원칙적으로 부진정연대채무 관계에 있다.","chapter":"채권각론","answer":"X"},{"id":1053,"text":"채무가 인수된 경우 특별한 사정이 없는 한 제3자가 제공한 담보물권도 함께 이전한다.","chapter":"채권각론","answer":"X"},{"id":1054,"text":"임대차가 종료된 경우, 그 임대목적물이 임대인이 아 닌 타인 소유라도 특별 한 사정이 없는 한 임차인은 임대인에게 임대차 종료일까지의 연체 차임 뿐 만 아니라 그 이후부터 인도 완 료일까지 차임 상당의 부당이득금도 반환할 의무가 있다.","chapter":"채권각론","answer":"O"},{"id":1055,"text":"임대인이 임차인에게 필요 비상환의무를 이행하지 않는 경우, 임차인은 지출 한 필요 비 금액의 한도에서 차임의 지급을 거절할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1056,"text":"임차인이 임대인의 동의 없이 임차물을 제3자에게 전대한 경우, 임대인은 임대차계약의 존속 여부를 불 문 하고 제3자에게 불법점유를 이유로 한 차임 상당액의 손해 배 상청구를 할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1057,"text":"임차인이 임대인의 동의를 얻 어 임차물을 전대한 경우, 전대인과 전차인이 전대차계약상의 차임을 감 액하여 전차인이 임대인에 대하여 직접 부담하는 의무의 범위가 변경되더라도 특별한 사정이 없는 한 전차인은 변경된 전대 차계약의 내용을 임대인에게 주장할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1058,"text":"계약의 당사자가 누구인지는 계약에 관여한 당사자의 의사해석 문제로서, 당사자들의 의사가 일치하는 경우에는 그 의사에 따라 계약의 당사자를 확정해야 한다.","chapter":"채권각론","answer":"O"},{"id":1059,"text":"임대차계약에서 보증금의 지급약정이 있는 경우, 보증금의 수수는 임대차계약의 성립 요건이 아니다.","chapter":"채권각론","answer":"O"},{"id":1060,"text":"계약이 의사의 불합치로 성립하지 아니한 경우, 그로 인하여 손해를 입은 당사자는 상대방에 대하여 민법 제535조(계약체결상의 과실)를 유추적용하여 손해배상을 청구 할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1061,"text":"매매계약체결 당시 목적물과 대금이 구체적으로 확정되지 않았더라도, 이행기 전까지 구체적으로 확정될 수 있는 방법과 기준이 정해져 있다면 계약의 성립을 인정할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1062,"text":"청약자의 의사표시나 관습에 의해 승낙의 통지가 필요하지 않은 경우, 계약은 승낙의 의사표시로 인정되는 사실이 있는 때에 성립한다.","chapter":"채권각론","answer":"O"},{"id":1063,"text":"부동산 매매계약에서 매수인이 부가가치세를 부담하기로 약정한 경우, 특별한 사정이 없는 한 부가가치세를 포함한 매매대금 전부와 부동산의 소유권이전등기의무는 동시 이행관계에 있다.","chapter":"채권각론","answer":"O"},{"id":1064,"text":"공사도급계약상 도급인의 지체상금채권과 수급인의 공사대금채권은 특별한 사정이 없 는 한 동시이행관계에 있다고 할 수 없다.","chapter":"채권각론","answer":"O"},{"id":1065,"text":"구분소유적 공유관계가 전부 해소된 경우, 공유지분권자 상호간의 지분이전등기의무 는 동시이행의 관계에 있다.","chapter":"채권각론","answer":"O"},{"id":1066,"text":"원인채무의 지급을 담보하기 위하여 어음이 교부된 경우, 채무자는 어음반환과 동시 이행을 주장하여 원인채무의 지급을 거절할 수는 없다.","chapter":"채권각론","answer":"X"},{"id":1067,"text":"동시이행의 관계에 있는 쌍방의 채무 중 어느 한 채무가 이행불능이 됨으로 인하여 발생한 손해배상채무도 여전히 다른 채무와 동시이행의 관계에 있다.","chapter":"채권각론","answer":"O"},{"id":1068,"text":"甲과 乙이 계약해제로 인한 원상회복의무로 반환할 매매대금에 가산할 이자를 4%로 약정한 경우, 동 약정이율은 매매대금 반환의무의 이행지체로 인한 지연손해금률에도 적용된다.","chapter":"채권각론","answer":"X"},{"id":1069,"text":"甲이 乙의 채무불이행을 이유로 매매계약을 해제한 후에도 乙은 착오를 이유로 매매 계약을 취소할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1070,"text":"乙 명의로 소유권이전등기가 경료된 X토지에 대하여 乙의 채권자 丙이 가압류 집행 을 마쳐둔 경우, 甲은 丙에 대하여 乙의 채무불이행을 이유로 한 해제의 소급효를 주 장할 수 없다.","chapter":"채권각론","answer":"O"},{"id":1071,"text":"甲이 乙의 채무불이행에 관하여 원인의 일부를 제공하였다고 하더라도 乙이 이를 이유 로 甲의 계약해제에 따른 원상회복청구에 대하여 과실상계하는 것은 인정되지 않는다.","chapter":"채권각론","answer":"O"},{"id":1072,"text":"乙이 중도금을 약정된 기일에 지급하지 않으면 최고 없이 계약은 자동적으로 해제되 는 것으로 약정한 경우, 특별한 사정이 없는 한 그 불이행이 있으면 계약은 자동적으 로 해제된다.","chapter":"채권각론","answer":"O"},{"id":1073,"text":"甲의 손해에 대하여 乙, 丙은 부진정연대책임을 진다.","chapter":"채권각론","answer":"O"},{"id":1074,"text":"甲의 호의동승으로 인해 乙의 책임이 제한되는 경우, 이는 丙에게도 인정된다.","chapter":"채권각론","answer":"O"},{"id":1075,"text":"甲이 乙의 난폭운전으로 사고발생의 위험성이 상당할 정도로 우려된다는 것을 인식한 경우, 甲에게 안전운전을 촉구할 주의의무가 인정된다.","chapter":"채권각론","answer":"O"},{"id":1076,"text":"甲의 호의동승에 따른 책임제한이 30%로 인정되고 丙이 甲에게 600만 원을 변제한 경우, 丙은 乙에게 40만 원을 구상할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1077,"text":"丙이 甲에게 손해 전부를 배상하고 乙에 대한 구상권을 취득한 후 甲의 乙에 대한 손 해배상채권이 시효로 소멸한 경우, 丙은 乙에게 더 이상 구상권을 행사할 수 없다.","chapter":"채권각론","answer":"X"},{"id":1078,"text":"乙에 의해 완공된 주택에 하자가 있어 계약의 목적을 달성할 수 없는 경우라도 甲은 도급계약을 해제할 수 없다.","chapter":"채권각론","answer":"O"},{"id":1079,"text":"乙에 의해 완공된 주택에 발생한 하자가 중요하지 않는데도 그 보수에 과다한 비용이 드는 경우, 甲은 하자보수에 갈음하는 손해배상을 청구 할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1080,"text":"지체상금의 종기는 특별한 사정이 없는 한 乙이 공사를 중단하거나 기 타 해제사유가 있어 甲이 실제로 해제한 때로부터 甲이 다른 업자에게 의뢰하여 완공할 수 있었던 시점까지로 제한된다.","chapter":"채권각론","answer":"X"},{"id":1081,"text":"예정된 준공기한 전에 도급계약이 해제되어 乙이 공사를 완료하지 아니 한 경우에는 특별한 사정이 없는 한 지체상금약정은 적용되지 않는다.","chapter":"채권각론","answer":"O"},{"id":1082,"text":"어느 조합원이 출자의무를 이행하지 않은 경우, 다른 조합원은 이를 이유로 조합계약 을 해제할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1083,"text":"조합계약이 성립하기 위한 공동사업이란 조합원 전원이 사업의 성공에 대하여 이해관 계를 가지는 것으로 일부 조합원만이 이익분배를 받는 관계는 조합이 아니다.","chapter":"채권각론","answer":"O"},{"id":1084,"text":"부동산의 공동매수인들이 전매차익을 얻으려는 목적으로만 상호 협력하는 경우에도 민법상 조합관계에 있다고 볼 수 있다.","chapter":"채권각론","answer":"X"},{"id":1085,"text":"조합원의 채권자는 조합재산을 구성하는 개개의 재산에 대한 조합원의 합유지분에 대 하여 강제집행을 할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1086,"text":"조합원이 조합을 탈퇴할 권리는 그 성질상 채권자대위가 허용되지 않는 일신전속적 권리에 해당한다.","chapter":"채권각론","answer":"X"},{"id":1087,"text":"수량지정매매에 해당하는 부동산매매계약에서 실제면적이 계약면적에 미달하는 경우, 매수인은 대금감액청구권의 행사와 별도로 부당이득반환청구도 할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1088,"text":"타인의 권리를 매매한 자가 그 권리를 이전할 수 없게 된 경우, 매도인은 선의의 매 수인에 대하여 불능 당시의 시가를 표준으로 이행이익을 배상할 의무가 있다.","chapter":"채권각론","answer":"O"},{"id":1089,"text":"매매계약 내용의 중요부분에 착오가 있는 경우, 매수인은 매도인의 하자담보책임이 성립하는지와 상관없이 착오를 이유로 그 매매계약을 취소할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1090,"text":"매수인이 하자의 발생과 확대에 잘못이 있는 경우, 법원은 매도인의 손해배상액을 산 정함에 있어 매수인의 과실을 직권으로 참작하여 그 범위를 정해야 한다.","chapter":"채권각론","answer":"O"},{"id":1091,"text":"저당권이 설정된 부동산의 매수인이 저당권의 행사로 그 소유권을 취득할 수 없는 경 우, 악의의 매수인이라도 특별한 사정이 없는 한 계약을 해제할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1092,"text":"A는 임대인 乙의 지위를 승계한 것으로 본다.","chapter":"채권각론","answer":"X"},{"id":1093,"text":"저당권자는 가압류채권자에 우선하므로, 戊는 丁에 우선하여 변제받을 수 있다.","chapter":"채권각론","answer":"X"},{"id":1094,"text":"경매로 인해 丙의 임차권은 소멸하기 때문에 丙은 A에게 주택을 인도하여야 한다.","chapter":"채권각론","answer":"O"},{"id":1095,"text":"丙이 임대차계약서상에 확정일자를 받았다면, 丙은 甲에 우선하여 보증금 전액에 대해 우선변제를 받을 수 있다.","chapter":"채권각론","answer":"X"},{"id":1096,"text":"丙이 적법하게 배당요구를 하였다면 배당받을 수 있었던 금액이 丙의 적법한 배당요 구가 없어서 丁과 戊에게 배당된 경우, 丙은 丁과 戊에게 부당이득반환을 청구할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1097,"text":"丁이 甲의 대여금채무를 모두 변제한 경우, 丁은 甲에 대하여 구상권을 행사할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1098,"text":"丁이 甲의 대여금채무를 모두 변제한 경우, 丁은 乙을 대위하여 丙을 상대로 2억원의 지급을 청구할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1099,"text":"戊는 甲의 대여금채무를 변제할 정당한 이익이 있는 자이므로, 戊가 그 채무를 모두 변제하였다면 乙의 승낙이 없어도 당연히 乙을 대위한다.","chapter":"채권각론","answer":"O"},{"id":1100,"text":"丙이 甲의 대여금채무를 모두 변제한 경우, 미리 저당권등기에 대위의 부기등기를 하지 않더라도 丁에 대하여 乙을 대위할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1101,"text":"A가 甲과의 매매계약을 원인으로 X토지의 소유권이전등기를 마친 후 甲의 대여금 채무를 모두 변제한 경우, A는 丙에 대하여 乙을 대위할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1102,"text":"손해배상 방법으로서 금전배상의 경우, 금전은 우리나라 통화를 의미하지만, 당사자의 약정이 있으면 외국통화로 배상할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1103,"text":"채무불이행으로 인한 손해배상책임과 달리 매매계약의 해제로 인한 원상회복의무의 이행으로서 이미 지급한 매매대금 기타 급부의 반환을 구하는 경우에는 과실상계의 법리가 적용되지 않는다.","chapter":"채권각론","answer":"O"},{"id":1104,"text":"지체상금이 손해배상의 예정으로 인정되어 감액할 때, 채무자가 계약을 위반한 경위 등 제반사정이 참작되므로, 손해배상액의 감경에 앞서 채권자의 과실 등을 들어 따로 감경할 필요는 없다.","chapter":"채권각론","answer":"O"},{"id":1105,"text":"특별손해의 배상에서 채무자가 그 사정을 알았거나 알 수 있었는지의 여부는 채무의 이행기가 아니라 계약체결 당시를 기준으로 판단하여야 한다.","chapter":"채권각론","answer":"X"},{"id":1106,"text":"매도인이 매수인으로부터 부동산 매매대금을 약정기일에 지급받지 못한 결과 제3자로 부터 이와 유사한 부동산을 매수하고 그 잔대금을 지급하지 못하여 계약금이 몰수되는 손해를 입었다면, 이는 특별한 사정으로 인한 손해에 해당한다.","chapter":"채권각론","answer":"O"},{"id":1107,"text":"증여계약의 대상인 권리가 타인에게 귀속되어 있다는 이유만으로 증여자의 계약에 따른 이행이 불능이라고 할 수는 없다.","chapter":"채권각론","answer":"O"},{"id":1108,"text":"매매목적물인 부동산이 가압류되었다는 사유만으로 매도인의 이행불능을 이유로 매매 계약을 해제할 수는 없다.","chapter":"채권각론","answer":"O"},{"id":1109,"text":"부동산의 소유권이전등기의무자가 그 부동산에 제3자 명의로 가등기를 마쳐주면, 부동산의 처분권한 상실로 소유권이전등기의무가 이행불능이 된다.","chapter":"채권각론","answer":"X"},{"id":1110,"text":"매수인의 잔대금지급의무가 소유권이전등기의무와 동시이행관계에 있더라도, 소유권 이전등기의무의 이행불능을 이유로 매수인이 매매계약을 해제하기 위해서는 매수인이 대금지급의무의 이행제공을 할 필요가 없다.","chapter":"채권각론","answer":"O"},{"id":1111,"text":"임대인에게 임대목적물에 대한 소유권이 없는 경우, 임차인이 진실한 소유자로부터 목적물의 반환청구를 받는 등의 이유로 임차인이 이를 사용 수익할 수가 없게 되면 임대인의 채무는 이행불능이 된다.","chapter":"채권각론","answer":"O"},{"id":1112,"text":"관리자가 사무관리를 함에 있어서 과실 없이 손해를 받은 경우, 본인 에게 그 손해 전부의 보상을 청구할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1113,"text":"관리자는 본인의 청구가 있는 때에 사무처리의 상황을 보고하여야 하며, 사무처리가 종료된 때에는 지체 없이 그 전말을 보고하여야 한다.","chapter":"채권각론","answer":"O"},{"id":1114,"text":"타인을 위하여 사무를 처리하는 의사는 관리자 자신의 이익을 위한 의사와 병존할 수 있고, 반드시 외부적으로 표시될 필요가 없으며, 사무를 관리할 당시에 확정되어 있을 필요도 없다.","chapter":"채권각론","answer":"O"},{"id":1115,"text":"제3자와의 약정에 따라 타인의 사무를 처리한 경우에도 그 타인과의 관계에서는 의무 없이 타인의 사무를 처리한 것이므로, 그 타인과의 관계에서 원칙적으로 사무관리가 성립한다.","chapter":"채권각론","answer":"X"},{"id":1116,"text":"조합원은 정당한 사유가 있는 경우에 한하여 조합의 업무 및 재산상태를 검사할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1117,"text":"조합의 존속기간을 정한 때에도 조합원은 부득이한 사유가 있으면 탈퇴할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1118,"text":"조합원의 제명은 정당한 사유가 있는 때에 한하여 다른 조합원 3분의 2 이상의 찬성 으로 결정된다.","chapter":"채권각론","answer":"X"},{"id":1119,"text":"조합의 채무자는 그 채무와 조합원에 대하여 개인적으로 가지는 채권과 상계할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1120,"text":"조합원의 제명 결정은 제명된 조합원에게 통지하지 않아도 그 조합원에게 대항할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1121,"text":"특정물과 불특정물의 구별은 당사자의 의사에 따른 주관적인 구별이다.","chapter":"채권각론","answer":"O"},{"id":1122,"text":"종물은 주물의 일부이거나 구성부분이어야 한다.","chapter":"채권각론","answer":"X"},{"id":1123,"text":"관리할 수 있는 전기는 동산이다.","chapter":"채권각론","answer":"O"},{"id":1124,"text":"건물을 사용함으로써 얻는 이득은 그 건물의 과실에 준하는 것이다.","chapter":"채권각론","answer":"O"},{"id":1125,"text":"수확되지 아니한 성숙한 쪽파와 같은 농작물 매매에 있어서 매수인이 그 소유권 을 취득하기 위해서는 명인방법을 갖추어야 한다.","chapter":"채권각론","answer":"O"},{"id":1126,"text":"乙이 무자력이 아 닌 경우 丙은 乙의 甲에 대한 이전등기청구권을 대위행사할 수 없다. 丙 전원의 합의가 없더라도, 丙은 甲에게 직접 이전등기를 청구할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1127,"text":"甲, 乙,","chapter":"채권각론","answer":"X"},{"id":1128,"text":"甲에서 직접 丙에게 이전등기하는 것에 관해 甲, 乙, 丙 전원의 합의가 있었으나, 甲과 乙 사이의 매매가 적법하게 합의해제된 경우, 甲은 丙의 이전등기청구를 거절할 수 없다.","chapter":"채권각론","answer":"X"},{"id":1129,"text":"甲에서 丙으로 직접 이전등기가 된 경우, 乙과 丙이 대금을 완제했더라도 甲은 중간생략등기의 합의가 없다는 이유로 丙 명의의 등기의 말소를 청구할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1130,"text":"만약 乙이 甲으로부터 丙으로 이전등기하는 것에 동의했더라도, 乙은 甲에 대한 이전등기청구권을 잃지 않는다.","chapter":"채권각론","answer":"X"},{"id":1131,"text":"매매계약을 맺은 후에야 매수인이 등기부상의 매매목적물이 매도인의 소유가 아니라는 것을 알게 되었다면 매수인은 중도금지급을 선이행하 기로 하였더라도 그 지급을 거절할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1132,"text":"임대차계약 종료 후 발생하는, 임차인의 임차목적물반환의무와 임대인의 임차보증금반환의무는 동시이행관계이다.","chapter":"채권각론","answer":"O"},{"id":1133,"text":"임대차계약 해제에 따른 임차인의 목적물반환의무와 임대인의 목적물을 사용수익하게 할 의무불이행에 대한 약정 지연손해배상의무는 특별한 사정이 없는 한 동시이행관계이다.","chapter":"채권각론","answer":"X"},{"id":1134,"text":"채무자의 변제와 채권자의 채권증서반환의무는 동시이행관계이다.","chapter":"채권각론","answer":"X"},{"id":1135,"text":"가압류등기가 있는 부동산의 매매계약에서 매도인의 소유권이전등기 의 무와 아울러 가압류등기의 말소의무도 매수인의 대금지급의무와 동시이 행관계이다.","chapter":"채권각론","answer":"O"},{"id":1136,"text":"부동산 매매계약에서 부동산 소유권이전등기의무뿐만 아니라 그 인도의 무도 대금지급의무와 동시이행관계이다.","chapter":"채권각론","answer":"O"},{"id":1137,"text":"매도인이 계약과 동시에 환매할 권리를 보류한 때에는 환매대금은 매도인이 영 수한 대금 및 매수인이 부담한 매매비용에 한정되며, 당사자가 특약으로 환매대 금을 다르게 정할 수 없다.","chapter":"채권각론","answer":"X"},{"id":1138,"text":"당사자가 부동산에 대한 환매기간을 정하지 않은 때에는 그 기간은 5년으로 되 며, 이와 달리 환매기간을 정한 때에는 이를 다시 연장하지 못한다.","chapter":"채권각론","answer":"O"},{"id":1139,"text":"환매특약의 실효는 원칙적으로 매매계약의 효력에 영향을 주지 않는다.","chapter":"채권각론","answer":"O"},{"id":1140,"text":"환매의 경우, 특별한 약정이 없으면 목적물의 과실과 대금의 이자는 상계한 것 으로 본다.","chapter":"채권각론","answer":"O"},{"id":1141,"text":"부동산 매매계약에서 소유권이전등기와 함께 환매특약에 따라 환매등기가 있은 후, 그 부동산에 제3자의 저당권등기가 마쳐진 경우라도, 매도인이 환매기간 내 에 적법하게 환매권을 행사하면 제3자의 저당권은 소멸한다.","chapter":"채권각론","answer":"O"},{"id":1142,"text":"계약 당시 당사자 사이에 손해배상액을 예정하는 내용의 약정이 있는 경우, 특별한 사정이 없는 한 위 약정은 그 계약과 관련된 불법행위책임에 따른 손해배상까지 예정한 것이라고는 볼 수 없다.","chapter":"채권각론","answer":"O"},{"id":1143,"text":"채권자가 그 채권의 목적인 물건 또는 권리의 가액전부를 손해배상으로 받은 때 에는 채무자는 그 물건 또는 권리에 관하여 당연히 채권자를 대위한다.","chapter":"채권각론","answer":"O"},{"id":1144,"text":"숙박업자가 숙박계약상의 고객보호의무를 다하지 못하여 투숙객이 사망한 경우, 그 투숙객의 근친자가 그 사고로 인하여 정신적 고통을 받았다면, 숙박계약의 당사자가 아닌 그 근친자는 숙박업자의 그 망인에 대한 숙박계약상의 채무불이 행을 이유로 위자료를 청구할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1145,"text":"피용자의 고의에 의한 불법행위로 인하여 사용자가 사용자책임을 부담하는 경 우, 사용자책임의 범위를 정함에 있어서 피해자의 과실을 고려하여 그 책임을 제한할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1146,"text":"과실상계는 매매계약이 해제되어 원상회복의무의 이행으로서 이미 지급한 매매 대금 기타 급부의 반환을 구하는 경우에는 적용되지 않는다.","chapter":"채권각론","answer":"O"},{"id":1147,"text":"乙의 차임채무불이행으로 임대차가 종료되어도 乙은 甲에게 Y건물의 매수를 청 구할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1148,"text":"乙이 적법하게 Y건물의 매수를 청구한 경우, 甲의 대금지급의무는 乙의 Y건물 명도 및 소유권이전의무보다 선이행되어야 한다.","chapter":"채권각론","answer":"X"},{"id":1149,"text":"乙이 Y건물에 대한 보존등기를 마친 후 甲이 丙에게 X토지를 매도하고 소유권 이전등기를 마쳐 준 경우, 乙의 임차권이 기간만료로 소멸하면 乙은 丙을 상대 로 Y건물의 매수를 청구할 수 없다.","chapter":"채권각론","answer":"X"},{"id":1150,"text":"만약 乙의 채권자 명의로 근저당권이 설정된 Y건물에 대하여 乙이 적법하게 매 수청구권을 행사한 경우, 甲은 근저당권이 말소되지 않았음을 이유로 채권최고 액에 상당한 대금의 지급을 거절할 수 없다.","chapter":"채권각론","answer":"X"},{"id":1151,"text":"만약 Y건물이 미등기 상태에 있더라도 임대차기간이 만료되어 乙이 적법하게 매수청구권을 행사한 경우, Y건물은 그 매수청구의 대상이 될 수 있다.","chapter":"채권각론","answer":"X"},{"id":1152,"text":"乙이 출자를 지연한 때에는 연체이자를 지급하면 되고, 그 외에 손해까지 배상 할 필요는 없다.","chapter":"채권각론","answer":"X"},{"id":1153,"text":"乙의 채권자는 특별한 사정이 없는 한, 乙을 집행채무자로 하여 A식당의 채권에 대하여 강제집행을 할 수 있다.","chapter":"채권각론","answer":"X"},{"id":1154,"text":"현물을 출자한 甲이 동업에서 탈퇴하게 되면, 甲의 지분은 금전으로 반환할 수 없다.","chapter":"채권각론","answer":"X"},{"id":1155,"text":"甲은 동업자로서의 지위를 유지한 채 전체 지분을 제3자에게 처분할 수도 있다.","chapter":"채권각론","answer":"X"},{"id":1156,"text":"A식당이 영업이익으로 구입한 부동산에 대하여 합유등기를 하지 않고 甲 명의 로 소유권이전등기를 하였다면, 이는 A식당이 甲에게 명의신탁한 것으로 보아야 한다.","chapter":"채권각론","answer":"O"},{"id":1157,"text":"사무처리의 긴급성 등으로 국가의 사무에 대하여 사인의 개입이 정당화되는 경우, 사인은 국가의 사무를 처리하면서 지출한 필요비를 청구할 수 있으나 유익비의 상환을 청구할 수는 없다.","chapter":"채권각론","answer":"O"},{"id":1158,"text":"관리인이 본인에게 인도할 금전을 자기를 위하여 소비한 때에는 소비한 날 이후 의 이자뿐만 아니라 그에 따른 손해까지 배상하여야 한다.","chapter":"채권각론","answer":"O"},{"id":1159,"text":"관리자가 타인의 명예에 대한 급박한 위해를 면하게 하기 위하여 그 사무를 관 리한 경우, 그의 경과실로 인하여 본인에게 손해가 발생하여도 그에 따른 손해 배상책임을 지지 않는다.","chapter":"채권각론","answer":"X"},{"id":1160,"text":"관리자가 사무관리를 함에 있어서 과실 없이 손해를 받은 때에는 본인의 현존이 익의 한도에서 그 손해의 보상을 청구할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1161,"text":"타인을 위하여 사무를 처리하는 의사는 관리자 자신의 이익을 위한 의사와 병존 할 수 있다.","chapter":"채권각론","answer":"O"},{"id":1162,"text":"토지임차인의 지상물매수청구권","chapter":"채권각론","answer":"O"},{"id":1163,"text":"임차인의 비용상환청구권","chapter":"채권각론","answer":"X"},{"id":1164,"text":"임차인의 차임감액청구권","chapter":"채권각론","answer":"X"},{"id":1165,"text":"임대차기간의 약정이 없는 임차인의 해지통고","chapter":"채권각론","answer":"X"},{"id":1166,"text":"임차인의 차임연체로 인한 임대인의 해지권","chapter":"채권각론","answer":"X"},{"id":1167,"text":"저당목적물인 건물에 대한 저당권자의 압류가 있으면 특별한 사정이 없는 한 압류 이후의 저당권설정자의 건물 임차인에 대한 차임채권에도 저당권 의 효력이 미친다.","chapter":"물권법","answer":"O"},{"id":1168,"text":"저당권 등기가 불법말소된 후 그 저당부동산이 경매절차에서 매각된 경우, 특별한 사정이 없는 한 저당권자는 경매절차의 매수인을 상대로 말소된 저 당권 등기의 회복을 청구할 수 없다.","chapter":"물권법","answer":"O"},{"id":1169,"text":"채무자는 저당권자에게 ‘지연배상은 원본의 이행기일을 경과한 1년분에 한 한다’는 민법 제360조에 근거하여 피담보채권의 제한을 주장할 수 있다.","chapter":"물권법","answer":"X"},{"id":1170,"text":"과실수취권이 있는 선의의 점유자의 점유는 자주점유일 것을 요하지 않는다.","chapter":"물권법","answer":"O"},{"id":1171,"text":"선의의 점유자는 과실을 취득함으로 인하여 타인에게 손해를 입 혔다 할지라도 그 과 실취득으로 인한 이득을 그 타인에게 반환할 의무를 지지 않는다.","chapter":"물권법","answer":"O"},{"id":1172,"text":"악의 점유자는 수취한 과실을 반환함에 있어서 그 받은 이익에 이자를 붙여 반환하여 야 하는 것은 아니다.","chapter":"물권법","answer":"X"},{"id":1173,"text":"선의의 점유자가 과실을 취득한 경우, 점유물의 보존을 위하여 지출한 통상의 필 비를 상환할 것을 청구할 수 없다. 요","chapter":"물권법","answer":"O"},{"id":1174,"text":"점유자의 회복자에 대한 유익비상환청구권은 점유자가 회복자로부터 점유물의 반환을 청구받거나 회복자에게 점유물을 반환한 때에 비로소 행사할 수 있다.","chapter":"물권법","answer":"O"},{"id":1175,"text":"지상권설정 당시에 공 작물의 종류와 구조를 정하지 아니한 경우, 지상권의 최단존속 기간은 15년이다.","chapter":"물권법","answer":"O"},{"id":1176,"text":"지상권의 존속기간 만료 후 지상권자가 지상권 갱신청구권을 지체 없이 행사하지 않아 지상권갱신청구권이 소멸한 경우, 지상권자는 지상물매수청구권을 행사할 수 없다.","chapter":"물권법","answer":"O"},{"id":1177,"text":"지상권자는 토지소유자의 의사에 반하여도 지상권을 자유롭게 양도할 수 있다.","chapter":"물권법","answer":"O"},{"id":1178,"text":"지상권자가 종전 소유자와 지료를 증액하지 않기로 특약을 맺은 경우, 이로써 새로운 소유자에게 대항하기 위해서는 그 특약을 등기하여야 한다.","chapter":"물권법","answer":"O"},{"id":1179,"text":"지상물매수청구에 따른 지상물매매가 격의 산출은 지상물 매수청구 당시의 시가가 아 니라 지상권 소멸 당시의 시가에 의한다.","chapter":"물권법","answer":"X"},{"id":1180,"text":"도급인과 수급인이 수급인은 공사대금채권의 미지급을 이유로 신 축건물에 유치권을 ’ 파산관재인은 유치권을 행사할 수 없다. 행사할 수 없다 는 약정을 한 경우, 수급인의","chapter":"물권법","answer":"O"},{"id":1181,"text":"상가임대인이 임차건물의 객관적 가치상승과 무관하게 임차인이 지출한 비용에 대해 서도 임차인에게 상환하기로 약정한 경우, 임차인은 그 채권을 피담보채권으로 하여 유치권을 행사할 수 있다.","chapter":"물권법","answer":"X"},{"id":1182,"text":"유치권자가 선관주의의무를 위반하여 유치물을 타인에게 임대한 경우, 그 후 유치물 을 양수한 자는 유치권자에 대하여 선관주의의무 위반을 이유로 유치권소멸을 청구할 수 없다.","chapter":"물권법","answer":"X"},{"id":1183,"text":"甲이 하나의 채권을 피담보채권으로 하여 乙 소유 여 러 필지의 토지에 대하여 유치권 을 취득하고, 일부 필지의 토지에 대하여 乙의 승낙없이 무단으로 사무실을 설치한 경우, 乙은 甲에게 유치목적물 전부에 대한 유치권의 소멸을 청구할 수 있다.","chapter":"물권법","answer":"X"},{"id":1184,"text":"저당목적물에 유익비를 지출한 저당목적물의 제3취득자는 저당권실행에 따른 경매절 차의 매수인에 대하여 민법 제367조의 제3취득자의 비용상환청구권을 피담보채권으로 하는 유치권을 행사할 수 있다.","chapter":"물권법","answer":"X"},{"id":1185,"text":"甲이 자기 소유의 X토지를 친구 乙에게 사인증여한 후, 甲이 사망하여 乙이 X토지를 취득하는 경우","chapter":"물권법","answer":"O"},{"id":1186,"text":"甲 ㆍ乙 ㆍ丙 3인으로 구성된 조합에서 甲이 X토지에 관한 합유지분을 포기 하여 그의 지분이 乙과 丙에게 균분으로 귀속하는 경우","chapter":"물권법","answer":"O"},{"id":1187,"text":"甲이 X토지에 관해 乙에게 소를 제기하여 법원으로부터 ‘乙은 甲에게 2023. 2. 1.자 매매계약을 원인으로 한 X토지의 소유권이전등기절차를 이행하라’ 는 확정판결을 받아 이에 기해 甲이 소유권을 취득하는 경우","chapter":"물권법","answer":"O"},{"id":1188,"text":"甲 소유의 X토지를 乙이 20년간 소유의 의사로 평온 ㆍ공연하게 점유하여 점유취득시효의 요건이 완성되어 乙이 소유권을 취득하는 경우","chapter":"물권법","answer":"O"},{"id":1189,"text":"선의의 점유자라도 본권에 관한 소에 패소한 때에는 그 소가 확정된 때로부터 악의의 점유자로 본다.","chapter":"물권법","answer":"X"},{"id":1190,"text":"건물의 소유권이 양도된 경우에는 특별한 사정이 없는 한 건물의 양도인인 전( ) 소 前 유자는 그 건물의 부지에 대한 점유를 상실한다.","chapter":"물권법","answer":"O"},{"id":1191,"text":"직접점유자가 그의 점유를 침탈당하거나 방해당하고 있는 경우, 직접점유자만이 점유 보호청구권을 가지고 간접점유자는 점유보호청구권을 행사할 수 없다.","chapter":"물권법","answer":"X"},{"id":1192,"text":"甲의 점유가 타주점유인 경우, 甲의 특정승계인 乙이 자기의 점유만을 주장하더라도 그 점유는 타주점유로 추정된다.","chapter":"물권법","answer":"X"},{"id":1193,"text":"과실수취권이 있는 점유자는 점유물로부 터 과실을 취득하였더라도 회복자에 대하여 점유물을 보존하기 위하여 지출한 통상의 필요비의 상환을 청구할 수 있다.","chapter":"물권법","answer":"X"},{"id":1194,"text":"甲이 丙에게 Y건물을 인도하지 않은 경우, 특별한 사정이 없는 한 丙의 전세권은 성 립하지 않는다.","chapter":"물권법","answer":"X"},{"id":1195,"text":"甲과 丙이 전세권의 존속기간을 약정하지 아니한 경우, 甲과 丙은 언제든지 상대방에 대 하여 전세권의 소멸을 통고할 수 있고 상대방이 이 통고를 받은 때 전세권은 소멸한다.","chapter":"물권법","answer":"X"},{"id":1196,"text":"전세금 3억 원은 현실적으로 수수되어야 하며, 丙이 甲에 대하여 갖는 기존의 채권으 로 전세금의 지급에 갈음할 수 없다.","chapter":"물권법","answer":"X"},{"id":1197,"text":"특별한 사정이 없는 한, 전세기간 중 丙은 甲의 동의를 얻어야 Y건물을 타인에게 임 대할 수 있다.","chapter":"물권법","answer":"X"},{"id":1198,"text":"甲이 乙에게 약정한 지 료를 2년분 이상 연체한 경우, 乙은 丙의 동의가 없어도 甲에 게 지상권소 멸을 청구할 수 있다.","chapter":"물권법","answer":"O"},{"id":1199,"text":"동시배당이 이루어지는 경우, 甲은 X토지의 매각대금으로부터 2억 원, Y토 지의 매각대금으로부터 1억 원을 배당받는다.","chapter":"물권법","answer":"O"},{"id":1200,"text":"먼저 X토지에 대한 경매가 이루어져 甲이 3억 원을 배당받은 경우, 丙은 Y토지에 대하여 1억 원의 범위에서 甲의 1번 저당권을 대위할 수 있다.","chapter":"물권법","answer":"O"},{"id":1201,"text":"먼저 X토지에 대한 경매가 이루어져 甲이 3억 원을 배당받은 경우, 만일 丙이 Y토지에 공동저당의 대위등기를 하지 아니한 사이에 甲이 Y토지에 대한 저당권을 말소하고 丁이 Y토지를 매수하여 소유권을 취득하였더라도 丙은 丁에 대하여 저당권을 주장할 수 있다.","chapter":"물권법","answer":"X"},{"id":1202,"text":"만일 甲이 경매가 개시되기 전에 Y토지에 대한 저당권을 포기하였다면 甲 은 X토지의 매각대금으로부터 3억 원을 배당받고 丙은 Y토지에 대하여 1 억 원의 범위에서 甲의 1번 저당권을 대위할 수 있다.","chapter":"물권법","answer":"X"},{"id":1203,"text":"매매대금 채권을 담보하기 위하여 가등기를 한 경우에는 「가등기담보 등에 관한 법률」 이 적용되지 않는다.","chapter":"물권법","answer":"O"},{"id":1204,"text":"가등기담보권이 설정되기 위해서는 피담보채권이 등기되어야 한다.","chapter":"물권법","answer":"X"},{"id":1205,"text":"당사자가 가등기담보권설정계약을 체결하면서 가등기 이후에 발생할 채권도 가등기부 동산의 피담보채권에 포함시키기로 약정한 경우, 이 약정은 특별한 사정이 없는 한 유효하다.","chapter":"물권법","answer":"O"},{"id":1206,"text":"채권자가 가등기담보권을 실행하기 위해 청산금의 평가액을 통지하는 경우, 그가 주 관적으로 평가한 청산금의 평가액을 통지하면 족하다.","chapter":"물권법","answer":"O"},{"id":1207,"text":"가등기담보권자는 담보목적부동산의 경매를 청구할 수 있고, 이 경우 경매에 관하여 는 가등기담보권을 저당권으로 본다.","chapter":"물권법","answer":"O"},{"id":1208,"text":"미등기건물에 대한 양도담보계약상의 채권자의 지위를 승계하여 건물을 관리하고 있 는 자는 그 건물에 대한 철거처분권을 가진 자에 해당한다.","chapter":"물권법","answer":"X"},{"id":1209,"text":"부동산 합유지분의 포기가 적법하더라도 그에 관한 등기가 경료되지 않았다면 그 포 기된 합유지분은 나머지 잔존 합유지분권자들에게 귀속되지 않는다.","chapter":"물권법","answer":"O"},{"id":1210,"text":"동산의 선의취득에서 물권적 합의가 동산의 인도보다 먼저 행하여진 경우 양수인의 선의ㆍ무과실의 판단시점은 인도된 때를 기준으로 한다.","chapter":"물권법","answer":"O"},{"id":1211,"text":"소유권이전의 약정을 내용으로 하는 화해조서는 민법 제187조(등기를 요하지 아니하 는 부동산물권취득)의 판결에 포함되지 않는다.","chapter":"물권법","answer":"O"},{"id":1212,"text":"공유물분할의 조정절차에서 공유자 사이에 공유토지에 관한 현물분할의 협의가 성립 하여 그 합의사항을 조서에 기재함으로써 조정이 성립하더라도 등기없이 그 협의에 따른 새로운 법률관계가 창설되는 것은 아니다.","chapter":"물권법","answer":"O"},{"id":1213,"text":"甲이 보증금의 반환을 담보하기 위하여 전세권을 설정하면서 이와 동시에 목적물을 인도하지 않았으므로 전세권의 설정은 효력이 없다.","chapter":"물권법","answer":"X"},{"id":1214,"text":"전세금의 지급은 전세권 성립의 요소가 되는 것이므로 전세금을 현실적으로 지급하지 않고 기존의 채권으로 대 신할 수 없다.","chapter":"물권법","answer":"X"},{"id":1215,"text":"乙이 차임의 지급을 연체하는 경우 甲은 연체된 차임을 보증금에서 공제할 수 있다.","chapter":"물권법","answer":"O"},{"id":1216,"text":"임대차보증금의 반환을 담보하기 위하여 전세권설정등기가 경료되었음을 丙이 알지 못한 경우에도 甲은 연체차임의 공제를 가지고 丙에게 대항할 수 있다.","chapter":"물권법","answer":"X"},{"id":1217,"text":"전세권의 존속기간이 만료되면 丙은 X상가에 대한 전세권저당권을 실행하는 방법으 로 乙에 대한 대여금채권을 회수하여야 한다.","chapter":"물권법","answer":"X"},{"id":1218,"text":"채무자는 상당한 담보를 제공하고 유 치권의 소멸을 청구할 수 있는데, 유치물 가액이 피담보채권액보다 적을 경우에는 피담보채권액에 해당하는 담보를 제공하여야 한다.","chapter":"물권법","answer":"X"},{"id":1219,"text":"유치권자가 유치물에 대한 점유를 빼앗긴 경우에도 점유물반환청구권을 보유하고 있 다면 점유를 회복하기 전에도 유치권이 인정된다.","chapter":"물권법","answer":"X"},{"id":1220,"text":"유치권의 존속 중에 유치물의 소유권이 제3자에게 양도된 경우에는 유치권자는 그 제 3자에 대하여 유치권을 행사할 수 없다.","chapter":"물권법","answer":"X"},{"id":1221,"text":"유익비상환청구권을 담보하기 위하여 유치권을 행사하고 있는 경우에도, 법원이 유익 비상환청구에 대하여 상당한 상환기간을 허락하면 유치권이 소멸한다.","chapter":"물권법","answer":"O"},{"id":1222,"text":"수급인은 도급계약에 따라 자신의 재료와 노력으로 건축된 자기 소유의 건물에 대해 서도 도급인으로부터 공사대금을 지급받을 때까지 유치권을 가진다.","chapter":"물권법","answer":"X"},{"id":1223,"text":"경매 절차의 매수인이 증축부분의 소유권을 취득하기 위해서는 부합된 증축부분이 기 존건물에 대한 경매절차에서 경매목적물로 평가되어야 한다.","chapter":"물권법","answer":"X"},{"id":1224,"text":"건물의 증축부분이 저당목적물인 기존의 건물에 부합한 경우에는 특별한 사정이 없는 한 저당권의 효력이 증축부분에도 미친다.","chapter":"물권법","answer":"O"},{"id":1225,"text":"어떤 물건이 저당권이 설정된 후에 저당목적물의 종물이 된 경우에도 그 종물에 대하 여 저당권의 효력이 미친다.","chapter":"물권법","answer":"O"},{"id":1226,"text":"건물의 소유를 목적으로 하여 토지를 임차한 사람이 그 건물에 저당권을 설정한 때에 는, 저당권의 효력은 그 건물의 소유를 목적으로 한 토지임차권에도 미친다.","chapter":"물권법","answer":"O"},{"id":1227,"text":"특별한 사정이 없는 한 저당목적물인 건물에 대한 저당권자의 압류가 있으면 저당권 설정자의 건물 임차인에 대한 차임채권에 저당권의 효력이 미친다.","chapter":"물권법","answer":"O"},{"id":1228,"text":"대리인이 본인 소유가 아닌 물건을 처분하고 상대방이 본인 소유라고 오신한 경우에 도 선의취득이 인정될 수 있다.","chapter":"물권법","answer":"O"},{"id":1229,"text":"자동차관리법이 적용되는 자동차이더라도 행정상 특례조치에 의하지 아니하고는 적법 하게 등록할 수 없어서 등록하지 아니한 상
