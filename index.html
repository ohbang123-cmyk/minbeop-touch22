더라도 기술적 범위를 확정할 수 없는 경우에는 명세서의 기재에 의한 보충을 통해 기술적 범위의 확장 또는 제한 해석을 함으로써 특허권의 권리범위가 발명의 실제 내용에 맞게 실질적으로 정해 질 수 있도 록 해야 한다.","chapter":"특허침해","answer":"X","explanation":"명세서에 의한 보충은 허용되지만 청구범위를 임의로 확장하거나 제한하는 방식의 해석은 허용되 지 않는다."},{"id":607,"text":"후발명이 선특허발명의 요지를 전부 포함하고 이를 그대로 이용하되, 후발명 내에서 선특허발명이 발 명으로서의 일체성을 유지하는 경우에 는 이용관계가 성립하고, 선특허권자의 허락 없이 선특허발명을 실시하면 이용침해에 해당하나, 후발명이 선특허발명과 동일한 발명이 아니 라 균등한 발명을 이용하는 경우에는 그렇지 않다.","chapter":"특허침해","answer":"O","explanation":"후발명이 선특허발명의 요지를 모두 포함하여 이용하면 이용관계가 성립할 수 있다."},{"id":608,"text":"청구항에 기재된 구성요소는 모두 필수구성요소로 파악되어야 하며 일부 구성요소를 그 중요성이 떨 어진다는 등의 이유로 필수구성요소가 아니라고 주장할 수 없다.","chapter":"특허침해","answer":"O","explanation":"청구범위에 기재된 구성요소는 원칙적으로 모두 발명의 구성요소로 고려해야 한다."},{"id":609,"text":"특허권침해소송의 상대방이 제조하는 제품이 특허발명의 특허권을 침해한다고 할 수 있기 위해서는 특허발명의 청구범위에 기재된 각 구성 요소와 그 구성요소 간의 유기적 결합관계가 침해대상제품에 그 대로 포함되어 있을 필요까지는 없다.","chapter":"특허침해","answer":"X","explanation":"문언침해가 성립하려면 청구범위의 각 구성요소와 그 유기적 결합관계가 침해대상제품에 포함되 어야 한다."},{"id":610,"text":"피해자는 침해행위를 조성한 물건 또는 그 침해행위로부터 생긴 물건을 받은 경우에는 그 물건의 가 액을 초과하는 손해액에 대해서만 배상을 청구할 수 있다.","chapter":"특허침해","answer":"O","explanation":"침해행위로 인한 물건의 교부와 손해배상액의 관계에 관한 특칙이 적용된다."},{"id":611,"text":"법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관 하여 비밀누설죄를 범하면 그 행위자를 벌하는 외에 그 법인에는 6 천만원 이하의 벌금형을, 그 개인에게 는 해당 조문의 벌금형을 과한다. 다만, 법인 또는 개인이 그 위반행위를 방 지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다.","chapter":"특허침해","answer":"O","explanation":"양벌규정에 따라 행위자뿐 아니라 법인·개인에게도 벌금이 부과될 수 있으며 상당한 주의·감독을 다한 경우에는 예외가 인정된다."},{"id":612,"text":"甲은 자신이 발명한 ‘발명 X’에 관하여 학술논문으로 공개 발표하였고, 얼마 되지 않아 乙도 독자적으 로 ‘발명 X’를 발명하여 학술논문으로 공개 발표하였다. 그 후 甲은 제1 국 특허청에 ‘발명 X’에 관하여 특 허출원하였고, 甲은 우리나라 특허청에 제1 국에서의 출원을 근거로 조 약우선권을 주장하면서 ‘발명 X’ 에 관하여 특허출원하였다(이하 ‘국내출원 A’). 이어서 甲은 자신이 학술논문에 발표한 ‘발명 X’에 대하여 공 지예외의 적용과 ‘국내출원 A’를 기초로 국내우선권을 주장하면서 출원하였다(이하 ‘국내출원 B’). 다 음 설명에서 옳지 않은 것을 모두 고른 것은?","chapter":"특허침해","answer":"X","explanation":"이 사례의 옳지 않은 지문은 복수지문형으로 판단한다."},{"id":613,"text":"甲의 ‘국내출원 B’가 특허 등록된다면, 특허권은 ‘국내출원 A’의 출원일부터 20년이 되는 날까지 존속 한다.","chapter":"특허침해","answer":"X","explanation":"국내우선권 주장에 따른 특허권 존속기간 기산관계를 잘못 설명한 지문이다."},{"id":614,"text":"甲이 공지예외의 적용을 받기 위한 증명서류의 제출은, ‘국내출원 A’의 출원일로부터 30일 이내에 하 여야 한다.","chapter":"특허침해","answer":"X","explanation":"공지예외 주장 및 증명서류 제출의 기준일은 지문의 ‘국내출원 A’와 같이 단순히 조약우선권 출원 일을 기준으로 정하지 않는다."},{"id":615,"text":"甲은 공지예외 주장이 인정되더라도, ‘국내출원 B’의 ‘발명 X’에 대해서는 乙의 공개행위에 의하여 특 허받지 못하게 된다.","chapter":"특허침해","answer":"O","explanation":"乙의 독자적인 공개는 甲 자신의 공지에 대한 예외와 별개의 선행기술 문제를 발생시킨다."},{"id":616,"text":"甲의 ‘국내출원 A’는 제1 국 출원일로부터 1년 3개월이 지난 시점에서 취하된 것으로 본다.","chapter":"특허침해","answer":"X","explanation":"국내우선권 제도상 선출원의 취하간주 시점은 지문의 1년 3개월과 다르다."},{"id":617,"text":"침해에 의하여 특허권자의 손해가 발생된 것은 인정되나 그 손해액을 증명하기 위하여 필요한 사실을 증명하는 것이 해당 사실의 성질상 극히 곤란한 경우, 법원은 변론 전체의 취지와 증거조사의 결과에 기 초하여 상당한 손해액을 인정할 수 있다.","chapter":"특허침해","answer":"O","explanation":"손해액 입증이 현저히 곤란한 경우 법원이 상당한 손해액을 인정할 수 있다."},{"id":618,"text":"특허권자는 고의 또는 과실에 의한 특허권 침해로 입은 손해의 배상을 청구할 수 있으며, 침해한 자가 그 침해행위로 인하여 얻은 이익액을 특 허권자가 입은 손해액으로 추정한다.","chapter":"특허침해","answer":"O","explanation":"침해자의 이익액은 특허권자의 손해액으로 추정될 수 있다."},{"id":619,"text":"특허권자가 손해배상을 청구하는 경우 그 특허발명의 실시에 대하여 합리적으로 받을 수 있는 금액을 본인이 입은 손해액으로 하여 손해배상 을 청구할 수 있지만, 손해액이 합리적으로 받을 수 있는 금액을 초과하는 경우에는 그 초과액에 대해서도 손해배상을 청구할 수 있다.","chapter":"특허침해","answer":"O","explanation":"합리적으로 받을 수 있는 금액을 기준으로 하되 실제 손해가 더 큰 경우 초과손해의 청구도 가능하 다."},{"id":620,"text":"특허권자가 생산할 수 있었던 물건의 수량에서 실제 판매한 물건의 수량을 뺀 수량에 특허권자가 판 매한 단위수량당 이익액을 곱한 금액을 손해액의 한도로 하고, 여기서 침해행위 외의 사유로 판매할 수 없었던 수량에 따른 금액은 빼야 한다.","chapter":"특허침해","answer":"X","explanation":"2021년 당시 법에서는 손해액 산정 한도에 관한 이 지문의 표현이 정확하지 않다."},{"id":621,"text":"법원은 타인의 특허권을 침해한 행위가 고의적인 것으로 인정되는 경우에는 특허법 제128 조(손해배 상청구 등) 제1 항에도 불구하고 제2 항부터 제7 항까지의 규정에 따라 손해로 인정된 금액의 3 배를 넘지 아니하는 범위에서 배상액을 정할 수 있다.","chapter":"특허침해","answer":"O","explanation":"고의적 특허침해에 대해서는 징벌적 손해배상으로 최대 3 배까지 배상액을 정할 수 있다. 乙이 甲의 허락없이 “A 의 스마트폰에서 B 와 음 성인식시스템(c)으로 구성되는 스마트폰의 음성인식 장치”를 실시하는 경우에는 제2 항의 구성과 동일하고, 제2 항은 제1 항(독립항)의 종속항이 므로 제1 항 및 제2 항을 침해한다."},{"id":622,"text":"乙이 甲의 허락없이 제2 항의 특허발명의 실시에만 사용하는 음성인식시스템(c)을 생산ㆍ판매하는 경 우에는 특허법 제127 조(침해로 보는 행위) 제1 호의 규정에 의한 침해이다.","chapter":"특허침해","answer":"O","explanation":"특허발명의 실시에만 사용하는 물건의 생산·판매는 침해로 간주된다."},{"id":623,"text":"乙이 “K 의 스마트폰에서 B 와 C 로 구성되는 스마트폰의 음성인식장치”를 판매하는 경우에는 甲의 제1항 전제부인 “A 의 스마트폰”과 다 르기 때문에 침해가 성립하지 않는 것이 원칙이다.","chapter":"특허침해","answer":"O","explanation":"청구항의 모든 구성요소를 충족하지 않으면 문언침해가 성립하지 않는 것이 원칙이다."},{"id":624,"text":"제3 자가 甲의 특허권을 인지하지 못하고 개발한 프로그램(P)이 제3 항 방법발명의 실시에만 사용하는 물건인 경우, 그 프로그램(P)의 양도 의 청약은 특허법 제127 조(침해로 보는 행위) 제2 호의 규정에 의한 침해이다.","chapter":"특허침해","answer":"O","explanation":"프로그램이 해당 방법발명의 실시에만 사용하는 물건에 해당하면 간접침해 규정이 문제된다."},{"id":625,"text":"甲이 “살균성분이 있는 물질 A”에 대한 선출원 등록 특허권자이고, 乙이 “살균성분이 있는 물질 A 와 B 를 결합하여 생성한 제초제 AB”에 대 한 후출원 등록 특허권자인 경우, 후발특허와 선행특허가 이용관 계에 있으면 후발특허의 실시는 선행특허권과의 관계에서 제한된다.","chapter":"특허침해","answer":"O","explanation":"이용관계에서는 후발발명의 실시가 선행특허의 권리범위와 충돌할 수 있다."},{"id":626,"text":"물건에 관한 특허발명의 존재를 모르고 특허발명을 실시하는 기계를 구입하여 설명서대로 조작한 것 뿐이라는 사정만으로 특허침해에 관한 과실의 추정을 번복할만한 정당한 사유라고 볼 수 없다.","chapter":"특허침해","answer":"O","explanation":"특허권의 존재를 몰랐다는 사정만으로 과실추정이 바로 번복되지는 않는다."},{"id":627,"text":"특허권의 존재를 모른 채 도급계약에 따라 제3 자 특허발명의 실시제품을 생산하였을 뿐, 계약상 상대 방 이외의 자에게 생산된 제품을 판매 하지 않았다는 사정만으로 특허침해에 관한 과실의 추정을 번복할 만한 정당한 사유라고 볼 수 없다.","chapter":"특허침해","answer":"O","explanation":"도급계약에 따른 생산이라는 사정만으로 과실추정이 번복되지는 않는다."},{"id":628,"text":"균등침해를 판단하기 위하여 ‘과제 해결원리가 동일한지’ 여부를 가릴 때에는 명세서에 적힌 발명의 상세한 설명의 기재는 물론 출원 당시의 공지기술을 참작하여 기술사상의 핵심을 실질적으로 판단하여 야 한다.","chapter":"특허침해","answer":"O","explanation":"균등침해에서는 과제해결원리의 동일성을 실질적으로 판단한다."},{"id":629,"text":"특허권에 대한 침해의 금지를 청구하는 경우 청구의 대상이 되는 제품이나 방법은 사회통념상 침해의 금지를 구하는 대상으로서 다른 것과 구 별될 수 있는 정도로 구체적으로 특정되면 족하다.","chapter":"특허침해","answer":"O","explanation":"금지청구의 대상은 다른 제품·방법과 구별할 수 있을 정도로 특정하면 된다."},{"id":630,"text":"특허권 침해죄에 관한 공소사실의 특정은 피고인의 방어권 행사에 지장 없는 정도이면 족하므로, 청 구범위를 기재하는 것으로 그 보호대상을 침해자의 행위태양을 기재함으로써 공소사실을 특정해야 한다 는 것이 판례의 태도이다.","chapter":"특허침해","answer":"X","explanation":"특허권 침해죄의 공소사실은 침해행위의 구체적인 태양 등이 특정되어야 한다."},{"id":631,"text":"시장에서 다른 용도로 판매되고 있어 오로지 특허발명의 생산에만 사용되는 전용물이 아니더라도, 그 것이 특허발명의 과제해결에 필수불가 결한 기능을 하고 당사자가 그 물건이 특허발명의 실시에 사용된 다는 사정을 알면서 업으로 이를 공급한다면 특허법 제127 조에서 정한 간 접침해에 해당한다.","chapter":"특허침해","answer":"X","explanation":"간접침해에서 전용물 요건이 문제되며, 전용물이 아닌 물건에 관한 이 지문은 옳지 않다. 특허법 제127 조 규정은 특허권 침해에 대한 권 리 구제의 실효성을 높이기 위하여 일정한 요건 아래 이를 특허권의 침해로 간주하더라도 특허권이 부당하게 확장되지 않는다고 본 것이라고 이해 된다."},{"id":632,"text":"특허권자가 실시권자와의 계약에서 “본 계약에서 부여한 실시권을 다른 자에게 허락할 수 없다”고 규 정하고 있는데도 불구하고 실시권자와 의 계약으로 특허발명의 실시에만 사용하는 물건을 생산하여 실시 권자에게만 양도한 자의 행위는 당해 특허권에 대한 간접침해에 해당하지 아니한다.","chapter":"특허침해","answer":"O","explanation":"특허권자가 실시권자의 실시를 허용한 범위와 간접침해 성립 여부를 구별하여야 한다."},{"id":633,"text":"특허법 제127 조는 “특허권을 침해한 것으로 본다”고 규정하고 있으나 본 규정이 특허권 침해행위를 처벌하는 형벌법규인 특허권 침해죄의 구성요건을 규정한 것은 아니다.","chapter":"특허침해","answer":"O","explanation":"제127 조는 민사상 간접침해를 규정한 것이며 형벌법규의 구성요건과는 구별된다."},{"id":634,"text":"특허권의 속지주의 원칙상 특허권은 특허권이 등록된 국가의 영역 내에서만 효력이 미치므로, 특허가 물건의 발명인 경우 국외에서 행한 그 물건의 ‘생산행위’에 대해 간접침해가 성립할 수 없다.","chapter":"특허침해","answer":"O","explanation":"국내 특허권의 효력이 미치는 범위와 외국에서의 생산행위는 속지주의 원칙에 따라 판단한다."},{"id":635,"text":"특허권자가 주장하는 침해행위의 구체적 행위태양을 부인하는 피고는 자기의 구체적 행위태양을 제 시하여야 한다.","chapter":"특허침해","answer":"O","explanation":"특허침해소송에서 피고의 구체적 행위태양 제시의무가 인정된다."},{"id":636,"text":"법원이 손해액 산정을 위해 감정을 명한 경우 피고는 감정에 필요한 사항을 감정인에게 설명하여야 한다.","chapter":"특허침해","answer":"O","explanation":"손해액 산정을 위한 감정에 협력할 의무가 있다."},{"id":637,"text":"방법특허와 동일한 물건을 생산한 경우에는 특별한 사정이 없다면 그 물건이 해당 특허방법으로 생산 되지 않았다는 사실을 피고가 증명해야 한다.","chapter":"특허침해","answer":"O","explanation":"생산방법 특허에 관한 입증책임 전환 규정이다."},{"id":638,"text":"손해액 산정에 반드시 필요한 자료라면 그 자료가 영업비밀이라도 피고는 제출을 거절할 수 없다.","chapter":"특허침해","answer":"X","explanation":"영업비밀 보호를 위한 예외가 인정된다."},{"id":639,"text":"권리범위 확인심판에서 공지기술과 동일하거나 통상의 기술자가 쉽게 실시할 수 있는 확인대상발명 은 자유실시기술이 될 수 있다.","chapter":"특허침해","answer":"O","explanation":"자유실시기술이면 특허권의 권리범위에 속하지 않는다."},{"id":640,"text":"특허침해소송에서 자유실시기술의 법리는 항상 적용되지 않는다.","chapter":"특허침해","answer":"X","explanation":"침해소송에서도 자유실시기술 항변이 인정될 수 있다."},{"id":641,"text":"특허출원 과정에서 청구범위의 다각형을 육각형으로 보정했다면 육각형 이외의 다각형을 의식적으 로 제외한 것으로 볼 수 있다.","chapter":"특허침해","answer":"O","explanation":"의식적 제외에 의한 균등론 제한이 문제된다."},{"id":642,"text":"특허발명의 신규성이 부정되면 권리범위 역시 인정될 수 없다.","chapter":"특허침해","answer":"O","explanation":"공지기술에 해당하는 특허발명의 권리범위는 인정되지 않는다."},{"id":643,"text":"등록특허의 진보성이 부정되는 경우에는 권리범위 확인심판에서 그 특허권의 권리범위를 당연히 부 정할 수 있다.","chapter":"특허침해","answer":"X","explanation":"진보성 흠결만으로 권리범위 확인심판에서 특허권의 효력을 당연히 부정할 수 없다."},{"id":644,"text":"특허침해자의 판매수량과 특허권자의 판매수량을 고려하여 특허법상 손해액을 산정할 수 있다.","chapter":"특허침해","answer":"O","explanation":"특허법은 침해자의 양도수량 등을 이용한 손해액 추정규정을 둔다. 특허권자가 판매하지 못한 수량 중 침해 이외의 사유로 판매할 수 없었 던 수량은 손해액에서 고려할 수 있다."},{"id":645,"text":"특허법 제128 조의 손해액 추정은 특허권자의 손해가 전혀 없어도 언제나 적용된다.","chapter":"특허침해","answer":"X","explanation":"손해 발생이 전제되어야 한다."},{"id":646,"text":"물건발명에서 특허발명이 구현된 물건을 특허권자 등이 적법하게 양도했다면 양수인의 통상적인 사 용·양도에 특허권의 효력이 미치지 않는 다.","chapter":"특허침해","answer":"O","explanation":"특허권 소진의 원칙이다."}],"trademark":[{"id":1,"text":"현저한 지리적 명칭이 다른 식별력 없는 표장과결합에 의하여 본래의 현저한 지리적 명칭 등을 떠나 새로운 관 넘을 낳는 경우 에는 제 33 조 ( 상표 등록 의요건 ) 제 1 항제 4 호의 적용이배제 된다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":2,"text":"현저한 지리적 명칭과대학교 라는 단어의결합 으로 본래의 현저한 지리적 명칭을떠 나 새로운 식별력을형성한경우 에는 상표 등록 을할수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":3,"text":"사찰 ' 불국사 ' 는문화재 이므로 현저한 지리적 명칭에해당 하지 않는다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":4,"text":"현저한 지리적 명칭 이란 일반 수요자 에게 널리 알려져 있는 것을 뜻한 다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":5,"text":"현저한 지리적 명칭 인지 판단의기준시점은원칙적 으로 출원 상표 에 대하여 등록 여부 를결정 하는 결정 시이나.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":6,"text":"상 표의 유사여부는 반드시 상품출처의 오인․혼동 가능성이 있는지 여부를 고려하여 판단하여야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":7,"text":"상 표의 유사여부의 관찰방법은 전체적, 객관적, 이격적 관찰을 원칙으로 하되 상표 구 성 중 인상적인 부분(요부)이 있는 경우 이에 대하여 중점적으로 비교하는 것으로 하 며, 이 경우 소리 ․냄새 등은 같은 유형의 상표 간에 시각적 표현을 기준으로 유사여 부를 비교하여 판단한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":8,"text":"두 개의 상표를 직접 놓고 대비할 때에는 구성요소가 다른 점이 있다고 하더라도, 때 와 장소를 달리하여 관찰했을 때 경험칙상 서로 출처의 오인․혼동이 일어나는 경우 에는 유사한 상표로 보아야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":9,"text":"상표의 유사여부는 그 상표가 사용될 지정상품의 주된 수요계층과 기타 그 상품의 거 래실정을 고려하여 일반수요자의 주의력을 기준으로 판단하여야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":10,"text":"등록상표의 구성 중 식별력 없는 일부분이 등록 전 사용에 의한 식별력을 취득한 경우 에는 그 부분은 사용상품과 유사한 상품에 관하여 상표유사판단의 요부가 될 수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":11,"text":"일반적으로 상 표법 제33조(상표등록의 요건) 제1항 제1호․제2호․제3호는「상품과 관련 」하여 식별력 유무를 판단하여야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":12,"text":"보통명칭에 다른 식별력 있는 문자나 도형 등이 결합되어 있어 전체적으로 식별력을 인정한 경우에도 당해 지정상품과 관련하여 상품에 대한 오인․혼동의 우려가 있을 때에는 지정상품의 범위를 그 보통명칭과 관련된 것에 한정하도록 제34조(상표등록을 받을 수 없는 상표) 제1항 제12호를 적용한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":13,"text":"상표법 제33조(상표등록의 요건) 제1항 제1호 내지 제3호를 이유로 거절결정을 하는 경우에는 지정상품 전부에 대하여 거절결정을 하여야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":14,"text":"출원 상표가 상표법 제33조(상표등록의 요건) 제1항 각 호의 식별력 요건을 갖추고 있는지 여부에 대한 판단의 기준시점은 원칙적으로 상표등록여부결정을 할 때이다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":15,"text":"홀로그램상표의 경우 제출된 상표견본과 상표에 대한 설명을 통하여 특정되는 전체적 인 외관이 지정상품의 품질, 원재료, 용도 등의 성질을 직접적으로 나타낸다고 인정되 는 경우 상표법 제33조(상표등록의 요건) 제1항 제3호를 적용한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":16,"text":"소리 상표 를 오랫동안 지속적 으로 사용 하여 사용에 의한 식별력을취득 하였더라도 법 EA 기능성이인정 되는 경우 상표 등록 을 받을 수 없다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":17,"text":"상표법 제 33 조 ( 상표 등록 의 요건) 제 1 항제 7 호의 기타 식별력이 없는 상표 에해당하는 경우 에도 사용에 의한 식별력을취득 하면 등록 받을 수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":18,"text":"상표법 제 34 조 ( 상표 등록 을 받을 수 없는 상표) 제 1 항제 7 호의적용에 있어 선 출원 등 록 상표 의 등록 여부결정시에는식별력이미약 하였던 일부 구성부분이타인의후 출원 상 표와유사 판단 시요부로 되기 위해서는 타인의후 출원 상표 의 출원 시를기준으료사 용에 의한 식별력을취득 하여야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":19,"text":"사용에 의한 식별력을 취득한 기술적 상표 는 상표법 제 90 조 ( 상표 권의효력이 ' 미 치지 아니하는 범위) 제 1 항제 2 호에 의한 효력제한을 받지 아니한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":20,"text":"상표 등록 여부결정시를기준 으로 본질적 으로 식별력이 AE JE 과오로 등록 된경 우 등록 후의 사용에 의하여 aaae 취득 하더라도 무효로 \" 될수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":21,"text":"다른 상품의 판매촉진이나 광고를 하기 위하여 무상으로 제공되는 볼펜","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":22,"text":"마약 등 거래가 금지되는 물품","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":23,"text":"인터넷에서 다운로드의 형태로 판매되는 컴퓨터프로그램","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":24,"text":"대리점에서 판매되는 즉석건강식품의 원재료를 보여주기 위해서 곡물마다 별도로 유리 용기에 담은 상품의 견본","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":25,"text":"종전부터 발행하여 오던, 영화ㆍ음악ㆍ연예인 등에 관한 정보를 담은 월간잡지 \"ROADSHOW, 로드쇼\"의 독자들에게 보답하기 위하여 사은품으로 제공한 외국의 영화 배우들 사진을 모은 \"WINK\"라는 제호의 책자","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":26,"text":"사회통념상 자타상품의 식별력을 인정하기 곤란하거나 공익상 특정인에게 상표를 독점 시키는 것이 적당하지 않다고 인정되는 경우에 그 상표는 식별력이 없다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":27,"text":"둘 이상의 문자 또는 도형의 조합으로 이루어진 결합상표는 구성 부분 전체의 외관, 호칭, 관념을 기준으로 상표의 유사 여부를 판단하는 것이 원칙이나, 상표 중에서 일 반 수요자에게 그 상표에 관한 인상을 심어주거나 기억ㆍ연상을 하게 함으로써 그 부 분만으로 독립하여 상품의 출처표시기능을 수행하는 부분, 즉 요부가 있는 경우 적절 한 전체관찰의 결론을 유도하기 위해서는 요부를 가지고 상표의 유사 여부를 대비ㆍ 판단하는 것이 필요하다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":28,"text":"결합상표의 구성 부분 전부가 식별력이 없거나 미약한 경우에는 그 중 일부만이 요부 가 된다고 할 수 없으므로 상표 전체를 기준으로 유사 여부를 판단하여야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":29,"text":"현저한 지리적 명칭과 대학교라는 단어의 결합으로 본래의 현저한 지리적 명칭을 떠 나 새로운 관념을 낳거나 새로운 식별력을 형성한 경우에는 상표등록을 할 수 있고, 이 경우에 현저한 지리적 명칭과 대학교라는 단어의 결합만으로 새로운 관념이나 식 별력이 생긴다고 볼 수는 없다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":30,"text":"수요자를 기만할 염려가 있는 상표가 특정인의 상표나 상품이라고 인식되었다고 인정 되려면 선사용상표가 국내 전역에 걸쳐 수요자와 거래자에게 알려져야 하고, 특정인 의 상표 등으로 인식되었는지 여부는 구체적인 사안에서 개별적으로 새로운 관념이나 식별력이 생겼는지를 판단하여야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":31,"text":"도형상 에 있어서는 그 외관이 지배적인 인상을 남긴다 할 것이므로 외관이 동일ㆍ유 사하여 양 상표를 다 같이 동종 상품에 사용하는 경우 일반 수요자로 하여금 상품의 출처에 관하여 오인ㆍ혼동을 일으킬 염려가 있다면 양 상표는 유사하다고 보아야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":32,"text":"상표의 유사 여부 판단에서 상품 출처의 오인ㆍ혼동을 일으킬 우려가 있는지 여부는 보통의 주의력을 가진 우리나라의 일반 수요자나 거래자를 기준으로 판단하여야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":33,"text":"대비되는 상표 사이에 유사한 부분이 있다고 하더라도 그 부분만으로 분리인식될 가 능성이 희박하거나 전체적으로 관찰할 때 명확히 출처의 혼동을 피할 수 있는 경우에 는 유사상표라고 할 수 없다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":34,"text":"도형상표들에서 상표의 유사 여부 판단은 두 개의 상표 자체를 나란히 놓고 대비하여 두 개의 상표를 대하는 일반 수요자에게 상품 출처에 관하여 오인ㆍ혼동을 일으킬 우 려가 있는지의 관점에서 이루어져야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":35,"text":"유사상표의 사용행위에 해당하는지에 대한 판단은 두 상표가 해당 상품에 관한 거래 실정을 바탕으로 외관, 호칭, 관념 등에 의하여 일반 수요자에게 주는 인상, 기억, 연 상 등을 전체적으로 종합할 때, 두 상표를 때와 장소를 달리하여 대하는 일반 수요자 가 상품 출처에 관하여 오인ㆍ혼동할 우려가 있는지의 관점에서 이루어져야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":36,"text":"상표 의 구성 중식별력이 없거나 미약한부분이거래사회 에서 오랜 기간 사용된 결과 수요자 간에 누구의업무에 관련된 상품 을표시 하는 것인가 현저 하게 인식 되어 있는 경우 에는 그부분은사용된 상품 에관게 없이 식별력 있는 요부로 보아 상표 의 유사 여부를관단할수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":37,"text":"상품 의 성질, 품질 등의특성에 대한 정보를직감 하게 하는 표장을 기술적 표장 이라 하고, 상품 의특성을파악 하기 위하여 상상, 사고, 지각 등의사고과정을요하는 표장 을암시적표장 이라 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":38,"text":"간단 하고 흔히 있는 표장 만으로 된 상표 라 하더라도 석별력을취득 하면 등록 을 받을 수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":39,"text":"디자인과 상표 는 배타적 ㆍ 선택적인관계에 있는 것이 아니므로디자인이될수 있는 형상 이나 모양 이라고 하더라도 그것이 상표 의 본질적인 기능 이라고 할수 있는 자타 상품 의출처표시를 위하여 사용되는 것으로 볼수 있는 경우 에는 상표 로서의 사용이 라고 보아야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":40,"text":"협의의석별력 이란 자신과타인의 상품 을구별 하여 인식 하게 하는 힘을의미 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":41,"text":"상품 의보통명칭을보통 으로 사용 하는 방법 으로 표시한표장 만으로 된 상표 는 본질적 인식별력이 없다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":42,"text":"사용에 의한 식별력을취득 하는 상표 는 실제로 사용한 상표 그자체에한하는 것은 아니고 그와 유사한 상표 에대하여 까지 석별럭취득을 인정할 수 있으며, 그와 유사 한 상표 의 장기간 사용은위석별력취득에도움이 되는 요소 이다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":43,"text":"어떤 상표 가 상품 의원재료를표시 하는 것인가의여부는그 상표 의 관념, 지정 상품 과 의 관게, 현실 거래사회의 실정 등에 비추어 객관적 으로 판단 하여야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":44,"text":"현저한 지리적 명칭 이란 일반 수요자 에게 널리 알려진 지명을 말하는 것으로, 그 판단에 있어서는 교과서, 언론 보도, 설문 조사 등을 비롯하여 일반 수요자의 인식 에영향을 미칠 수 있는 여리 사정을종합적 으로 고려 하여 합리적 으로 판단 하여야 한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":45,"text":"흔히 있는 AU) 또는 명칭을보통 으로 사용 하는 방법 으로 표시한표장 만으로 된상 표 에서 ' 흔히 있는 성 또는 명칭 ' 이라함은 현실적으로 다수가존제하는 것으로 인석 되고 있는 자연인의성 또는 법인, 단체, 상호 임을 표시 하는 명칭, 아호, 예명, 필명 또는 그 약칭 등을 말한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":46,"text":"A상표는 출원 후에 특정인의 상품출처를 표시하는 것으로 현저하게 인식되었으나, 출원 당시 식별력 없는 기술적 표장에 불과하므로 등록결정을 받을 수 없다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":47,"text":"식별력 없는 기술적 표장이라도 사용에 의한 식별력을 취득하면 상표등록이 가능하며, 등록 여부 결정 시를 기준으로 판단하므로 A상표는 등록결정을 받을 수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":48,"text":"사용에 의한 식별력은 구체적인 권리자 성명·명칭까지 일반수요자에게 인식될 것을 요구하는 것이 아니라, 상품의 추상적 출처가 특정인과 연결되어 인식되는 것으로 족하다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":49,"text":"출원 당시 기술적 표장이라도 등록 여부 결정 전 사용에 의해 식별력을 취득해 등록되었다면 상표권은 제90조 제1항 제2호의 효력 제한을 받지 않는다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":50,"text":"AEA 등록 상표 의 등록 번호와 상표 를기재 하고, 그 상표 에 대하여 ' 타 사의 컴퓨터 및 전자오락기구를 오인, 혼동 하여 현혹 없기를바란디 ' 고기재한 것은 지정 상품 에 대한 광 고로 볼수 있으므로 상표법 제 2 조 ( 정의 ) 상 상표 의사용 으로 볼수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":51,"text":"소관부처 로부터 등록 상표 의지정 상품 인의약품의제조나수입에 관한 품목별허가를 받지 아니한 상태 에서 신문에 1 년못 미처 한차레씩그 상표 를광고 하였거나 국내의 일부 특정지역 에서 해당 상표 를부착한지정 상품 이판매된경우 라면 불사용 으로 인한 상표 등록 취소 심판 에서의 정당한 사용이 있었다고 볼수 없다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":52,"text":"상품 의선전광고나 HARA 또는 고객에 대한 서비스 제공 등의목적 으로 그 상품 과 함께 또는 이와 별도로 고객 에게 무상 으로 배부 되는 이른바 ' 광고매 체가 되는 물품 ' 은 비록 그물품에 표시된 상표 이외의 다른 문자나 도형 등에 의하여 광고 하고자 하는 상품 의출처표시로사용된 것으로 인식할수 있는 등의 특별한 사정이 없더라도 이러 한물품에 상표 를표시한 것은 상표법 제 2 조 ( 정의 ) 상 상표 의사용 으로 볼수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":53,"text":"자신의 상표 가 아니라 주문자가요구 하는 상표 로 상품 을생산 하여 주는 주문자 상표 부 착 생산 방식 (이른바 OEM 방식 ) 에 의한 수출의 경우, 불사용 으로 인한 상표 등록 취소 심판 에서 누가 상표 를 사용한 것인지를판단 하는데 있어서는 특단의사정이 없는 한 국내 에서 실제로 상품 또는 상품 을제조 하면서 포장에 상표 를표시 하였는지 여부를 가지고 판단 하여야 하므로 국내의생산자에 의해 상표 가사용된 것으로 볼수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":54,"text":"상표 권 자가 외국 에서 AAJ 등록 상표 를 상품 에표시 하고 우리나라 에서 직접 또는 대 리인을 통하여 그 상품 을거래한바 없이, 상표 권 자가 등록 상표 를표시한 그대로 그 상품 이제 3 자에 의하여 정상적으로 국내로수입 되어 유통 됨에 따라 사회통념상 국내 의거래자나수요자 에게 그 상표 가 상표 권 자의 AFA 관련된 상품 을표시 하는 것으 로인식 되는 경우 라도 상표 권 자가 직접 유통 시킨 것이 아니므로특단의사정이 없는 한불사용 으로 인한 상표 등록 취소 심판 에서 그 상표 를표시한 상표 권 자가 국내 에서 상 표를불사용한 것으로 볼수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":55,"text":"상표등록여부결정을 한 때에 식별력이 없어 등록을 받을 수 없었음에도 불구하고 잘 못하여 상표등록이 이루어진 경우에는 비록 그 등록 후의 사용에 의하여 식별력을 취 득하였더라도 등록무효의 하자가 치유되지 아니한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":56,"text":"현저한 지리적 명칭으로만 된 상표는 상표등록출원 전부터 그 상표를 사용한 결과 수 요자 간에 특정인의 상품에 관한 출처를 표시하는 것으로 식별할 수 있게 되었더라도 그 상표를 사용한 상품에 대하여 상표등록을 받을 수 없다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":57,"text":"사용에 의한 식별력을 특정 지역에서만 취득하여 등록이 된 경우에는 상표권의 효력 은 식별력을 취득한 그 지역에만 미친다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":58,"text":"간단하고 흔히 있는 표장만으로 된 상표가 식별력 있는 표장과 결합하여 새로운 식별 력이 있다고 인정되더라도 그 결합상표는 상표등록이 불가능하다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":59,"text":"흔히 있는 성(姓)을 보통으로 사용하는 방법으로 표시한 표장만으로 된 상표는 어떠 한 경우에도 식별력을 취득할 수 없다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":60,"text":"제과점업에 대하여 상표등록을 받은 자가 해당 등록상표가 표시된 나무상자에 즉석으 로 구운 빵을 담아 판매한 행위는 제과점업에 대한 상표의 사용행위에 해당한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":61,"text":"상표법 제2조 제1항 제11호 다목에서 말하는 상품에 관한 광고에는 시각으로 인식할 수 있는 것이 포함되어야 하므로 그 광고에는 상품명이나 제조원이 표시되어야 상표 의 사용으로 인정된다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":62,"text":"명함의 뒷면에 상표를 표시하고, 이를 거래상대방에게 교부한 행위는 상표법상 상표 의 사용행위에 해당한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":63,"text":"인터넷 포털사이트 운영자에게서 특정 단어나 문구의 이용권을 구입하여 일반 인터넷 사용자가 그 단어나 문구를 검색창에 입력하면 검색결과 화면에 그 키워드 구입자의 홈페이지로 이동할 수 있는 스폰서의 홈페이지 주소가 나타나는 경우에 그 검색결과 화면에 나타난 표장이 자타상품의 출처표시를 위하여 사용된 것으로 볼 수 있다면 상 표로서의 사용에 해당한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":64,"text":"도메인이름의 사용태양 및 그 도메인이름으로 연결되는 웹사이트 화면의 표시 내용 등을 전체적으로 고려하여 거래통념상 상품의 출처를 표시하고 자기의 업무에 관계된 상품과 타인의 업무에 관계된 상품을 구별하는 식별표지로 기능하고 있을 때에는 도 메인이름의 사용행위를 상표의 사용으로 볼 수 있다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":65,"text":"상 의 유사 여부의 판단은 두 개의 상 표 란 놓 자체를 나 히 고 대비하여 두 개의 표 상 를 대하는 일반 수요자에게 상 품 처 혼 출 에 관하여 오인ㆍ 동을 일으 킬 려우 점 루 져 표 칭 념 가 있는지의 관 에서 이 어 야 하고, 두 개의 상 가 외관, 호 , 관 등에 억 의하여 일반 수요자에게 주는 인상, 기 , 연상 등을 전체적으로종 품 합할 때 상 의 출처에 관하여 오인ㆍ혼동을 일으킬 우려가 있는 경우에는 두 개의 상표는 서로 유사하다고 보아야 한다. 표","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":66,"text":"업무 장이 란 국내 및 국외에서 영 리를 목적으로 하지 아니하는 업무를 하는 자 가 그 업무를 나타내기 위하여 사용하는 장이다. 표","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":67,"text":"상 의품 품 려 질오인을 일으키게 할 염 가 있는 상 는 상 등록을 받을 수 없는 표 표 데 상 의품 품 질오인이 상 의 란 품 품 질에 관한 오인을 하는 것이지, 상 자체를 오 말 품 인하게 하는 경우는 포함되지 않는다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":68,"text":"등록상 임을 표 표 시한 타인의 상 표권을 침해한 자는 그 침해행위에 대하여 과실 이 있는 것으로 추정한다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":69,"text":"디자인과 상표는 배타적ㆍ선택적인 관계에 있는 것이 아니므로 디자인이 될 수 있는 형상이나 모양이라고 하더라도 그것이 상표의 본질적인 기능이라고 할 수 있는 자타상품의 출처표시를 위하여 사용되는 것으로 볼 수 있는 경우에는 위 사용은 상표로서의 사용이라고 보아야 할 것이다.","chapter":"상표의 개념·사용·식별력","answer":"","explanation":""},{"id":70,"text":"상표법 제33조(상표등록의 요건) 제2항에 따라 등록한 상표는 상표법 제90조(상표권 의 효력이 미지치 아니하는 범위) 제1항 제2호에 의한 상표권 효력의 제한을 받지 아니한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":71,"text":"상표법 제33조 제1항에 해당하여 상표등록을 받을 수 없는 상표라도 상표등록출원 전부터 그 상표를 사용한 결과 수요자 간에 특정인의 상품에 관한 출처를 표시하는 것으로 식별할 수 있게 된 경우에는 그 상표를 사용한 상품과 동일ㆍ유사한 상품에 대하여 상표등록을 받을 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":72,"text":"그 상품에 대하여 관용하는 상표를 상표등록출원 전부터 사용한 결과 수요자 간에 특정 인의 상품에 관한 출처를 표시하는 것으로 식별할 수 있게 된 경우에는 제33조 제2항에 따라 등록할 수 있다. 역 품 표시하는 것이라고 수요자들에게 널리 인식되어 있는 타인의 지리","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":73,"text":"특정 지 의 상 을 적 표시와 동일ㆍ유사한 상표로서 그 지리적 표시를 사용하는 상품과 유사하다고 인정 되어 있는 상품에 사용하는 상표는 상표법 제34조(상표등록을 받을 수 없는 상표) 제1항 제10호에 따라 상표등록을 받을 수 없다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":74,"text":"상표를 등록하여 사용하는 행위가 특정한 당사자 사이에 이루어진 계약을 위반하거나 특정인에 대한 관계에서 신의성실의 원칙에 위배된 경우, 상표법 제34조 제1항 제4호의 공공의 질서를 해칠 우려가 있는 상표에 해당한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":75,"text":"출원인이 재심사 청구를 하면서 지정상품을 보정한 경우 그 보정이 최초의 상표등록 출원의 요지를 변경하여 부적법한 때에는 심사관은 보정각하 결정을 하여야 한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":76,"text":"재심사 청구시 출원인이 의견서를 반드시 제출해야 하는 것은 아니다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":77,"text":"지정상품추가등록출원, 존속기간갱신등록신청 및 상품분류전환등록신청에 대한 거절 결정에 대해서도 재심사 청구를 할 수 있다. 표","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":78,"text":"상 등록거절결정에 대한 거절결정 불복심판의 청구기간이 상표법 제17조(기간의 연장 등) 제1항에 따라 연장된 경우 그 연장된 기간 만큼 재심사 청구의 기간도 연장된다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":79,"text":"재심사가 유효하게 청구된 경우 그 상표등록출원에 대하여 종전에 이루어진 상표등록 거절결정은 취소된 것으로 본다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":80,"text":"상표등록의 이의신청인은 이의신청기간이 지난 후 30일 이내에 그 이의신청서에 적은 이유와 증거를 보정할 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":81,"text":"심사관합의체는 이의신청인이 이의신청기간 내에 그 이유나 증거를 제출하지 아니한 때에는 출원인에게 답변서 제출기회를 주지 아니한 경우라도 상표법 제61조(이의신청 이유 등의 보정)에 따른 이의신청 이유 등의 보정기간이 지난 후 결정으로 이의신청을 각하할 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":82,"text":"심사관합의체는 둘 이상의 이의신청이 있는 경우에 그 중 어느 하나의 이의신청이 이유가 있다고 인정할 때에는 다른 이의신청에 대해서는 결정하지 아니할 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":83,"text":"심사관합의체는 이의신청에 관하여 출원인이나 이의신청인이 주장하지 아니한 이유에 관하여도 심사할 수 있으나 이 경우 출원인이나 이의신청인에게 기간을 정하여 그 견을 진술할 수 있는 기회를 주어야 한다. 이유에 관하여 의","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":84,"text":"지정상품추가등록 이의신청의 이유는 통상의 상표등록 이의신청의 이유와 동일하다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":85,"text":"저명한 AMNYA 관계를거짓 으로 표시한 상표 라도 유족의승낙을 받은 경우에 는 상표 등록 을 받을 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":86,"text":"공공단체의 비영리 QFE 표시 하는 표장 으로서 저명한 것과 동일한 상표 라도 그공 공단체의승낙을 받은 경우 에는 상표 등록 을 받을 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":87,"text":"저명한 타인의 성명 ㆍ 명칭을포함 하는 상표 라도 그타인의승낙을 받은 경우 에는 상 표 등록 을 받을 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":88,"text":"저명한 국제기관의 명칭 ㆍ FAA 동일한 상표 라도 그국제기관의승낙을 받은 경우에 는 상표 등록 을 받을 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":89,"text":"대한민국의 국기, 국장 ( 뻐후 ) 과 동일한 상표 라도 대한민국 정부의승낙을 받은 경우에 비영리법인은 상표 등록 을 받을 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":90,"text":"농 일한 지정 상품 에 사용할 동일한 상표 에 대하여 먼저 출원 한자로 부터 상표 등록 에 대한 동의를 받은 경우 에는 나중에 출원 한 자도 상표 를 등록 받을 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":91,"text":"궁존동의서는 SUA 또는 의견서에첨부 하여 제출이가능하 다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":92,"text":"적법한 공존 동의서 AZA 지정 상품 일부에 대한 공존동의도가능하 나.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":93,"text":"지리적 표시 단체표장과 유사한 표장 에는 공존동의를적용 하지 않는다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":94,"text":"업무표장의 출원 에는 원칙적 으로 공존동의를적용 하지 않는다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":95,"text":"저명한 연예인 이름, 연예인 그룹 명칭, 스포츠선수 이름, 기타 국내외 유명 인사 등 의 이름이나 이들의 약칭을 포함하는 상표를 출원한 경우에는 지정 상품과 관계없이 제34조 제1항 제6호를 적용한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":96,"text":"제34조 제1항 제2호는 저명한 고인과의 관계를 거짓으로 표시하거나 비방 또는 모욕 평판을 나쁘게 할 우려가 있는 경우에 적용한다. 하거나","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":97,"text":"저명한 고인과의 관계를 거짓으로 표시하는 것이 아니라도 지정상품과의 관계를 고려 할 때 저명한 고인과 관련있는 것으로 오인․혼동을 일으킬 염려가 있는 경우에는 제 34조 제1항 제12호를 적용한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":98,"text":"현존하는 저명한 공익법인의 명칭 또는 약칭이나 이를 포함하는 상표에 대해서는 제 34조 제1항 제6호를 적용한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":99,"text":"저명한 고인의 성명을 정당한 권리자의 동의없이 출원하여 그 명성에 편승하려는 경 우 제34조 제1항 제2호가 적용된다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":100,"text":"부분거절제도란 상표등록출원의 지정상품 중 일부에 거절이유가 있는 경우 해당 거절이유가 있는 지정상품에 대하여만 상표등록거절결정을 하여 나머 지 지정상품에 대하여는 상표등록을 받을 수 있도록 하는 것으로, 이 제도 의 도입으로 인하여 해당 상품을 분할출원하지 않더라도 거절이유 없는 지 정상품에 대한 조기등록이 가능하다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":101,"text":"상표등록출원의 일부 지정상품에 대하여만 상표등록거절결정을 받은 경우 에는 그 일부 지정상품에 대하여 재심사청구가 가능하다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":102,"text":"일부 지정상품에 거절이유가 있는 경우 거절이유가 없는 지정상품에 대하 여 먼저 출원공고결정을 거쳐 상표등록결정을 할 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":103,"text":"부분거절제도는 국제상표등록출원에도 그 적용이 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":104,"text":"지정상품추가등록출원을 상표등록출원으로 변경하는 경우 마","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":105,"text":"상표등록출원을 그 지정상품 다 분할하여 이전하는 경우에 유사한 지정상품을 함께 이전하지 않아 상표등록을 할 수 없다는 이유로 된 거절결정에 대하여 불복하여 심판 을 제기하는 경우 력","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":106,"text":"이해관계인이 등록상표가 식별 이 없는 상표라는 이유로 제기한 상표등록무효심판에 대하여 답 변서를 제출하는 경우 각 던","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":107,"text":"보정 하결정불복심판을 대리하고 있 변리사 甲이 구술심리기일에 출 하기 어 게 되 석 렵 석 자 변리사 乙에게 그 특허심판원의 심리기일에 출 을 위해 대리권을 다시 위 하는 경우 임 망","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":108,"text":"당사자가 사 하여 중단된 상표에 관한 절차의 수계신청을 취하하는 경우","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":109,"text":"단체표장등록: 대통령령으로 정하는 단체표장의 사용에 관한 사항을 정한 정관","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":110,"text":"증명표장등록: 대통령령으로 정하는 바에 따라 그 표장에 관한 설명과 증명하려는 상품의 품질, 원산지, 사용방법 그리고 그 밖의 특성을 증명하고 관리할 수 있음을 증명하는 서류","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":111,"text":"지리적 표시 단체표장등록: 대통령령으로 정하는 바에 따라 지리적 표시 상품의 생산지를 증명하는 서류","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":112,"text":"업무표장등록: 그 업무의 경영 사실을 증명하는 서류","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":113,"text":"선출원에 의한 타인의 등록상표(등록된 지리적 표시 단체표장을 포함한다)와 동일·유사한 상표로서 그 지정상품과 동일·유사한 상품에 사용하는 상표","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":114,"text":"동업·고용 등 계약관계나 업무상 거래관계 또는 그 밖의 관계를 통하여 타인이 사용하거나 사용을 준비 중인 상표임을 알면서 그 상표와 동일·유사한 상표를 동일·유사한 상품에 등록출원한 상표","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":115,"text":"수요자들에게 인식되어 있는 타인의 상품이나 영업과 혼동을 일으키게 하거나 그 식별력 또는 명성을 손상시키는 상표","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":116,"text":"국가·인종·민족·공공단체·종교 또는 저명한 고인과의 관계를 거짓으로 표시하거나 이들을 비방 또는 모욕하거나 이들에 대한 평판을 나쁘게 할 우려가 있는 상표","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":117,"text":"본호에해당 하려면 출원 당시에 설사용 상표 가 국내 또는 외국의수요자들 에게 특정 인의 상품 을표시 하는 것이라고 인식 되어 있어야 하고, 출원 인이선사용 상표 와 동일 또는 유사한 상표 를 부정한 목적을가지교사용 하여야 한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":118,"text":"본 호의 국내 또는 외국의수요자들 에게 특정인의 상품 을표시 하는 것이라고 인식되 어 있다는 것은 일반 수요자를표준 으로 하여 거래의실정에 따라 인정 되는 객관적인 상태를 말하는 것이다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":119,"text":"본 호의 국내 / 또는외국의 | 수요자들 에게 특정인의 상품 을표시 하는 것이라고 인식되 기 위해서는 선사용 상표 에 관한 권리 자의명칭이구체적 으로 알려지는것 까지 필요한 것은 아니고, 뭔리자가 』 누구인지알수 없더라도 동일 하고 일관된 FAE 인식될수 있으멘충분 하다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":120,"text":"얼사용 상표 가양도된 경우 본 호의 국내 또는 외국의수요자들 에게 특정인의 상품 을 표시 하는 것이라고 인식 되어 있는 상표 로인정 되기 위해서는 선사용 상표 에 관한 주지 성이양수인 에게 승게 되었거나 FFAA 독자적 으로 FAAS 획득 해야 하며, 양도 전의 사용실적을 고려할 수는 없다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":121,"text":"본 호의 국내 또는 외국의수요자들 에게 특정인의 JES 표시 하는 것이라고 인식되 EAE 결정 하기 위해 외국에서의 상표 및그사용 상품 에 대한 인식과평가를참작할 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":122,"text":"상표등록을 받을 수 있는 자가 정부가 개최하는 박람회에 출품한 상품에 사용한 상표를 그 출품일부터 12개월 이내에 그 상품을 지정상품으로 하여 상표등록출원한 경우 그 상표등록출원은 그 출품을 한 때에 출원한 것으로 본다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":123,"text":"출원공고가 있는 경우 누구든지 출원공고일부터 3개월 내에 거절이유 등에 해당한다는 것을 이유로 특허청장에게 이의신청을 할 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":124,"text":"상표권자가 사망한 날부터 3년 이내에 상속인이 그 상표권의 이전등록을 하지 않으면 사망한 날부터 3년이 되는 날의 다음 날에 상표권이 소멸한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":125,"text":"상표법 제35조(선출원)에 해당하는 것을 사유로 하는 상표등록의 무효심판은 상표등록일부터 3년이 지난 후에는 청구할 수 없다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":126,"text":"심판에서 심판관의 제척 또는 기피의 원인은 신청한 날부터 30일 이내에 소명하여야 한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":127,"text":"해군사관 학교 사관생도의 \"견장\"","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":128,"text":"의류를 지정상품으로 하는 상표 \"JAMES DEAN\"","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":129,"text":"지정상품이 기계 류 인 출원상표 \" KS B\"","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":130,"text":"지정상품을 '눈썹 용 연필, 립 스 틱 , 매니 큐 어, 아이 섀 도, 마스 카 라 ' 등으 로 하는 외국 회 사의 출원상표 \"2 N E1\"","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":131,"text":"공인 노 무사업, 법무사업, 변 호사업, 변리 사업 등을 지정서 비 스업으로 하 면서 전문 직 종사자에게 업무를 위 임 하지 아니하고 스스로 행할 수 있 도록 도와주는 방식을 보통으로 표시하는 표장만으로 된 상표 \"나 홀 로\"","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":132,"text":"지정상품을 서적으로 하는 출원상표 \"관족법(觀足法)\"","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":133,"text":"업무표장 등록을 받은 자는 해당 업무표장과 유사한 표장을 증명표장으로 등록받을 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":134,"text":"업무표장등록출원은 해당 업무와 함께 양도하지 않더라도 양도할 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":135,"text":"업무표장권에 대해 질권을 설정할 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":136,"text":"업무표장등록출원은 상표등록출원으로 변경할 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":137,"text":"업무표장권에 대해 전용사용권을 설정할 수 없다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":138,"text":"사과주스에 사용하는 원재료를 표시한 '사과'라는 상표라도 상표등록출원 전부터 그 상표를 사과주스에 사용한 결과 수요자 간에 특정인의 상품에 관한 출처를 표시하는 것으로 식별할 수 있게 된 경우에는 그 상표를 사용한 사과주스를 지정상품으로 한정 하여 상표등록을 받을 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":139,"text":"상품에 상표를 표시한 것을 인도할 목적으로 수출하는 행위는 상표의 사용에 해당하 지 아니한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":140,"text":"타인의 등록상표와 동일 또는 유사한 표장을 순전히 디자인적으로만 사용하여 상표의 사용으로 인식될 수 없는 경우에는 상표권 침해로 볼 수 없다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":141,"text":"증명표장을 출원하거나 등록을 받은 자는 그 증명표장과 동일ㆍ유사한 표장을 상표로 등록을 받을 수 없다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":142,"text":"자기의 영업에 관한 상품에 사용하려는 경우에는 증명표장의 등록을 받을 수 없다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":143,"text":"직업소개업, 직업알선업, 취업정보제공업을 지정상품(서비스)으로 하는 '알바천국'","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":144,"text":"가정/사무실용물분배기, 산업용물분배기, 냉수기를 지정상품으로 하는 'WATERLINE'","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":145,"text":"장미를 지정상품으로 하는 'Red Sandra'","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":146,"text":"호텔업, 모텔업, 레스토랑업, 관광숙박업을 지정상품(서비스)으로 하는 'SUPER8' 치 형 화와 련 술 담","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":147,"text":"금속절단공구, 절단공구, 도구 및 절단장 의 상 관 한 기 상 g g you comp t t v g 업을 지정상품(서비스)으로 하는 'en ineerin r e i i e ed e'","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":148,"text":"상표가 보통명칭화 되었는가의 여부는 그 나라에 있어서 당해 상품의 거래실정에 따라서 이를 결정하여야 하고, 상표권자가 상표권침해로 인한 손해배상을 청구 하는 경우에 있어서는 상표등록여부결정 당시를 기준으로 등록상표가 보통명칭 화 되었는지의 여부를 판단한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":149,"text":"관용표장이 포함된 상표로서 그 관용표장이 다른 식별력이 있는 표장에 흡수되 어 불가분의 일체를 구성하고 있어서 전체적으로 식별력이 인정되는 경우에는 상표등록을 받을 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":150,"text":"지정상품과의 관계에서 간접적, 암시적이라고 인식될 수 있는 표장이라도 실제 거래업계에서 직접적으로 상품의 성질을 표시하는 표장으로 사용되고 있는 경우 에는 성질표시 표장에 해당한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":151,"text":"지리적 명칭은 원칙적으로 현존하는 것에 한하지만 특정 지역의 옛 이름, 애칭 등이 일반수요자나 거래자들에게 통상적으로 사용된 결과 그 지역의 지리적 명 칭을 나타내는 것으로 현저하게 인식되는 경우에는 현저한 지리적 명칭에 해당 한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":152,"text":"알파벳 두 글자를 결합한 상표는 그 구성이 특별히 사람의 주의를 끌 정도이거나 새로운 관념이 형성되는 경우에는 그 상표를 구성하는 문자를 직감할 수 있다고 하더라도 간단하고 흔히 있는 표장만으로 된 상표에 해당한다고 할 수 없다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":153,"text":"저명한 타인의 성명, 명칭 등을 상표로 사용한 때에는 타인 자신의 불쾌감의 유무 또는 사회통념상 타인의 인격권의 침해여부를 불문하고 본호를 적용한다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":154,"text":"사회통념상 국내 일반수요자 또는 관련 거래업계에서 타인의 성명ㆍ명칭 등이 저명하면 되고, 타인 그 자체는 저명할 필요가 없다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":155,"text":"타인이라 함은 현존하는 국내의 자연인 또는 법인은 물론이고 국내 일반수요자 또는 관련 거래업계에서 일반적으로 널리 인식되고 있는 현존하는 외국의 자연인 또는 법인도 포함된다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":156,"text":"저명한 연예인그룹 명칭이나 약칭을 포함하는 상표를 제3자가 임의로 출원한 경우 본호에 해당하는 것으로 본다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":157,"text":"저명한 타인의 성명, 명칭 등 또는 이들의 약칭이 상표의 부기적인 부분으로 포 함되어 있는 경우에는 본호에 해당하지 않는 것으로 본다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":158,"text":"甲이 乙의 X'상표등록출원에 대하여 이의신청을 제기하였을 경우 특허청장은 직 권으로 이의신청이유 등의 보정기간을 30일 이내에서 한 차례 연장할 수 있으며, 甲이 교통이 불편한 지역에 있는 자에 해당하는 경우 그 횟수 및 기간을 추가로 연장할 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":159,"text":"甲이 사용 중이던 X상표를 a상품에 대하여 상표등록출원한 시점이 乙의 X'상표등록 후 그 무효심결확정 전이라 하더라도 甲의 X상표등록출원이 등록될 수도 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":160,"text":"乙이 제기한 적극적 권리범위 확인심판에서 甲에게 상표법 제99조제1항의 선사용권 이 인정되는 경우라도 그 선사용권의 존재가 적법한 항변사유가 될 수 없다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":161,"text":"甲에게 상표법 제99조제1항의 선사용권이 인정되는 경우라면 그 선사용권은 甲 의 지위를 승계한 자에게도 그대로 인정된다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":162,"text":"甲의 X상표가 사용에 의하여 수요자들에게 특정인의 상표로 알려지기 시작한 시기가 乙의 X'상표등록출원의 등록여부결정시 이후라면 乙의 상표등록 이후 甲 의 X상표 사용은 乙의 상표권행사에 의해 저지될 수 있다.","chapter":"상표등록요건·출원·심사·등록","answer":"","explanation":""},{"id":163,"text":"상 법 제100조(전용사용권ㆍ통상사용권 등의 등록의 효력) 제1항에 따른 상속에 의한 통상사용권 이전의 경우 지체 없이 그 취지를 지식재산처장에게 신고하여야 한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":164,"text":"상표권을 목적으로 하는 질권이 상속에 의하여 이전된 경우, 등록하지 아니하여도 그 효력이 발생한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":165,"text":"상표권 또는 전용사용권뿐만 아니라 통상사용권을 목적으로 하는 질권을 설정한 경우 에도 질권자는 해당 등록상표를 사용할 수 없다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":166,"text":"상표권이 공유인 경우에 각 공유자는 다른 공유자 모두의 동의를 받지 아니하면 그 지분을 목적으로 하는 질권을 설정할 수 없다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":167,"text":"업무표장권을 목적으로 하는 질권은 설정할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":168,"text":"상표권 존속기간 갱신등록의 효력은 원래 존속기간의 종료일 다음 날부터 발생한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":169,"text":"상표권자는 상표법 제99조 제1항에 따라 상표를 계속 사용할 권리를 가지는 자에게 그 자의 상품과 자기의 상품 간 출처의 오인이나 혼동을 방지하는 데 필요한 표시를 할 것을 청구할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":170,"text":"상표권자가 사망한 날부터 3년 이내에 상속인이 상표권의 이전등록을 하지 아니하면 상표권은 그 3년이 되는 날의 다음 날에 소멸한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":171,"text":"특허청장은 상표등록무효심판의 청구가 있는 경우 그 취지를 해당 상표권의 전용사용권자 및 그 밖에 상표에 관한 권리를 등록한 자에게 통지하여야 한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":172,"text":"상 표법 제92조(타인의 디자인권 등과의 관계)에서 등록상표가 그 상표등록출원일 전 에 발생한 타인의 저작권과 저촉되는 경우에 지정상품 중 저촉되는 지정상품에 대한 상표의 사용은 저작권자의 동의없이 그 등록상표를 사용할 수 없기 때문에 저작권자 와 관계없는 제3자가 등록된 상표를 무단으로 사용하는 경우에 상표권자는 그 사용금 지를 청구할 수 없다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":173,"text":"상 표법 제47조(출원 시의 특례)에 따라 상표등록을 받을 수 있는 자가 조약당사국이 가입된 국제기구가 개최하는 국제박람회에 출품한 상품에 사용한 상표를 그 출품을 한 때에 그 상표등록 출원한 것으로 하기 위해서는 그 취지를 적은 상표등록출원서와 이를 증명할 수 있는 서류를 상표등록출원일부터 3개월 이내에 특허청장에게 제출하 여야 한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":174,"text":"확정된 심결에 대하여 재심을 청구하는 경우에 당사자는 심결 확정 후 재심 사유를 안 날부터 90일 이내에 재심을 청구하여야 한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":175,"text":"상표권에 관하여 전용사용권이 설정된 경우 이로 인하여 상표권자의 상표의 사용권이 제한받게 되지만, 제3자가 그 상표를 정당한 법적 권한 없이 사용하는 경우에는 그 상표권자는 그 상표권에 기하여 제3자의 상표의 사용에 대한 금지를 청구할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":176,"text":"상표법상 손실보상청구권은 출원인의 서면경고가 필수이고, 상대방인 제3자에게 이익 이 발생한 경우에만 손실에 상당하는 보상금의 지급을 받을 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":177,"text":"제1항에 따른 선사용권은 엄격한 선출원주의 운영에 따른 문제점을 보완하여 사용주 의와 선출원주의를 조화시킴으로써 상표의 정당한 선사용자를 보호하기 위한 것이다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":178,"text":"상표권자는 제1항에 따라 상표를 사용할 권리를 가지는 자에게 그 자의 상품과 자기 의 상품 간에 출처의 오인이나 혼동을 방지하는 데 필요한 표시를 할 것을 청구할 수 있지만, 제2항에 따라 상표를 사용할 권리를 가지는 자에게는 이러한 표시를 할 것을 청구할 수 없다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":179,"text":"제1항에 따른 선사용권은 법정통상사용권이 므로 상속과 같은 일반승계 또는 영업양도 에 의하여 타인에게 이전되지 않는다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":180,"text":"제2항에 따른 선사용권은 부정경쟁의 목적 없이 타인의 상표등록출원 전부터 국내에 서 계속하여 사용하고 있어야 한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":181,"text":"제1항에 따른 선사용권은 상표를 사용한 결과 타인의 상표설정등록 시가 아니라, 상 표등록출원 시에 국내 수요자 간에 그 상표가 특정인의 상품을 표시하는 것이라는 인 식이 필요하다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":182,"text":"전용사용권 설정행위에 의하여 그 등록상표의 지정상품과 유사한 상품에 대하여 그 등록상표를 사용할 권리가 취 득될 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":183,"text":"전용사용권자는 상표권의 사용에 대하여 받을 대가나 물건에 대해서도 그 지급 또는 인도 전에 그 대가나 물건을 압류하여 물상대위권을 행사할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":184,"text":"통상사용권자는 그 사용권을 특허청에 등록할 필요는 없으나 그 상품에 자신의 이름 이나 명칭과 상표에 관한 표시를 하여야 한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":185,"text":"동일자로 출원된 특허권과 상표권이 상호 저촉되는 경우, 그 특허권의 존속기간이 만료 되는 때에는 그 상표권의 통상사용권자는 상표를 사용할 권리를 가진 자에게 그의 업 무에 관한 상품과 자기의 업무에 관한 상품 간에 혼동을 방지하는 데 필요한 표시를 하도록 청구할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":186,"text":"질권자가 질권의 목적인 상표권을 이전받은 경우, 권리의 혼동으로 인한 그 질권의 소멸은 등록하지 아니하더라도 그 효력이 발생한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":187,"text":"국제등록 명의의 변경에 따라 국제등록 지정상품의 전부 또는 일부가 분할되어 이전 된 경우에는 국제상표등록출원은 변경된 국제등록명의인에 의하여 각각 출원된 것으 로 본다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":188,"text":"특허청장은 상표에 관한 절차가 특허청에 계속( 繫屬) 중일 때 상표권 또는 상표에 관한 권리가 이전된 경우에는 그 상표권 또는 상표에 관한 권리의 승계인에게 그 절차를 속 續行)하도록 하여야 한다. 행(","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":189,"text":"통상사용권은 상속이나 그 밖의 일반승계의 경우를 제외하고는 상표권자의 동의를 받지 아니하고 설정행위로 정한 범위에서 이전할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":190,"text":"상표권자는 상표권을 목적으로 하는 질권설정 또는 공유인 상표권의 분할청구 전에 지정상품에 관하여 그 등록상표를 사용하고 있는 경우라도 그 상표권이 경 매에 의하 여 이전되는 경우 그 상표권에 대하여 통상사용권을 가지지 않는다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":191,"text":"상표권자가 사망한 날부터 3년 이내에 상속인이 그 상표권의 이전등록을 하지 아니한 경우에는 상표권자가 사망한 날부터 3년이 되는 날에 상표권이 소멸된다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":192,"text":"JERA 존속기간은설정 등록 이 있는 날 부터 10 년 이지만 10 년썩갱신 하여 영구적 독 점이 가능하 다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":193,"text":"준속기간갱신 등록 신청서는 YEU 존속 기간 만료 전 1 년 이내에 제출 하여야 한다. 다만, 이기간에존속기간갱신 등록 신청을 하지 아니한 자는 상표 권의존속기간이끝 난후 6 개월 이내에 할수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":194,"text":"AEA) 공유인 경우 공유 자는 단독 으로 상표권 존속기간갱신 등록 신청을할수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":195,"text":"상표법 제 84 조 ( 존속기간갱신 등록 신청) 제 2 항에 따른 기간에존속기간갱신 등록 신청을 하면 상표 권의존속기간이갱신된 것으로 보며, 존속기간갱신 등록 은 AGSTE 효력이 끝나는 날의 다음 날 부터 효럭이발생한 다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":196,"text":"존속기간갱신 등록 신청에 대해서는 설체심사를 하지 아니하 므로 1 상표 1 출원 ( 제 38 조 ), AAA 보정 ( 제 39 조 ) 등 상표 등록 출원 의심사에 따른 규정이준용퇴제 ' 야니 한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":197,"text":"단체 표장권은 이전할 수 없다. 다만, 법인의 합병의 경우에는 특허청장의 허가를 받아 이전할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":198,"text":"단체표장권, 업무표장권 또는 증명표장권에 관하여는 전용사용권을 설정할 수 없다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":199,"text":"업무표장권은 이전할 수 없다. 다만, 그 업무와 함께 이전할 경우에는 특허청장의 허가 를 받아 이전할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":200,"text":"상표권은 그 지정상품마다 분할하여 이전할 수 있다. 이 경우 유사한 지정상품은 함 께 이전하여야 한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":201,"text":"상표권의 이전(상속이나 그 밖의 일반승계에 의한 경우는 제외한다)ㆍ변경ㆍ포기에 의 한 소멸, 존속기간의 갱신, 상품분류전환, 지정상품의 추가 또는 처분의 제한에 해당하는 사항은 등록하지 아니하면 그 효력이 발생하지 아니한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":202,"text":"상표권자에 대하여 상표권에 관한 이전약정에 기하여 이전등록절차의 이행을 청구할 권리를 가지는 사람이 이미 그 상표를 실제로 사용하고 있으면 상표권에 관한 이전등 록절차 이행청구권의 소멸시효가 진행되지 아니한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":203,"text":"타인의 상표권을 침해한 자는 그 침해행위에 대하여 과실이 있는 것으로 추정되고, 타인의 상표권을 침해한 자에게 과실이 없다고 하기 위하여는 상표권의 존재를 알지 못하였다는 점을 정당화할 수 있는 사정이 있다거나 자신이 사용하는 상표가 등록상 표의 권리범위에 속하지 아니한다고 믿은 점을 정당화할 수 있는 사정이 있다는 것을 주장ㆍ증명하여야 한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":204,"text":"상표법 제109조(손해배상의 청구)에 따른 손해배상을 청구하는 경우 그 등록상표의 사 용에 대하여 합리적으로 받을 수 있는 금액에 상당하는 금액을 상표권자 또는 전용사용 권자가 받은 손해액으로 하여 그 손해배상을 청구할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":205,"text":"상표권은 등록되어 있는 상표를 타인이 사용하였다는 것만으로 당연히 통상 받을 수 있는 상표권 사용료 상당액이 손해로 인정되는 것은 아니고, 상표권자가 그 상표를 영업 등에 실제 사용하고 있었음에도 불구하고 상표권 침해행위가 있었다는 등 구체 적 피해 발생이 전제되어야 인정될 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":206,"text":"상표권의 행사가 상표제도의 목적이나 기능을 일탈하여 공정한 경쟁질서와 상거래 질 서를 어지럽히고 수요자 사이에 혼동을 초래하거나 상대방에 대한 관계에서 신의성실 의 원칙에 위배되는 등 법적으로 보호받을 만한 가치가 없다고 인정되는 경우에는 그 상표권의 행사는 권리행사의 외형을 갖추었다 하더라도 등록상표에 관한 권리를 남용 하는 것으로서 허용될 수 없다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":207,"text":"상표 권 자가 ' 상표 에 관한 어떠한 경우 라도 독점적인 권리 를부여 하지 않고, 다만 사용 권자가 상표 권 자의 상표 를 사용할 권리 를부여 하며 사용권 자의 상표 사용에 대하여 상 표 침해 의책임을 묻지 않는다 ' 는내용 으로 사용권을설정한경우에제 3 자가무단 으로 상표 를사용 하더라도 그사용권자에 대한 상표법 제 230 조 ( 침해 죄 ) 는성림 하지 않는다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":208,"text":"상표권 UIAA 전부에 대하여 전용사용권이 설정된 경우에제 3 자가그 상표 를 정당 한 법적 권한 없이 사용 하면 전용사용권 자가 금지청구권을행사 하므로 상표 권 자는 F AZTL 상실한 다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":209,"text":"상표 권 자가 자신의 상표 권에 설정된 질권을상속 받은 경우 상속에 관한 사항을 등록 하지 아니하면그효럭이발생 하지 않는다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":210,"text":"상표 권자 Pe 자신의 상표 권에 대하여 조그만 개인 식당을운영하던아버지 에게 전 용사용권을설정 하여 주었는데, 아버지가사망 하여 전용사용권을뷔이 단독 상속 하는 경우 라면 상속에 관한 사항을 등록 하여야 제 3 자 에게 대항할수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":211,"text":"상표권 킨리 범위 전부에 대하여 전용사용권을설정한경우 라도 JEU 상표 를 A 용하는 것이라면 전용사용권의 침해 가성립되지 않는다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":212,"text":"상표권자는 전용사용권자ㆍ통상사용권자 또는 질권자의 동의를 받지 아 니하면 상표권을 포기할 수 없다. 다만, 국제등록기초상표권에 대해서는 이러한 내용이 적용되지 않는다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":213,"text":"상표권의 포기를 하였을 경우에는 상표권은 그때부터 소멸되므로 상표 권의 포기에 대한 등록이 없어도 그 효력이 발생한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":214,"text":"상표권자가 사망한 날부터 1년 이내에 상속인이 그 상표권의 이전등록 을 하지 아니한 경우에는 상표권자가 사망한 날부터 1년이 되는 날의 다음 날에 상표권이 소멸된다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":215,"text":"선출원상표가 등록 후 무효심결이 확정된 경우에는 선출원의 지위를 소 급적으로 상실한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":216,"text":"상표법에 따라 선서한 증인이 특허심판원에 대하여 거짓의 진술을 하였을 경우에는 5 년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. 다만, 이 위증죄를 범한 증인이 그 사건의 상표등록여부결정 또는 심결의 확정 전에 자수하였을 경우에는 그 형을 감 경하거나 면제할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":217,"text":"상표등록을 하지 아니한 상표를 등록상표인 것같이 영업용 광고에 표시한 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":218,"text":"거짓이나 그 밖의 부정한 행위를 하여 상표등록을 받은 자는 5년 이하의 징역 또는 5 천만원 이하의 벌금에 처한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":219,"text":"상표권의 침해행위를 한 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":220,"text":"상표권의 침해물 제작에 사용하기 위하여 제공된 제작 용구에 대해서는 몰수가 가능 하나, 상표권의 침해물 제작에 사용하기 위하여 제공된 재료에 대해서는 몰수가 불가 능하다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":221,"text":"상표권자가 사망한 경우 사망한 날부터 3년 이내에 상속인이 상표권의 이전등록 을 하지 아니하면 상표권자가 사망한 날부터 3년이 되는 날에 상표권이 소멸한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":222,"text":"상표원부에 상표권자인 법인에 대한 청산종결등기가 되었음을 이유로 상표권의 말소등록이 이루어진 경우, 이러한 상표권의 말소등록행위는 항고소송의 대상이 될 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":223,"text":"상품분류전환등록신청이 취하된 경우 상품분류전환등록의 대상이 되는 지정상품 에 관한 상표권은 상품분류전환등록신청기간의 만료일이 속하는 존속기간의 만 료일 다음 날에 소멸한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":224,"text":"상품분류전환등록의 대상이 되는 지정상품으로서 상품분류전환등록신청서에 기 재되지 아니한 지정상품에 관한 상표권은 상품분류전환등록신청서에 기재된 지 정상품이 전환등록 되는 날의 다음 날에 소멸한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":225,"text":"청산절차가 진행 중인 법인의 상표권은 법인의 청산종결등기일까지 상표권의 이 전등록을 하지 아니하면 청산종결등기일에 소멸한다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":226,"text":"상표권자는 특약이 없는 한 전용사용권이 설정된 범위 내에서 등록상표를 사용할 수 없지만 제3자의 무단사용행위에 대해서는 전용사용권 설정 후에도 침해금지 를 청구할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":227,"text":"업무표장권, 단체표장권 또는 증명표장권에 관하여는 전용사용권을 설정할 수 없다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":228,"text":"전용사용권의 설정등록은 효력발생요건이지만 그 이전등록은 제3자 대항요건에 불과하다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":229,"text":"전용사용권자는 그 상품에 자기의 성명 또는 명칭을 반드시 표시하여야 하며, 법 정사용권자인 선사용권자에게 자기의 상품과 출처의 오인이나 혼동을 방지하는데 필요한 표시를 할 것을 청구할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":230,"text":"전용사용권자는 상표권자의 의사와 상관없이 이해관계인의 입장에서 상표권의 존속기간갱신등록 신청에 대한 상표등록료를 대납할 수 있다.","chapter":"상표권·사용권·이전·질권·소멸","answer":"","explanation":""},{"id":231,"text":"상표권자가 국내에서 등록상표가 표시된 상품을 양도한 경우 특별한 사정이 없는 한 당해 상품에 대한 상표권은 그 목적을 달성한 것으로서 소진되고, 그로써 상표권의 효력은 당해 상품을 사용, 양도 또는 대여한 행위 등에는 미치지 아니한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":232,"text":"상표권자가 국내에서 등록상표가 표시된 상품을 양도한 경우라도, 그 양도된 상품을 원래 상품과의 동일성을 해할 정도로 가공 또는 수선한 경우에는 상표권자의 권리를 침해한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":233,"text":"한국 등록상표와 동일한 출처를 표시하는 것으로 볼 수 있는 상표를 외국 상표권자가 그 수입된 상품에 부착하였고, 수입상품과 한국 상표권자가 등록상표를 부착한 상품 사이의 품질에 실질적 차이가 없으면, 위 상품의 수입은 상표권 침해가 아니다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":234,"text":"통상사용권자가 계약상 부수적인 조건을 위반하여 상품을 양도한 경우에도 상표권자의 동의를 받지 않은 양도행위이므로 일률적으로 권리소진의 원칙이 배제된다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":235,"text":"등록상표가 표시된 상품을 수입한 자가 임의로 그 상품을 소량으로 나누어 새로운 용기에 담는 방식으로 포장한 후 그 등록상표를 표시하거나 그 표시한 것을 양도하 였다면 특별한 사정이 없는 한 상표권을 침해하는 행위에 해당한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":236,"text":"상 법 제111조(법정 해배상의 청구)에 의한 손해배상을 청구하려면 침해자가 사용한 상표가 상표권자의 등록상표와 같거나 동일성이 있어야 한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":237,"text":"상표법 제111조는 피해자가 쉽게 권리구제를 받을 수 있도록 하는 예외적 규정이므로, 그 적용요건은 법문에 규정된 대로 엄격하게 해석하여야 한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":238,"text":"상표권자가 침해자와 동종의 영업을 하고 있는 것을 증명한 경우라면 특별한 사정이 없는 한 상표권 침해에 의하여 영업상의 손해를 입었음이 사실상 추정된다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":239,"text":"법원이 변론전체의 취지와 증거조사의 결과에 기초하여 상당한 손해액을 인정할 수 있다고 규정한 상표법 제110조(손해액의 추정 등) 제6항은 법관에게 손해액 산정에 관한 자유재량을 부여한 것이다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":240,"text":"상표법 제110조 제3항에 따라 침해자의 이익액이 상표권자의 손해액으로 추정되었어도, 침해자가 자신의 상품의 품질과 기술의 우수성 등 상표권 침해와 무관하게 얻은 이익이 있다는 특별한 사정이 있음을 증명하면, 위 추정의 전부 또는 일부가 뒤집어질 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":241,"text":"타인의 등록 상표 와 동일한 상표 를그지정 상품 과 동일한 상품 에사용 하는 행위","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":242,"text":"타인의 등록 상표 와 유사한 상표 를그지정 상품 과 유사한 상품 에사용 하는 행위","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":243,"text":"타인의 등록 상표 와 유사한 상표 를그지정 상품 과 유사한 상품 에 사용할 목적 으로 소 지하는 행위","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":244,"text":"HAJ 등록 상표 를위조할목적 으로 그용구를소지 하는 행위","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":245,"text":"타인의 등록 상표 가 표시된 지정 상품 과 동일한 상품 을양도 하기 위하여 소지 하는 행위","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":246,"text":"상표 권 자는 자기가사용 하고 있는 등록 상표 와동일 하거나 유사한 상표 를그지정 상품 과동일 하거나 유사한 상품 에사용 하여 자기의 상표 권을 고의로 침해 한자에 대하여 1 억원이하의 AANA 상표법 제 111 조 ( 법정손해배상의청구 ) 의법정손해배상을 청구 할수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":247,"text":"ARAJE 자기가사용 하고 있는 국내에현저 하게 알려진 등록 상표 와 유사한 상표 를 사용함 으로써 자기 등록 상표 의식별력을손상한자에 대하여는 1 억원이하의범위에 A 상표법 제 111 조 ( 법정손해배상의청구 ) 의범정손해배상을청구할수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":248,"text":"JERE 자기가사용 하고 있는 등록 상표 와 같은 YEE 그지정 상품 과 같은 상품 에사용 하여 자기의 상표 권을고의적 으로 침해 한경우 에는 법정손해배상과 함께 손해 로인정된금액의 3 배를 넘지 아니하는범위 에서 손해배상을청구할수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":249,"text":"상표법 제 109 조 ( 손해배상의청구 ) 에 따라 손해배상을청구한 상표 권 자는 법원이 변론 을종결할때 까지 그청구를법정손해배상의청구로 변경할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":250,"text":"상표법 제 222 조 ( 등록 상표 의 EAA 따라 등록 상표 임을 표시한타인의 상표 권을 침해 한 자는 그 침해 행위에 대하여 그 상표 가 이미 등록 된사실을 알았던 것으로 본다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":251,"text":"상표권 침해행위에 제공되거나 그 침해행위로 생긴 침해물과 침해물 제작에 주로 사용하기 위하여 제공된 제작 용구 또는 재료는 몰수의 대상이 된다. 다만 상품이 기능 및 외관을 해치지 않고 상표 또는 포장과 쉽게 분리될 수 있으면 그 상품은 몰수하지 않을 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":252,"text":"국내외에서 정당한 사유 없이 비밀유지명령을 위반한 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처하고, 비밀유지명령을 신청한 자의 고소가 있어야 공소를 제기할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":253,"text":"거짓이나 그 밖의 부정한 행위를 하여 상표등록, 지정상품의 추가등록, 존속기간갱신등록, 상품분류전환등록 또는 심결을 받은 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":254,"text":"상표법에 따라 선서한 증인·감정인 또는 통역인이 특허심판원에 대하여 거짓의 진술·감정 또는 통역을 하면 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":255,"text":"등록하지 않은 상표 또는 상표등록출원을 하지 않은 상표를 등록상표 또는 등록출원상표인 것처럼 상품에 표시한 행위는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":256,"text":"고의적으로 상 표권자 또는 전용사용권자의 등록상표와 동일․유사한 상표를 그 지정 상품과 동일․유사한 상품에 사용하여 상표권 또는 전용사용권을 침해한 자에 대하여 상표법 제110조(손해액의 추정 등) 제1항부터 제6항까지의 규정에 따라 손해로 인정 된 금액의 3배를 넘지 아니하는 범위에서 배상액을 정할 수 있도록 법원에 권한을 부 여하고 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":257,"text":"상표권의 침해가 계속적으로 행하여지는 결과 손해도 역시 계속적으로 발생하는 경우 에 그 침해로 인한 손해배상청구권의 소멸시효는 정책적인 이유에 의하여 최초로 손 해가 발생한 때부터 일괄적으로 진행되는 것으로 본다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":258,"text":"상표권자가 상표법 제109조(손해배상의 청구)에 따른 손해배상을 청구하는 대신에 상 표법 제111조(법정손해배상의 청구)에 따른 손해배상을 청구하는 경우에 법원은 변론 전체의 취지와 증거조사의 결과를 고려하여 상당한 손해액을 인정할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":259,"text":"상표법은 제222조(등록상표의 표시)에 따라 등록상표임을 표시한 타인의 상표권을 침 해한 자는 그 침해행위에 대하여 그 상표가 이미 등록된 사실을 알았던 것으로 추정 한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":260,"text":"상표권자가 상표권을 목적으로 하는 질권설정 이전에 지정상품에 관하여 그 등록상표 를 사용하고 있는 경우에는 그 상표권이 경매에 의하여 이전되더라도 지정상품 중 사 용하고 있는 상품에 한정하여 사용하는 경우에는 상표권 침해가 되지 않는다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":261,"text":"통상사용권자가 지정상품 또는 이와 유사한 상품에 등록상 표 또는 이와 유사한 상표 를 사용함으로써 수요자에게 상품의 품질을 오인하게 한 경우에 상표등록취소심판을 청구하려면 통상사용권자의 고의가 필요하다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":262,"text":"전용사용권자가 등록상표를 변형하여 실제로 사용한 경우에만 제119조 제1항 제2호에 따른 상표등록취소심판이 가능하다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":263,"text":"지리적 표시 단체표장 등록출원의 경우에 그 소속 단체원의 가입에 관하여 정관에 의 하여 단체의 가입을 금지하였지만, 상표등록취소심판의 청구 이후에 정관을 변경하여 그 소속 단체원의 가입을 허용하였다면 취소사유에 영향을 미친다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":264,"text":"증명표장권자가 사용을 허락받은 자에 대한 감독에 상당한 주의를 하지 않아 증명표 장의 사용허락을 받은 자가 정관을 위반하여 타인에게 사용하게 한 경우에는 누구든 지 증명표장의 상표등록취소심판을 청구할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":265,"text":"특허청장은 상표등록취소심판이 청구된 경우에는 그 취지를 해당 상표권의 전용사용 권자와 그 밖에 상표에 관한 권리를 등록한 자에게 통지하여야 한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":266,"text":"업무표장권의 적 적 권리범위 인심판사건에서 확 인대상표장과 심판청구인이 실제 확 피 로 사용하는 표장이 차이가 있더라도 그 차이나는 부분이 부기적인 것에 불과하여 양 표장이 동일성이 인정되는 경우에는 인의 이 이 있다. 확 익","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":267,"text":"상표권의 권리범위 인심판에서 확 확 인대상표장의 전체 또는 일부가 상표법 제90조(상 력 표권의 효 이 미치지 아니하는 범위) 제1항 제4호 '상품에 대하여 관용하는 상표'에 해당하는지 여부의 판단시점은 심결시이다. 확","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":268,"text":"권리범위 인심판에서 등록상표와 확 인대상표장의 유사 여부는 그 외관, 호 및 관 칭 념을 객 격 찰 관적, 전체적, 이 적으로 관 하여 그 지정상품의 거 에서 일반 수요자들이 래 상표에 대하여 느끼 는 직관적 인식을 기준으로 그 상품의 출처에 관하여 인ㆍ 동 오 혼 키 을 일으 게 할 우려가 있는지에 따라 판단한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":269,"text":"상표권의 권리 대 권리간 적 적 권리범위 인심판은 극 확 인대상표장이 심판청구인의 확 등록상표와 동일 또는 유사하다고 하더라도 등록무효절차 이외에서 등록된 권리의 효 력 을 부인하는 결과가 되어 부적법하다. 극","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":270,"text":"상표권의 적 적 권리범위 인심판은 심결이 확 정된 경우 심판의 당사자 만 아니라 확 뿐 력 친 제3자에게도 일사부재리의 효 이 미 다. 이에 따라 상표권의 효 이 미치는 범위의 력 확 극 권리 정을 위해 적 적 권리범위 인심판에서 선사용권의 확 부에 대해서 심리ㆍ판단 존 하는 것이 허용된다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":271,"text":"타인의 등록상표를 이용한 경우라고 하더라도 그것이 상표의 본질적인 기능이라고 할 수 있는 출처표시를 위한 것이 아니어서 상표의 사용으로 인식될 수 없는 경우에는 등록상표의 상표권을 침해한 행위로 볼 수 없다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":272,"text":"등록상표에 대한 등록무효심결이 확정되기 전이라고 하더라도 상표등록이 무효심판에 의하여 무효로 될 것임이 명백한 경우에는 상표권에 기초한 침해금지 또는 손해배상 등의 청구는 특별한 사정이 없는 한 권리남용에 해당하여 허용되지 아니한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":273,"text":"법원은 상표권 또는 전용사용권의 침해에 관한 소가 제기된 경우에는 그 취지를 특허 심판원장에게 통보하여야 한다. 그 소송절차가 끝난 경우에도 또한 같다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":274,"text":"상표법 제109조(손해배상의 청구)에 따른 손해배상을 청구하는 경우 그 등록상표의 사용에 대하여 통상받을 수 있는 금액에 상당하는 액을 상표권자가 받은 손해액으로 하여 그 손해배상을 청구할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":275,"text":"상표권자는 자기가 사용하고 있는 등록상표와 같거나 동일성이 있는 상표를 그 지정 상품과 같거나 동일성이 있는 상품에 사용하여 자기의 상표권을 고의나 과실로 침해 한 자에 대하여 상표법 제109조에 따른 손해배상을 청구하는 대신 1억원(고의적으로 침해한 경우에는 3억원) 이하의 범위에서 상당한 금액을 손해액으로 하여 배상을 청 구할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":276,"text":"혼동의 대상이 되는 타인의 상표(이하 \"대상상표\")가 저명한 경우 대상상표의 상품과 실제 사용 상표의 상품이 유사하지 않아도 경제적 견련관계가 있으면 보호를 적용할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":277,"text":"상표권이 이전되는 경우 양도인의 부정사용의 책임은 이전 후 양수인에게 승계되지 아니하므로 양수인이 스스로 부정사용을 하지 않는 한 본 호를 적용할 수 없다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":278,"text":"대상상표가 식별력이 없는 표장인 경우에도 실사용 상표와 대상상표가 유사하다면 출처혼동의 우려가 있으므로 본 호를 적용할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":279,"text":"본 호 규정은 타인의 선등록상표의 신용에 부당하게 편승하는 것을 막는 취지이므로 대상상표가 미등록 또는 출원 중인 경우에는 적용할 수 없다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":280,"text":"본 호의 고의 요건 판단에서 대상상표가 주지·저명한 상표인 경우에는 그 대상상표 또는 그 상품의 존재를 인식하지 못하였더라도 고의가 추정된다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":281,"text":"출원 Ag 특레 ( 제 47 조 ) 를인정 받기 위한 FAVE 판단 시","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":282,"text":"조약 우선권 주장 ( 제 46 조 ) 의 AAA 요건 충족 판단 시","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":283,"text":"불사용취소 심판 ( 제 119 조제 1 항제 3 호 ) 에서 등록 상표 의사용 으로 인정 받기 위한 사용 상표 판단 시","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":284,"text":"타인의 등록 상표 가 표시된 상품 을 양도 ㆍ 인도하기 위한 소지 행위가 ' 침해로 보는 행 위 '( 제 108 조제 1 항제 4 호 ) 에해당 하는 지 여부 판단 시","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":285,"text":"법정손해배상청구 ( 제 111 조 ) 가인정 되기 위한 침해 영역에 관한 요건 판단 시","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":286,"text":"출원인은 출원공고 후 해당 상 등록출원에 관한 지정상품과 동일ㆍ유사한 상품에 대 표 표 표 하여 해당 상 등록출원에 관한 상 와 동일ㆍ유사한 상 를 사용하는 자에게 서면으 로 경고할 수 있고, 출원인이 해당 상표등록출원의 사본을 제시하는 경우에는 출원공고 전이라도 서면으로 경고할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":287,"text":"상표법 제58조(손실보상청구권) 제1항에 따라 경고를 한 출원인은 경고 후 상표권을 설정등록할 때까지의 기간에 발생한 해당 상표의 사용에 관한 업무상 손실에 상당하 는 보상금의 지급을 청구할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":288,"text":"상표등록출원이 포기ㆍ취하ㆍ무효가 되거나 상표등록거절결정이 확정된 경우, 손실보 상청구권은 처음부터 발생하지 않는 것으로 추정한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":289,"text":"손실보상청구권은 해당 상표등록출원에 대한 상표권의 설정등록 전까지는 행사할 수 없다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":290,"text":"손실보상청구권을 행사할 때 상 표법 제110조(손해액의 추정 등)가 준용되지 않기 때 문에 업무상 손실에 관한 사항은 청구권자가 입증하여야 한다. 칙에 관한 설명으로 옳지 않은 것은?","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":291,"text":"상표권 침해행위는 권리자에게 피해를 주는 것 이외에 상품 출처의 오인ㆍ혼동을 발 생시킴으로써 거래질서를 혼란하게 할 우려도 있으므로, 상표권 침해죄는 특허권 침 해죄와는 달리 비친고죄이다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":292,"text":"상표법에 따라 선서한 증인으로서 특허심판원에 대하여 거짓의 진술ㆍ감정을 하여 위 증죄를 범한 자가 그 사건의 상표등록여부결정 또는 심결의 확정 전에 자수하였을 경 우에는 필요적으로 그 형을 감경하거나 면제하여야 한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":293,"text":"상표법상 비밀유지명령위반죄는 비밀유지명령을 신청한 자의 고소가 있어야 공소를 제기할 수 있는 친고죄이다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":294,"text":"거짓이나 그 밖의 부정한 행위를 하여 상표등록, 지정상품의 추가등록, 존속기간갱신 등록, 상품분류전환등록 또는 심결을 받은 자는 거짓행위의 죄에 해당되는데 이 죄는 비친고죄이다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":295,"text":"상표권 침해행위에 제공되거나 그 침해행위로 인하여 생긴 침해물과 그 침해물 제작 에 주로 사용하기 위하여 제공된 제작 용구 또는 재료는 필요적 몰수의 대상이지만, 상품이 그 기능 및 외관을 해치지 아니하고 상표 또는 포장과 쉽게 분리될 수 있는 경우에는 그 상품은 몰수하지 아니할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":296,"text":"상표법 AZ 제 1 항제 1 호의자기의 성명 ㆍ 명칭 또는 상호 ㆍ 초상 ㆍ 서명 ㆍ 인장등을 상거래 관행에 따라 사용 하는 상표 에 대하여는 상표 권의효럭이 미치지 아니하며, 상 EU 설정 등록 이 있은 후에 부정경쟁의목적 으로 사용 하는 경우 에도 상표 권의 효력 이 미치지 아니한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":297,"text":"상표법 AZ 제 1 항제 1 호의자기의 성명 ㆍ 명칭 또는 상호 ㆍ 초상 ㆍ 서명 ㆍ 인장등을 상거래 관행에 따라 사용 하는 상표 에서 성명 ㆍ 명칭 또는 상호 ㆍ 초상 ㆍ 서명 ㆍ 인장등 은저명할 것을 요건 으로 한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":298,"text":"상표법 제 90 조제 1 항제 2 호의보통 명칭 또는 기술적 표장에해당 하는지 여부는 권리 범위 확인 심판 에서는 AAA, 침해 금지청구소송 에서는 HAAS 기준 으로 판단 하여야 한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":299,"text":"전체적으로 볼때 일반 수요자를기준 으로 사용 상품의 품질 ㆍ 효능 ㆍ 용도등을표시하 는 것으로 직감할수 있을 정도로 도안화된 상표 는 상표법 제 90 조제 1 항제 2 호에해 당하여 이에 대하여는 상표 권의효력이 미치지 아니한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":300,"text":"돌 이상의 문자 ㆍ 도형등의조합 으로 이루어진 결합 상표 의 경우 분리 인식 될수 있는 일부분이 상표법 제 90 조의 상표 권의효럭이 미치지 아니하는범위의 상표 에해당 하는 경우, 그일부분 에만 효력이제한 되는 것은 아니므로그부분을 제외한 나머지 부분 을기초로 상표 유사여부를판단할수 없다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":301,"text":"타인의 등록상표와 동일한 상표가 표시된 지정상품과 동일한 상품을 양도하기 위하여 소지하는 행위","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":302,"text":"타인의 등록상표와 동일한 상표가 표시된 지정상품과 유사한 상품을 인도하기 위하여 소지하는 행위","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":303,"text":"타인의 등록상표와 동일한 상표가 표시된 지정상품과 동일한 상품을 양도할 목적으로 전시하는 행위","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":304,"text":"타인의 등록상표와 동일한 상표가 표시된 지정상품과 동일한 상품을 인도할 목적으로 수입하는 행위","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":305,"text":"타인의 등록상표와 동일한 상표를 지정상품과 동일한 상품의 포장에 표시한 것을 양도하는 행위","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":306,"text":"지리적 표시 단체표장에서 지리적 표시는 상품의 특정 품질ㆍ명성 또는 그 밖의 특성 이 전적으로 특정지역에서 비롯된 경우에만 그 지역에서 생산ㆍ제조 또는 가공된 상 품임을 나타내는 표시를 말한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":307,"text":"지리적 표시를 사용할 수 있는 상품을 판매하는 자만으로 구성된 법인이 직접 사용하 기 위한 표장에 대해 지리적 표시 단체표장등록을 받을 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":308,"text":"서비스에 대해 지리적 표시 단체표장등록을 받을 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":309,"text":"지리적 표시 단체표장등록출원은 상표등록출원으로 출원의 변경을 할 수 없다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":310,"text":"지리적 표시를 사용할 수 있는 상품을 제조하는 자가 직접 사용하기 위한 표장에 대 해 개인을 출원인으로 하여 지리적 표시 단체표장등록을 받을 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":311,"text":"상표법에 따라 선서한 증인이 특허심판원에 대하여 거짓의 진술, 감정 또는 통 역을 하였을 경우에는 위증죄에 해당한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":312,"text":"비밀유지명령을 신청한 자의 고소가 없더라도 비밀유지명령 위반죄로 공소를 제 기할 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":313,"text":"등록을 하지 아니한 상 표 표 또는 상 등록출원을 하지 아니한 상 를 등록상 또 표 표 는 등록출원상 인 것같이 표 업용 영 광 고, 간판, , 상 의 포장 등에 시하는 표찰 품 표 행위를 한 경우에는 거 시의 짓표 죄 에 해당한다. 표","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":314,"text":"법인의 대 자나 법인 또는 개인의 대리인, 종 업원이 그 법인 또는 개인의 업무 표 죄 에 관하여 상 권침해 의 위반행위를 하면 그 행위자를 하는 외에 그 법인에 벌 벌 는 科 문 벌 금형을 과( )하고 그 개인에게는 해당 조 의 금형을 과한다. 다만, 법 인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주 감 의와 독을 게을리하지 아니한 경우에는 그러하지 아니하다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":315,"text":"거짓이나 그 밖의 부정한 행위를 하여 상표등록, 지정상품의 추가등록, 존속기간 갱신등록, 상품분류전환등록 또는 심결을 받은 경우에는 거짓행위의 죄에 해당 된다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":316,"text":"상 권자에 대하여 상 권에 관한 이전약정에 기하여 이전등록을 청구할 권리를 표 가지는 사람이 이미 그 상 를 실제로 사용하고 있다 하더라도 상 권이전등록 표 청구권의 소멸시효는 진행된다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":317,"text":"아무 런대가를 받지 아니하는 자원 사나 단 한 호의에 의한 봉 무 또는 순 노 편익의 제공 등과 같이 상거래의 대상이 되지 아니하는 용 을 일정한 목적 아래 역 계속 였 적ㆍ반복적으로 제공하 다고 하더라도 이는 상 법상의 서비 업을 위하 표 스 영 였다 고 할 수 없다는 것이 판례의 입장이다. 표 표 액","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":318,"text":"상 권자가 상 법 제110조(손해 의 추정 등)제4항에 따라 손해배상을 청구하 표 는 경우 상 권자는 권리침해 사실과 통상 받을 수 있는 사용료를 주장ㆍ증명하 면 되고 손해의 발생 사실을 구체적으로 주장ㆍ증명할 요는 없다. 필 표 액","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":319,"text":"상 법 제110조(손해 의 추정 등)제4항에 의하여 등록되어 있는 상 를 타인이 표 였 사용하 다는 것만으로 당연히 통상 받을 수 있는 상 권 사용료 상당 이 손해 표 액 표 표 로 인정되므로, 상 권자가 상 를 등록만 해두고 실제 사용하지는 않 더라도 았 침해자에게 손해배상책임이 인정된다. 표","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":320,"text":"상 법 제121조(권리범위 확인심판)에 의한 적극적 권리범위확인심판사건에서 확인대상 장과 표 피 심판청구인이 실제로 사용하는 장이 차이가 있더라도 그 차 표 이나는 부분이 부기적인 것에 불과하여 양 장이 동일성이 인정되는 경우에는 표 익 확인의 이 이 있다. 멸에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":321,"text":"상표법 제90조제3항의 '부정경쟁의 목적'이란 등록된 상표권자의 신용을 이용하 여 부당한 이익을 얻을 목적을 말하고 단지 등록된 상표라는 것을 알고 있었다 는 사실만으로 그와 같은 목적이 있다고 볼 수는 없다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":322,"text":"지리적 표시 등록단체표장의 지정상품과 동일하다고 인정되어 있는 상품의 보통 명칭ㆍ산지ㆍ품질ㆍ원재료ㆍ효능ㆍ용도ㆍ수량ㆍ형상ㆍ가격 또는 생산방법ㆍ가공 방법ㆍ사용방법 및 시기를 상거래 관행에 따라 사용하는 상표에 대하여는 지리 적 표시 단체표장권의 효력이 미치지 아니한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":323,"text":"상표법 제90조제3항의 '부정경쟁의 목적'에 대한 입증책임은 상표권자에게 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":324,"text":"등록된 상표가 지정상품에 대하여 주지성을 얻어야만 상표법 제90조제3항에 규 정된 '부정경쟁의 목적'이 인정되는 것은 아니다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":325,"text":"상표법 제90조제1항제2호의 '상품의 산지'라 함은 그 상품이 생산되는 지방의 지 리적 명칭을 말하고 반드시 일반 수요자나 거래자에게 널리 알려진 산지만을 말 하는 것은 아니다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":326,"text":"甲의 상표(X)가 정당하게 출원ㆍ등록된 후 제3자인 乙이 甲의 등록상 표(X)와 동일ㆍ유사한 상표(Y)를 정당한 이유 없이 사용한 결과 사용 상표(Y)가 주지성을 획득하더라도 상표권자(甲)가 상표사용자(乙)를 상 대로 등록상표(X)의 상표권에 기초한 침해금지를 청구하는 것은 권리 남용에 해당하지 아니한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":327,"text":"진정상품병행수입업자가 타인의 등록상표가 표시된 진정상품인 화장품 을 보다 작은 용량의 용기에 재병입하면서 그 용기에 임의로 제작한 그 등록상표를 표시하여 판매하는 경우에는 상표권의 침해를 구성하지 아 니한다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":328,"text":"상표권의 침해가 계속적으로 행하여지는 경우 상표권의 침해로 인한 손해 배상청구권의 소멸시효는 최종 손해를 안 때부터 일괄적으로 진행된다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":329,"text":"丙의 X 상표가 정당하게 출원ㆍ등록된 후 丙이 X 상표와 동일ㆍ유사한 표장 및 지정상품에 대해 출원ㆍ등록(Y 상표)한 경우, X 상표와 동일 ㆍ유사한 상표로서 X 상표의 등록 이후부터 사용되어 온 결과 Y 상표 의 등록결정 당시 丁의 상표로 인식된 Z 상표와의 관계에서, Z 상표와 유사한 Y 상표는 상표법 제34조제1항제12호 후단의 '수요자를 기만할 염려가 있는 상표'에 해당하여 등록이 무효로 될 수 있다.","chapter":"상표권 효력·침해·손해배상·보상","answer":"","explanation":""},{"id":330,"text":"둘 이상의 지정상품에 관하여 상표법 제117조(상표등록의 무효심판) 제1항에 따른 상표등록의 무효심판이 청구되었을 경우 지정상품마다 심판청구를 취하할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":331,"text":"상표권자는 상표등록을 무효로 한다는 심결에 불복하기 위해 심결 등본을 송달받은 날부터 3개월 이내에 특허법원에 심결취소의 소를 제기하여야 한다. 표 9 표","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":332,"text":"상 법 제11 조(상 등록의 취소심판) 제1항각호 전체의 사유에 의한 상표등록의 취소 심판은 취소사유에 해당하는 사실이 없어진 날부터 3년이 지난 후에는 청구할 수 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":333,"text":"상표법 제116조(거절결정에 대한 심판)에 따른 거절결정불복심판의 결과에 대하여 이해관계를 가진 자는 심리가 종결될 때까지 심판장에게 참가신청서를 제출하여 그 심판에 보조참가를 할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":334,"text":"상표법 제119조 제1항 제3호를 사유로 하는 불사용 취소심판에서 상표등록을 취소 한다는 심결이 확정된 경우 그 상표권은 그때부터 소멸된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":335,"text":"제 119 조 ( 상표 등록 의취소 심판 ) 제 1 항제 3 호에 있어서 상표 권자 또는 그사용권 자가 타 인 상품 의출처를표시 하기 위하여 상표 를 사용한 경우 불사용을 이유로 한 상표 등 목의취소를면하기 위한 상표 의사용에해당 하지 않는다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":336,"text":"제 119 조 ( 상표 등록 의취소 심판 ) 제 1 항제 3 호및제 3 항 에서 등록 상표 를그지정 상품 에사 용하고 있지 않은 경우라함은 등록 상표 를지정 상품 그 자체 또는 거래사회의통념상 이와 동일 하게 볼수 있는 상품 에현실로사용 하지 않은 때를 말하며, 지정 상품 과유 사한 상품 에 사용한 경우도 등록 상표 를지정 상품 에 사용한 것으로 볼수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":337,"text":"제 119 조 ( 상표 등록 의취소 심판 ) 제 1 항제 3 호및제 3 항에 있어서 광고지 등에 등록 상표 를표 시하 였다고 하더라도 상품 의출처표시로사용된 것이 아니 거나, 지정 상품 이국내 에서 유 통 되거나 유통예정을 하고 있지 않은 상태 에서 단순히 등록 상표 에 대한 불사용취소를 면하기 위하여 명목상 으로 등록 상표 에 대한 광고행위를한데에 그친 경우 등록 상표 를 정당하게사용 하였다고 할수 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":338,"text":"제 119 조 ( 상표 등록 의취소 심판 ) 제 1 항제 3 호에해당 하는 것을 사유로취소 심판 이청구된 경우 에는 피청구인이 해당 등록 상표 를취소 심판 청구에관계 되는 지정 상품 중 하나 이 상에 대하여 그 심판 청구일전 3 년 이내에 국내 에서 정당 하게 사용하였음을증명 하지 아니하면 상표 권 자는 취소 심판 청구와관계 되는 지정 상품 에 관한 상표 등록 의취소를 면할 수 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":339,"text":"제 119 조 ( 상표 등록 의취소 심판 ) 제 1 항제 3 호에서의 ' 정 당한 이유 ' 에는 질병 기타 천재 등 의불가항력에 의하여 영업을할수 없는 경우 뿐만 아니라 법률에 의한 규제, 판매금 A 또는 국가의수입제한 조치 등에 의하여 부득이 등록 상표 의지정 상품 을국내 에서 일반적, 정상적으로 거래할수 없는 경우도포함한 다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":340,"text":"상표 등록 무효 심판, 존속기간갱신 등록 무효 심판, 상표 등록 취소 심판, 권리 범위확인 심판, 상품 분류전환 등록 무효 심판 에서 심판 을청구 하는 자가 2 인이상 이면 각자 또는 그모 두가공동 으로 심판 을청구할수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":341,"text":"FEAH 청구인 이나 피청구인 중 1 인 에게 심판 절차의 중단 또는 중지의원인이 있을 경우 그효럭은모두에 대하여 발생한 다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":342,"text":"섬판관은 당사자 또는 참가인이신청 하지 아니한 이유에 대해서도 심리를할수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":343,"text":"심판 청구는심결이확정될 AAA 취하할수 있으며, 이 경우 피청구인이 PANE 제출 하였더라도 상대방의동의를 받지 않아도 된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":344,"text":"상표 등록 무효 심판 을청구 하고자 하는 자는 심판 청구서를 특허 심판 원장 에게 제출 하여 야 한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":345,"text":"해당 심판 ( 재심 ) 에참가신청을 하였으나 그신청이 APA 자는 제 162 조 (심결 등에 대한 àA 따른 심결취소소송 에서 원고적격을 갖지 못한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":346,"text":"거절결정에 대한 AAA 심결취소소송 에는 민사소송법상보조참가에 관한 규정이준 용 되지 않는다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":347,"text":"심결취소판결의 확정 이후 특허 심판 원의 재심 리과정 에서 취소판결에서의취소의 기본 이된이유에 따라 한심결에 대하여 새로운 사실의주장 이나 입증이 없더라도 그적 법여부를 다툴 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":348,"text":"행정소송인심결취소소송 에서도 원칙적 으로 변론주의가적용 되므로 주요사실에 대한 당사자의 불리한 진술인자백이성립할수 있고, 사실에 대한 법적 판단 내지 평가도 자백의대상이 된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":349,"text":"거절결정불복 심판 청구 기각 심결의취소소송 에서 특허 청 장은 거절결정의 이유 외에 심사나 심판 단계 에서 의견서 제출의기회를 부여한 사유 및 이와 주요한 취지가부 ' 합하는사유는 해당 심결의결론을정당 하게 하는 사유로주장할수 있다. 31. 디자인보호법의내용 으로 옮지 않은 것은? O 법인이 아닌 사단 또는 재단 으로서 대표자 또는 관리인이정하여져 있는 경우 에는 그 사단 또는 재단의이름 으로 디자인일부심사 등록 이의 신청인, AAA 청구인 ㆍ 피 청구 인 또는 재심의 청구인 ㆍ 피청구인이될수 있다. © 행위 능력 또는 법정대리권이 없거나 디자인에 관한 절차를 YE 데에 필요한 권한의 AAA 흠이 있는 자가 밝은 절차는 NAJADA 당사자나법정대리인이추인 하면 ㆍ 추인한때 부터 그효력이발생한 다. © 디자인에 관한 절차를 WE 자의 위임을 받은 대리인의대리권은본인이사망 하거나 행위능력을상실하여도소멸 하지 아니한다. © 디자인에 관한 절차가중단 되거나 중지된경우 에는 그기간의진행은정지 되고 그절 차의수계통지를 하거나 그절차를속행한때 부터 전체기간이 새로 진행된 다. © 재외 자의 디자인권 또는 JAAA 관한 권리 에 관하여 디자인관리인이 있으면 그디 자인관리인의 주소 또는 영업소 를, 디자인관리인이 없으면 특허청 소재지를 「 민 사소 SW 제 11 조 ( 재산이 있는 곳의특별재판적 ) 에 따른 재산이 있는 곳 으로 본다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":350,"text":"상표법 제84조(존속기간갱신등록신청) 제2항에 따른 기간에 존속기간갱신등록신청을 하면 갱신등록이 되기 전이라고 하더라도 상표권의 존속기간이 갱신된 것으로 본다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":351,"text":"상표권의 공유자 중 일부가 그 지분권을 포기하였으나 그 포기가 등록되지 않은 경우 에, 나머지 상표권의 공유자들이 존속기간갱신등록신청을 하여 상표권이 갱신된 경우 에는 존속기간갱신등록무효심판의 대상이 된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":352,"text":"상표권의 전용사용권자는 상표권의 이해관계자로 상표권자가 존속기간갱신등록신청을 하지 않는 경우에 상표권자 대신에 상표권의 존속기간갱신등록신청을 할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":353,"text":"상표권 존속기간갱신등록이 상표법 제84조(존속기간갱신등록신청) 제2항에 따른 존속 기간갱신등록 신청서를 제출해야 하는 기간에 제출하지 않은 경우에 상표권 존속기간 갱신등록이 되면 당연무효에 해당하므로 이해관계인은 제척기간에 관계없이 존속기간 갱신등록의 무효심판을 청구할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":354,"text":"존속기간갱신등록은 원등록(原登錄)의 효력이 끝나는 날부터 효력이 발생한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":355,"text":"미국에 주소를 두고, 미국과 유럽에만 영업소를 가지고 있던 회사 甲의 대표자가 직접 국내에 거주하면서 한국내 자회사의 임원 등을 선발하기 위한 면접을 하더라도 자회 사 설립전인 경우에는 상표에 관한 대리인으로서 국내에 주소나 영업소가 있는 자에 의해서만 상표출원을 할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":356,"text":"미성년자가 행한 상표출원행위에 대하여 법정대리인의 추인에 의한 출원행위의 효 력 발생시점은 미성년자의 상표 출원시점부터가 아닌 법정대리인의 추인행위를 한 시점 력이 발생한다. 부터 그 효","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":357,"text":"상표에 관한 절차를 밟는 자로부터 출원을 위임받은 대리권자의 대리권은 반드시 서 면에 의하여 증명해야 하고, 심판절차에서 위임한 위임인과 동시에 출석하여 구두로 대리권을 증명할 수는 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":358,"text":"심판을 청구하는 자가 책임질 수 없는 불가항력으로 인하여 심결의 등본을 송달받은 날로부터 30일 이내에 심결에 관한 소를 제기하지 못한 경우에는 그 불가항력 사유가 소멸한 날로부터 2개월 이내에 소를 제기할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":359,"text":"미성년자의 법정대리인의 사망으로 대리권이 소멸하여 상표에 관한 절차가 중단된 경 우에 성년이 된 미성년자는 절차를 수계할 수 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":360,"text":"甲이 등록한 상표와 동일한 상표를 그 등록상표의 지정상품과 동일한 상품에 乙이 임 매 의로 사용하여 丙에게 판 한 경우, 상표권자 甲은 乙에게 손해배상을 청구할 수 있으 나 그 상품이 위조상표를 부착한 상품이라는 사정을 자신의 책임있는 사유없이 전혀 알 수 없었던 丙에게는 권리소진의 항변이 인정되므로 손해배상을 청구할 수 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":361,"text":"상표권자 甲으로부터 상표권의 지분을 1 % 이전 받은 乙은 상표권을 침해하는 丙을 상대로 단독으로 상표권 침해금지청구권을 행사할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":362,"text":"상표권을 甲과 乙이 각각 50 %의 지분비율로 등록을 하고 있는 경우에 乙은 甲의 동 의 없이 자신의 지분에 기하여 丙에게 특정지역에 한정하여 통상사용권을 설정하는 것은 허용되지 않는다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":363,"text":"증명표장권자는 특허청장의 허가를 받더라도 같은 증명업무를 영위하는 자에게 증명 표장만을 양도할 수는 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":364,"text":"국제올림픽위원회는 상표법 제34조(상표등록을 받을 수 없는 상표) 제1항 제1호 다목 단서에 따라 자기 표장인 오륜기를 상표등록을 받더라도 그 상표권에 대하여 질권을 설정할 수 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":365,"text":"통상사용권자가 사용허락을 받은 등록상표를 그 상표의 지정상품과 유사한 상품에 사 용하여 수요자에게 상품의 품질을 오인하게 한 경우에 수요자는 상표법 제119조(상표 등록의 취소심판) 제1항 제2호에 따라 해당상표에 대하여 상표등록취소심판을 청구할 적격이 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":366,"text":"甲이 2022. 12. 1.에 등록한 등록상표 사용이 乙에 대하여 부정경 쟁방지 및 영업비밀 보호에 관한 법 률 제2조 제1호 파목의 부정경쟁행위를 구성하는 경우에, 그 상표에 관한 권리를 가진 자는 2023. 1. 31.에 甲의 상표에 대하여 상표등록취소심판을 제기 할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":367,"text":"증명표장권자가 다른 증명표장이나 상표와 혼동방지조치를 취하면서 품질관리를 위해 직접 유통 판매하는 상품에 대하여 그 증명표장을 사용한 경우에 취소심판의 대상이 된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":368,"text":"상표법 제119조 제1항 제1호의 사유로 상표등록취소심판이 제기된 후에 상표권자가 그 상표를 포기하여 이를 등록하 였더라도 계속하여 심리를 진행하여야 한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":369,"text":"甲은 외부 주문에 따라 생산만하는 파운드리 회사로서 소위 팹리스(fabless) 반도체 설 계 판매회사인 乙로부터 반도체 설계와 상품제조에 대한 품질관리 등 실질적인 통제 를 받으면서, 乙이 주문한대로만 생산한 반도체 전량을 乙에게 공급하고 있다. 이 경우 甲이 乙의 등록상표를 반도체에 표시한 상표사용행위는 특별한 사정이 없는 한 상표 법 제119조 제1항 제3호에 따른 불사용취소심판에서 乙의 상표사용행위로 인정된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":370,"text":"후행 등록 상표 인 침해 상표 가일반수요자 에게 인식 되어 있어 역혼동이발생 하는 경우 에 침해 상표 에 대한 인석 만을 근거로하여서도그 \" 상표 사용자를 상대로 한 선행 등 록 상표 의 상표 권에 기초한 침해 금지 또는 \\ 손해배상 , 등의청구는 권리 남용에해당 한다 고불수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":371,"text":"상표권 침해 소송 에서 등록 상표 에명백한 / 무효사유가 있어 그 상표 권의행사가 권리 남 용에해당 한다는 항변이 있는 경우 , 법원은그당부를 살피기 위한 전제로무효여부에 대해 판단할수 있으며 무효사유는 특별히 한정 하지 않고 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":372,"text":"상표법 제 90 조 ( 상표 권의효럭이 미치지 아니하는 범위) 제 1 항제 3 호의 상표 권의 효력 이제한 되는 AE 해당 하는지 여부는 권리 범위확인 심판 의판단대상이 된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":373,"text":"타인의 등록 상표 가 표시된 일회용 필름용기의재활용에 있어 그용기에 새겨진 타인 의 상표 를 그대로 눈채필름만대체 해서 재판매한 경우 상표 권은소진 되지 않으므로 상표 권 \\ 침해 가성림 된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":374,"text":"' 상표법 | 제 99 조 ( 선사용에 따른 상표 를 게속 사용할 권리 ) 의선사용권을근거로 침해 에 해당 하지 않는다는 주장은 침해 소송 에서는 인정될수 있으나 권리 범위확인 심판 에서는 인정될 \" 수 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":375,"text":"상표권자는 저촉관계에 있는 타인의 등록상표를 확인대상표장으로 하여 적극적 권리범위확인심판을 청구할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":376,"text":"상표등록출원일 전에 발생한 저작권과 상표권이 저촉되는 경우, 부정경쟁의 목적이 없는 한 저작권자는 존속기간이 만료한 후에도 원 저작권의 범위 내에서 등록상표와 동일·유사한 표장을 계속하여 사용할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":377,"text":"상표법은 저촉되는 지식재산권 상호 간에 선출원 또는 선발생 권리가 우선한다는 원리를 기본으로 하며, 이 원리는 상표권 사이의 저촉관계에도 적용된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":378,"text":"상표법상 출원일을 기준으로 저촉되는 상표 사이의 우선순위를 정하며, 이에 위반하여 등록된 상표는 제척기간의 적용을 받는 등록무효심판의 대상이 된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":379,"text":"후출원 등록상표를 무효로 하는 심결이 확정되기 전에는 후출원 등록상표권자의 상표 사용이 선출원 등록상표권의 침해가 되지 않는다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":380,"text":"지정상품추가등록출원의 기초가 된 등록상표에 대하여 무효심판 또는 취소심판이 청구 되거나 그 등록상표가 무효심판 또는 취소심판 등으로 소멸된 경우에 지정상품추가등록 출원을 한 출원인은 상표등록출원으로 변경할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":381,"text":"전용사용권자 또는 통상사용권자가 지정상품 또는 이와 유사한 상품에 등록상표 또는 이와 유사한 상표를 사용함으로써 수요자에게 상품의 품질을 오인하게 하거나 타인의 업무와 관련된 상품과의 혼동을 불러일으키게 한 경우에는 상표권자가 상당한 주의를 하여도 그 상표등록의 취소심판을 청구할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":382,"text":"상표권의 이전으로 유사한 등록상표가 각각 다른 상표권자에게 속하게 되고 그 중 1인 이 자기의 등록상표의 지정상품과 동일ㆍ유사한 상품에 부정경쟁을 목적으로 자기의 등 록상표를 사용함으로써 수요자에게 상품의 품질을 오인하게 하거나 타인의 업무와 관련 된 상품과 혼동을 불러일으키게 한 경우를 사유로 하는 취소심판은 이해관계인만이 청 구할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":383,"text":"상표법 제120조(전용사용권 또는 통상사용권 등록의 취소심판) 제1항에 따라 전용사용 권 또는 통상사용권 등록의 취소심판을 청구한 후 그 심판청구사유에 해당하는 사실이 없어진 경우에도 취소 사유에 영향이 미치지 아니한다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":384,"text":"상표권자ㆍ전용사용권자 또는 통상사용권자 중 어느 누구도 정당한 이유 없이 등록상표 를 그 지정상품에 대하여 취소심판청구일 전 계속하여 3년 이상 국내에서 사용하고 있 지 아니하였음을 이유로 상표등록을 취소한다는 심결이 확정되었을 경우에는 그 상표권 은 심결 확정일부터 소멸된다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":385,"text":"상 법에 따른 심판의 심결이 확정되었을 경우에 그 사건에 대해서 이해관계인은 같 은 사실 및 같 은 증거에 의하여 다시 심판을 청구할 수 없다. 다만, 확정된 심결이 각 하심결인 경우에는 다시 심판을 청구할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":386,"text":"확정심결에 일사부재리의 효력을 인정하는 이유는 서로 모 ㆍ저 되는 심결방지와 순 촉 뢰 확정심결의 신 성확보ㆍ권위 유지, 심판청구의 발 방지, 확정심결에 대한 법적 안 남 정성에 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":387,"text":"확정심결의 일사부재리는 심결당사자, 그 승계인뿐만 아니라 제3자에 대하여도 대세 적 효력이 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":388,"text":"대법원은 동일 증거에는 전에 확정된 심결의 증거와 동일한 증거만이 아니라 그 심결 을 번복 할 수 있을 정도로 유력하지 아니한 증거가 부가되는 것도 함하는 것이므 포 로, 확정된 심결의 결론을 번복 할 만한 유력한 증거가 로 제출된 경우에는 일사부 새 칙 재리의 원 에 반하지 않는다고 판시하였다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":389,"text":"대법원은 일사부재리의 원 칙에 해당하는지의 판단 시점을 '심결시'에서 '심판청구시'로 변경하였다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":390,"text":"aaay 확인심관 에는 형성적효력이인정 되지 않는다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":391,"text":"소극적 권리 법위 확인 심판 에서 심관대 상인 문자와도형 으로 구성된 결합 상표 를 문자 부분 만으로 이루어진 상표 로변경 하는 것은 확인대 상표 장의동일성에영향을 미치는 청구의변경 이므로 허용 되지 않는다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":392,"text":"확인대 상표 장을디자인적으로사용 하는 것은 출처표시기능을 하는 상표 적사용이아 니 므로 확인대 상표 장이 등록 상표 의 UIAA 속하지 아니한다는확인을 구하는 A 판은확인의이익이 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":393,"text":"피 심판 청구인의 상표 등록 출원 행위가 심판 청구인에 대한 관계 에서 사회질서에위반된 것으로서 AWAPA 대하여 JERA 효력이 없다는 대인 적인 상표권 행사의 제한 사유를주장 하면서 제기한 권리 범위 확인섬판은 상표 권의효력이 미치는 A 관한 권리 확정과는무관 하므로 확인의이익이 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":394,"text":"Fg 선사용 상표 가 출원 되지 않은 것을 기화로은버이 상표 를사용 하던 상품 과동 일한 상품 에 상표 등록 출원 을 하여 상표 등록 을받았는바 , 뛰이자신의사용 상표 와 Z 의 등록 상표 는표장과그사용 ( 지정 ) 상품 이동일 하거나 유사 하다고 다 두지 않고 선사 Sue 근거로 FA 사용 상표 ( 확인대 상표 장 ) 가 ZA 상표 의 AAAA 속하지 아니 한다고 제기한 심판 은확인의이익이 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":395,"text":"상표등록의 취소심판은 이해관계인만이 청구할 수 있다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":396,"text":"불사용취소심판에 관한 상표법 제119조 제1항 제3호에서 미등록 통상사용권자의 사용 은 정당한 사용이라고 할 수 없기 때문에 미등록 통상사용권자의 사용은 그 사실이 입증되어도 상표등록의 취소를 면할 수 없다.","chapter":"상표심판·소송·재심·권리범위","answer":"","explanation":""},{"id":397,"text":"상표권자가 상당한 주의를 하였다고 인정되더라도 전용
