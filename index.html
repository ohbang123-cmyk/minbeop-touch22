에는 미치지 아니한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허법은 약사법상 조제행위를 특허권 효력의 예외로 규정한다."},{"id":272,"text":"실용신안권의 효력은 연구 또는 시험(「약사법」에 따른 의약품의 품목허가ㆍ품목신고 및 「농약관리법」 에 따른 농약의 등록을 위한 연구 또는 시험을 포함한다)을 하기 위한 등록실용신안의 실시에 해당하는 사항에는 미치지 아니한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"해당 예외의 범위와 실용신안법의 준용관계를 구별해야 한다. 지문처럼 특허법상 규정을 그대로 확장하여 실용신안권에 적용할 수 없다."},{"id":273,"text":"특허법은 자기의 특허발명이 무효사유에 해당하는 것을 알지 못하고 국가로부터 부여받은 특허권을 신뢰하여 국내에서 실시사업을 하거나 실시 준비 중인 자를 보호하기 위하여 그 특허권에 대하여 통상실 시권을 가지거나 특허가 무효로 된 당시에 존재하는 특허권의 전용실시권에 대하여 통상실시권을 가진 다고 규정하고 있으나, 실용신안법은 고안에 관하여 같은 취지의 규정을 두고 있지 아니하다.","chapter":"특허권 및 실시권","answer":"X","explanation":"이러한 권리보호 규정은 실용신안법에도 준용되어 동일한 취지의 보호가 이루어진다."},{"id":274,"text":"연구자의 지시에 따라 데이터를 수집하고 실험을 행한 A 가 자기 이름으로 특허출원을 하였으나 특허 를 받을 수 있는 권리를 가지지 아니한 사유로 A 가 특허를 받지 못한 경우에 정당한 권리자 B 가 A 의 특 허출원 후 특허를 출원하였다 하더라도 B 의 특허출원은 A 의 출원 시로 소 급하지 못한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"정당한 권리자의 출원은 법정 요건을 갖추면 무권리자의 출원일을 기준으로 출원한 것으로 볼 수 있다."},{"id":275,"text":"특허를 받을 수 있는 권리를 가지지 아니한 C 가 특허출원하여 특허 등록되었을 경우에 정당한 권리자 D 는 특허의 정정심판청구로 특허 등록 할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"정당한 권리자는 특허권의 이전청구 제도를 이용할 수 있으며 정정심판으로 권리를 취득하는 것은 아니다."},{"id":276,"text":"특허권의 이전청구에 따라 공유인 특허권의 지분을 이전하는 경우에 특허법의 규정에 따라 다른 공유 자의 동의를 받아야 그 지분을 이전할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"특허권 이전청구에 따른 지분 이전에는 일반적인 공유지분 양도와 다른 특칙이 적용된다."},{"id":277,"text":"특허권의 이전청구에 기초하여 특허권이 이전등록된 경우에, 제65 조(출원공개의 효과) 제2 항에 따른 보상금지급청구권은 특허권이 이전 등록된 날부터 이전등록을 받은 자에게 있는 것으로 본다.","chapter":"특허권 및 실시권","answer":"X","explanation":"보상금청구권의 귀속은 단순히 이전등록일을 기준으로만 판단하는 것이 아니라 정당한 권리자의 보호를 위한 특칙에 따른다."},{"id":278,"text":"이전등록된 특허권에 대하여 이전등록 당시에 전용실시권을 취득하고 등록을 받은 자가 특허권의 이 전청구에 따른 특허권의 이전등록이 있 기 전에 해당 특허가 무효심판 대상임을 알지 못하고 국내에서 해 당 발명의 실시사업을 준비하고 있는 경우에 그 준비를 하고 있는 발명 및 사 업목적의 범위에서 그 특허 권에 대하여 통상실시권을 가진다.","chapter":"특허권 및 실시권","answer":"O","explanation":"일정한 선의의 실시·사업준비자에게는 법정통상실시권이 인정된다."},{"id":279,"text":"특허권의 상속이 개시된 때 상속인이 없는 경우에는 그 특허권은 국가에 귀속된다.","chapter":"특허권 및 실시권","answer":"X","explanation":"상속인이 없는 경우 특허권은 국가에 귀속되는 것이 아니라 법에서 정한 효과에 따라 소멸한다."},{"id":280,"text":"특허권이 공유인 경우 각 공유자는 계약으로 특별히 약정한 경우를 제외하고는 다른 공유자의 동의를 받지 아니하고 그 특허발명을 자신이 실 시할 수 없다.","chapter":"특허권 및 실시권","answer":"X","explanation":"특허권의 각 공유자는 특별한 약정이 없는 한 다른 공유자의 동의 없이 자신의 특허발명을 실시할 수 있다."},{"id":281,"text":"청산절차가 진행 중인 법인의 특허권은 법인의 청산종결등기일(청산종결등기가 되었더라도 청산사무 가 사실상 끝나지 아니한 경우에는 청 산사무가 사실상 끝난 날과 청산종결등기일부터 6개월이 지난 날 중 빠른 날로 한다.)까지 그 특허권의 이전등록을 하지 아니한 경우에는 청 산종결등기일에 소멸한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"특허권의 소멸시점은 지문의 ‘청산종결등기일’과 정확히 일치하지 않는다."},{"id":282,"text":"특허법에 따라 특허청장이 정한 대가와 보상금액에 관하여 확정된 결정은 집행력 있는 집행권원(執行 權原)과 같은 효력을 가진다. 이 경우 집행력 있는 정본은 법원 소속 공무원이 부여한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"결정에 집행력 있는 집행권원과 같은 효력이 인정되더라도 집행력 있는 정본을 부여하는 주체에 관한 지문이 틀리다. 특허권을 포기한 때 에는 특허권은 그때부터 소멸된다."},{"id":283,"text":"납부된 특허료 및 수수료는 제1 항 각호의 어느 하나에 해당하는 경우에만 납부한 자의 청구에 의하여 반환한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허료 및 수수료의 반환은 법에서 정한 사유가 있는 경우에 한하여 청구할 수 있다."},{"id":284,"text":"잘못 납부된 특허료 및 수수료는 납부한 자의 청구에 의하여 반환한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"잘못 납부된 특허료·수수료는 반환대상이다."},{"id":285,"text":"납부된 특허료 및 수수료는 특허권의 존속기간의 연장등록을 무효로 한다는 심결이 확정된 해의 다음 해부터의 특허료 해당분에 해당하는 경 우 납부한 자의 청구에 의하여 반환한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"연장등록 무효심결이 확정된 경우 일정한 이후 연도의 특허료는 반환될 수 있다."},{"id":286,"text":"특허청장 또는 특허심판원장은 납부된 특허료 및 수수료가 제1 항 각 호의 어느 하나에 해당하는 경우 에는 그 사실을 납부한 자에게 통지하 여야 한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"반환사유가 있는 경우 특허청장 또는 특허심판원장은 그 사실을 납부자에게 통지한다."},{"id":287,"text":"제1 항에 따른 특허료 및 수수료의 반환청구는 제2 항에 따른 통지를 받은 날부터 3년이 지나면 할 수 없다.","chapter":"특허권 및 실시권","answer":"X","explanation":"반환청구기간은 통지를 받은 날부터 5년이다."},{"id":288,"text":"특허발명의 실시가 공공의 이익을 위하여 특히 필요하여 하는 재정의 경우, 특허청장은 재정을 받은 자에게 통상실시권은 국내수요충족을 위 한 공급을 주목적으로 하여야 한다는 조건을 붙일 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"공공의 이익을 위한 재정에는 국내수요 충족을 위한 공급을 주목적으로 하는 조건을 붙일 수 있다."},{"id":289,"text":"특허발명을 실시하려는 자는 공공의 이익을 위하여 특허발명을 비상업적으로 실시하려는 경우와 사 법적 절차 또는 행정적 절차에 의하여 불 공정거래행위로 판정된 사항을 바로잡기 위하여 특허발명을 실 시할 필요가 있는 경우, 특허권자 또는 전용실시권자와 협의 없이도 재정을 청 구할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"공공의 이익을 위한 비상업적 실시와 불공정거래 시정의 경우에는 협의 없이 재정을 청구할 수 있 다."},{"id":290,"text":"반도체 기술에 대해서는, 공공의 이익을 위하여 비상업적으로 실시하려는 경우와, 사법적 절차 또는 행정적 절차에 의하여 불공정거래행위로 판정된 사항을 바로잡기 위하여 특허발명을 실시할 필요가 있 는 경우에만 재정을 청구할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"반도체 기술에 대한 재정은 법에서 정한 두 가지 경우로 제한된다."},{"id":291,"text":"특허출원일부터 4년이 지나지 아니한 특허발명에 관하여는 특허발명이 정당한 이유 없이 계속하여 3년 이상 국내에서 상당한 영업적 규모 로 실시되고 있지 아니하거나 적당한 정도와 조건으로 국내수요를 충족시키지 못한다는 것을 근거로 재정을 청구할 수 없다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허출원일부터 4년이 지나지 않은 경우에는 해당 재정사유를 적용하지 않는다."},{"id":292,"text":"재정에 의한 통상실시권은 실시사업과 함께 이전하는 경우에만 이전할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"재정에 의한 통상실시권은 실시사업과 함께 이전할 수 있다."},{"id":293,"text":"허가 등에 따른 특허권존속기간 연장등록출원은 대상이 되는 특허발명의 특허권이 존속되는 경우에 만 가능하다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허권이 존속하고 있어야 존속기간 연장등록출원을 할 수 있다."},{"id":294,"text":"하나의 특허와 관련하여 연장등록출원의 대상이 되는 유효성분 A, B 및 C 에 대하여 각각 허가 A, B 및 C 를 받았다면 각 유효성분에 대하여 연장 받고자 하는 허가 모두에 대하여 1 회씩 연장등록출원 할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"하나의 특허에 복수의 유효성분에 대한 복수의 허가가 있더라도 그 중 하나를 선택하여 1 회에 한 해 연장할 수 있다."},{"id":295,"text":"특허권의 존속기간을 연장 받을 수 있는 기간은 그 특허발명을 실시할 수 없었던 기간으로서 5년의 기 간 내로 한정된다.","chapter":"특허권 및 실시권","answer":"O","explanation":"실시할 수 없었던 기간에 대하여 최대 5년까지 한 차례 연장할 수 있다."},{"id":296,"text":"해당 관청의 심사부서 중 어느 한 부서의 보완요구로 인하여 보완기간이 소요되었다 하더라도, 다른 부서에서 허가를 위한 심사 등의 절차가 계속 진행되고 있었던 경우에는 그 보완기간 중 다른 부서에서 심사가 진행되고 있는 기간과 중첩되는 기간에 관한 한 허가 등을 받은 자의 책 임 있는 사유로 인하여 허 가가 지연되었다고 볼 수 없으므로 위 중첩되는 기간은 그 특허발명을 실시할 수 없었던 기간에서 제외 할 수 없다.","chapter":"특허권 및 실시권","answer":"O","explanation":"다른 심사부서에서 허가절차가 계속 진행 중이라면 중첩기간을 권리자의 책임 있는 사유로 볼 수 없다. 특허권 존속기간의 연장등록출원 의 출원인은 특허권자에 한하며 특허권이 공유인 경우에는 공유자 전원이 공동으로 특허권 존속기간의 연장등록출원을 하여야 한다."},{"id":297,"text":"추가납부기간에 특허료를 납부하지 않은 경우에는 특허권의 설정등록을 받으려는 자의 특허출원은 취하한 것으로 본다.","chapter":"특허권 및 실시권","answer":"X","explanation":"추가납부기간 내 특허료를 납부하지 않으면 해당 출원이 취하된 것으로 보는 것이 아니라 특허법 상 별도의 효과가 발생한다."},{"id":298,"text":"특허권의 설정등록을 받으려는 자 또는 특허권자가 책임질 수 없는 사유로 추가납부기간에 특허료를 내지 아니하였거나 보전기간에 보전하 지 아니한 경우에는 그 사유가 소멸한 날부터 30일 이내에 그 특 허료를 내거나 보전할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"정당한 사유에 의한 추가납부·보전의 기간을 30일로 정한 부분이 잘못되었다."},{"id":299,"text":"특허권의 존속기간의 연장등록을 무효로 한다는 심결이 확정된 경우에 심결이 확정된 해부터의 특허 료는 납부한 자의 청구에 의하여 반환한 다.","chapter":"특허권 및 실시권","answer":"X","explanation":"반환되는 특허료의 범위는 심결 확정 시점 이후의 일정 기간을 기준으로 판단한다."},{"id":300,"text":"특허청장은 특허료가 잘못 납부된 경우에는 그 사실을 납부한 자에게 통지하여야 하며, 특허료의 반 환청구는 이 통지를 받은 날부터 3년이 지나면 할 수 없다.","chapter":"특허권 및 실시권","answer":"O","explanation":"잘못 납부된 특허료의 반환에는 법정 청구기간이 적용된다. 특허청장은 특허료의 감면을 거짓이나 그 밖의 부정한 방법으로 받은 자에 대 하여는 산업통상자원부 령으로 정하는 바에 따라 감면받은 특허료의 3 배액을 징수할 수 있다."},{"id":301,"text":"단독으로 발명을 완성한 후 특허를 받을 수 있는 권리의 일부 지분을 양도한 경우에는 공유자 모두가 공동으로 특허출원을 하지 않더라도 해 당 출원은 거절되지 않는다.","chapter":"특허권 및 실시권","answer":"X","explanation":"특허를 받을 수 있는 권리가 공유인 경우 공유자 전원이 공동으로 출원해야 한다."},{"id":302,"text":"특허권이 공유인 경우 다른 공유자와 경쟁관계에 있는 제3 자에게 지분이 양도되면 다른 공유자는 불 측의 손해를 입을 우려가 있기 때문에 특허권이 공유인 경우에는 각 공유자는 다른 공유자 모두의 동의 를 받아야만 그 지분을 양도할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허권의 지분 양도에는 다른 공유자 전원의 동의가 필요하다."},{"id":303,"text":"특허권의 각 공유자에게 민법상의 공유물분할청구권을 인정하더라도 특허법 제99 조(특허권의 이전 및 공유 등)에 반하지 아니하고, 달리 분 할청구를 금지하는 특허법 규정이 없으므로, 특허권의 공유관계 에 민법상 공유물분할청구에 관한 규정이 적용될 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허권 공유관계에도 일정한 범위에서 민법상 공유물분할의 법리가 적용될 수 있다."},{"id":304,"text":"특허권 분할시 각 공유자에게 특허권을 부여하는 방식의 현물분할을 인정하면 하나의 특허권이 사실 상 내용이 동일한 복수의 특허권으로 증 가하는 부당한 결과를 초래하게 되므로, 현물분할은 허용되지 않 는다.","chapter":"특허권 및 실시권","answer":"O","explanation":"하나의 특허권을 동일한 내용의 복수 특허권으로 만드는 현물분할은 허용되지 않는다. 심판청구서의 보정은 그 요지를 변경할 수 없는 것 이 원칙이나, 공동출원인 중 일부만이 심판청구를 제기한 경우 나머지 공동출원인을 심판청구인으로 추가하는 보정은 허용된다."},{"id":305,"text":"반도체 기술에 대해서는 특허법 제107 조(통상실시권 설정의 재정) 제1 항 제3 호(공공의 이익을 위하 여 비상업적으로 실시하는 경우만 해 당한다)의 경우에만 재정을 청구할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"반도체 기술에 대한 재정은 법에서 정한 특별한 경우로 제한된다."},{"id":306,"text":"비밀취급이 필요한 특허발명에 대해서는 그 발명의 비밀취급이 해제될 때까지 그 특허의 등록공고를 보류하여야 하며, 그 발명의 비밀취급이 해제된 경우에는 지체 없이 특허법 제87 조(특허권의 설정등록 및 등록공고) 제3 항에 따라 등록공고를 하여야 한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"비밀취급 특허발명에 대해서는 비밀취급 기간 동안 등록공고가 보류된다."},{"id":307,"text":"특허발명의 실시가 특허법 제2 조(정의) 제3 호 나목에 따른 방법의 사용을 청약하는 행위인 경우 특허 권의 효력은 그 방법의 사용이 특허권 또는 전용실시권을 침해한다는 것을 알면서 그 방법의 사용을 청 약하는 행위에만 미친다.","chapter":"특허권 및 실시권","answer":"O","explanation":"방법발명의 사용 청약에 관한 특허권의 효력에는 법정 제한이 있다."},{"id":308,"text":"정부는 특허발명이 국가 비상사태, 극도의 긴급상황 또는 공공의 이익을 위하여 비상업적으로 실시할 필요가 있다고 인정하는 경우에는 그 특 허발명을 실시하거나 정부 외의 자에게 실시하게 할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"긴급한 공공의 필요가 있는 경우 정부는 특허발명을 직접 실시하거나 타인에게 실시하게 할 수 있 다. 청산절차가 진행 중인 법인의 특허 권은 법인의 청산종결등기일(청산종결등기가 되었더라도 청산사무 가 사실상 끝나지 아니한 경우에는 청산사무가 사실상 끝난 날과 청산종결등기 일부터 6개월이 지난 날 중 빠른 날로 한다)까지 그 특허권의 이전등록을 하지 아니한 경우에는 청산종결등기일의 다음 날에 소 멸한다."},{"id":309,"text":"특허발명 실시계약 체결 이후에 특허가 무효로 확정된 경우 특허발명 실시계약이 원시적으로 이행불 능 상태에 있었더라도 특허권자는 특허 발명 실시계약이 유효하게 존재하는 기간 동안 실시료의 지급을 청구할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"무효 확정 전에는 실시계약이 유효하게 존속할 수 있고 그 기간의 실시료 청구가 인정된다."},{"id":310,"text":"특허발명 실시계약을 체결하면 특허권자는 실시권자의 특허발명 실시에 대하여 특허권 침해로 인한 손해배상이나 그 금지 등을 청구할 수 없 고, 특허가 무효로 확정되기 전에는 특허권의 독점적ㆍ배타적 효력에 따라 제3 자의 특허발명 실시가 금지된다.","chapter":"특허권 및 실시권","answer":"X","explanation":"실시권자에 대한 관계와 제3 자에 대한 관계를 구분해야 하며, 실시계약의 존재만으로 모든 청구권 이 일률적으로 배제되는 것은 아니다."},{"id":311,"text":"특허발명 또는 등록실용신안이 신규성은 있으나 진보성이 없는 경우 이에 관한 권리범위확인심판에 서 당연히 그 권리범위를 부정할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"권리범위확인심판에서는 진보성 흠결만을 이유로 권리범위를 부정할 수 없다."},{"id":312,"text":"특허법 제128 조(손해배상청구권 등) 제5 항에 의하여 특허발명의 실시에 대하여 합리적으로 받을 수 있는 금액을 결정함에 있어서는, 당해 특허발명에 대하여 특허권자가 제3 자와 사이에 특허권 실시계약 을 맺고 실시료를 받은 바 있다면 일방 당사자에게 현저하게 불합리하더라 도 그 실시계약에서 정한 실시 료를 기준으로 위 금액을 산정하여야 한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"기존 실시계약의 실시료는 참작할 수 있지만 현저하게 불합리한 경우까지 기계적으로 그대로 적용 하는 것은 아니다."},{"id":313,"text":"특허법은 전용실시권이 설정된 범위를 제외하고는 특허권자가 업으로서 특허발명을 실시할 권리를 독점하도록 명시적으로 규정하며, 전용실 시권자가 등록되어 있지 않은 제한을 넘어 특허발명을 실시하 는 경우 특허권자에 대하여 채무불이행 책임을 지게 됨은 물론 특허권 침해가 성립한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"등록되지 않은 전용실시권의 제한을 위반한 경우에는 계약상 책임은 문제될 수 있으나 곧바로 특 허권 침해가 성립하는 것은 아니다."},{"id":314,"text":"특허권자 또는 그 특허권의 전용실시권이나 등록된 통상실시권을 가진 자가 특허법 제89 조(타인의 특허발명 등과의 관계) 제1 항에 따른 의 약품 제조허가를 받지 않고 다른 사람이 허가를 받은 경우, 그 존 속기간 연장등록출원은 거절결정된다.","chapter":"특허권 및 실시권","answer":"O","explanation":"존속기간 연장등록의 주체와 허가 관계에 관한 법정 요건을 충족하지 못한다."},{"id":315,"text":"특허발명을 실시하기 위하여 의약품제조 허가를 신청하였으나, 신청자의 책임있는 사유로 보완지시 를 받은 날부터 6개월 후에 관련 서류를 제출하여 신청일부터 3년 6개월 후에 허가를 받은 경우의 존속 기간연장 기간은 3년 6개월이다.","chapter":"특허권 및 실시권","answer":"X","explanation":"허가에 걸린 기간 중 허가받을 자에게 책임 있는 기간은 연장기간에서 제외한다."},{"id":316,"text":"특허권의 존속기간 연장등록출원은 허가를 받은 날부터 6개월 이내에 출원하여야 하며, 특허권의 존 속기간의 만료 전 6개월 후에는 그 특허 권의 존속기간 연장등록출원을 할 수 없다.","chapter":"특허권 및 실시권","answer":"X","explanation":"연장등록출원기간은 허가일로부터 3개월 이내 등 법정기간에 따른다."},{"id":317,"text":"청구범위의 독립 청구항이 2 개가 있는 경우, 그 독립항 각각 별도로 의약품 제조허가를 받기 위하여 소요된 기간이 각 독립항별로 2년 및 3년이 걸린 때에는 5년간 존속기간 연장등록이 가능하다.","chapter":"특허권 및 실시권","answer":"X","explanation":"하나의 특허권에 대한 연장등록은 법이 정한 범위에서 1 회만 가능하며 단순히 각 독립항의 기간을 합산하지 않는다."},{"id":318,"text":"특허발명을 실시하기 위하여 의약품제조 허가를 받기 위한 유효성ㆍ안전성 시험에 7년이 소요된 경 우에는 그 허가를 받는데 걸린 소요기간 에 대하여 특허권의 존속기간을 연장할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"존속기간 연장은 법정 상한인 5년의 범위 내에서만 가능하다."},{"id":319,"text":"甲은 자기의 특허발명인 물질 A 가 乙의 제초제에 그대로 실시되고 있다는 이유로 乙의 특허발명을 확 인대상발명으로 하여 자기의 특허발명 의 권리범위에 속한다는 확인을 구하는 적극적 권리범위확인심판 을 청구할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"선행특허와 후행특허가 이용관계에 있는 경우 권리 대 권리의 적극적 권리범위확인이 예외적으로 허용될 수 있다."},{"id":320,"text":"乙의 특허발명이 甲의 특허발명과 이용관계가 성립하기 위해서는 물질 A 와 B 의 유기적 결합관계에 의하여 생성된 제초제 AB 는 甲의 특허 발명인 물질 A 의 살균성분과 특성이 일체성을 가지고 있어야 한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"이용관계는 후발명이 선행발명의 구성요소를 그대로 이용하면서 선행발명의 일체성을 유지하는 관계를 말한다."},{"id":321,"text":"乙은 자기의 특허발명이 특허법 제98 조(타인의 특허발명 등과의 관계)에 해당하여 그 실시의 허락을 받고자 하였으나 甲이 정당한 이유 없 이 허락하지 아니하는 경우, 자기의 특허발명의 실시에 필요한 범 위에서 통상실시권허락 심판을 청구할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"선행특허와의 이용관계가 있으면 일정 요건 아래 통상실시권 허락심판을 청구할 수 있다."},{"id":322,"text":"乙이 자기의 특허발명을 실시하기 위하여 甲을 상대로 특허법 제138 조(통상실시권허락의 심판)의 심 판을 청구한 경우, 乙의 특허발명이 甲 의 특허발명과 비교하여 상당한 경제적 가치가 있는 중요한 기술 적 진보를 가져오는 것이 아니면 통상실시권을 허락하여서는 아니 된다.","chapter":"특허권 및 실시권","answer":"O","explanation":"후발발명이 상당한 경제적 가치가 있는 중요한 기술적 진보를 가져오는 것이 허락심판의 요건이다."},{"id":323,"text":"乙은 자기의 특허발명이 甲의 특허발명과 이용관계에 있는 경우 甲의 허락을 받지 아니하고는 자기의 특허발명을 업으로서 실시할 수 없다.","chapter":"특허권 및 실시권","answer":"X","explanation":"이용관계에 해당한다고 해서 후발특허의 등록 자체가 무효가 되는 것은 아니며, 법이 정한 절차에 따른 실시 가능성이 별도로 문제된다."},{"id":324,"text":"실용신안 물품을 적법하게 양수한 자가 당해 물품을 계속 사용하기 위하여 필요한 범위 내에서 실용 신안으로서 보호되는 기술적 사상과 무관 한 부품의 교체는 실용신안권 침해가 되지 아니한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"적법한 양수에 의해 권리가 소진된 물품의 통상적인 수리·사용 범위의 교체는 원칙적으로 침해가 아니다."},{"id":325,"text":"물건을 생산하는 방법의 발명에 대한 특허권자가 생산한 물건이 경매절차에 의하여 양도된 경우에도 원칙적으로 특허권은 소진된다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허권자가 국내에서 적법하게 물건을 양도한 경우 특허권 소진의 원칙이 적용된다."},{"id":326,"text":"타인의 특허발명을 허락없이 실시한 자라도 자신이 실시하는 기술이 특허발명의 권리범위에 속하지 않는다고 믿은 점을 정당화할 수 있는 사 정이 있다는 것을 주장하여 입증한다면 그에 대한 과실의 추정 은 번복될 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허권 침해에 관한 과실 추정은 그 추정을 번복할 사정의 주장·입증으로 뒤집을 수 있다."},{"id":327,"text":"특허발명 실시계약 체결 이후에 계약 대상인 특허의 무효가 확정되었더라도 특허의 유효성이 계약 체 결의 동기로서 표시되었고 그것이 법률 행위의 내용의 중요부분에 해당하는 등의 사정이 없는 한, 착오를 이유로 특허발명 실시계약을 취소할 수는 없다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허의 사후 무효만으로 바로 착오취소가 인정되는 것은 아니다."},{"id":328,"text":"특허권은 특허권설정등록이 있는 날에 발생하고 출원일로부터 20년이 되는 날까지 존속하며 특허권 존속기간의 말일이 공휴일, 근로자의 날 및 토요일을 포함한다면 그 다음 날로 만료한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"특허권 존속기간의 만료에 관한 기간 계산이 일반적인 기간의 연장 규정과 동일하게 적용되는 것 은 아니다."},{"id":329,"text":"특허권자는 자신의 특허발명에 관하여 업으로서 실시할 권리를 독점하므로 다른 특허발명의 권리범 위에 속하더라도 실시허락을 얻을 필요 없이 자신의 특허발명을 실시할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"자신의 특허발명이라도 선행특허의 권리범위에 속하면 이용관계 등으로 실시가 제한될 수 있다."},{"id":330,"text":"무권리자의 특허출원 후 정당한 권리자의 특허출원이 있고 무권리자가 특허출원한 때에 정당한 권리 자가 특허출원한 것으로 보는 경우 특허 권의 존속기간은 무권리자의 특허출원일부터 기산한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"정당한 권리자의 출원일 소급과 특허권 존속기간의 기산은 구별하여야 한다."},{"id":331,"text":"특허권이 무효심판에 의하여 무효로 되면 그 특허권은 처음부터 없던 것으로 보게 되므로 특허권자가 이미 받은 특허실시료는 특허발명 실시 계약이 유효하게 존재하는 기간에 상응하는 부분을 실시권자에 게 부당이득으로 반환하여야 한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"특허가 무효가 되었다는 사정만으로 기존 실시계약상의 실시료를 당연히 전부 부당이득으로 반환 하는 것은 아니다. 방법발명에 대한 특 허권자 등이 우리나라에서 그 특허방법의 사용에 쓰이는 물건을 적법하게 양도한 경우로서 그 물건이 방법발명을 실질적으로 구현한 것이라면 양 수인 등이 그 물건을 이용하여 방법발명 을 실시하는 행위에 대하여 특허권의 효력이 미치지 않는다."},{"id":332,"text":"특허권자 또는 전용실시권자는 자기의 권리를 침해한 자 또는 침해할 우려가 있는 자에 대하여 그 침 해의 금지 또는 예방을 청구할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허권자의 침해금지·예방청구권에 관한 기본 규정이다."},{"id":333,"text":"특허권자 또는 전용실시권자가 침해의 금지 또는 예방을 청구할 때에는 침해행위를 조성한 물건(물건 을 생산하는 방법의 발명인 경우에는 침 해행위로 생긴 물건을 포함한다)의 폐기, 침해행위에 제공된 설 비의 제거, 그 밖에 침해의 예방에 필요한 행위를 청구할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"침해의 금지·예방에 필요한 구체적인 조치도 함께 청구할 수 있다."},{"id":334,"text":"특허권 또는 전용실시권 침해소송에서 특허권자 또는 전용실시권자가 주장하는 침해행위의 구체적 행위태양을 부인하는 당사자는 자기의 구 체적 행위태양을 제시하여야 한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"침해소송에서 구체적 행위태양 제시의무가 인정된다."},{"id":335,"text":"당사자가 정당한 이유 없이 자기의 구체적 행위태양을 제시하지 않는 경우에는 법원은 특허권자 또는 전용실시권자가 주장하는 침해행위의 구체적 행위태양을 진실한 것으로 본다.","chapter":"특허권 및 실시권","answer":"O","explanation":"정당한 이유 없이 제시하지 않으면 상대방의 주장을 진실한 것으로 인정할 수 있다."},{"id":336,"text":"법원은 타인의 특허권 또는 전용실시권을 침해한 행위가 고의적인 것으로 인정되는 경우에는 손해로 인정된 금액의 3 배를 넘지 아니하는 범 위에서 배상액을 정할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"고의적 특허침해에 대한 3 배 배상 규정이다."},{"id":337,"text":"“실시”란 “물건의 발명”인 경우 그 물건을 생산ㆍ사용ㆍ양도ㆍ대여 또는 수입하거나 그 물건의 양도 또는 대여의 청약(양도 또는 대여를 위한 전시를 포함한다)을 하는 행위를 말한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허법상 물건발명의 실시행위에 관한 정의이다."},{"id":338,"text":"‘물건의 발명’에서 “생산”이란 발명의 구성요소 일부를 결여한 물건을 사용하여 발명의 구성요소를 가 진 물건을 새로 만들어내는 행위를 의 미하므로 가공, 조립 등의 행위는 이에 포함되지 않는다.","chapter":"특허권 및 실시권","answer":"X","explanation":"생산에는 가공·조립 등 구성요소를 가진 물건을 새로 만들어내는 행위가 포함될 수 있다."},{"id":339,"text":"‘물건의 발명’에 대한 특허권자 또는 특허권자로부터 허락을 받은 실시권자가 우리나라에서 그 특허발 명이 구현된 물건을 적법하게 양도한 경우 양수인이나 전득자가 그 물건을 사용, 양도하는 등의 행위에 대하여 특허권의 효력이 미치지 않는다.","chapter":"특허권 및 실시권","answer":"O","explanation":"적법한 양도에 따른 특허권 소진에 관한 내용이다. 타인의 특허발명을 허락 없이 실시한 자에게 과실이 없다고 하기 위해서는 특허권의 존 재를 알지 못 하였다는 점을 정당화할 수 있는 사정이 있다거나 자신이 실시하는 기술이 특허발명의 권리범위에 속하 지 않는다고 믿은 점을 정당화 할 수 있는 사정이 있다는 것을 주장ㆍ입증하여야 한다."},{"id":340,"text":"공동발명자가 되기 위해서는 발명의 완성을 위하여 단순히 아이디어를 제공하거나 관리하는 수준을 넘어 실질적으로 상호 협력하는 관계가 있어야 하므로, 발명에 대한 새로운 착상을 구체화하고 공동 연 구자에 대한 구체적인 지도를 하여 발명을 가능케 하였다고 하더라도 공동발 명자에 해당하지 않는다.","chapter":"특허권 및 실시권","answer":"X","explanation":"발명의 완성에 실질적으로 기여했다면 공동발명자가 될 수 있다."},{"id":341,"text":"당사자계 심판에 대한 심결취소소송은 공유자 전원이 공동으로 제기하여야만 하는 고유필수적 공동 소송이라는 것이 판례의 태도이다.","chapter":"특허권 및 실시권","answer":"X","explanation":"공유특허권자의 심결취소소송에 관한 공동소송의 성격은 고유필수적 공동소송으로 보지 않는다."},{"id":342,"text":"특허권의 각 공유자에게 민법상의 공유물분할청구권을 인정하더라도 특허법 제99 조(특허권의 이전 및 공유 등)에 반하지 아니하고 달리 분 할청구를 금지하는 특허법 규정이 없음에도 불구하고 각 공유자 에게 특허권을 부여하는 방식의 현물분할은 허용되지 않는다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허권 자체를 공유자별로 현물분할하는 것은 허용되지 않는다."},{"id":343,"text":"심결취소소송에 관한 보존행위설 또는 유사필수적 공동소송설에 의하면 특허권 공유자 중 1 인이 단 독으로 제기한 소는 일종의 방해배제청 구소송이므로 부적법하여 각하하여야 한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"단독 제소가 당연히 부적법하여 각하된다고 볼 수 없다."},{"id":344,"text":"특허법 제99 조(특허권의 이전 및 공유 등)의 규정은 특허권 공유관계의 특수성을 고려하여 다른 공유 자의 동의 없는 지분의 양도를 금지하 면서 특허권의 공유를 합유관계로 본다는 명문의 규정이다.","chapter":"특허권 및 실시권","answer":"X","explanation":"특허권 공유를 합유라고 명시한 규정은 없다."},{"id":345,"text":"특허를 받을 수 있는 권리가 공유인 경우 각 공유자는 다른 공유자의 동의를 받아야 그 지분을 양도할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"공유지분의 양도에는 다른 공유자의 동의가 필요하다."},{"id":346,"text":"특허를 받을 수 있는 권리가 공유인 경우 각 공유자는 다른 공유자의 동의를 받아야 그 지분을 목적으 로 질권을 설정할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"특허를 받을 수 있는 권리의 질권 설정에 관한 규율은 특허권 공유와 동일하지 않다."},{"id":347,"text":"특허를 받을 수 있는 권리의 승계가 출원 전에 이루어지면 승계인이 출원해야만 승계 효력이 발생한 다.","chapter":"특허권 및 실시권","answer":"X","explanation":"출원 전 승계는 출원과 별개의 문제이며 승계 자체의 효력 발생요건과 출원인 적격을 구별해야 한 다."},{"id":348,"text":"특허권이 공유인 경우 각 공유자는 다른 공유자 모두의 동의를 받아 그 지분을 양도할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허권 공유지분의 양도에는 다른 공유자의 동의가 필요하다."},{"id":349,"text":"특허권이 공유인 경우 각 공유자는 다른 공유자 모두의 동의를 받아 그 지분을 목적으로 질권을 설정 할 수 있다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허권의 공유지분에 대한 질권 설정에는 다른 공유자의 동의가 요구된다."},{"id":350,"text":"상속 기타 일반승계를 제외한 특허권의 이전은 등록하여야 효력이 발생한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"특허권 이전의 등록은 효력발생요건이다. 무권리자의 특허 후 정당한 권리자가 특허를 받은 경우 일정 요건 아래 특허권의 이전을 구하는 것이 가능하다."},{"id":351,"text":"공동발명자 중 1 인이 단독으로 특허출원하더라도 다른 공동발명자는 무효심판을 청구할 수 없다.","chapter":"특허권 및 실시권","answer":"X","explanation":"공동발명자에게 정당한 권리자 지위가 인정된다면 무효심판을 청구할 수 있다."},{"id":352,"text":"발명자에게서 특허를 받을 수 있는 권리를 각각 양수한 두 사람이 같은 날 출원하고 협의가 성립하지 않으면 양쪽 모두 승계의 효력을 인정받 을 수 없다.","chapter":"특허권 및 실시권","answer":"O","explanation":"동일한 권리를 이중으로 양수한 경우 협의가 성립하지 않으면 어느 한쪽을 특정할 수 없다."},{"id":353,"text":"출원 후 특허를 받을 수 있는 권리를 특정승계한 자는 특허출원인변경신고를 해야만 승계 자체의 효 력이 발생한다.","chapter":"특허권 및 실시권","answer":"X","explanation":"변경신고의 효력과 권리승계 자체의 효력은 구별된다."},{"id":354,"text":"특허권 존속기간 연장등록은 한 차례만 가능하다.","chapter":"특허권 및 실시권","answer":"O","explanation":"허가 등에 따른 존속기간 연장등록은 1 회에 한정된다."},{"id":355,"text":"특허권이 공유이면 공유자 전원이 공동으로 연장등록출원을 해야 한다.","chapter":"특허권 및 실시권","answer":"O","explanation":"공유특허권의 존속기간 연장등록출원은 공유자 전원이 공동으로 한다."},{"id":356,"text":"연장등록 대상 특허권의 효력은 연장등록된 특허청구범위에 적힌 발명에 한정된다.","chapter":"특허권 및 실시권","answer":"O","explanation":"연장된 기간의 효력범위는 법이 정한 청구범위에 따라 정해진다."},{"id":357,"text":"특허권의 존속기간 만료 전 6개월이 지난 뒤에는 존속기간 연장등록출원을 할 수 없다.","chapter":"특허권 및 실시권","answer":"O","explanation":"연장등록출원의 시적 제한에 관한 규정이다."},{"id":358,"text":"자신의 특허발명이라면 다른 특허발명의 권리범위에 속하더라도 별도 허락 없이 항상 자유롭게 실시 할 수 있다.","chapter":"특허권 및 실시권","answer":"X","explanation":"이용관계 등으로 선행특허의 실시가 제한될 수 있다.. Ⅳ특허심판·소송. Ⅳ특허심판·소송 문항 수: 152 개 Ⅳ. 특허심판·소송 문항 수: 152개"},{"id":359,"text":"특허에 관한 절차를 밟은 자가 책임질 수 없는 사유로 특허법 제132 조의17(특허거절결정 등에 대한 심판)에 따른 심판의 청구기간을 지키지 못한 경우에는 그 사유가 소멸한 날부터 3개월 이내에 지키지 못한 절차를 추후 보완할 수 있다. 다만, 그 기간의 만료일부터 1년이 지났을 때 에는 그러하지 아니하다.","chapter":"특허심판·소송","answer":"X","explanation":"추후보완의 대상과 기간을 잘못 서술한 지문이다. 심판청구기간의 추후보완에 관한 특허법상 별도 의 요건을 적용해야 한다."},{"id":360,"text":"특허의 공동출원인 2 인 중 1 인만의 주소 또는 영업소가 불분명함에도 공시송달이 이루어진 경우, 그 공시송달은 부적법하고 효력이 발생하 지 아니한다.","chapter":"특허심판·소송","answer":"X","explanation":"공동출원인 중 한 사람의 주소 등이 불분명하다는 사정만으로 공시송달 전체가 당연히 부적법해지 는 것은 아니다. 공시송달의 요건은 송달받 을 자별로 판단한다. 재외자가 국내에 체류하지 않으면서 특허관리인에 의하지 아니하고 서류를 제출한 경우 이를 반려하 지 않고 수리하여 진 행한 특허에 관한 절차는 특허법 제53 조(재외자의 특허관리인) 제1 항에 위반되어 효력이 없다."},{"id":361,"text":"특허심판원장은 청구에 따라 또는 직권으로 특허법 제132 조의17(특허거절결정 등에 대한 심판)에 따른 심판의 청구기간을 30일 이내에서 한 차례만 연장할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"기출 당시 기준으로 옳은 지문이다. 특허법 제15 조제1 항에 따라 제132 조의17 에 따른 심판청구기간은 원칙적으로 30일 이내에서 1 회 연장할 수 있다. 다만 현행법은 도서·벽지 등 교통이 불편한 지역에 대한 추가 연장 예외를 두고 있으므로, 현재법 기준으로는 이 예외까지 함께 기 억해야 한다."},{"id":362,"text":"특허법상 최초의 공시송달의 효력은 특허공보에 게재한 날부터 2 주일이 지나면 그 효력이 발생하며, 같은 당사자에 대한 이후의 공시송달은 특허공보에 게재한 날의 다음 날부터 효력이 발생한다.","chapter":"특허심판·소송","answer":"O","explanation":"최초 공시송달과 같은 당사자에 대한 이후 공시송달은 효력 발생시기가 서로 다르다."},{"id":363,"text":"공동출원인에 대하여 제219 조(공시송달) 제1 항에 의한 공시송달을 실시하기 위해서는 ‘공동출원인 전원의 주소 또는 영업소가 불분명하여 송달받을 수 없는 때’에 해당하여야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"공동출원인에 대한 공시송달은 법정 요건을 갖춘 경우에만 할 수 있다."},{"id":364,"text":"법정기간은 특허법 제132 조의17 의 규정에 의한 심판의 청구기간에 한하여 연장할 수 있으나, 지정기 간은 연장 대상에 제한이 없다.","chapter":"특허심판·소송","answer":"X","explanation":"법정기간이라고 하여 오직 제132 조의17 에 따른 심판청구기간만 연장할 수 있는 것은 아니다."},{"id":365,"text":"심판장은 특허취소신청에 대한 결정이 있는 때에는 그 결정의 등본을 특허취소신청인, 특허권자 및 참가인에게 송달하여야 하지만, 그 특허 취소신청에 대한 심리에 참가를 신청하였으나 그 신청이 거부된 자에게는 송달할 필요가 없다.","chapter":"특허심판·소송","answer":"X","explanation":"참가신청이 거부된 자라도 법에서 정한 송달관계를 따져야 하므로 지문처럼 일률적으로 송달할 필 요가 없다고 할 수 없다."},{"id":366,"text":"특허취소신청을 심리하여 결정하는 합의체는 부적법한 특허취소신청으로서 그 흠을 보정할 수 없을 때에는 특허권자에게 특허취소신청서의 부본을 송달하지 아니하고, 결정으로 그 특허취소신청을 각하 할 수 있으며, 이러한 각하결정에 대해서는 불복할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"보정할 수 없는 부적법한 특허취소신청은 각하할 수 있고 그 결정에 별도의 불복을 할 수 없다."},{"id":367,"text":"청구범위의 청구항이 둘 이상인 경우에는 청구항마다 특허취소신청을 할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"특허취소신청은 청구항별로 할 수 있다."},{"id":368,"text":"특허취소신청에 관한 심리는 서면으로 한다.","chapter":"특허심판·소송","answer":"O","explanation":"특허취소신청은 원칙적으로 서면심리에 의한다."},{"id":369,"text":"심판장은 특허취소신청이 있으면 그 사실을 해당 특허권의 전용실시권자나 그 밖에 그 특허에 관하여 등록을 한 권리를 가지는 자에게 알려야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"등록된 이해관계인에게 특허취소신청 사실을 알려 절차 참여의 기회를 보장한다. 특허법상 무효심판에 관한 설명으로 옳지 않은 것은?"},{"id":370,"text":"무권리자의 출원을 무효사유로 한 특허무효심판 및 그에 따른 심결취소소송에서 무효사유에 관한 증 명책임은 무효라고 주장하는 당사자에 게 있다.","chapter":"특허심판·소송","answer":"O","explanation":"무효사유의 존재를 주장하는 자가 그 사실을 증명하는 것이 원칙이다."},{"id":371,"text":"일사부재리 원칙 위반을 이유로 등록무효 심판청구를 각하한 심결에 대한 취소소송에서 심결 시를 기 준으로 동일 사실과 동일 증거를 제출한 것인지를 심리하여 일사부재리 원칙 위반 여부를 판단하여야 하 며, 이때 심판청구인이 심판절차에서 주장하지 않은 새로운 등록무효 사유를 주장하는 것이 허용된다.","chapter":"특허심판·소송","answer":"X","explanation":"심결취소소송에서 심판절차에서 주장하지 않은 새로운 무효사유를 자유롭게 추가할 수 있는 것은 아니다."},{"id":372,"text":"특허무효심판을 청구할 수 있는 이해관계인이란 당해 특허발명의 권리 존속으로 인하여 법률상 어떠 한 불이익을 받거나 받을 우려가 있어 그 소멸에 관하여 직접적이고 현실적인 이해관계를 가진 사람을 말한다.","chapter":"특허심판·소송","answer":"O","explanation":"단순한 사실상 관심이 아니라 직접적이고 현실적인 법률상 이해관계가 필요하다."},{"id":373,"text":"특허처분은 하나의 특허출원에 대하여 하나의 특허권을 부여하는 단일한 행정행위이므로, 설령 그러 한 특허처분에 의하여 수인을 공유자로 하는 특허등록이 이루어졌다고 하더라도, 그 특허처분 자체에 대 한 무효를 청구하는 제도인 특허무효심판에서 그 공유자 지분에 따라 특허를 분할하여 일부 지분만의 무 효심판을 청구하는 것은 허용할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"하나의 특허처분에 대한 무효 여부를 지분별로 분할하여 판단할 수 없다. 동일한 특허발명에 대하여 정정심판 사건이 특허심판원에 계속 중에 있다는 이유로 상고심에 계속 중 인 그 특허발명에 관한 특허무효심결에 대한 취소소송의 심리를 중단하여야 하는 것은 아니다."},{"id":374,"text":"특허발명과 대비되는 확인대상 발명이 특허발명의 권리범위에 속한다고 하기 위해서는 특허발명의 청구범위에 기재된 각 구성요소와 그 구 성요소 간의 유기적 결합관계가 확인대상 발명에 그대로 포함되 어 있을 필요는 없고 구성요소 중 일부만 포함되어 있어도 된다.","chapter":"특허심판·소송","answer":"X","explanation":"원칙적으로 특허발명의 각 구성요소와 그 유기적 결합관계가 확인대상 발명에 포함되어야 한다."},{"id":375,"text":"특허발명의 보호범위는 청구범위에 적혀 있는 사항에 의하여 정하여지고, 발명의 설명이나 도면 등에 의하여 그 보호범위를 제한하는 것은 원 칙적으로 허용되지만, 확장하는 것은 허용되지 않는다.","chapter":"특허심판·소송","answer":"X","explanation":"청구범위를 해석할 때 명세서와 도면을 참작할 수 있지만, 청구범위가 명확한 경우 이를 명세서로 임의로 제한하여 해석할 수 있는 것은 아니 다."},{"id":376,"text":"특허법 제30 조(공지 등이 되지 아니한 발명으로 보는 경우)제1 항에서 정한 공지예외 규정을 적용받 아 특허를 받은 특허발명의 경우 확인대 상발명이 그 특허권의 권리범위에 속하는지를 판단할 때에는 자 유실시기술 주장, 즉 발명이 속하는 기술분야에서 통상의 지식을 가진 사람이 공지예외 규정의 적용 근 거가 된 공지기술로부터 확인대상 발명을 쉽게 실시할 수 있어 확인대상 발명이 특허권의 권리범위에 속 하지 않는 다는 주장은 허용된다고 보아야 한다.","chapter":"특허심판·소송","answer":"X","explanation":"공지예외의 적용 근거가 된 공지기술을 다시 자유실시기술의 근거로 삼는 것은 공지예외제도의 취 지와 맞지 않는다."},{"id":377,"text":"확인대상 발명의 설명서와 도면에는 특허발명의 구성요소에 대응하는 확인대상 발명의 구성요소를 명확하게 기재하여야 하며, 확인대상 발 명의 특정을 위하여 대상물의 구체적인 구성을 전부 기재해야 한 다.","chapter":"특허심판·소송","answer":"X","explanation":"확인대상 발명의 특정에 필요한 정도로 기재하면 되고, 대상물의 구성을 반드시 전부 기재해야 하 는 것은 아니다."},{"id":378,"text":"소극적 권리범위 확인심판에서는 심판청구인이 현실적으로 실시하는 기술이 심판청구에서 심판의 대 상으로 삼은 구체적인 확인대상 발명과 다르다고 하더라도 심판청구인이 특정한 확인대상 발명이 실시 가능성이 없을 경우 그 청구의 적법 여부가 문제될 수 있을 뿐이다.","chapter":"특허심판·소송","answer":"O","explanation":"소극적 권리범위 확인심판의 적법 여부는 현실 실시기술과 확인대상 발명의 관계를 일률적으로 동 일시하지 않는다."},{"id":379,"text":"정부가 전시, 사변 또는 이에 준하는 비상시에 국방상 필요에 의하여 특허권을 수용한 경우, 그 보상금 에 관한 소송에서 해당 특허권에 대한 통상실시권자는 피고가 될 수 없다.","chapter":"특허심판·소송","answer":"X","explanation":"보상금 관련 소송의 피고적격은 특허법의 수용·보상에 관한 규정에 따라 판단하며 통상실시권자를 지문처럼 일률적으로 배제할 수 없다."},{"id":380,"text":"특허침해소송에서 피고가 제조하는 제품(침해대상제품)이 어떤 구성요소를 가지고 있는지와는 달리, 심결취소소송에서 특허발명의 진보성 판단에 제공되는 선행발명이 어떤 구성요소를 가지고 있는지는 주 요사실로서 자백의 대상이 되지 않는다.","chapter":"특허심판·소송","answer":"X","explanation":"선행발명이 어떤 구성을 개시하고 있는지는 주요사실에 해당할 수 있으며 자백의 대상이 될 수 있 다."},{"id":381,"text":"법원은 특허법 제136 조(정정심판)에 따른 심결에 대한 소에 관하여 소송절차가 완결되었을 때에는 지체 없이 그 사건에 대한 각 심급(審級) 의 재판서 정본을 특허심판원장에게 보내야 한다.","chapter":"특허심판·소송","answer":"X","explanation":"특허법상 재판서 송부의 대상이 되는 소송을 정확히 구별해야 한다. 지문은 해당 조항과 소송의 대 상을 잘못 연결하고 있다."},{"id":382,"text":"동일한 특허권에 관하여 甲과 乙이 공동으로 특허무효심판을 청구하여 승소한 경우, 특허권자 丙이 甲을 상대로 제기한 심결취소소송에서 제소기간이 도과한 이후 丙은 소송 중 乙을 당사자로 추가할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"심결취소소송의 제소기간은 불변기간이므로 제소기간이 지난 뒤 새로운 당사자를 추가하여 소를 유지할 수 없다."},{"id":383,"text":"특허법 제138 조(통상실시권 허락의 심판)에 따른 심결을 받은 자가 통상실시권 허락에 관한 대가에 불복하는 경우, 그 심결 등본을 송달받은 날부터 30일 이내에 소송을 제기하여야 하고 이 불변기간에 대 하여 심판장은 교통이 불편한 지역에 있는 자를 위하여 직권으로 부가기간을 정할 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"통상실시권 허락의 심판에 대한 대가불복 소송의 제소기간 및 부가기간에 관한 지문의 법적 요건 이 잘못되었다."},{"id":384,"text":"정정심판이나 그 심결취소소송에서 정정의견제출 통지서를 통하여 심판청구인에게 의견서 제출 기회 를 부여한 바 없는 사유를 들어 정정심 판청구를 기각하는 심결을 하거나 심결취소청구를 기각하는 것은 위법하지 않다.","chapter":"특허심판·소송","answer":"X","explanation":"당사자에게 의견제출 기회를 부여하지 않은 새로운 사유로 불리한 판단을 하는 것은 적법절차에 반할 수 있다."},{"id":385,"text":"특허법 제186 조(심결 등에 대한 소)에 따른 특허취소결정 또는 심결에 대한 소는 특허법원의 전속관 할로 하며, 심결 또는 결정의 등본을 송 달받은 날부터 30일 이내에 제기하여야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"심결취소소송은 특허법원의 전속관할이며 제소기간은 송달일부터 30일이다. 특허취소를 신청할 수 있는 사항 또는 심판을 청구할 수 있 는 사항에 관한 소는 특허취소결정이나 심 결에 대한 것이 아니면 제기할 수 없다."},{"id":386,"text":"거절결정불복심판청구 기각 심결의 취소소송절차에서 지식재산처장(舊특허청장)은 거절결정의 이유 외에도 심사나 심판 단계에서 의견서 제출의 기회를 부여한 사유 및 이와 주요한 취지가 부합하는 사유 를 해당 심결의 결론을 정당하게 하는 사유로 주장할 수 있고, 심결취소소송 의 법원은 이를 심리ㆍ판단 하여 심결의 당부를 판단하는 근거로 삼을 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"심사·심판 단계에서 의견제출의 기회가 부여된 범위에서라면 심결취소소송에서 그 심결을 정당화 하는 사유를 주장할 수 있다."},{"id":387,"text":"심결취소소송에서 특허출원 심사 또는 심판 단계에서 통지한 거절이유에 기재된 주선행발명을 다른 선행발명으로 변경하는 경우에는, 일반 적으로 출원발명과의 공통점 및 차이점의 인정과 그러한 차이점 을 극복하여 출원발명을 쉽게 발명할 수 있는지에 대한 판단 내용이 달라지므 로, 출원인에게 이에 대해 실질적으로 의견제출의 기회가 주어졌다고 볼 수 있는 등의 특별한 사정이 없는 한 이미 통지된 거절이 유와 주요한 취지가 부합하지 아니하는 새로운 거절이유에 해당한다.","chapter":"특허심판·소송","answer":"O","explanation":"주선행발명을 변경하여 실질적으로 새로운 판단구조가 형성되는 경우에는 새로운 거절이유가 될 수 있다."},{"id":388,"text":"특허권자 甲과 그로부터 특허권 침해의 고소를 당한 乙 사이에 ‘乙이 그 특허권을 인정하고 그 권리에 위반되는 행위를 하지 않는다.’는 내용 의 약정을 하였다면, 그 약정으로 인하여 乙이 무효심판을 청구할 이익이 상실되었다고 보아야 한다.","chapter":"특허심판·소송","answer":"X","explanation":"당사자 사이의 약정만으로 특허무효심판을 청구할 법률상 이해관계가 당연히 소멸하는 것은 아니 다."},{"id":389,"text":"확인대상발명이 특허발명인 경우에 적극적 권리범위확인심판을 허용한다면 특허권의 무효를 인정하 는 것과 다름이 없게 되므로 확인대상발 명이 특허발명의 이용발명인 경우에는 이와 같은 권리범위확인 심판은 허용되지 않는다.","chapter":"특허심판·소송","answer":"O","explanation":"권리 대 권리의 적극적 권리범위확인심판은 후발 특허권의 효력을 사실상 부인하는 결과가 될 수 있으므로 허용되지 않는 것이 원칙이다."},{"id":390,"text":"정정심판에서 잘못 기재된 사항을 정정하는 경우, 특허발명의 명세서 또는 도면의 범위 내에서 하여 야 한다.","chapter":"특허심판·소송","answer":"X","explanation":"잘못 기재된 사항의 정정은 허용되는 정정사유 및 정정의 범위를 충족해야 하며, 단순히 ‘명세서 또 는 도면의 범위 내’라는 표현만으로 정정 이 허용되는 것은 아니다."},{"id":391,"text":"일사부재리 원칙을 적용할 때는 종전에 확정된 심결에서 판단이 이루어진 청구원인과 공통되는 부분 에 대해서 확정된 심결을 번복할 수 있을 정도로 유력한 증거가 새로이 제출되었는지를 따져 종전 심결 에서와 다른 결론을 내릴 것인지를 판단하여야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"동일한 청구원인에 관한 부분이라도 종전 심결을 뒤집을 정도의 유력한 새로운 증거가 있다면 일 사부재리의 적용관계를 달리 판단할 수 있 다."},{"id":392,"text":"거절결정에 대한 특허심판원의 심판절차에서 의견제출의 기회를 부여한 바 없는 새로운 거절이유를 들어서 거절결정이 결과에 있어 정당하 다는 이유로 거절결정불복심판 청구를 기각한 심결은 타당하다.","chapter":"특허심판·소송","answer":"X","explanation":"심판절차에서 의견제출의 기회를 부여하지 않은 새로운 거절이유를 들어 심판청구를 기각하는 것 은 허용되지 않는다."},{"id":393,"text":"대리권의 흠을 이유로 재심을 청구하는 경우 그 기간은 청구인 또는 법정대리인이 특허취소결정등본 또는 심결등본의 송달에 의하여 특허취 소결정 또는 심결이 있는 것을 안 날의 다음 날부터 기산한다.","chapter":"특허심판·소송","answer":"O","explanation":"대리권 흠을 이유로 하는 재심청구기간에는 특허법상 특별한 기산점 규정이 적용된다."},{"id":394,"text":"심판의 당사자가 공모하여 제3 자의 권리나 이익을 사해할 목적으로 심결을 하게 하였을 때 제3 자는 그 확정된 심결에 대하여 재심을 청구할 수 있으며, 이 경우 심판의 당사자를 공동피청구인으로 한다.","chapter":"특허심판·소송","answer":"O","explanation":"당사자의 통모로 제3 자의 권리나 이익을 해하는 심결이 이루어진 경우 제3 자의 재심청구가 인정 된다."},{"id":395,"text":"특허취소결정 또는 심결의 증거가 된 문서나 그 밖의 물건이 위조 또는 변조된 것인 경우에는, 처벌받 을 행위에 대하여 유죄의 판결이나 과태 료부과의 재판이 확정된 때 또는 증거부족 외의 이유로 유죄의 확정판결이나 과태료부과의 확정재판을 할 수 없을 때에만 재심의 소를 제기할 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"위조·변조 증거에 관한 재심사유는 형사판결 등의 확정 여부 및 그 형사재판을 받을 수 없는 사유 에 관한 특허법상 요건을 정확히 구별해야 한 다. 지문의 요건처럼 일률적으로 제한되는 것은 아니다."},{"id":396,"text":"특허법 제138 조(통상실시권 허락의 심판)제1 항 또는 제3 항에 따라 통상실시권을 허락한다는 심결이 확정된 후 재심에서 그 심결과 상반 되는 심결이 확정된 경우에는 재심청구 등록 전에 선의로 국내에서 그 발명의 실시사업을 하고 있는 자 또는 그 사업을 준비하고 있는 자는 원 (原)통상실시권의 사업목적 및 발명의 범위에서 그 특허권 또는 재심의 심결이 확정된 당시에 존재하는 전용실시권에 대하여 통상실시 권을 가진다.","chapter":"특허심판·소송","answer":"O","explanation":"재심으로 기존 통상실시권을 상실하게 되는 자에 대한 거래안전 보호를 위해 법정통상실시권이 인 정된다."},{"id":397,"text":"재심사유가 특허취소결정 후에 생겼을 경우 특허법 제180 조(재심청구의 기간)제3 항의 기간은 그 사 유가 발생한 날부터 기산한다.","chapter":"특허심판·소송","answer":"O","explanation":"재심사유가 특허취소결정 또는 심결의 확정 후에 발생한 경우에는 그 재심사유가 발생한 때를 기 준으로 기간을 계산한다."},{"id":398,"text":"甲이 특허법원에 심결취소소송을 제기한 경우, 특허법원에 소를 제기하여야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"심결취소소송은 특허법원의 전속관할에 속한다. 甲은 기각심결에 불복하고자 하는 경우, 기각심결의 등본을 송달받은 날부터 30일 이내 에 심결취소소 송을 제기하여야 한다."},{"id":399,"text":"甲이 심결취소소송을 제기하는 경우 제소기간 계산에는 「민법」이 적용되므로, 특허법원에 2024. 5. 1.(수요일)까지 소를 제기하여야 한 다.","chapter":"특허심판·소송","answer":"X","explanation":"특허심판 관련 제소기간에는 특허법의 기간계산에 관한 특칙이 적용된다. 단순히 민법의 기간계산 규정이 적용된다고 할 수 없다."},{"id":400,"text":"甲의 주소 또는 거소가 멀리 떨어진 곳에 있거나 교통이 불편한 지역에 있는 자에 해당한다면 심판장 은 제소기간에 대해 부가기간을 정할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"불변기간이라도 법이 정하는 경우 심판장은 원격지 등의 당사자에게 부가기간을 정할 수 있다."},{"id":401,"text":"甲이 2024. 5. 1.(수요일)에 부가기간지정신청을 하였고 그 신청이 받아들여져 2024. 5. 2.(목요일) 에 20일의 부가기간이 지정된 경우, 甲 이 2024. 5. 21.(화요일)에 특허법원에 심결취소소송을 제기한 것은 적법하다.","chapter":"특허심판·소송","answer":"O","explanation":"부가기간은 원래의 제소기간에 추가되는 기간이므로 5 월 21일 제소는 적법한 기간 내에 이루어진 다."},{"id":402,"text":"누구든지 특허권의 설정등록일부터 등록공고일 후 1년이 되는 날까지 동일한 발명에 대하여 다른 날 에 둘 이상의 특허출원이 있었던 경우 나 중에 특허출원한 자의 발명에 대하여 특허를 부여한 경우 특허 심판원장에게 특허취소신청을 할 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"특허취소신청의 기간을 등록공고 후 1년으로 정한 부분이 틀리다. 특허권에 관하여 이해관계를 가진 자는 특허취소신청에 대한 결정이 있을 때까지 특허권자를 보조하 기 위하여 그 심리에 참가할 수 없다."},{"id":403,"text":"특허취소결정이 확정된 때에는 그 특허권은 확정된 날로부터 효력을 상실한다.","chapter":"특허심판·소송","answer":"X","explanation":"특허취소결정이 확정되면 특허권은 소급하여 효력을 상실하는 것이 원칙이다."},{"id":404,"text":"심판관은 특허취소신청에 관하여 특허취소신청인, 특허권자 또는 참가인이 제출하지 아니한 이유에 대해서도 심리할 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"특허취소신청에서는 당사자가 제출하지 않은 이유에 대하여 심리할 수 있는지에 제한이 있다."},{"id":405,"text":"공유인 특허권의 특허권자 중 1 인에게 특허취소신청절차의 중단 또는 중지의 원인이 있으면 그 1 인에 게만 그 효력이 발생한다.","chapter":"특허심판·소송","answer":"O","explanation":"공유 특허권자의 절차상 중단·중지 원인은 그 해당 공유자에게 발생한다."},{"id":406,"text":"특허법에 따른 심판의 심결이 확정되었을 때에는 그 사건에 대해서는 누구든지 동일사실 및 동일증거 에 의하여 다시 심판을 청구할 수 없다. 다만, 확정된 심결이 각하심결인 경우에는 그러하지 아니하다.","chapter":"특허심판·소송","answer":"O","explanation":"확정된 심결에 대해서는 동일사실·동일증거에 의한 반복 심판청구를 제한하는 일사부재리 원칙이 적용된다."},{"id":407,"text":"심판청구는 심결이 확정될 때까지 취하할 수 있고, 상대방의 답변서가 제출된 후에도 상대방의 동의 없이 취하할 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"상대방이 답변서를 제출한 후에는 원칙적으로 상대방의 동의가 필요하다."},{"id":408,"text":"거절결정불복심판청구 기각 심결의 취소소송절차에서도 특허청장은 심사 또는 심판 단계에서 의견제 출의 기회를 부여한 바 없는 새로운 거 절이유를 주장할 수 없다고 보아야 한다. 다만 거절결정불복심판 청구 기각 심결의 취소소송절차에서 특허청장이 비로소 주장하는 사유라고 하더라도 심사 또는 심판 단 계에서 의견제출의 기회를 부여한 거절이유와 주요한 취지가 부합하여 이미 통지된 거절이유를 보충하 는 데 지 나지 아니하는 것이면 이를 심결의 당부를 판단하는 근거로 할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"새로운 거절이유를 임의로 추가할 수는 없지만 이미 통지된 거절이유와 주요한 취지가 부합하는 보충적 사유는 주장할 수 있다."},{"id":409,"text":"특허출원에 대한 심사 단계에서 거절결정을 하려면 그에 앞서 출원인에게 거절이유를 통지하여 의견 제출의 기회를 주어야 하고, 거절결정에 대한 특허심판원의 심판절차에서 그와 다른 사유로 거절결정이 정당하다고 하려면 먼저 그 사유에 대해 의견제출의 기회를 주어야만 이를 심 결의 이유로 할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"새로운 거절사유를 심결의 이유로 삼기 위해서는 적절한 의견제출 기회가 보장되어야 한다."},{"id":410,"text":"특허발명의 도면에 대한 정정을 한다는 심결이 있는 경우 특허심판원장은 그 내용을 특허청장에게 알 려야 하며 특허청장은 정정심결 통보가 있으면 이를 특허공보에 게재하여야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"정정심결의 확정에 따른 공시를 위해 특허공보에 게재한다."},{"id":411,"text":"심판에 관여한 심판관이 그 사건에 관하여 직무에 관한 죄를 범한 경우에는 처벌받을 행위에 대하여 유죄의 판결이나 과태료부과의 재판이 확 정된 때 또는 증거부족 외의 이유로 유죄의 확정판결이나 과태 료부과의 확정재판을 할 수 없을 때에만 재심의 소를 제기할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"심판관의 직무상 범죄는 법에서 정한 재심사유와 확정판결 등의 요건을 충족해야 한다. 당사자는 확정된 특허취소결정 또는 확정된 심결 에 대하여 재심을 청구할 수 있다."},{"id":412,"text":"재심사유가 특허취소결정 후에 생겼을 경우 특허취소결정 후 3년의 기간은 그 사유가 발생한 날로부 터 기산한다.","chapter":"특허심판·소송","answer":"O","explanation":"재심사유가 결정 후 발생한 경우 법정 재심기간은 그 사유 발생일을 기준으로 계산한다."},{"id":413,"text":"특허취소결정에 대한 재심의 절차에 관하여는 그 성질에 반하지 아니하는 범위에서 특허취소신청에 관한 규정을 준용한다.","chapter":"특허심판·소송","answer":"O","explanation":"특허취소결정에 대한 재심절차에는 성질에 반하지 않는 범위에서 특허취소신청 규정이 준용된다."},{"id":414,"text":"대리권의 흠을 이유로 재심을 청구하는 경우에 재심청구 기간은 청구인 또는 법정대리인이 특허취소 결정등본 또는 심결등본의 송달에 의하 여 특허취소결정 또는 심결이 있는 것을 안 날의 다음 날부터 기 산한다.","chapter":"특허심판·소송","answer":"O","explanation":"대리권 흠에 따른 재심기간은 법이 정한 인식시점을 기준으로 계산한다."},{"id":415,"text":"특허취소결정 또는 심결에 대한 소 및 특허취소신청서ㆍ심판청구서ㆍ재심청구서의 각하결정에 대한 소는 특허법원의 전속관할로 한다.","chapter":"특허심판·소송","answer":"O","explanation":"해당 소송은 특허법원의 전속관할에 속한다. 법원은 소송절차에서 필요하면 직권 또는 당사자의 신청에 따라 특허취소신청에 대한 결정 이나 특허 에 관한 심결이 확정될 때까지 그 소송절차를 중지할 수 있다."},{"id":416,"text":"법원은 특허권침해소송에서 당사자의 신청에 의하여 상대방 당사자에게 해당 침해의 증명 또는 침해 로 인한 손해액의 산정에 필요한 자료의 제출을 명할 수 있다. 다만, 그 자료의 소지자가 그 자료의 제출 을 거절할 정당한 이유가 있으면 그러하지 아니하다.","chapter":"특허심판·소송","answer":"O","explanation":"특허침해소송에는 침해 및 손해액 입증을 위한 자료제출명령 제도가 있다."},{"id":417,"text":"법원은 특허취소결정 또는 심결에 대한 소 및 각하결정에 대한 소가 제기된 경우에 그 청구가 이유 있 다고 인정할 때에는 판결로써 해당 심결 또는 결정을 취소하여야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"심결취소소송에서 청구가 이유 있으면 법원은 해당 심결 또는 결정을 취소한다."},{"id":418,"text":"특허출원된 발명이 국방상 필요하여 정부가 특허하지 아니하고 보상금 지급을 결정하여 이 결정을 받 은 자가 보상금에 불복할 때에는 법원에 소를 제기할 수 있고 소는 결정의 등본을 송달받은 날로부터 2개월 이내에 제기하여야 한다.","chapter":"특허심판·소송","answer":"X","explanation":"지문은 법정 제소기간을 잘못 기재하였다."},{"id":419,"text":"국내외에서 정당한 사유 없이 비밀유지명령을 위반한 자는 5년 이하의 징역 또는 5 천만원 이하의 벌 금에 처하며, 이때 비밀유지명령을 신청 한 자의 고소가 없어도 공소를 제기할 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"비밀유지명령 위반죄의 공소제기 요건을 지문처럼 단순하게 규정할 수 없다. 특허심판원으로부터 증인으로 소환된 자로서 정당한 이유 없이 소환에 따르지 아니하거나 선서를 거 부한 자에게는 50 만원 이하의 과태료를 부과한다."},{"id":420,"text":"거짓이나 그 밖의 부정한 행위로 특허권의 존속기간의 연장등록을 받은 자는 3년 이하의 징역 또는 3 천만원 이하의 벌금에 처한다.","chapter":"특허심판·소송","answer":"O","explanation":"존속기간 연장등록을 부정하게 받은 행위에는 형사처벌 규정이 있다."},{"id":421,"text":"특허청 소속 직원이거나 직원이었던 사람이 특허출원 중인 발명에 관하여 직무상 알게 된 비밀을 누 설하거나 도용한 경우에는 5년 이하의 징 역 또는 5 천만원 이하의 벌금에 처한다.","chapter":"특허심판·소송","answer":"O","explanation":"특허청 직원 등의 직무상 비밀 누설·도용은 별도의 처벌대상이다."},{"id":422,"text":"특허법에 따라 선서한 증인, 감정인 또는 통역인이 특허심판원에 대하여 거짓으로 진술ㆍ감정 또는 통역을 한 경우에는 5년 이하의 징역 또는 5 천만원 이하의 벌금에 처한다.","chapter":"특허심판·소송","answer":"O","explanation":"특허심판 절차에서의 위증·허위감정·허위통역은 형사처벌 대상이다."},{"id":423,"text":"특허를 무효로 한 심결에 대한 심결취소소송에서 원고의 청구가 기각되어 상고심에 계속 중, 제3 자가 제기한 특허무효심판에서 특허를 무효 로 하는 심결이 확정된 때에는 그 특허권은 처음부터 없었던 것으 로 보게 되므로, 특허가 무효로 확정된 이상 심결의 취소를 구할 법률상 이익 도 없어졌다.","chapter":"특허심판·소송","answer":"O","explanation":"특허가 최종적으로 소급하여 무효가 된 경우 해당 심결의 취소를 구할 법률상 이익이 소멸할 수 있 다. 거절결정에 대한 심결취소소송에서 특허청이 보정각하결정에서와 다른 이유를 들어 보정의 부적법 을 주장하더라도 출원인으로서는 이에 대응하여 소송절차에서 보정의 적법 여부에 관하여 다툴 수 있으 므로 출원인의 방어권 또는 절차적 이익이 침해된다고 할 수 없다."},{"id":424,"text":"주지관용의 기술이 소송상 공지 또는 현저한 사실이라고 볼 수 있을 만큼 일반적으로 알려져 있지 아 니한 경우에도 그 주지관용의 기술은 심 결취소소송에 있어서 증명을 필요로 하지 아니하므로, 법원은 자 유로운 심증에 의하여 증거 등 기록에 나타난 자료를 주지관용의 기술로서 인정할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"일반적으로 알려져 있지 않아 현저한 사실로 볼 수 없는 기술은 주지관용기술이라는 이유만으로 증명 없이 인정할 수 없다."},{"id":425,"text":"행정소송의 일종인 심결취소소송에 직권주의가 가미되어 있다고 하더라도 여전히 변론주의를 기본 구조로 하는 이상, 심결의 위법을 들어 그 취소를 청구할 때에는 직권조사사항을 제외하고는 그 취소를 구하는 자가 위법사유에 해당하는 구체적 사실을 먼저 주장하여야 하고, 법원이 당사자가 주장하지도 않 은 법률요건에 관하여 판단하는 것은 변론주의 원칙에 위배된다.","chapter":"특허심판·소송","answer":"O","explanation":"심결취소소송에서도 변론주의가 기본적으로 적용된다."},{"id":426,"text":"심결취소소송은 항고소송에 해당하여 그 소송물은 심결의 실체적, 절차적 위법성 여부라 할 것이므로 당사자는 심결에서 판단되지 않은 처분 의 위법사유도 심결취소소송 단계에서 주장ㆍ입증할 수 있고 심 결취소소송의 법원은 특별한 사정이 없는 한 제한없이 이를 심리ㆍ판단하여 판결의 기초로 삼을 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"심결취소소송에서 새로운 위법사유를 무제한으로 주장·판단할 수 있는 것은 아니다."},{"id":427,"text":"판결에 당사자가 주장한 사항에 대한 구체적ㆍ직접적인 판단이 표시되어 있지 않더라도 판결이유의 전반적인 취지에 비추어 그 주장을 인용 하거나 배척하였음을 알 수 있는 정도라면 설령 실제로 판단을 하지 아니하였다고 하더라도 그 주장이 배척될 경우임이 분명한 때로서 판단누 락의 위법이 있다.","chapter":"특허심판·소송","answer":"X","explanation":"판결이유 전체를 통해 판단의 취지를 알 수 있다면 반드시 판단누락의 위법이 발생하는 것은 아니 다."},{"id":428,"text":"특허출원인으로부터 특허를 받을 수 있는 권리를 양수한 특정승계인은 특허출원인변경신고를 하지 않은 상태에서는 그 양수의 효력이 발생 하지 않아서 특허심판원의 거절결정불복심판심결에 대하여 취소 의 소를 제기할 수 있는 당사자 등에 해당하지 아니하므로 그가 제기한 취소 의 소는 부적법하다.","chapter":"특허심판·소송","answer":"X","explanation":"특허를 받을 수 있는 권리의 승계 효력과 심결취소소송의 당사자적격을 이와 같이 동일하게 볼 수 없다."},{"id":429,"text":"고유필수적 공동소송이 아닌 사건에서 소송 도중에 당사자를 추가하는 것은 허용될 수 없으나, 동일 한 특허권에 관하여 2 명 이상의 자가 공 동으로 특허의 무효심판을 청구하여 승소한 경우 그 특허권자가 제기할 심결취소소송은 심판청구인 모두를 상대로 제기하여야만 하는 고유 필수적 공동소송이라고 할 수 있으므로 해당 소송에서 당사자의 변경을 가져오는 당사자 추가신청은 예외적으로 허용될 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"공동으로 무효심판을 청구한 경우 심결취소소송의 당사자 관계에서 고유필수적 공동소송 관계가 인정될 수 있다."},{"id":430,"text":"특허침해소송이 계속 중이어서 그 소송에서 특허권의 효력이 미치는 범위를 확정할 수 있으므로 침해 소송과 별개로 청구된 권리범위확인심 판의 심판청구의 이익은 부정된다.","chapter":"특허심판·소송","answer":"X","explanation":"침해소송이 계속 중이라는 사정만으로 권리범위확인심판의 심판청구의 이익이 당연히 부정되는 것은 아니다."},{"id":431,"text":"특허청이 출원발명에 대한 최초의 거절이유통지부터 출원거절의 심결을 내릴 때까지 출원발명의 진 보성을 문제삼았을 뿐이고 출원인에게 출원발명의 신규성이 없다는 이유로 의견서제출통지를 하여 그 로 하여금 명세서를 보정할 기회를 부여하지 않았더라도 법원이 출원발명의 요지가 신규성이 없다는 이 유로 심결을 유지할 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"출원인에게 신규성에 관한 의견제출 기회를 부여하지 않았다면 그 사유를 심결취소소송에서 바로 판단 근거로 삼을 수 없다."},{"id":432,"text":"乙은 판매하는 제품 X 가 丙의 특허권 P 의 제1 항 및 제2 항의 권리 범위에 속하지 않는다는 청구 취지 로 특허법 제135 조의 권리범위 확인 심판을 청구할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"침해소송의 상대방은 자신의 실시기술이 특허권의 권리범위에 속하지 않는다는 취지의 소극적 권 리범위확인심판을 청구할 수 있다."},{"id":433,"text":"丙은 甲에 의해서 특허무효심판(증거 E 를 제출하며 청구항 제1 항 및 제2 항의 진보성 흠결을 청구 이 유로 기재)이 청구된 후 지정 기간 내 에 특허권 P 의 청구항 제3 항에 대해서 정정을 청구할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"무효심판 계속 중에도 법이 정한 기간과 요건을 충족하면 정정청구를 할 수 있다."},{"id":434,"text":"甲과 乙은 특허권 P 의 청구항 제1 항 및 제2 항에 대해서 특허법 제29 조 위반을 주장하고 청구항 제3 항에 대해서 특허법 제42 조 제4 항 위반을 주장하는 심판청구서를 공동으로 특허심판원에 제출할 수 있 다.","chapter":"특허심판·소송","answer":"O","explanation":"공동으로 특허무효심판을 청구하는 것이 가능하다."},{"id":435,"text":"乙이 丙을 상대로 특허권 P 에 대한 특허무효심판(청구항 제3 항에 대해서 특허법 제42 조 제4 항 위반 을 청구 이유로 기재)을 청구하여 특 허심판원에 계속 중인 경우, 丙은 특허권 P 에 대한 정정심판을 청구 하여 두 심판에 대한 심리의 병합을 신청할 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"무효심판이 계속 중인 경우에는 정정심판과의 관계에서 특허법상 정해진 절차를 따라야 하며, 지 문과 같이 정정심판을 청구하여 병합을 신청 할 수 있는 것은 아니다."},{"id":436,"text":"甲에 의해서 청구된 특허무효심판에서 丙이 답변서를 제출하였음에도 인용심결이 나온 경우 甲은 반 드시 丙의 동의를 받아야만 특허무효심 판의 취하를 할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"상대방의 답변서가 제출된 후에는 상대방의 동의가 있어야 심판청구를 취하할 수 있다. ※ 이 문제는 최종적으로 ‘정답 없음’으로 판단된 문제 이다. 따라서 아래 지문별 O/X 는 원 출제법리와 행 정심판의 최종 판단을 함께 고려하여 표시한다."},{"id":437,"text":"ㄱ. 甲은 2026. 1. 27.이 경과하면 재심을 청구할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"재심청구에는 심결 또는 특허취소결정 확정 후 3년의 제한이 있다. 다만 이 문제는 기간 계산 및 전 제사실의 관계가 불명확하여 최종적으로 정답 없음으로 판단되었다."},{"id":438,"text":"ㄴ. 甲은 2023. 3. 8.까지 재심을 청구할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"재심사유를 안 날인 2023. 2. 6.부터 30일 이내인 2023. 3. 8.까지 재심을 청구할 수 있다."},{"id":439,"text":"ㄷ. 재심사유가 2023. 2. 2.에 생겼다면, 甲은 2026. 2. 2.까지 재심을 청구할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"재심사유가 심결 확정 후 발생한 경우 3년의 기간은 그 사유가 발생한 날의 다음 날부터 기산한다."},{"id":440,"text":"ㄹ. 대리권의 흠을 이유로 재심을 청구하는 경우에 甲은 2023. 3. 15.까지 재심을 청구할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"대리권 흠을 이유로 하는 경우에는 심결등본의 송달에 의해 심결이 있음을 안 날의 다음 날부터 30일을 기산한다."},{"id":441,"text":"ㄱ. 특허취소결정, 결정계 심판의 심결 또는 그 재심의 심결 및 심판청구서ㆍ재심청구서 각하결정에 대한 소를 제기하는 경우에는 특허청장 을 피고로 하여야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"결정계 사건 등에 관한 심결취소소송에서는 특허청장이 피고가 된다."},{"id":442,"text":"ㄴ. 공동으로 특허무효심판을 청구하여 승소한 경우, 특허권자가 공동심판청구인 중 일부만을 상대로 제기한 심결취소소송에서 당사자변경 을 가져오는 당사자 추가신청은 허용된다.","chapter":"특허심판·소송","answer":"X","explanation":"공동 무효심판 청구인 전원을 상대로 한 소송이 고유필수적 공동소송인 것은 아니므로 당사자 추 가신청은 허용되지 않는다."},{"id":443,"text":"ㄷ. 특허취소신청 기각결정에 대하여는 불복할 수 없으며, 인용결정에 대한 불복소송에서 특허권자는 원고가 된다.","chapter":"특허심판·소송","answer":"O","explanation":"특허취소신청 기각결정에는 불복할 수 없으며, 인용결정에 대한 소송에서는 특허권자가 원고적격 을 가진다."},{"id":444,"text":"ㄹ. 심결취소소송에서 특허취소결정ㆍ심판ㆍ재심사건의 당사자, 참가인 그 외 심결에 의하여 자기의 법률상 이익이 침해되는 자는 원고적격 이 인정된다.","chapter":"특허심판·소송","answer":"X","explanation":"원고적격이 인정되는 자의 범위는 법에서 제한적으로 정하고 있으므로 지문처럼 포괄적으로 인정 되지 않는다."},{"id":445,"text":"심결 또는 결정의 취소판결이 확정된 경우에는 심판관은 심판청구인의 새로운 신청을 기다리지 않고 취소판결의 취지에 따라 다시 심리하여 야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"심결 또는 결정의 취소판결이 확정되면 심판관은 판결의 취지에 따라 다시 심리하여야 한다. 당사자계 심판에 대한 심결취소소송의 경우 당사자는 심결에서 판단되지 않은 위법사유도 심결취소 소송단계에서 주장ㆍ입증할 수 있다."},{"id":446,"text":"심결취소소송에서 특허발명의 진보성 판단에 제공되는 선행발명이 어떤 구성요소를 가지고 있는지 여부는 주요 사실로서 당사자 자백의 대 상이 된다.","chapter":"특허심판·소송","answer":"O","explanation":"선행발명의 구성요소에 관한 사실은 주요사실로서 자백의 대상이 된다."},{"id":447,"text":"등록무효심판 심결에 대한 특허소송의 경우 주지관용기술 여부는 법원이 자유로운 심증에 의하여 증 거 등을 통하여 인정할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"주지관용기술이 현저한 사실이 아닌 경우에도 증거 등에 의해 법원이 자유심증으로 인정할 수 있 다."},{"id":448,"text":"거절결정불복심판 심결에 대한 특허소송에서 발명의 성립, 신규성 결여 등에 대해서는 출원인이 이를 주장ㆍ증명하여야 한다.","chapter":"특허심판·소송","answer":"X","explanation":"신규성·진보성 부정에 관한 공지사실은 이를 주장하는 쪽에서 증명하는 것이 원칙이다."},{"id":449,"text":"확인대상발명의 일부 구성이 불명확하여 다른 것과 구별될 수 있는 정도로 구체적으로 특정되어 있지 않다면 심판의 심결이 확정되더라도 일 사부재리의 효력이 미치는 범위가 명확하다고 할 수 없으므로 나 머지 구성만으로 확인대상발명이 특허발명의 권리범위에 속하는지 여부를 판단할 수 있는 경우라 하더 라도 심판청구를 각하하여야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"확인대상발명이 구체적으로 특정되지 않으면 심판대상의 동일성이 확보되지 않으므로 심판청구가 부적법해질 수 있다."},{"id":450,"text":"종전에 확정된 심결에서의 무효사유 외에 다른 무효사유가 추가된 심판청구의 경우 일사부재리 원칙 에 위배되지 아니하지만, 종전에 확정된 심결에서 판단이 이루어진 청구원인과 공통되는 부분에 대해서 는 일사부재리 원칙 위배 여부의 관점에서 종전에 확정된 심결을 번복할 수 있 을 정도로 유력한 증거가 새로이 제출되었는지를 따져 종전 심결에서와 다른 결론을 내릴 것인지를 판단하여야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"새로운 무효사유와 종전 심결에서 판단된 사유를 구분하여 일사부재리 여부를 판단한다."},{"id":451,"text":"적극적 권리범위확인심판의 심결이 확정된 때에는 그 일사부재리의 효력은 동일사실 및 동일증거에 의한 소극적 권리범위확인심판 청구에 대해서도 그대로 미친다.","chapter":"특허심판·소송","answer":"O","explanation":"적극적 권리범위확인심판과 소극적 권리범위확인심판 사이에도 동일사실·동일증거 관계가 인정되 면 일사부재리가 문제될 수 있다."},{"id":452,"text":"동일사실이란 청구원인사실의 동일성을 말하고, 진보성의 결여를 이유로 하는 등록무효심판 청구에 대한 심결이 확정된 후, 다시 특허가 미 완성발명 내지 기재불비에 해당한다는 이유를 들어 등록무효심판 청구를 하는 것은 일사부재리에 해당하지 않는다.","chapter":"특허심판·소송","answer":"O","explanation":"진보성 흠결과 미완성발명·기재불비는 서로 다른 무효사유이므로 동일사실로 볼 수 없다."},{"id":453,"text":"확정된 심결이 각하심결인 경우에는 일사부재리의 효력이 없다고 정한 특허법 제163 조(일사부재리) 단서 규정은 새로 제출된 증거가 선행 확정 심결을 번복할 수 있을 만큼 유력한 증거인지에 관한 심리ㆍ 판단이 이루어진 후 선행 확정 심결과 동일 증거에 의한 심판청구라는 이유 로 각하된 심결인 경우에는 적용되지 않는다.","chapter":"특허심판·소송","answer":"X","explanation":"각하심결이라고 하더라도 그 각하의 내용과 이유에 따라 일사부재리의 적용 여부를 판단해야 하므 로 지문처럼 단정할 수 없다. 적극적 권 리범위확인심판의 청구인은 특허권자, 전용실시권자이다."},{"id":454,"text":"심판장은 구술심리로 심판을 할 경우에는 심판장이 지정한 직원에게 기일마다 심리의 요지와 그 밖에 필요한 사항을 적은 조서를 작성하게 하 여야 하며, 이 조서에는 심판의 심판장 및 조서를 작성한 직원이 서명날인하여야 한다.","chapter":"특허심판·소송","answer":"X","explanation":"구술심리조서의 작성 및 서명에 관한 법정 방식이 지문과 다르다."},{"id":455,"text":"제138 조(통상실시권 허락의 심판) 제1 항에 따른 심판 청구인은 이용ㆍ저촉관계에 있는 후출원 특허 권자, 전용실시권자 또는 통상실시권 자이다.","chapter":"특허심판·소송","answer":"O","explanation":"이용·저촉관계에 있는 후출원 권리자에게 통상실시권 허락의 심판청구가 인정된다."},{"id":456,"text":"제139 조(공동심판의 청구 등) 제1 항에 따라 심판에 참가하려는 자는 참가신청서를 심판장에게 제출 하여야 하며, 참가여부는 심판으로 결 정하여야 하고, 이 결정에 대해서는 불복할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"심판참가 절차와 참가 여부 결정에 관한 법정 규정이다."},{"id":457,"text":"부적법한 심판청구로서 그 흠을 보정할 수 없을 경우라도 피청구인에게 답변서 제출의 기회를 주어야 하고, 심결로써 그 청구를 각하할 수 없 다.","chapter":"특허심판·소송","answer":"X","explanation":"보정할 수 없는 부적법한 심판청구는 피청구인에게 답변기회를 주지 않고도 심결로 각하할 수 있 다. 당사자는 특허취소결정 또는 심결 확 정 후 재심사유를 안 날부터 30일 이내에 재심을 청구하여야 하 고, 대리권의 흠을 이유로 재심을 청구하는 경우에 이 기간은 청구인 또는 법정대리 인이 특허취소결정등 본 또는 심결등본을 송달받은 날부터 기산한다."},{"id":458,"text":"특허취소결정 또는 심결 확정 후 3년이 지나면 재심을 청구할 수 없으며, 재심사유가 특허취소결정 또 는 심결 확정 후에 생겼을 때에는 위의 3년의 기간은 그 사유가 발생한 날의 다음 날부터 기산한다.","chapter":"특허심판·소송","answer":"O","explanation":"재심사유가 확정 후 발생한 경우 그 사유 발생 시점을 기준으로 기간을 계산한다."},{"id":459,"text":"심판의 당사자가 공모하여 제3 자의 권리나 이익을 사해(詐害)할 목적으로 심결을 하게 하였을 때에는 제3 자는 그 확정된 심결에 대하여 재 심을 청구할 수 있으며, 이 경우 심판의 당사자를 공동피청구인으로 한다.","chapter":"특허심판·소송","answer":"O","explanation":"제3 자에 대한 사해 목적의 심결에는 제3 자의 재심청구가 인정된다."},{"id":460,"text":"취소된 특허권이 재심에 의하여 회복된 경우 특허권의 효력은 해당 특허취소결정 또는 심결이 확정된 후 재심청구 등록 전에 선의로 수입하거 나 국내에서 생산 또는 취득한 물건에는 미치지 아니한다.","chapter":"특허심판·소송","answer":"O","explanation":"재심에 의한 특허권 회복의 효력에는 선의의 제3 자를 보호하기 위한 제한이 있다."},{"id":461,"text":"취소된 특허권이 재심에 의하여 회복된 경우 해당 특허취소결정 또는 심결이 확정된 후 재심청구 등 록 전에 국내에서 선의로 그 발명의 실시 사업을 하고 있는 자 또는 그 사업을 준비하고 있는 자는 실시하 고 있거나 준비하고 있는 발명 및 사업목적의 범위에서 그 특허권에 관하여 통 상실시권을 가진다.","chapter":"특허심판·소송","answer":"O","explanation":"재심에 따른 특허권 회복 전 선의로 실시하거나 사업을 준비한 자에게 법정통상실시권이 인정된다. 침해소송이 계속 중이어서 그 소송에 서 특허권의 효력이 미치는 범위를 확정할 수 있는 경우에는 이 를 이유로 침해소송과 별개로 청구된 권리범위확인심판의 심판청구의 이익이 부정 된다고 볼 수 있다."},{"id":462,"text":"동일한 특허발명에 대하여 정정심판 사건이 특허심판원에 계속 중에 있는 경우에 이를 이유로 상고심 에 계속 중인 그 특허발명에 관한 특허 무효심결에 대한 취소소송의 심리를 중단하여야 하는 것은 아니다.","chapter":"특허심판·소송","answer":"O","explanation":"정정심판의 계속 자체만으로 심결취소소송의 심리를 당연히 중단해야 하는 것은 아니다."},{"id":463,"text":"특허권자가 정정심판을 청구하여 특허무효심판에 대한 심결취소소송의 사실심 변론종결 전에 특허발 명의 명세서 또는 도면에 대하여 정정 을 한다는 심결이 확정되는 경우에는 정정 전 명세서 등으로 판단 한 원심판결에 재심사유가 있다.","chapter":"특허심판·소송","answer":"O","explanation":"심결취소소송의 사실심 변론종결 전 정정심결이 확정된 경우에는 정정의 효력이 소송판단과 관계 될 수 있다."},{"id":464,"text":"동일한 특허권에 관하여 2 인 이상의 자가 공동으로 특허의 무효심판을 청구하여 승소한 경우에 그 특 허권자가 제기할 심결취소소송은 심판 청구인 전원을 상대로 제기하여야만 하는 고유필수적 공동소송이 다.","chapter":"특허심판·소송","answer":"X","explanation":"공동 무효심판 청구인 전원을 반드시 공동피고로 해야 하는 고유필수적 공동소송이라고 볼 수 없 다."},{"id":465,"text":"법원은 특허취소결정 또는 심결에 대한 소 및 특허취소신청서ㆍ심판청구서ㆍ재심청구서의 각하결정 에 대한 소 또는 특허법원의 판결에 따 른 상고가 대법원에 제기되었을 때에는 지체 없이 그 취지를 특허 청장과 특허심판원장에게 통지하여야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"특허법원 또는 대법원에 관련 소송이 제기되면 법에서 정한 통지의무가 있다."},{"id":466,"text":"청구범위 “A+B”가 명세서의 “발명의 설명”에 기재되어 있다고 하더라도, 도면에 기재된 “B+C”를 근 거로 청구범위를 “B+C”로 정정하는 것 은 청구범위의 변경에 해당하므로 불가능하다.","chapter":"특허심판·소송","answer":"O","explanation":"정정 전후의 청구범위를 비교하여 실질적으로 변경되는 경우 허용되지 않는다."},{"id":467,"text":"청구항에 기재된 “온도 1,000 ” ℃는 특허법 제136 조(정정심판) 제1 항 제2 호의 “잘못 기재된 사항을 정정”하는 경우에 해당한다는 이유로, 명세서에 기재된 “온도 20 50 ” ℃의 범위를 넘더라도 “온도 100 ” ℃로 정정될 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"잘못 기재된 사항의 정정도 최초 명세서·도면에 기재된 범위를 벗어날 수 없다."},{"id":468,"text":"특허취소신청이 특허심판원에 계속 중인 때부터 그 결정이 확정될 때까지의 기간에는 청구범위의 구 성 A 를 그 하위개념의 “a”로 감축하는 정정심판을 청구할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"특허취소신청 절차가 계속 중인 기간에는 별도의 정정심판 청구가 제한된다."},{"id":469,"text":"정정의 무효심판의 심결에 대한 소가 특허법원에 계속 중인 경우에는 특허법원에서 변론이 종결된 날 까지 “청구범위를 감축”하는 정정심판 을 청구할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"해당 소송의 변론종결 시까지 법에서 정한 범위의 정정심판 청구가 가능하다."},{"id":470,"text":"“청구범위를 감축하는 정정”을 하는 경우에는 특허발명의 명세서 또는 도면에 기재된 사항의 범위에 서 할 수 있지만, “잘못 기재된 사항을 정 정”하는 경우에는 특허출원서에 최초로 첨부된 명세서 또는 도 면에 기재된 사항의 범위에서 할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"감축정정과 잘못 기재된 사항의 정정은 각각 법에서 정한 기재범위 제한을 받는다."},{"id":471,"text":"실용신안법 제11 조(특허법의 준용)에 따라 준용되는 특허법 제33 조(특허를 받을 수 있는 자) 제1 항 본문에 따른 실용신안등록을 받을 수 있는 권리를 가지지 아니하는 경우, 실용신안등록을 받을 수 있는 권리자 또는 심사관은 그 실용신안등록의 무효심판을 청구할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"실용신안등록무효사유에 해당하는 경우 권리자 또는 심사관이 무효심판을 청구할 수 있다."},{"id":472,"text":"동일한 특허발명에 대하여 특허 무효심판과 정정심판이 특허심판원에 동시에 계속중에 있는 경우에 는 정정심판제도의 취지상 정정심판을 특허 무효심판에 우선하여 심리ㆍ판단하는 것이 바람직하므로 반 드시 정정심판을 먼저 심리ㆍ판단하여야 한다.","chapter":"특허심판·소송","answer":"X","explanation":"정정심판을 우선하는 것이 바람직할 수는 있지만 반드시 먼저 심리해야 하는 것은 아니다."},{"id":473,"text":"실용신안등록의 무효를 청구할 수 있는 심사관은 심판청구 당시 실용신안의 등록출원에 대한 심사를 담당하고 있는 자이면 되고 반드시 당해 실용신안등록을 심사하여 등록결정한 심사관에 한하거나 심결 당시에 그 심사관의 지위에 있어야만 하는 것은 아니다.","chapter":"특허심판·소송","answer":"O","explanation":"심판청구 당시 해당 실용신안등록출원의 심사를 담당하는 심사관이면 된다."},{"id":474,"text":"특허권의 공유관계는 민법에 규정된 합유에 준하는 것이므로 특허권이 공유인 경우 그 특허권에 관한 심판사건에 있어서는 공유자 전원이 심 판의 청구인 또는 피청구인이 되어야 하고 그 심판절차는 공유자 전원에게 합일적으로 확정되어야 할 필요에서 이른바 필요적 공동소송관계 에 있다.","chapter":"특허심판·소송","answer":"O","explanation":"공유특허권에 관한 심판은 공유자 전원이 당사자가 되어야 하는 필요적 공동관계가 인정된다."},{"id":475,"text":"자신의 발명이 타인의 특허권의 권리범위에 속하지 아니한다는 소극적 권리범위확인심판 청구에 있 어서 그 이유가 없는 경우, 그것을 배척함 에 그치지 아니하고 그 타인의 권리범위 내에 속한다고 심결하 는 것은 위법하다.","chapter":"특허심판·소송","answer":"O","explanation":"소극적 권리범위확인심판에서 속한다고 판단되면 청구를 기각하면 되고 적극적 확인까지 할 수는 없다."},{"id":476,"text":"특허등록의 무효를 주장하고자 하는 자는 특허심판원에 특허무효심판을 청구할 수 있을 뿐만 아니라 특허법원에 특허등록을 무효로 하는 판 결을 구할 수도 있다.","chapter":"특허심판·소송","answer":"X","explanation":"특허등록의 무효는 특허무효심판을 통해 다투어야 한다."},{"id":477,"text":"권리범위 확인심판에 따른 심결취소소송은 특허심판원의 심결의 취소를 구하는 것이므로 특허심판원 에서 주장하지 아니한 심결취소사유를 특허법원에서 주장하는 것은 허용되지 아니한다.","chapter":"특허심판·소송","answer":"X","explanation":"심결취소소송에서 새로운 주장·증거의 제출이 일률적으로 금지되는 것은 아니다. 적극적 권리범위 확인심판에서 심판청구인이 특정한 확 인대상발명과 피심판청구인이 실시하고 있는 발명 사이에 동일성이 인정되지 아니하면 피심판청구인이 실시하지 않고 있는 발명을 대상으로 한 그 와 같은 심판청구는 확인의 이익이 없어 부적법하여 각하되어야 한다."},{"id":478,"text":"특허무효심판에서 청구기각 심결이 이루어지고 그 심결취소소송에서 원고의 청구가 기각되어 상고심 에 계속 중 같은 발명에 대한 다른 사건 에서 등록무효심결이 확정되어 그 특허가 처음부터 없던 것으로 보게 되더라도 심결의 취소를 구할 법률상의 이익이 없어졌다고 볼 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"무효심결 확정 여부와 기존 심결취소소송의 법률상 이익은 별도로 판단된다."},{"id":479,"text":"특허심판원에 특허취소신청이 있는 경우 이에 대하여는 3 명 또는 5 명의 심판관으로 구성되는 합의체 가 심리ㆍ결정하며 그 결정에 대한 소 에서는 특허심판원장을 피고로 하여야 한다.","chapter":"특허심판·소송","answer":"X","explanation":"특허취소신청 결정에 대한 소의 피고적격은 특허취소결정의 구조에 따라 판단한다."},{"id":480,"text":"특허취소신청은 결정계로 누구든지 신청인이 될 수 있는 반면에, 무효심판은 당사자계로 이해관계인 또는 심사관이 심판을 청구할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"특허취소신청과 특허무효심판의 청구인 적격이 다르다."},{"id":481,"text":"특허취소신청은 청구항이 둘 이상인 경우에 청구항마다 할 수 없지만 무효심판은 청구항이 둘 이상인 경우에는 청구항마다 청구할 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"특허취소신청도 청구항별로 신청하는 것이 가능하다."},{"id":482,"text":"특허취소신청은 물론이고 무효심판에서도 특허권자는 지정된 기간에 특허발명의 명세서 또는 도면 에 대하여 정정청구를 할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"두 절차 모두 정정청구 제도가 인정된다."},{"id":483,"text":"특허취소신청에 관한 심리는 서면으로 하는 반면에 무효심판은 구술심리 또는 서면심리로 한다.","chapter":"특허심판·소송","answer":"O","explanation":"특허취소신청은 서면심리를 원칙으로 하고 무효심판은 구술심리 또는 서면심리가 가능하다."},{"id":484,"text":"특허취소신청은 특허권의 설정등록일부터 등록공고일 후 6개월이 되는 날까지 신청할 수 있으나 무 효심판은 특허권이 소멸된 후에도 청구 할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"양 제도의 청구·신청기간이 서로 다르다."},{"id":485,"text":"특허청 심사관이 특허출원의 보정에 대한 각하결정을 한 후 ‘보정 전’의 특허출원에 대하여 거절결정 을 하였고, 그에 대한 불복심판 절차에서 위 보정각하결정 및 거절결정이 적법하다는 이유로 심판청구를 기각하는 특허심판원의 심결이 있었는데 보정각하결정이 위법한 경우, 심결 취소소송에서 법원은 그것만 을 이유로 곧바로 심결을 취소할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"보정각하결정의 위법성만으로 곧바로 심결 전체를 취소하는 것은 아니다."},{"id":486,"text":"거절결정불복심판청구 기각 심결의 취소소송절차에서 특허청장은 거절결정의 이유 외에도 심사나 심 판 단계에서 의견서 제출의 기회를 부 여한 사유 및 이와 주요한 취지가 부합하는 사유를 해당 심결의 결 론을 정당하게 하는 사유로 주장할 수 있고, 심결취소소송의 법원은 이를 심 리ㆍ판단하여 심결의 당부를 판단하는 근거로 삼을 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"동일한 취지의 사유라면 심결취소소송에서 주장·판단할 수 있다."},{"id":487,"text":"거절결정 불복심판청구를 기각하는 심결의 취소소송단계에서 특허청은 심결에서 판단되지 않은 것이 라고 하더라도 거절결정의 이유와 다른 새로운 거절이유에 해당하지 않는 한 심결의 결론을 정당하게 하 는 사유를 주장ㆍ입증할 수 있고, 심결취소소송의 법원은 달리 볼 만한 특별 한 사정이 없는 한 제한 없이 이를 심리ㆍ판단하여 판결의 기초로 삼을 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"심결의 결론을 뒷받침하는 범위에서 관련 사유를 주장할 수 있다."},{"id":488,"text":"심결취소소송을 제기한 후 당사자 사이에 소를 취하하기로 하는 합의가 이루어졌다면 특별한 사정이 없는 한 소송을 계속 유지할 법률상의 이 익이 소멸하여 당해 소는 각하되어야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"당사자 간 합의로 법률상 이익이 소멸할 수 있다."},{"id":489,"text":"특허무효가 판결로 확정된 경우 특허권은 처음부터 특허발명 실시계약의 목적이 된 특허발명의 실시 가 불가능한 경우가 아니라면 특허무효 의 소급효에도 불구하고 그와 같은 특허를 대상으로 하여 체결된 특허발명 실시계약이 그 계약의 체결 당시부터 원시적으로 이행불능 상태에 있었다고 볼 수는 없다.","chapter":"특허심판·소송","answer":"O","explanation":"특허무효의 소급효와 실시계약의 원시적 이행불능 여부는 구별된다."},{"id":490,"text":"특별한 사정이 없는 한 특허권의 실시권자는 특허권자로부터 권리의 대항을 받거나 받을 염려가 없으 므로 무효심판을 청구할 수 있는 이해관 계가 소멸되었다고 볼 수 있다.","chapter":"특허심판·소송","answer":"X","explanation":"실시권자도 특허권과 이해관계가 인정될 수 있으므로 무효심판 청구의 이해관계가 당연히 소멸하 는 것은 아니다."},{"id":491,"text":"특허처분에 의하여 수인을 공유자로 하는 특허등록이 이루어졌다고 하더라도 특허무효심판에서 그 공유자 지분에 따라 특허를 분할하여 일 부 지분만의 무효심판을 청구하는 것은 허용할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"특허무효는 공유자별 지분만을 따로 떼어 무효로 하는 방식으로 청구할 수 없다."},{"id":492,"text":"특허는 일단 등록이 된 이상 이와 같은 심판 등에 의하여 특허를 무효로 한다는 심결 등이 확정되지 않 는 한 유효한 것이고 다른 절차에서 그 특허가 당연 무효라고 판단할 수 없지만, 등록된 특허발명의 일부 또는 전부가 출원 당시 공지공용의 것인 경우에는 특허무효의 심결 등 유무 에 관계없이 그 권리범위를 인정할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"공지공용 기술에 관한 특허의 권리범위는 인정되지 않는다."},{"id":493,"text":"특허무효심판절차에서 정정청구가 있는 경우 정정의 확정시기 및 정정의 허용 여부를 일체로 판단하 여야 한다.","chapter":"특허심판·소송","answer":"O","explanation":"무효심판에서 정정청구가 있는 경우 정정의 확정 여부와 허용 여부를 함께 판단한다."},{"id":494,"text":"일단 적법하게 발생한 특허권이라 할지라도 그 권리가 소멸된 이후에는 그에 대한 권리범위 확인을 구할 이익이 없어진다.","chapter":"특허심판·소송","answer":"O","explanation":"특허권이 소멸하면 원칙적으로 권리범위 확인의 이익도 소멸한다. 권리범위 확인심판에서 특허발명과 대비되는 확인대상발명이 자유실 시기술인 경우에도 특허발명과 대비하여 확인대상발명이 특허발명 청구범위에 나타난 구성요소의 문언침해에 해당하는지 판단하여야 한다."},{"id":495,"text":"계속 중인 특허침해소송에서 특허권의 효력이 미치는 범위를 확정할 수 있더라도 이를 이유로 침해소 송과 별개로 청구된 권리범위 확인심판 의 심판청구의 이익이 부정된다고 볼 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"특허침해소송이 계속 중이라는 사정만으로 권리범위 확인심판의 이익이 당연히 소멸하지 않는다."},{"id":496,"text":"특허발명이 공지의 기술인 경우 등을 제외하고는 특허발명의 진보성이 부정되는 경우에도 권리범위 확인심판에서 등록되어 있는 특허권의 효력을 당연히 부인할 수는 없다.","chapter":"특허심판·소송","answer":"O","explanation":"진보성 흠결만으로 권리범위 확인심판에서 특허권의 효력을 부인할 수 없다."},{"id":497,"text":"소극적 권리범위 확인심판에서는 현재 실시하는 것만이 아니라 장래 실시 예정인 것도 심판 대상으로 삼을 수 있으므로 심판 대상으로 특정한 확인대상발명이 특허권의 권리범위에 속하지 않는다는 점에 관 하여는 아무런 다툼이 없는 경우라도 소극적 권리범위 확인심판 청구의 이익 이 있다.","chapter":"특허심판·소송","answer":"O","explanation":"장래 실시 예정인 발명도 확인대상이 될 수 있지만, 확인의 이익이 없는 경우까지 인정되는 것은 아니어서 이 지문은 정확한 법리에 맞지 않는 다. 권리범위 확인심판에서 당사자 사이에 확인대상발명이 특허권의 권리범위에 속하는지 여부에 다툼 이 없다면 확인의 이익이 인정되지 않는 다."},{"id":498,"text":"자유실시기술에 해당하면 특허발명과 대비하지 않고 권리범위에 속하지 않는다고 판단할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"자유실시기술의 법리가 인정된다."},{"id":499,"text":"적극적 권리범위 확인심판에서 확인대상발명과 실제 실시발명이 동일하지 않으면 확인의 이익이 없 다.","chapter":"특허심판·소송","answer":"O","explanation":"실시하지 않는 발명을 대상으로 한 적극적 확인심판은 확인의 이익이 없다."},{"id":500,"text":"특허권자와 침해 피고 사이에 권리를 인정하고 침해하지 않기로 한 약정이 있으면 권리범위 확인심판 의 이익이 반드시 소멸한다.","chapter":"특허심판·소송","answer":"X","explanation":"약정만으로 항상 확인의 이익이 소멸한다고 볼 수 없다."},{"id":501,"text":"정정심판과 정정의 무효심판에 관한 법정 요건이 충족되면 특허무효심판과 별개의 절차로 심리할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"각각 독립된 심판제도를 가진다."},{"id":502,"text":"특허무효심판이 특허심판원에 계속 중인 기간에는 정정심판을 청구할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"무효심판 계속 중 정정심판 청구에는 제한이 있다."},{"id":503,"text":"정정의 무효심판이 계속 중인 기간에도 정정심판을 청구할 수 없다.","chapter":"특허심판·소송","answer":"O","explanation":"정정절차가 중복되어 진행되는 것을 방지하기 위한 제한이다."},{"id":504,"text":"일사부재리의 효력은 단순한 각하심결이 확정되면 언제나 발생한다.","chapter":"특허심판·소송","answer":"X","explanation":"일사부재리는 본안판단을 한 확정심결을 전제로 한다."},{"id":505,"text":"동일 사실·동일 심판에서 전에 확정된 심결의 증거를 다른 사항에 적용하여 결과를 달리하더라도 항 상 일사부재리에 반한다.","chapter":"특허심판·소송","answer":"X","explanation":"동일증거 여부와 확정심결의 판단 범위를 구체적으로 살펴야 한다. 동일한 선행기술을 새 증거와 결합하여 사용했다는 이유만으로 항상 일사부재리에 반한다."},{"id":506,"text":"동일증거 여부는 단순히 증거의 내용이 같은지만으로 결정한다.","chapter":"특허심판·소송","answer":"X","explanation":"확정심결의 결론을 번복할 만한 유력한 증거인지 등이 문제된다."},{"id":507,"text":"다른 무효사유가 추가된 심판청구는 그 부분에 대해서 일사부재리에 반하지 않는다.","chapter":"특허심판·소송","answer":"O","explanation":"새로운 청구원인에 대해서는 별도로 판단한다."},{"id":508,"text":"심결취소소송에서는 심결의 실체적 위법뿐 아니라 심판절차상의 위법도 심리대상이 된다.","chapter":"특허심판·소송","answer":"O","explanation":"심결의 적법성 전반이 심리대상이다."},{"id":509,"text":"심결취소소송에서 당사자 또는 참가인만이 소를 제기할 수 있다.","chapter":"특허심판·소송","answer":"O","explanation":"원고적격은 법에서 정한 자에게 인정된다."},{"id":510,"text":"심결취소소송의 판결에서 취소의 기본이 된 이유는 특허심판원을 기속한다.","chapter":"특허심판·소송","answer":"O","explanation":"취소판결의 기속력이 인정된다.. Ⅴ국제출원(PCT). Ⅴ국제출원(PCT) 문항 수: 38 개 Ⅴ. 국제출원(PCT) 문항 수: 38개"},{"id":511,"text":"특허권 및 특허에 관한 권리의 등록신청서류와 특허협력조약(PCT) 제2 조(vii)에 따른 국제출원에 관 한 서류를 우편으로 제출하는 경우에는 그 서류가 특허청장 또는 특허심판원장에게 도달한 날부터 효력 이 발생한다.","chapter":"국제출원(PCT)","answer":"O","explanation":"해당 서류는 우편 제출의 경우에도 도달주의가 적용된다."},{"id":512,"text":"국제특허출원의 출원인이 제203 조(서면의 제출) 제3 항에 따른 보정명령을 받고 지정된 기간에 보정 을 하지 아니하면 특허청장은 해당 국 제특허출원을 무효로 하여야 한다.","chapter":"국제출원(PCT)","answer":"X","explanation":"특허청장은 해당 국제특허출원을 무효로 할 수 있다. 반드시 무효로 하여야 하는 것은 아니다."},{"id":513,"text":"국제특허출원에 있어서 특허법 제203 조(서면의 제출) 제1 항 전단에 따른 서면에는 발명자의 성명 및 주소를 기재하여야 한다.","chapter":"국제출원(PCT)","answer":"O","explanation":"국제특허출원의 국내서면 제출에서도 발명자에 관한 사항을 기재하여야 한다. 특허법 제64 조(출원공개)에 따라 특허청장은 공개특허공 보에 발명자의 성명 및 주소를 반드시 게재 하여 공개해야 한다."},{"id":514,"text":"국제출원을 하려는 자는 국어, 영어 또는 일본어로 작성한 출원서와 발명의 설명ㆍ청구범위ㆍ도면 및 요약서를 지식재산처장에게 제출하여 야 한다.","chapter":"국제출원(PCT)","answer":"X","explanation":"국제출원에 관한 언어요건과 제출서류는 PCT 및 특허법의 구체적인 요건에 따라 판단하여야 하 므로 지문처럼 단순히 세 언어를 자유롭게 선택할 수 있다고 할 수 없다. ‘ 일본에 주소를 가진’ 일본인 B 가 ‘국내에 영업소를 가진’ 미국인 A 와 공동으로 국제출원하는 경우, 미 국인 A 를 대표자로 하여 출원하지 않으면 일본인 B 는 국제출원을 할 수 있는 자에 해당하지 않는다."},{"id":515,"text":"2 인 이상이 공동으로 국제출원을 하는 경우에 특허법 제192 조(국제출원을 할 수 있는 자)부터 제196 조(취하된 것으로 보는 국제출원 등) 까지 및 제198 조(수수료)에 따른 절차를 대리인에 의하여 밟으려는 자는 반드시 변리사를 대리인으로 하여야 한다.","chapter":"국제출원(PCT)","answer":"X","explanation":"국제출원의 모든 절차에서 반드시 변리사만을 대리인으로 해야 하는 것은 아니다."},{"id":516,"text":"지식재산처장은 국제출원이 지식재산처에 도달한 날을 특허협력조약 제11 조의 국제출원일로 인정하 여야 한다. 다만, 출원인의 성명이나 명칭을 잘못 적은 경우 지식재산처장은 기간을 정하여 서면으로 절 차를 보완할 것을 명하여야 한다.","chapter":"국제출원(PCT)","answer":"X","explanation":"국제출원일은 단순히 지식재산처에 도달한 날짜만으로 정하는 것이 아니라 PCT 제11 조의 국제출 원일 인정요건을 충족해야 한다."},{"id":517,"text":"국제출원에 관하여 내야 할 수수료의 일부를 지식재산처장이 정한 기간에 내지 아니하여 특허협력조 약 제14 조(3)(b)에 해당하게 된 경우에 는 수수료를 내지 아니한 지정국의 지정은 취하된 것으로 보며, 지식재산처장은 그 사실을 출원인에게 알려야 한다.","chapter":"국제출원(PCT)","answer":"O","explanation":"일정한 수수료가 지급되지 않으면 해당 지정국의 지정이 취하된 것으로 보는 PCT 상 특칙이 적용 된다."},{"id":518,"text":"특허법 제201 조(국제특허출원의 국어번역문)제1 항에 따라 국어번역문을 제출한 출원인은 국내서면 제출기간(제1 항 단서에 따라 취지를 적은 서면이 제출된 경우에는 연장된 국어번역문 제출기간을 말한 다)에 그 국어번역문을 갈음하여 새로운 국어번역문을 제출할 수 있으나, 출원인이 출원심사의 청구를 한 후에는 그러하지 아니하다.","chapter":"국제출원(PCT)","answer":"O","explanation":"국제특허출원의 국내단계에서 일정 기간 내 새로운 국어번역문을 제출할 수 있으나 출원심사청구 후에는 제한된다."},{"id":519,"text":"국제특허출원을 외국어로 출원한 출원인은 국제출원서와 발명의 설명, 청구범위 및 도면(도면 중 설 명부분에 한정한다)의 국어번역문을 우 선일부터 2년 7개월이 될 때까지 제출하여야 하고, 이를 제출하 지 않으면 출원을 취하한 것으로 본다.","chapter":"국제출원(PCT)","answer":"O","explanation":"한국에서 국제특허출원의 국내단계 진입을 위해서는 법정기간 내 국어번역문을 제출해야 하며 이 를 하지 않으면 취하간주된다."},{"id":520,"text":"국제출원을 하려는 자는 산업통상자원부령으로 정하는 언어인 국어, 영어 또는 일어로 작성한 출원서 와 발명의 설명, 청구범위, 필요한 도면 및 요약서를 특허청장에게 제출하여야 한다.","chapter":"국제출원(PCT)","answer":"O","explanation":"한국 특허청을 수리관청으로 하는 국제출원에는 법령에서 정한 언어요건이 있다."},{"id":521,"text":"특허법 제203 조(서면의 제출)제3 항에 따른 보정명령을 받은 자가 지정된 기간에 보정을 하지 아니하 면 특허청장은 해당 국제특허출원을 무효로 할 수 있다.","chapter":"국제출원(PCT)","answer":"O","explanation":"국제특허출원의 국내단계 서면 제출에 관한 보정명령을 따르지 않으면 해당 국제특허출원을 무효 로 할 수 있다."},{"id":522,"text":"특허청장은 국제특허출원이 도면에 관하여 적고 있지만 그 출원에 도면이 포함되어 있지 않은 경우 그 취지를 출원인에게 통지하여야 하고, 출원인이 산업통상자원부령으로 정하는 기간에 도면을 제출하 는 경우에는 그 도면의 도달일을 국제출원일로 인정하여야 한다.","chapter":"국제출원(PCT)","answer":"X","explanation":"도면의 추가 제출에 관한 특칙이 있다고 하더라도 그 도면 제출일 자체를 곧바로 국제출원일로 소 급하여 인정하는 것은 아니다."},{"id":523,"text":"특허와 실용신안등록에 관한 설명 중 특허협력조약(PCT)에 의한 국제출원시 특허출원에 따른 도면 의 설명부분에 대한 국어번역문을 제출하 지 아니한 경우 도면의 설명부분에 대한 기재가 없었던 것으로 본다.","chapter":"국제출원(PCT)","answer":"O","explanation":"국제출원의 국어번역문 제출과 관련하여 도면 설명부분에 대한 특칙이 적용된다."},{"id":524,"text":"WTO/TRIPs 협정은 지식재산권의 보호에 관하여 최소한의 기준을 정하고 있으므로 국내입법이 이 보다 더 강력하게 보호할 경우 WTO/TRIPs 협정 위반이 된다.","chapter":"국제출원(PCT)","answer":"X","explanation":"TRIPs 는 최소보호기준을 정하는 협정이므로 회원국이 더 높은 수준의 보호를 하는 것 자체가 곧 바로 협정 위반이 되는 것은 아니다."},{"id":525,"text":"세계지식재산권기구(WIPO)의 특허법조약(PLT)은 특허실체법의 통일화를 꾀하기 위한 국제조약이 다.","chapter":"국제출원(PCT)","answer":"X","explanation":"PLT 는 주로 특허절차 및 형식요건의 조화를 목적으로 한다."},{"id":526,"text":"부다페스트조약에 따른 국제기탁기관은 정부, 지방자치단체, 정부투자기관 중 하나에 해당해야 한다.","chapter":"국제출원(PCT)","answer":"X","explanation":"국제기탁기관은 조약에서 정한 요건을 갖춘 기관이면 되며 지문의 기관유형으로 한정되지 않는다."},{"id":527,"text":"WTO/TRIPs 협정은 파리협약과 달리 그 기본원칙 중 하나로서 최혜국대우원칙을 천명하고 있다.","chapter":"국제출원(PCT)","answer":"O","explanation":"TRIPs 는 내국민대우와 함께 최혜국대우 원칙을 규정한다."},{"id":528,"text":"특허협력조약(PCT)에 의하여 세계 모든 국가에 효력이 미치는 단일의 국제특허를 취득하는 것이 가 능하게 되었다.","chapter":"국제출원(PCT)","answer":"X","explanation":"PCT 는 국제출원 및 국제조사·예비심사 절차를 제공할 뿐 단일한 세계특허를 부여하는 제도가 아 니다."},{"id":529,"text":"국제특허출원서에 발명의 설명은 기재되어 있으나 청구범위가 기재되어 있지 않는 경우, 국제출원이 특허청에 도달한 날을 국제출원일로 인 정하여야 한다.","chapter":"국제출원(PCT)","answer":"X","explanation":"국제출원일 인정에는 PCT 제11 조에서 정한 필수요건을 충족하여야 한다."},{"id":530,"text":"국제출원에 관한 서류가 우편의 지연으로 인하여 제출기간 내에 도달하지 않은 경우에도 이러한 지연 이 우편의 지연에 의한 것으로 인정된다 면, 해당 서류는 제출기간 내에 제출된 것으로 추정한다.","chapter":"국제출원(PCT)","answer":"X","explanation":"우편 지연에 관한 특례의 적용요건을 지문처럼 일반화할 수 없다."},{"id":531,"text":"국제출원에서, 우선일부터 1년 4개월과 국제출원일부터 4개월 중 늦게 만료되는 날 이내에 우선권 주 장의 보정은 할 수 있으나, 우선권 주 장의 추가는 할 수 없다.","chapter":"국제출원(PCT)","answer":"X","explanation":"우선권 주장에 대한 보정과 추가 가능 여부는 PCT 및 특허법의 정해진 기간과 요건에 따라 판단 해야 하며 지문처럼 추가를 일률적으로 금지 하지 않는다."},{"id":532,"text":"국제출원에 대하여 특허청이 국제조사기관으로 지정된 경우에, 우선권 주장의 기초가 되는 선출원이 국어, 영어, 일본어 이외의 언어로 된 경 우에는 국어 번역문을 제출할 것을 출원인에게 명할 수 있다.","chapter":"국제출원(PCT)","answer":"X","explanation":"해당 우선권 서류의 번역문 제출에 관한 특칙을 지문의 방식으로 정하고 있지 않다."},{"id":533,"text":"외국어로 출원된 국제출원에서 원문의 범위를 벗어난 보정은 특허무효사유이나 국어번역문의 범위 를 벗어난 보정은 거절이유에는 해당하지 만 특허무효사유는 아니다.","chapter":"국제출원(PCT)","answer":"O","explanation":"국제출원의 원문 및 국내 번역문을 벗어난 보정에 대해서는 각각 다른 법적 효과가 적용된다."},{"id":534,"text":"특허청장은 국제특허출원에 청구범위가 기재되어 있지 않은 경우, 기간을 정하여 서면으로 청구범위 를 제출하도록 보정명령을 해야 한다.","chapter":"국제출원(PCT)","answer":"X","explanation":"청구범위 누락은 일정한 보완사유로 처리된다."},{"id":535,"text":"특허청장은 국제특허출원이 도면에 관하여 적고 있지만 그 출원에 도면이 포함되어 있지 않아서 그 취지를 출원인에게 통지하고 출원인이 산 업통상자원부령으로 정하는 기간에 도면을 제출하는 경우, 그 국제특허출원일은 도면의 도달일로 한다.","chapter":"국제출원(PCT)","answer":"O","explanation":"도면 관련 누락을 보완하여 제출한 경우 법이 정한 국제출원일 처리 규정에 따른다."},{"id":536,"text":"특허청장은 국제특허출원이 도면에 관하여 적고 있지만 그 출원에 도면이 포함되어 있지 않아서 그 취지를 출원인에게 통지하여도 출원인이 도면을 제출하지 않은 경우, 그 국제특허출원은 취하된 것으로 본다.","chapter":"국제출원(PCT)","answer":"X","explanation":"도면에 관하여 기재가 있는 경우 도면이 제출되지 않으면 그 기재를 하지 않은 것으로 본다."},{"id":537,"text":"국제특허출원인이 특허청장으로부터 특허법 제195 조(보정명령) 제4 호에 따라 산업통상자원부령으 로 정하는 방식을 위반하여 보정명령 을 받고도 그 지정기간에 보정을 하지 않은 경우, 그 국제특허출원 은 인정되나 실제 심사단계에서 방식심사 위반에 대한 거절이유통지서를 받고 보정을 할 수 있다.","chapter":"국제출원(PCT)","answer":"X","explanation":"법정 기간 내 보정을 하지 않으면 국제출원이 취하 간주되는 등 정해진 절차상 효과가 발생한다."},{"id":538,"text":"2 인 이상이 공동으로 국제특허출원한 경우의 수수료 납부는 출원인의 대표자 또는 특허법 제3 조(미 성년자 등의 행위 능력)에 의한 법정대 리인만 할 수 있다.","chapter":"국제출원(PCT)","answer":"X","explanation":"국제출원 관련 절차를 공동출원인 모두가 할 수 없는 것은 아니며 법정대리인 등으로 제한되지 않 는다."},{"id":539,"text":"甲이 미국잡지에 게재한 것에 대하여 특허법 제30 조(공지 등이 되지 아니한 발명으로 보는 경우) 제1 항 제1 호를 적용받고자 하는 경우, 그 취지를 적은 서면 및 이를 증명할 수 있는 서류를 2018. 9. 1.부터 2년 7개월 이내에 제출하여야 한다.","chapter":"국제출원(PCT)","answer":"X","explanation":"공지예외 적용에 관한 기간은 PCT 국내단계 절차에서 정해진 기준일에 따라 계산한다."},{"id":540,"text":"甲이 특허청장에게 서면을 국내서면제출기간에 제출하면서 국어번역문의 제출기간을 연장하여 달라 는 취지를 기재하여 제출한 경우에는 국 어번역문을 함께 제출하지 않아도 된다.","chapter":"국제출원(PCT)","answer":"O","explanation":"법이 정한 방식으로 기간연장 의사를 표시한 경우 번역문 제출기한을 연장할 수 있다."},{"id":541,"text":"甲이 국내서면제출기간에 발명의 설명, 청구범위 및 도면(설명부분에 한정한다)의 국어번역문을 제출 하고, 이에 갈음한 새로운 국어번역문 을 제출할 수 있으나 甲이 출원심사의 청구를 한 후에는 그러하지 아니하다.","chapter":"국제출원(PCT)","answer":"O","explanation":"국내단계에서 번역문의 교체가 가능하지만 심사청구 후에는 제한된다."},{"id":542,"text":"甲이 특허청장에게 서면을 제출한 경우, 한국에서의 특허출원일은 특허청장에게 서면을 제출한 날이 아니라 국제특허출원일인 2019. 2. 1. 이다.","chapter":"국제출원(PCT)","answer":"O","explanation":"국내단계 진입 후에도 국제출원일이 한국에서의 출원일로 인정된다."},{"id":543,"text":"甲이 특허협력조약(PCT) 제19 조(1)의 규정에 따라 청구범위를 보정하고, 그 보정서의 국어번역문을 제출하는 때에는 특허법 제47 조(특허 출원의 보정) 제1 항에 따라 보정된 것으로 본다.","chapter":"국제출원(PCT)","answer":"O","explanation":"PCT 제19 조에 따른 청구범위 보정은 국내법상 보정으로 취급된다."},{"id":544,"text":"특허법 제201 조(국제특허출원의 국어번역문) 제1 항에 따라 국어번역문을 제출한 출원인은 국내서면 제출기간 제1 항 단서에 따라 취지를 적은 서면이 제출된 경우에는 연장된 국어번역문 제출기간을 말한 다)에 그 국어번역문을 갈음하여 새로운 국어번역문을 제출할 수 있으나, 출원인이 출원심사의 청구를 한 후에는 그러하지 아니하다.","chapter":"국제출원(PCT)","answer":"O","explanation":"국제특허출원의 번역문은 정해진 기간 내에 새로운 번역문으로 교체할 수 있다."},{"id":545,"text":"특허법 제197 조(대표자 등) 제1 항의 절차를 대리인에 의하여 밟으려는 자는 제3 조(미성년자 등의 행 위능력)에 따른 법정대리인을 제외하 고는 변리사를 대리인으로 하여야 한다.","chapter":"국제출원(PCT)","answer":"O","explanation":"국제특허출원 관련 절차의 대리인은 원칙적으로 변리사여야 한다."},{"id":546,"text":"국제출원을 하려는 자는 산업통상자원부령으로 정하는 언어인 국어, 영어 또는 중국어로 작성한 출원 서와 발명의 설명, 청구범위, 필요한 도 면 및 요약서를 특허청장에게 제출하여야 한다.","chapter":"국제출원(PCT)","answer":"O","explanation":"국내관청을 수리관청으로 하는 국제출원에서 사용 가능한 언어가 정해져 있다."},{"id":547,"text":"특허법 제203 조(서면의 제출) 제3 항에 따른 보정명령을 받은 자가 지정된 기간에 보정을 하지 아니 하면 특허청장은 해당 국제특허출원을 무효로 할 수 있다.","chapter":"국제출원(PCT)","answer":"X","explanation":"국제특허출원에 대해서는 법이 정한 절차상 취하간주 등 별도의 효과가 발생한다."},{"id":548,"text":"특허청장은 국제특허출원의 출원인에 대하여 기간을 정하여 특허협력조약 제18 조(국제조사보고)의 국제조사보고서 또는 같은 조약 제35 조(국제예비심사보고)의 국제예비심사보고서에 적혀 있는 문헌의 사본을 제출하게 할 수 있다.","chapter":"국제출원(PCT)","answer":"O","explanation":"국제조사·국제예비심사 관련 문헌의 사본 제출을 명할 수 있다.. Ⅵ실용신안 실용신안등록출원일은 명세서 및 도면을 첨부한 실용신안등 록출원서가 지식재산처장에게 도달한 날 로 하며, 이 경우 명세서에 고안의 설명은 적지 아니할 수 있으나, 청구범위는 적어야 한다. Ⅵ. 실용신안 문항 수: 32개"},{"id":549,"text":"지식재산처장은 인공지능 또는 사물인터넷 등 4 차산업혁명과 관련된 기술을 활용한 실용신안등록출 원에 대해서는 심사관에게 다른 실용신 안등록출원에 우선하여 심사하게 할 수 없다.","chapter":"실용신안","answer":"O","explanation":"해당 기술이라는 이유만으로 우선심사를 받을 수 있는 것은 아니며, 법정 우선심사 사유가 별도로 필요하다."},{"id":550,"text":"누구든지 실용신안권의 설정등록일부터 등록공고일 후 6개월이 되는 날까지 그 실용신안등록이 실용 신안법 제7 조(선출원)제1 항의 규정 에 위반된 경우에는 지식재산처장에게 실용신안등록취소신청을 할 수 있다.","chapter":"실용신안","answer":"X","explanation":"실용신안등록취소신청의 대상과 사유는 법에서 정한 범위에 한정되므로 지문의 선출원 위반 사유 를 그대로 취소신청 사유로 볼 수 없다."},{"id":551,"text":"실용신안등록출원인은 실용신안등록출원서에 최초로 첨부한 명세서에 청구범위를 적지 아니한 경우 에 실용신안법 제8 조의2(실용신안등 록출원일 등)에서 정한 기간까지 명세서에 청구범위를 적는 보정을 하여야 하며, 이러한 보정을 하지 아니한 경우에는 해당 기한이 되는 날에 그 실용신안등록출원을 취소 한 것으로 본다.","chapter":"실용신안","answer":"X","explanation":"청구범위 미기재에 따른 법적 효과를 ‘출원을 취소한 것으로 본다’고 표현한 것은 틀리다. 법에서 정한 출원일 및 취하 관련 효과를 적용해야 한다."},{"id":552,"text":"국제실용신안등록출원의 출원인은 국제출원일에 제출한 국제출원이 도면을 포함하지 아니한 경우에 는 기준일까지 도면을 제출해야 하며, 기준일까지 도면의 제출이 없는 경우에 지식재산처장은 기간을 정 하여 도면의 제출을 명할 수 있고, 도면의 제출 명령을 받은 자가 그 지정된 기간에 도면을 제출하지 아 니한 경우에는 그 국제실용신안등록출원을 포기한 것으로 본다.","chapter":"실용신안","answer":"X","explanation":"도면 미제출에 대한 국제실용신안등록출원의 법적 효과를 ‘포기한 것으로 본다’고 한 부분이 틀리 다."},{"id":553,"text":"특허법에 따라 선서한 증인, 감정인 또는 통역인이 거짓으로 특허심판원에 대하여 진술ㆍ감정 또는 통역한 경우에 그 사건의 특허취소신청에 대한 결정 또는 심결이 확정되기 전에 자수한다면 그 형을 감 경 또는 면제할 수 있다.","chapter":"실용신안","answer":"O","explanation":"특허법상 허위 진술·감정·통역죄에 관하여 자수한 경우 형을 감경 또는 면제할 수 있는 특칙이 있 다."},{"id":554,"text":"특허청 또는 특허심판원 소속 직원이거나 직원이었던 사람이 실용신안등록출원 중인 고안(국제출원 중인 고안을 포함한다)에 관하여 직무상 알게 된 비밀을 누설하거나 도용한 경우에는 5년 이하의 징역 또는 5 천만원 이하의 벌금에 처한다.","chapter":"실용신안","answer":"O","explanation":"실용신안등록출원 중인 고안에 관한 직무상 비밀누설·도용에 대해서도 특허법 및 실용신안법상 벌 칙이 적용된다."},{"id":555,"text":"특허법상 특허심판원으로부터 증거조사 또는 증거보전에 관하여 서류나 그 밖의 물건 제출 또는 제시 의 명령을 받은 자로서 정당한 이유 없 이 그 명령에 따르지 아니한 자에게는 50 만원 이하의 과태료를 부 과한다.","chapter":"실용신안","answer":"O","explanation":"증거조사·증거보전 명령에 정당한 이유 없이 따르지 않은 자에게 과태료를 부과하는 벌칙 규정이 있다."},{"id":556,"text":"특허법상 법인의 대표자나 법인 또는 개인의 대리인ㆍ사용인 또는 그 밖의 종업원이 그 법인 또는 개 인의 업무에 관하여 비밀누설죄를 범하 면, 그 행위자를 벌하는 외에 그 법인에는 6 천만원 이하의 벌금형 을, 그 개인에게는 5 천만원 이하의 벌금형을 부과한다. 다만, 법인 또는 개 인이 그 위반행위를 방지하기 위하여 해당 업무에 관한 상당한 주의와 감독을 게을리하지 않았다면 그러하지 아니하다.","chapter":"실용신안","answer":"O","explanation":"양벌규정에 따라 행위자를 처벌하는 것과 별도로 법인 또는 개인에게 벌금형을 부과할 수 있으며, 상당한 주의·감독을 다한 경우에는 면책된 다. 공공의 질서 또는 선량한 풍속에 어긋나거나 공중의 위생을 해칠 우려가 있는 발명 또는 고안은 특허 또는 실용신안등록을 받을 수 없다."},{"id":557,"text":"고안은 기술적 진보 또는 발명의 고도성 기준에 달하지 못한 작은 발명이다. 이 점과 관련하여 실용신 안법은 실용신안권을 침해한 자에 대하 여 특허권을 침해한 자보다 낮은 형량을 규정하고 있다.","chapter":"실용신안","answer":"X","explanation":"실용신안이 특허발명보다 높은 고도성을 요구하지 않는다는 점과 별개로, 침해죄의 형량을 특허보 다 낮게 규정한 부분이 틀리다."},{"id":558,"text":"특허법과 실용신안법은 각 침해죄를 동일하게 반의사불벌죄로 규정하고 있다.","chapter":"실용신안","answer":"O","explanation":"특허권 및 실용신안권 침해죄에는 반의사불벌의 성격이 인정된다."},{"id":559,"text":"실용신안등록을 받으려는 자는 출원시 도면을 첨부하여야 하지만, 특허를 받으려는 자는 도면을 제출 하지 아니할 수도 있다.","chapter":"실용신안","answer":"O","explanation":"실용신안은 고안의 형상·구조 등을 대상으로 하므로 도면이 필수적이고, 특허는 도면이 항상 필수 인 것은 아니다."},{"id":560,"text":"특허협력조약(PCT)에 의한 국제출원시 특허출원에 따른 도면의 설명부분에 대한 국어번역문을 제출 하지 아니한 경우 도면의 설명부분에 대 한 기재가 없었던 것으로 보지만, 실용신안등록출원시 도면을 포 함하지 아니한 경우 출원인은 기준일까지 이를 제출하여야 하고 기준일까지 도면을 제출하지 아니한 때 에는 특허청장이 정한 기간 내에 도면을 제출할 수 있다.","chapter":"실용신안","answer":"O","explanation":"실용신안등록출원의 도면 미제출에 대해서는 법정 보완절차가 마련되어 있다. ㄱ. 침해죄(제45 조 제1 항)는 고소가 없으면 공소를 제기 할 수 없다."},{"id":561,"text":"ㄴ. 특허청 또는 특허심판원 소속 직원이거나 직원이었던 사람이 실용신안등록출원 중인 고안(국제출 원 중인 고안을 포함한다)에 관하여 직 무상 알게 된 비밀을 누설하거나 도용한 경우에는 5년 이하의 징 역 또는 5 천만원 이하의 벌금에 처한다.","chapter":"실용신안","answer":"O","explanation":"실용신안법에도 특허법과 유사한 직무상 비밀 누설·도용에 관한 처벌규정이 있다."},{"id":562,"text":"ㄷ. 전문심리위원 또는 전문심리위원이었던 자가 그 직무수행 중에 알게 된 다른 사람의 비밀을 누설 하는 경우에는 2년 이하의 징역이나 금 고 또는 1 천만원 이하의 벌금에 처한다.","chapter":"실용신안","answer":"X","explanation":"실용신안법에는 지문과 같은 처벌규정이 존재하지 않는다."},{"id":563,"text":"ㄹ. 비밀유지명령 위반죄(제49 조의2 제1 항)는 비밀유지명령을 신청한 자의 고소가 없으면 공소를 제 기할 수 없다.","chapter":"실용신안","answer":"O","explanation":"비밀유지명령 위반죄는 고소와 관련하여 법에서 정한 제한이 있다."},{"id":564,"text":"ㅁ. 침해죄(제45 조 제1 항)에 해당하는 침해행위를 조성한 물품 또는 그 침해행위로부터 생긴 물품은 몰수하거나 피해자의 청구에 따라 그 물품을 피해자에게 교부할 것을 선고하여야 한다.","chapter":"실용신안","answer":"O","explanation":"해당 물품은 법원의 판단에 따라 몰수하거나 피해자에게 교부할 수 있다. 등록고안의 청구범위에 기재된 구성요소 중 일부를 권리행사의 단계에서 등록고안에서 비교적 중요 하지 않은 사항이라고 하여 무시하는 것은 사실상 청구범위의 확장적 변경을 사후에 인정하는 것이 되어 허용 될 수 없다."},{"id":565,"text":"실용신안권 침해금지가처분에서 금지의 대상이 되는 침해행위는 구체적으로 특정되어야 하는바, 이 러한 가처분의 효력은 특정된 침해행위 에 대하여만 미칠 뿐 신청인이 피보전권리로 주장한 실용신안권 의 권리범위 또는 보호범위에까지 당연히 미치는 것은 아니다.","chapter":"실용신안","answer":"O","explanation":"가처분의 효력은 법원에서 특정한 침해행위의 범위에 미친다."},{"id":566,"text":"등록고안과 대비되는 고안에 공지의 기술만으로 이루어진 경우라 하더라도 등록고안과 대비하여 등 록고안의 권리범위에 속하는지 여부를 판단하고, 이 경우에 그 등록내용과 동일ㆍ유사한 물품을 제작ㆍ 판매한다면 실용신안권 침해죄를 구성할 수 있다.","chapter":"실용신안","answer":"X","explanation":"공지기술만으로 이루어진 고안이라면 특허·실용신안권의 보호범위에 속하는지와 권리행사의 적법 성을 별도로 판단하여야 한다."},{"id":567,"text":"실용신안등록청구범위를 정정하는 것이 그 청구범위를 확장하거나 변경하는 경우에 해당하는지 여부 를 판단함에 있어서는 청구범위 자체의 형식적인 기재만을 가지고 대비할 것이 아니라 고안의 상세한 설 명을 포함하여 명세서 및 도면의 전체내용과 관련하여 실질적으로 대비하여 그 확장이나 변경에 해당하 는지 여부를 판단하는 것이 합리적이다.","chapter":"실용신안","answer":"O","explanation":"정정의 적법성은 청구범위의 형식뿐만 아니라 명세서와 도면 전체를 실질적으로 고려하여 판단한 다."},{"id":568,"text":"실용신안권 침해죄는 7년 이하 징역 또는 1 억원 이하 벌금에 처하고, 고소가 없으면 공소를 제기할 수 없다.","chapter":"실용신안","answer":"O","explanation":"실용신안권 침해죄에는 형사처벌 및 고소에 관한 특칙이 있다."},{"id":569,"text":"실용신안등록출원인이 외국어실용신안등록출원을 한 경우, 실용신안법 제11 조(특허법의 준용)에 따 라 준용되는 특허법 제47 조(특허출원 의 보정) 제1 항 제1 호 또는 제2 호에 따른 기간에 정정을 하는 경우 에는 마지막 정정 전에 한 모든 정정은 처음부터 없었던 것으로 본다.","chapter":"실용신안","answer":"O","explanation":"외국어출원의 번역문·정정에 관한 특허법 규정이 실용신안에도 준용된다."},{"id":570,"text":"하나의 총괄적 고안의 개념을 형성하는 일 군(群)의 고안에 대하여도 하나의 실용신안등록출원으로 할 수 있다.","chapter":"실용신안","answer":"O","explanation":"하나의 총괄적 고안 개념을 형성하는 일군의 고안은 하나의 출원으로 할 수 있다."},{"id":571,"text":"특허심판원 소속 직원이었던 사람이 실용신안등록출원 중인 고안에 관하여 직무상 알게 된 비밀을 도 용한 경우에는 5년 이하의 징역 또는 5 천만원 이하의 벌금에 처한다.","chapter":"실용신안","answer":"O","explanation":"실용신안법은 관련 특허법상 비밀누설·도용에 관한 벌칙을 준용한다."},{"id":572,"text":"실용신안등록출원일부터 3년이 지난 후에도 변경출원을 한 날부터 30일 이내에는 누구든지 실용신안 등록출원심사의 청구를 할 수 있다.","chapter":"실용신안","answer":"O","explanation":"변경출원과 관련하여 법이 정한 기간 내에는 심사청구가 가능하다."},{"id":573,"text":"실용신안등록출원에 대하여 심사청구가 있을 때에만 이를 심사한다.","chapter":"실용신안","answer":"O","explanation":"실용신안은 출원심사가 청구된 경우에만 심사한다."},{"id":574,"text":"출원심사의 청구는 취하할 수 없다.","chapter":"실용신안","answer":"O","explanation":"실용신안법상 출원심사의 청구는 취하할 수 없다. 실용신안등록출원인이 아닌 자가 출원심사의 청구를 한 후 그 실용신안등록출원서에 첨부한 명세서 를 보정하여 청구범위에 적은 청구항의 수가 증가한 경우에는 그 증가한 청구항에 관하여 내야 할 심사 청구료는 실용신안등록출원 인이 내야 한다."},{"id":575,"text":"실용신안권 또는 전용실시권 침해행위를 조성한 물품 또는 그 침해행위로부터 생긴 물품은 몰수하거 나 피해자의 청구에 따라 그 물품을 피해 자에게 교부할 것을 선고하여야 한다.","chapter":"실용신안","answer":"X","explanation":"실용신안법 제51 조는 몰수 또는 교부를 ‘선고할 수 있다’고 규정하므로 필요적 선고가 아니다."},{"id":576,"text":"등록실용신안에 관한 물품의 생산에만 사용하는 물건을 업으로 사용하는 행위는 실용신안권 또는 전 용실시권의 침해로 본다.","chapter":"실용신안","answer":"O","explanation":"실용신안법상 간접침해 규정에 해당한다."},{"id":577,"text":"실용신안권의 설정등록이 법정 기준보다 늦게 이루어진 경우 출원인에게 책임 있는 지연기간을 제외 한 기간만큼 존속기간을 연장할 수 있다.","chapter":"실용신안","answer":"O","explanation":"등록지연에 따른 존속기간 연장제도가 인정된다."},{"id":578,"text":"선출원된 타인의 디자인권과 등록실용신안이 저촉되는 경우 허락 없이 실시할 수 없다.","chapter":"실용신안","answer":"O","explanation":"선출원된 타인의 권리와의 이용·저촉관계에 대한 제한이다."},{"id":579,"text":"출원인이 출원할 때 그 취지를 표시하면 명세서와 도면의 설명부분을 영어로 작성할 수 있다.","chapter":"실용신안","answer":"O","explanation":"외국어 실용신안등록출원에 관한 규정이다."},{"id":580,"text":"실용신안권 침해자는 7년 이하의 징역 또는 1 억원 이하의 벌금에 처한다.","chapter":"실용신안","answer":"X","explanation":"당시 실용신안권 침해죄의 법정형과 일치하지 않는다.. Ⅶ특허침해. Ⅶ특허침해 문항 수: 66 개 Ⅶ. 특허침해 문항 수: 66개"},{"id":581,"text":"특허법 제127 조(침해로 보는 행위) 제1 호의 ‘그 물건의 생산에만 사용하는 물건’에서 말하는 ‘생산’이 란 국내에서의 생산을 의미하지만, 이 러한 생산이 외국에서 일어나고 그 전 단계의 행위가 국내에서 이 루어지더라도 간접침해가 성립될 수 있다.","chapter":"특허침해","answer":"X","explanation":"특허법 제127 조의 ‘생산’은 국내에서 이루어지는 생산을 전제로 한다. 외국에서 최종 생산되는 경 우 국내의 전 단계 행위만으로 간접침해가 성립한다고 볼 수 없다."},{"id":582,"text":"침해제품 등이 특허발명을 이용하는 경우에는 특허발명에 대한 특허권 침해에 해당하는데, 이러한 이 용관계는 침해제품 등이 특허발명의 구 성에 새로운 기술적 요소를 부가하는 것으로서 침해제품 등이 특 허발명의 요지를 전부 포함하고 이를 그대로 이용하면서 침해제품 등 내에서 특허발명이 발명으로서의 일체성을 유지하는 경우에 성립한다.","chapter":"특허침해","answer":"O","explanation":"후발제품이 선행 특허발명의 구성 전체를 포함하면서 새로운 기술적 요소를 부가하는 이용관계가 인정되면 침해가 문제될 수 있다."},{"id":583,"text":"국내에서 특허발명의 실시를 위한 부품 또는 구성 전부가 생산되거나 대부분의 생산단계를 마쳐 주요 구성을 갖춘 반제품이 생산되고, 이것이 하나의 주체에게 수출되어 마지막 단계의 가공ㆍ조립이 이루어 질 것이 예정되어 있으며, 그와 같은 가공ㆍ조립이 극히 사소하거나 간단하여 이와 같은 부품 전체의 생 산 또는 반제품의 생산만으로도 특허발명의 각 구성요소가 유기적으로 결합한 일체로서 가지는 작용효 과를 구현할 수 있는 경우에는 국내에서 특허발명의 실시제품이 생산된 것과 같이 볼 수 있다.","chapter":"특허침해","answer":"O","explanation":"국내에서 대부분의 생산이 이루어지고 외국에서 이루어지는 마지막 공정이 극히 사소한 경우 국내 에서 특허발명의 실시제품이 생산된 것으 로 평가할 수 있다. 특허권침해소송에서 침해제품 등과 특허발명의 과제해결원리가 동일한지 여부를 가릴 때에는 청구범 위에 기재된 구성의 일부를 형식적으로 추출할 것이 아니라, 명세서에 적힌 발명의 설명의 기재와 출원 당시의 공지기술 등을 참작하여 선행기술과 대비하여 볼 때 특허 발명에 특유한 해결수단이 기초하고 있 는 기술사상의 핵심이 무엇인가를 실질적으로 탐구하여 판단하여야 한다."},{"id":584,"text":"특허발명의 보호범위는 청구범위에 기재된 사항에 의하여 정하여지는 것이 원칙이고, 다만 그 기재만 으로 특허발명의 기술적 구성을 알 수 없거나 알 수는 있더라도 기술적 범위를 확정할 수 없는 경우에는 명세서의 다른 기재에 의한 보충을 할 수는 있으나, 그 경우에도 명세서의 다 른 기재에 의하여 청구범위 의 확장 해석은 허용되지 아니함은 물론 청구범위의 기재만으로 기술적 범위가 명백한 경우에는 명세서 의 다른 기재에 의하여 청구범위의 기재를 제한 해석할 수 있다.","chapter":"특허침해","answer":"X","explanation":"청구범위의 기재가 명확한 경우 명세서의 다른 기재를 근거로 청구범위를 임의로 제한하여 해석할 수는 없다."},{"id":585,"text":"甲이 乙에게 특허법 제65 조(출원공개의 효과)에 따른 보상금지급청구를 하기 위해서는 甲의 특허출 원 Y 는 반드시 특허법 제64 조(출원공 개)에 따라 출원공개되어야 한다.","chapter":"특허침해","answer":"O","explanation":"출원공개에 따른 보상금지급청구권은 출원공개를 전제로 하므로 공개되지 않은 출원에 대해서는 이를 행사할 수 없다."},{"id":586,"text":"甲이 명세서에 청구범위를 적는 보정을 하지 않는 경우에 甲의 특허출원 Y 가 특허법 제64 조(출원공 개)에 따라 출원공개되는 경우는 없다.","chapter":"특허침해","answer":"X","explanation":"청구범위 미기재에 관한 보정제도와 출원공개의 관계를 구별해야 한다. 청구범위 미기재라고 해서 반드시 출원공개 자체가 불가능하다고 단 정할 수 없다. 乙이 2024. 3. 30. 甲의 특허출원 Y 에 대하여 심사청구를 하였고, 특허청장으로부터 이 심사청구의 취지가 甲에게 2024. 4. 1. 통지된 경우, 甲은 2024. 7. 1.까지 청구범위를 적는 보정을 하여야 한다."},{"id":587,"text":"乙이 甲의 발명의 내용을 알지 못하고 스스로 실시하는 것이라면, 乙은 甲에 대하여 특허법 제103 조(선 사용에 의한 통상실시권)에 따른 통 상실시권을 가진다.","chapter":"특허침해","answer":"X","explanation":"선사용권이 인정되려면 특허출원 당시 이미 국내에서 그 발명을 사업으로 실시하거나 실시사업을 준비하고 있어야 한다. 乙의 실시 시점은 甲의 우선일인 2023년 6 월 1일보다 늦으므로 선사용권이 인정 되지 않는다."},{"id":588,"text":"심판장은 심판에서 필요하면 직권 또는 당사자의 신청에 따라 그 심판사건과 관련되는 특허취소신청 에 대한 결정 또는 다른 심판의 심결이 확정되거나 소송절차가 완결될 때까지 그 절차를 중지할 수 있다.","chapter":"특허침해","answer":"O","explanation":"관련 사건의 확정 또는 소송절차의 완결이 필요하다고 인정되면 심판절차를 중지할 수 있다."},{"id":589,"text":"특허권의 존속기간 연장등록결정이 있는 경우 특허청장은 특허권 존속기간의 연장을 특허원부에 등 록하여야 한다.","chapter":"특허침해","answer":"O","explanation":"존속기간 연장등록결정이 있으면 그 내용을 특허원부에 등록한다."},{"id":590,"text":"특허권자는 고의 또는 과실로 자기의 특허권을 침해당한 경우 그 침해로 인하여 입은 손해의 배상을 청구할 수 있으며, 이때 특허권을 침해한 자가 그 침해행위로 인하여 얻은 이익액을 특허권자가 입은 손 해액으로 추정할 수 있다.","chapter":"특허침해","answer":"O","explanation":"특허법상 손해액 추정규정에 따라 침해자가 얻은 이익액을 손해액으로 추정할 수 있다. 법원은 제187 조(피고적격) 단서에 따른 소에 관 하여 소송절차가 완결되었을 때에는 지체 없이 그 사 건에 대한 각 심급(審級)의 재판서 정본을 특허심판원장에게 보내야 한다."},{"id":591,"text":"무효심판의 심결 후에 청구범위가 정정되었다고 하더라도 심결취소소송에서 특허법원이 정정된 청구 범위를 심결의 기초로 하여 특허발명에 무효사유가 존재하는지 여부를 판단할 수 있고 청구항이 정정으 로 삭제되었더라도 심결의 취소를 구할 법률상의 이익은 여전히 존재한다고 봄이 타당하다.","chapter":"특허침해","answer":"X","explanation":"심결취소소송에서 심결 후 이루어진 정정을 무제한으로 심결의 기초로 삼을 수 있는 것은 아니며, 청구항이 삭제된 경우에는 법률상 이익도 문제된다."},{"id":592,"text":"물건 A 에 대한 특허권의 전용실시권자 甲은 乙이 아무런 과실 없이 자신의 전용실시권을 침해하는 행 위를 하였더라도 乙을 상대로 A 를 제 조하는데 제공된 기계의 제거를 청구할 수 없다.","chapter":"특허침해","answer":"O","explanation":"침해제거·예방청구는 침해자의 고의·과실이나 손해발생 여부와 관계없이 가능하다."},{"id":593,"text":"의약이라는 물건의 발명에서 대상 질병 또는 약효와 함께 투여용법과 투여용량을 부가하더라도 이러 한 투여용법과 투여용량은 의료행위 그 자체에 해당하므로 이러한 투여용법과 투여용량의 부가에 의하 여 별개의 의약용도발명이 된다고 볼 수 없다.","chapter":"특허침해","answer":"X","explanation":"투여용법·투여용량은 의약이라는 물건에 새로운 의미를 부여하는 구성요소가 될 수 있다."},{"id":594,"text":"발명의 상세한 설명의 기재와 출원당시의 공지기술 등을 참작하여 파악되는 특허발명의 해결수단이 기초하고 있는 기술사상의 핵심이 침해 제품 등에서도 구현되어 있다면 작용효과가 실질적으로 동일하다 고 보는 것이 원칙이다.","chapter":"특허침해","answer":"O","explanation":"균등침해에서 과제해결원리와 작용효과의 실질적 동일성을 판단하는 법리와 관련된다."},{"id":595,"text":"시장에서 다른 용도로 판매되고 있어 오로지 특허발명의 생산에만 사용되는 전용물이 아니더라도, 그 것이 특허발명의 과제해결에 필수불가 결한 기능을 하고, 당사자가 그 물건이 특허발명의 실시에 사용된 다는 사정을 알면서 업으로 이를 공급한다면 특허법 제127 조에서 정한 간 접침해에 해당한다.","chapter":"특허침해","answer":"X","explanation":"특허법 제127 조의 간접침해는 원칙적으로 특허발명의 실시에만 사용하는 전용물 등을 대상으로 한다."},{"id":596,"text":"법원은 타인의 특허권을 침해한 행위가 고의적인 것으로 인정되는 경우에는 손해로 인정된 금액 범위 내에서 배상액을 정하여야 한다.","chapter":"특허침해","answer":"X","explanation":"고의적 침해의 경우 법원은 손해액의 3 배를 넘지 않는 범위에서 배상액을 정할 수 있으므로 ‘정하 여야 한다’는 표현이 틀리다."},{"id":597,"text":"선특허권 등과 후출원 등록상표권이 저촉되는 경우에, 선특허권 등의 권리자는 후출원 상표권자의 동 의가 없더라도 자신의 권리를 자유롭게 실시할 수 있지만, 후출원 상표권자가 선특허권 등의 권리자의 동의를 받지 않고 그 등록상표를 지정상품에 사용하면 선특허권 등에 대한 침 해가 성립한다.","chapter":"특허침해","answer":"O","explanation":"후출원 상표권은 선행 특허권 등과 저촉되는 범위에서 자유롭게 실시할 수 없다."},{"id":598,"text":"선출원에 대한 우선권 주장을 수반하는 후출원을 한 후출원인은 그 특허출원시에 선출원인과 동일인 이거나 그 적법한 승계인이어야 하고, 후 출원인이 선출원인의 특허출원 후 특정승계의 방법으로 그 특허 를 받을 수 있는 권리를 양수한 경우에는 특허출원인 변경신고를 하지 아니하 면 그 권리승계의 효력이 발생하지 않는다.","chapter":"특허침해","answer":"X","explanation":"우선권 주장에서는 후출원 시 특허를 받을 수 있는 권리를 승계받았다면 특허출원인변경신고까지 마쳐야 하는 것은 아니다. 특허권침해 소송의 상대방이 제조하는 제품 또는 사용하는 방법이 특허발명의 특허권을 침해한다고 하기 위하여는 특허발명의 청구범위에 기재된 각 구성요소 와 그 구성요소 간의 유기적 결합관계가 침해 대상제품 등에 그대로 포함되어 있어야 한다."},{"id":599,"text":"특허출원 전에 특허를 받을 수 있는 권리를 계약에 따라 이전한 양도인이 특허출원을 하여 설정등록 이 이루어진 경우, 그 특허권은 특허무효 사유에 해당하는 ‘정당한 권리자 아닌 사람’의 특허이다.","chapter":"특허침해","answer":"O","explanation":"특허출원 전에 권리를 양도한 사람은 더 이상 권리의 귀속주체가 아니므로 그 사람이 한 출원은 무 권리자의 출원이 된다."},{"id":600,"text":"특허심판원에 계속 중인 심판에 대하여 동일한 당사자가 동일한 심판을 다시 청구한 경우, 후심판이 중복심판청구 금지에 위반되는지 판단하 는 기준 시점은 후심판의 심결 시이다.","chapter":"특허침해","answer":"O","explanation":"중복심판청구 금지 여부는 후심판의 심결 시를 기준으로 판단한다."},{"id":601,"text":"발명 A 에 대하여 甲이 단독으로 특허출원한 경우에는 등록거절사유, 등록무효사유가 된다.","chapter":"특허침해","answer":"O","explanation":"특허를 받을 수 있는 권리가 공유인 경우 공유자 모두가 공동으로 출원해야 하므로 일부만의 출원 은 거절사유 및 무효사유가 된다."},{"id":602,"text":"甲과 乙은 특허 취득 전 발명 A 에 대한 권리를 제3 자에게 양도하는 것은 가능하나 질권 설정은 불가 하다.","chapter":"특허침해","answer":"O","explanation":"특허를 받을 수 있는 권리는 이전할 수 있지만 질권의 목적이 될 수 없다. 발명 A 가 적법하게 등록된 경우, 제3 자는 권리의 일부 지분에 대해서만 무효심판을 청구할 수 없다."},{"id":603,"text":"甲과 乙이 발명 A 에 대한 특허권을 공유한 경우, 각 공유자에게 특허권을 부여하는 방식의 현물분할 을 할 수 있다.","chapter":"특허침해","answer":"X","explanation":"특허권은 하나의 권리이므로 각 공유자에게 동일 내용의 복수 특허권을 부여하는 방식의 현물분할 은 허용되지 않는다."},{"id":604,"text":"발명 A 가 등록 거절된 경우 甲과 乙은 공동으로 거절결정불복심판을 청구하여야 한다.","chapter":"특허침해","answer":"O","explanation":"특허를 받을 수 있는 권리가 공유인 경우 심판청구도 공유자 전원이 공동으로 해야 한다."},{"id":605,"text":"심결취소소송에서도 자백 또는 의제자백이 인정되지만, 자백의 대상은 사실이고 이러한 사실에 대한 법적 판단 내지 평가는 자백의 대상이 되 지 않으므로, 특허발명의 진보성 판단에 제공되는 선행발명이 어떤 구성요소를 가지고 있는지 여부에 대해서는 자백이 허용되지 않는다.","chapter":"특허침해","answer":"O","explanation":"선행발명의 구성요소에 관한 법적 평가는 자백의 대상이 아니므로 지문과 같이 판단된다."},{"id":606,"text":"특허권의 권리범위는 청구범위에 기재된 사항에 의하여 정하여지는 것이 원칙이나, 청구항은 발명의 설명에 의하여 뒷받침될 것이 요구되기 때문에, 청구범위의 기재만으로 특허의 기술적 구성을 알 수 없 거나 알 수 있
