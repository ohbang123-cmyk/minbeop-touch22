<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>민법·특허법·상표법 O/X</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:21px}main{max-width:720px;margin:auto;padding:15px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:13px;padding:14px;background:#eef2f6;font-weight:700;font-size:15px}.wide{width:100%;margin:5px 0}.primary{background:#111827;color:#fff}.q{font-size:18px;line-height:1.75;font-weight:650;white-space:pre-wrap;word-break:keep-all}.meta{font-size:12px;color:#6b7280;margin-bottom:10px}.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.ox button{height:70px;border:2px solid #e5e7eb;border-radius:15px;background:#fff;font-size:27px;font-weight:900}.ok,.bad{margin-top:14px;padding:13px;border-radius:13px}.ok{background:#ecfdf5;color:#065f46}.bad{background:#fff1f2;color:#9f1239}.small{font-size:12px;color:#6b7280}iframe{width:100%;height:72vh;border:0;border-radius:12px}</style></head><body><header><h1>민법 · 특허법 · 상표법 O/X</h1></header><main id="app"></main><script>
const A=document.getElementById('app');const S={sub:'',arr:[],i:0,stats:JSON.parse(localStorage.getItem('oxstats')||'{}')};let D={};
const CH={특허법:['특허절차','특허요건 및 특허출원','특허권 및 실시권','특허심판·소송','국제출원(PCT)','실용신안','특허침해'],상표법:['상표의 개념·사용·식별력','상표등록요건·출원·심사·등록','상표권·사용권·이전·질권·소멸','상표권 효력·침해·손해배상·보상','상표심판·소송·재심·권리범위','국제상표등록·마드리드·조약우선권','단체표장·지리적표시·증명표장·업무표장·특수표장']};
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function save(){localStorage.setItem('oxstats',JSON.stringify(S.stats))}
function home(){A.innerHTML=`<div class="card"><h2>과목 선택</h2><div class="grid"><button class="btn" onclick="choose('민법')">민법<br><span class="small">기존 민법 터치</span></button><button class="btn" onclick="choose('특허법')">특허법<br><span class="small">646개 · 7대단원</span></button><button class="btn" onclick="choose('상표법')">상표법<br><span class="small">493개 · 7대단원</span></button></div></div>`}
function choose(s){S.sub=s;if(s==='민법'){A.innerHTML=`<button class="btn" onclick="home()">← 과목</button><div class="card"><iframe src="source/civil_original.html"></iframe></div>`;return}menu()}
function menu(){A.innerHTML=`<button class="btn" onclick="home()">← 과목</button><div class="card"><h2>${S.sub}</h2><div class="grid"><button class="btn" onclick="start('all')">전체</button><button class="btn" onclick="start('random')">랜덤</button><button class="btn" onclick="start('wrong')">오답만</button><button class="btn" onclick="chapters()">대단원</button></div></div>`}
function chapters(){A.innerHTML=`<button class="btn" onclick="menu()">← ${S.sub}</button><div class="card"><h2>대단원</h2>${CH[S.sub].map((c,i)=>`<button class="btn wide" onclick='start("chapter",${JSON.stringify(c)})'>${i+1}. ${c}</button>`).join('')}</div>`}
function start(mode,ch){let all=D[S.sub==='특허법'?'patent':'trademark'];let a=ch?all.filter(q=>q.chapter===ch):all.slice();if(mode==='wrong')a=a.filter(q=>(S.stats[S.sub+'_'+q.id]?.w||0)>0);if(!a.length){alert('해당 조건의 문제가 없습니다.');return}a.sort(()=>Math.random()-.5);S.arr=a;S.i=0;render()}
function render(){let q=S.arr[S.i];A.innerHTML=`<button class="btn" onclick="menu()">← ${S.sub}</button><div class="card"><div class="meta">${S.i+1} / ${S.arr.length} · ${E(q.chapter)}</div><div class="q">${E(q.text)}</div><div class="ox"><button onclick="answer('O')">O</button><button onclick="answer('X')">X</button></div><div id="f"></div></div>`}
function answer(v){let q=S.arr[S.i],k=S.sub+'_'+q.id,s=S.stats[k]||{a:0,w:0};s.a++;let ok=v===q.answer;if(!ok)s.w++;S.stats[k]=s;save();let f=document.getElementById('f');f.className=ok?'ok':'bad';f.innerHTML=`<b>${ok?'정답입니다 ✓':'오답입니다 ✕'}</b><div>정답: <b>${q.answer}</b></div><button class="btn primary wide" onclick="next()">${S.i+1<S.arr.length?'다음 문제':'종료'}</button>`}
function next(){if(S.i+1<S.arr.length){S.i++;render()}else menu()}
Promise.all([fetch('data/patent.json').then(r=>r.json()),fetch('data/trademark.json').then(r=>r.json())]).then(([p,t])=>{D={patent:p,trademark:t};home()})
</script></main></body></html>
